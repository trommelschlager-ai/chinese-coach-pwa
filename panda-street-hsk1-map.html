<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#090817">
<meta name="description" content="Panda Street HSK 1 — разговорный китайский, живые уроки и практика.">
<title>Panda Street · HSK 1</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#080817;color:#fff}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#080817}
body{min-height:100dvh;overflow-x:hidden;overscroll-behavior:none}
button,a{font:inherit}
.screen{position:relative;isolation:isolate;width:min(100%,520px);min-height:100dvh;margin:auto;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 14px);display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 31%,#621c9752,transparent 44%),linear-gradient(180deg,#0a0718,#100a24 55%,#080817)}
.top{display:flex;align-items:center;gap:10px;min-height:42px}
.back{flex:none;color:#f4d5ff;text-decoration:none;font-size:14px;font-weight:750;border:1px solid #d26aff72;border-radius:14px;padding:8px 11px;background:#1d1235;box-shadow:0 3px 0 #10091b}
.brand{flex:1;text-align:right;line-height:1.05}
.brand b{display:block;color:#f3d2ff;font-size:13px;letter-spacing:.16em}
.brand small{display:block;color:#c5a9d4;font-size:10px;margin-top:4px;letter-spacing:.08em}
.hero{position:relative;height:clamp(190px,31dvh,280px);min-height:180px;margin:10px -6px 14px;overflow:hidden;border:1px solid #ec8cff9c;border-radius:24px;background:linear-gradient(180deg,#0a071055,#0a0710a8),url("./assets/panda-street-day-night/night.webp") center 43%/cover;box-shadow:0 0 24px #cb45ff4a,inset 0 0 18px #d667ff24}
.hero:after{content:"";position:absolute;inset:45% 0 0;background:linear-gradient(transparent,#0c081a 96%)}
.hero-copy{position:absolute;z-index:1;left:16px;right:16px;bottom:14px;text-align:center;text-shadow:0 2px 12px #080313}
.hero-copy .tag{color:#f0b8ff;letter-spacing:.2em;font-size:10px;font-weight:900}
.hero-copy h1{margin:4px 0 0;font-size:clamp(23px,7vw,34px);line-height:1.02;color:#fff;font-weight:950}
.hero-copy p{margin:6px 0 0;color:#f3d4ff;font-size:13px;font-weight:700}
.section-title{margin:0 2px 9px;color:#eacbfa;font-size:12px;letter-spacing:.14em;font-weight:850}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.tile{--c:#e663ff;--d:#7224a8;position:relative;min-height:54px;border:1px solid color-mix(in srgb,var(--c) 72%,white);border-radius:17px;padding:8px 9px;display:flex;align-items:center;gap:8px;text-align:left;color:#fff;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 40%,#24133c),color-mix(in srgb,var(--d) 80%,#100b20));box-shadow:0 4px 0 color-mix(in srgb,var(--d) 88%,black),0 0 13px color-mix(in srgb,var(--c) 30%,transparent),inset 0 1px 0 #ffffff4a;cursor:pointer;touch-action:manipulation;transition:transform .12s,filter .12s}
.tile:active{transform:translateY(3px);filter:brightness(1.2);box-shadow:0 1px 0 color-mix(in srgb,var(--d) 88%,black),0 0 17px color-mix(in srgb,var(--c) 42%,transparent)}
.tile:nth-child(2){--c:#42dcff;--d:#126099}.tile:nth-child(3){--c:#ffd564;--d:#8c5618}.tile:nth-child(4){--c:#ff61bb;--d:#86205f}.tile:nth-child(5){--c:#a99aff;--d:#49318f}.tile:nth-child(6){--c:#65f2bb;--d:#1d7255}.tile:nth-child(7){--c:#ff875d;--d:#9b3f29}
.icon{width:31px;height:31px;flex:none;display:grid;place-items:center;border-radius:11px;background:#10091e8a;border:1px solid #ffffff35;font-size:18px}
.tile-label{font-size:13px;line-height:1.08;font-weight:850}
.tile-label small{display:block;margin-top:3px;font-size:9px;line-height:1.1;color:#f7eaffbd;font-weight:650}
.start{width:100%;min-height:54px;margin-top:15px;border:1px solid #ffb5ff;border-radius:18px;color:#fff;font-size:16px;font-weight:950;background:linear-gradient(100deg,#a817c5,#ee33b7 55%,#8129dc);box-shadow:0 5px 0 #5a1275,0 0 21px #ed41e17a,inset 0 1px 0 #ffffff7a;cursor:pointer}
.start:active{transform:translateY(3px);box-shadow:0 2px 0 #5a1275,0 0 24px #ed41e1}
.note{text-align:center;color:#bca4ca;font-size:10px;margin:10px 0 0}
.dialog{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:18px;background:#05030bd9;backdrop-filter:blur(8px)}
.dialog[hidden]{display:none}
.panel{width:min(100%,440px);max-height:80dvh;overflow:auto;border:1px solid #d879ff;border-radius:22px;padding:17px;background:linear-gradient(150deg,#231337,#100b21);box-shadow:0 0 32px #be38ff61}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.panel h2{margin:0;font-size:20px;color:#f3d4ff}
.close{width:36px;height:36px;border:1px solid #a678c0;border-radius:12px;background:#28173b;color:#fff;font-size:21px}
.lesson-list{display:grid;gap:8px}
.lesson{display:block;padding:12px;border-radius:14px;color:#fff;text-decoration:none;background:#4a2364;border:1px solid #de8cff;font-weight:800}
.lesson small{display:block;color:#d7bfdf;margin-top:3px;font-weight:600}
.locked{padding:12px;border-radius:14px;background:#21172d;border:1px solid #5f4c68;color:#b3a6b9;font-weight:750}
@media(max-height:720px){.hero{height:25dvh;min-height:150px;margin:7px -4px 10px}.tile{min-height:48px;padding:6px}.start{min-height:48px;margin-top:11px}.note{margin-top:7px}}
</style>
</head>
<body>
<main class="screen">
<header class="top">
<a class="back" href="./index.html" aria-label="Вернуться в главное меню Panda Go">‹ Panda Go</a>
<div class="brand"><b>PANDA STREET</b><small>ЖИВОЙ КИТАЙСКИЙ · HSK 1</small></div>
</header>
<section class="hero" aria-label="Panda Street HSK 1">
<div class="hero-copy"><div class="tag">PANDA STREET</div><h1>Живой китайский</h1><p>Разговорная практика · HSK 1</p></div>
</section>
<h2 class="section-title">ВЫБЕРИ РАЗДЕЛ</h2>
<nav class="grid" aria-label="Разделы курса Panda Street HSK 1">
<button class="tile" data-act="topics"><span class="icon">🌆</span><span class="tile-label">Темы<small>ситуации HSK 1</small></span></button>
<button class="tile" data-act="lessons"><span class="icon">📚</span><span class="tile-label">Уроки<small>уроки курса</small></span></button>
<button class="tile" data-act="words"><span class="icon">🀄</span><span class="tile-label">Слова<small>лексика в контексте</small></span></button>
<button class="tile" data-act="phrases"><span class="icon">💬</span><span class="tile-label">Фразы<small>живые выражения</small></span></button>
<button class="tile" data-act="grammar"><span class="icon">📖</span><span class="tile-label">Грамматика<small>коротко и понятно</small></span></button>
<button class="tile" data-act="practice"><span class="icon">🎤</span><span class="tile-label">Практика<small>проверь себя</small></span></button>
<button class="tile" data-act="ai"><span class="icon">🐼</span><span class="tile-label">Panda AI<small>поговори с Пандой</small></span></button>
</nav>
<button class="start" data-act="start">Начать урок 1</button>
<p class="note">Прогресс занятий сохраняется на этом устройстве</p>
</main>
<section class="dialog" id="dialog" hidden>
<div class="panel" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
<div class="panel-head"><h2 id="dialog-title">Уроки Panda Street</h2><button class="close" id="close" aria-label="Закрыть">×</button></div>
<div class="lesson-list" id="lesson-list"></div>
</div>
</section>
<script>
(()=>{
'use strict';
const lesson1='./panda-street-slang-lesson1-preview.html?welcome=1';
const lesson2='./panda-street-slang-lesson2-preview.html?welcome=1';
const ai='./panda-street-ai-preview.html';
const dialog=document.querySelector('#dialog'),title=document.querySelector('#dialog-title'),list=document.querySelector('#lesson-list');
const pages=[
 ['1','哈喽！· Приветствия',lesson1],
 ['2','认识一下！· Знакомство',lesson2],
 ['3','Семья',null],['4','Еда',null],['5','На улице',null],['6','Работа',null],['7','Планы',null]
];
function showLessons(heading){
 title.textContent=heading;
 list.innerHTML=pages.map(([n,label,url])=>url?'<a class="lesson" href="'+url+'">'+n+' · '+label+'<small>Открыть урок</small></a>':'<div class="locked">'+n+' · '+label+'<small>Скоро</small></div>').join('');
 dialog.hidden=false;
}
function lesson2Step(step){try{localStorage.setItem('panda-street-lesson2-step-v4',String(step))}catch{}location.href=lesson2}
function action(a){
 if(a==='topics')return showLessons('Темы HSK 1');
 if(a==='lessons')return showLessons('Все уроки');
 if(a==='words'){title.textContent='Слова и фразы';list.innerHTML='<a class="lesson" href="'+lesson2+'">Разговорные выражения<small>Открыть раздел</small></a><a class="lesson" href="'+lesson1+'">Слова урока 1<small>Открыть урок</small></a>';dialog.hidden=false;return}
 if(a==='phrases')return lesson2Step(0);
 if(a==='grammar')return lesson2Step(2);
 if(a==='practice')return lesson2Step(4);
 if(a==='ai')return location.href=ai;
 if(a==='start')return location.href=lesson1;
}
document.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>action(b.dataset.act)));
document.querySelector('#close').addEventListener('click',()=>dialog.hidden=true);
dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape')dialog.hidden=true});
})();
</script>
</body>
</html>
