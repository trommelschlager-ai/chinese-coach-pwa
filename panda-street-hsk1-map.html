.stage{position:relative;width:min(100vw,calc(100dvh * 941 / 1672));aspect-ratio:941 / 1672;max-height:100dvh;isolation:isolate;flex-shrink:0;overflow:hidden;background:#050915;box-shadow:0 0 25px #02020ab0}
.stage>img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;display:block;user-select:none;-webkit-user-drag:none}
/* The approved graphic remains untouched; only the incorrect Panda Go wordmark gets replaced in HTML. */
.brand{position:absolute;z-index:2;left:13.6%;top:.38%;width:34.5%;height:4.2%;background:linear-gradient(90deg,#09091b 0%,#09091bec 88%,transparent);display:flex;flex-direction:column;justify-content:center;padding-left:2px;pointer-events:none}
.brand strong{font-size:clamp(13px,3.8vw,24px);line-height:1.04;color:#fff;font-weight:900;white-space:nowrap;text-shadow:0 1px 5px #000}.brand strong span{color:#fa36d5}.brand small{font-size:clamp(8px,2.1vw,13px);line-height:1.5;color:#ddd6e8;white-space:nowrap}
.hotspots{position:absolute;z-index:3;inset:0;pointer-events:none}.hit{position:absolute;left:var(--x);top:var(--y);width:var(--w);height:var(--h);border:0;border-radius:16px;background:transparent;padding:0;margin:0;cursor:pointer;pointer-events:auto;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.hit:active,.hit.pressed{box-shadow:inset 0 0 15px #fff7,0 0 20px #ea34e17c;background:#f59ce331;transform:scale(.985);transition:background .1s,transform .1s}.hit:focus-visible{outline:3px solid #ffe777;outline-offset:-3px}
.sr-only{position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden;white-space:nowrap}
.toast{position:fixed;z-index:12;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));max-width:min(92vw,460px);transform:translateX(-50%);padding:12px 16px;border-radius:15px;background:#24153df5;border:1px solid #d56bf5;box-shadow:0 10px 25px #0009;color:#fff;font-size:14px;text-align:center;line-height:1.4}.toast[hidden]{display:none}
.overlay{position:fixed;inset:0;z-index:15;display:grid;place-items:center;padding:18px;background:#000b;backdrop-filter:blur(7px)}.overlay[hidden]{display:none}.dialog{width:min(92vw,410px);max-height:85dvh;overflow-y:auto;background:linear-gradient(145deg,#22183c,#0e1027);padding:20px 16px;border:2px solid #ba60ef;border-radius:23px;box-shadow:0 0 30px #b135db88}.dialog h2{margin:0 0 11px;text-align:center;color:#ffdc82;font-size:23px}.dialog p{color:#ddd0e8;font-size:13px;line-height:1.45}.dialog a,.dialog button{display:block;width:100%;text-align:left;margin:8px 0;border-radius:13px;border:1px solid #a16ad3;padding:12px 13px;color:#fff;text-decoration:none;background:linear-gradient(110deg,#382451,#251a43);font-weight:750;font-size:15px;cursor:pointer}.dialog .available{border-color:#f0cf80;background:linear-gradient(110deg,#63438a,#3b205e)}.dialog .muted{opacity:.68}.dialog .close{text-align:center;background:#171627;border-color:#78698e}
