let recording=null,stream=null,recUrl=null;
function play(zh){
 if(!('speechSynthesis' in window)){message('Синтез речи недоступен на этом устройстве.','bad');return}
 window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(zh);u.lang='zh-CN';u.rate=.84;u.pitch=1;u.volume=1;
 const voices=window.speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang.toLowerCase().startsWith('zh-cn'))||voices.find(v=>v.lang.toLowerCase().startsWith('zh'))||null;
 window.speechSynthesis.speak(u);
}
function message(text,type='ok'){s.feedback=text;s.feedbackKind=type;save();render(false)}
function stopRecording(){if(recording&&recording.state==='recording'){recording.onstop=null;recording.stop()}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}recording=null}
async function record(){
 if(recording&&recording.state==='recording'){recording.stop();return}
 if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){message('Микрофон или запись не поддерживаются браузером.','bad');return}
 try{
   stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true}});
   const chunks=[];recording=new MediaRecorder(stream);
   recording.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
   recording.onstop=()=>{
      if(recUrl)URL.revokeObjectURL(recUrl);
      recUrl=URL.createObjectURL(new Blob(chunks,{type:recording?.mimeType||'audio/webm'}));
      if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
      recording=null;message('Запись готова. Прослушай свой голос.')
   };
   recording.start();message('● Идёт запись. Нажми «Остановить», когда закончишь.')
 }catch(e){message('Нет доступа к микрофону. Проверь разрешение браузера.','bad')}
}

 save();render();$('workspace').scrollTop=0;
}

   '<div class="pg5-answer">'+(s.qchars.length?s.qchars.map(k=>chars[k]).join(''):'Выбирай иероглифы')+'</div>'+
   '<div class="pg5-tokens">'+order.map(k=>button(chars[k],'char','pg5-soft',(s.qchars.includes(k)?'disabled ':'')+'data-index="'+k+'"')).join('')+'</div>'+
   '<div class="pg5-actions">'+button('Очистить','char-clear')+button('Проверить','char-check','pg5-primary')+'</div>';
 }else if(t===3){
   start+='<h2>Вставь пропущенное выражение</h2><div class="pg5-cn" style="font-size:25px">'+w.fill+'</div>';
   start+='<div class="pg5-q-choices">'+choiceIds(i,t).map(k=>button('<span class="pg5-cn">'+W[k].zh+'</span>','answer','pg5-soft','data-index="'+k+'"')).join('')+'</div>';
 }else{
   start+='<h2>Прослушай и выбери перевод</h2>'+button('🔊 Прослушать слово','quiz-sound','pg5-primary')+
   '<div class="pg5-q-choices">'+choiceIds(i,t).map(k=>button(W[k].ru,'answer','pg5-soft','data-index="'+k+'"')).join('')+'</div>';
 }
 return title(TYPES[t],'По 8 заданий каждого типа. Выполненное можно повторять.')+
 panel(start+notify()+(done?'<div class="pg5-notice ok">✓ Уже выполнено. Можешь выбрать ответ снова.</div>':'')+
 '<div class="pg5-actions">'+button('← К пяти тестам','quiz-home')+
 button(i===7?'К списку тестов →':'Следующий вопрос →','quiz-next','pg5-primary',(done?'':'disabled'))+'</div>');
}
function tests(){
 if(s.qtype!==null)return quizQuestion();
 return title('Проверь слова!','40 упражнений: 8 основных, ещё 32 для закрепления.')+
 panel('<div style="display:flex;align-items:center;gap:12px">'+img('hsk2-about-me/panda-quiz.svg','Панда с заданиями','')+
 '<div><h2>Пять видов заданий</h2><p>Первый тест обязателен; остальные доступны всегда.</p></div></div>').replace('<img src="./assets/hsk2-about-me/panda-quiz.svg"','<img style="width:34%;max-height:145px;object-fit:contain;flex:none" src="./assets/hsk2-about-me/panda-quiz.svg"')+
 '<div class="pg5-testlist">'+TYPES.map((t,i)=>'<button type="button" class="pg5-testitem" data-action="choose-test" data-index="'+i+'"><span class="num">'+(i+1)+'</span><span class="symbol">'+SYMBOLS[i]+'</span><span class="txt"><strong>'+t+(i===0?' · Основной':' · Дополнительный')+'</strong><small>'+['Переведи китайское слово','Найди слово по звучанию','Поставь иероглифы по порядку','Заполни предложение','Слушай и выбирай'][i]+'</small></span><span class="count">'+count(i)+'/8</span></button>').join('')+'</div>'+
 '<div class="pg5-notice">Чтобы перейти дальше, достаточно пройти первые 8 заданий. Остальные 32 можно выполнить позже.</div>';
}
function plan(){
 const day=DAYS[s.day],time=TIMES[s.time],act=ACTIVITIES[s.activity];
 const value=['我们'+day[0]+time[0]+act[0]+'吧。','Wǒmen '+day[1]+' '+time[1]+' '+act[1]+' ba.','Давай '+day[2]+' '+time[2]+' '+act[2]+'.'];
 const select=(name,arr,val)=>'<div class="pg5-select-row"><label for="'+name+'">'+({day:'День встречи',time:'Время встречи',activity:'Чем займёмся'}[name])+'</label><select id="'+name+'">'+arr.map((a,i)=>'<option value="'+i+'"'+(i===val?' selected':'')+'>'+a[2]+'</option>').join('')+'</select></div>';
 return title('Мой план встречи','Составь приглашение другу, выбрав день, время и занятие.')+
 panel(select('day',DAYS,s.day)+select('time',TIMES,s.time)+select('activity',ACTIVITIES,s.activity)+sample(value)+
 '<div class="pg5-actions">'+button('🔊 Слушать приглашение','plan-sound')+button('✓ Сохранить мой план','plan-save','pg5-primary')+'</div>'+notify())+
 panel('<h3>Другие примеры</h3><div class="pg5-response-list">'+[
 ['我们星期六下午三点见面吧。','Wǒmen xīngqīliù xiàwǔ sān diǎn jiànmiàn ba.','Давай встретимся в субботу в 15:00.'],
 ['我们周末一起看电影吧。','Wǒmen zhōumò yìqǐ kàn diànyǐng ba.','Давай на выходных вместе посмотрим фильм.'],
 ['你明天下午有时间吗？','Nǐ míngtiān xiàwǔ yǒu shíjiān ma?','У тебя завтра после обеда есть время?']
 ].map((p,i)=>button('<span class="pg5-cn">'+p[0]+'</span><span class="pg5-py">'+p[1]+'</span><span class="pg5-ru">'+p[2]+'</span>','plan-example','pg5-soft','data-index="'+i+'"')).join('')+'</div>');
}
function dialogue(){
 let next=Math.min(DIALOG.length,s.dialog.length);
 let h=title('Диалог с Пандой','Три вопроса, шесть реплик. Выбирай подходящий ответ — без замков.')+
 panel('<h3>Договоримся о встрече</h3>'+DIALOG.map((turn,i)=>{
   if(i>next)return '';
   let out='<div class="pg5-bubble"><div class="speaker">🐼 Панда</div>'+sample(turn.q)+
     button('🔊 Слушать вопрос','dialog-sound','pg5-soft','data-index="'+i+'')+'</div>';
   if(i<next)out+='<div class="pg5-bubble me"><div class="speaker">🧑 Ты</div>'+sample(turn.choices[s.dialog[i]])+'</div>';
   return out;
 }).join('')+
 (next<3?'<h3>Как ответишь?</h3><div class="pg5-response-list">'+DIALOG[next].choices.map((ans,i)=>
 button('<span class="pg5-cn">'+ans[0]+'</span><span class="pg5-py">'+ans[1]+'</span><span class="pg5-ru">'+ans[2]+'</span>','dialog-answer','pg5-soft','data-index="'+i+'"')).join('')+'</div>':
 '<div class="pg5-notice ok">✓ Диалог завершён! Теперь ты умеешь согласовать встречу.</div>')+
 '<div class="pg5-actions">'+button('↻ Начать диалог заново','dialog-reset')+'</div>');
 return h+'<div class="pg5-small">Это диалог с вариантами ответов, не самостоятельный разговорный Panda AI.</div>';
}
function summary(){
 const allCore=count(0)===8;
 const meaningful=allCore&&s.grammar&&s.dialog.length===3;
 const sentence='我们'+DAYS[s.day][0]+TIMES[s.time][0]+ACTIVITIES[s.activity][0]+'吧。';
 const pinyin='Wǒmen '+DAYS[s.day][1]+' '+TIMES[s.time][1]+' '+ACTIVITIES[s.activity][1]+' ba.';
 return title('Итог урока 5','Ты учился приглашать друзей и договариваться о встрече.')+
 panel(img('hsk2-about-me/panda-finish.svg','Панда поздравляет с уроком','')+
 '<h2>'+(meaningful?'🎉 Основная программа пройдена!':'Продолжай практиковаться!')+'</h2>'+
 '<div class="pg5-summary">'+stat('8','выражений')+stat(count(0)+'/8','основной тест')+stat([1,2,3,4].reduce((a,i)=>a+count(i),0)+'/32','доп. задания')+stat(s.dialog.length+'/3','ответы в диалоге')+'</div>'+
 '<p class="pg5-completion">Грамматика: '+(s.grammar?'✓':'нужна проверка')+' · Произнесено: '+s.spoken.length+'/'+PRACTICE.length+' · Мой план: '+(s.planSaved?'✓':'ещё не сохранён')+'</p>'+
 '<h3>Твоё приглашение</h3>'+sample([sentence,pinyin,'Предложение другу встретиться'])+
 (meaningful?'<div class="pg5-notice ok">✓ Обязательные задания выполнены.</div>':'<div class="pg5-notice">Для завершения пройди 8 основных тестов, грамматику и диалог. Просмотр всех вкладок остаётся открытым.</div>')+
 '<div class="pg5-actions">'+button('↻ Повторить урок','restart','pg5-primary')+'</div>')+
 '<p class="pg5-small">Пока используем демонстрационный голос устройства; финальную запись носителя подключим после утверждения урока.</p>';
}
const renderers=[intro,words,grammar,speaking,tests,plan,dialogue,summary];
function render(reset=true){
 $('stepBadge').textContent='Шаг '+s.step+' / 8';
 $('progress').style.width=(s.step/8*100)+'%';
 $('stepName').textContent=T[s.step-1];
 const active=s.step===2?0:s.step===3?1:s.step===4?2:s.step===5?3:4;
 document.querySelectorAll('[data-tab]').forEach((b,i)=>{const flag=i===active;b.classList.toggle('active',flag);b.setAttribute('aria-current',flag?'step':'false');b.disabled=false});
 $('workspace').innerHTML=renderers[s.step-1]();
 $('prev').textContent=s.step===1?'← Все уроки':'← Назад';
 $('next').textContent=s.step===8?'К началу ↻':s.step===5&&s.qtype!==null?'К тестам →':'Далее →';
 $('next').disabled=false;
 if(reset)$('workspace').scrollTop=0;
 save();
}
const set=(text,kind='ok')=>{s.feedback=text;s.feedbackKind=kind;render(false)};
function action(which,button){
 const i=Number(button.dataset.index);
 switch(which){
 case 'start':go(2);return;
 case 'listen-word':play(W[i].zh);if(!s.heard.includes(i))s.heard.push(i);save();return;
 case 'gram-token':if(!s.builder.includes(i))s.builder.push(i);render(false);return;
 case 'gram-clear':s.builder=[];s.feedback='';render(false);return;
 case 'gram-check':if(s.builder.join(',')==='0,1,2,3,4'){s.grammar=true;set('✓ Правильно! 你明天下午有空吗？')}else set('Проверь порядок слов: 你 → 明天下午 → 有空 → 吗 → ？','bad');return;
 case 'speak-model':play(PRACTICE[s.practice][0]);return;
 case 'speak-prev':s.practice=(s.practice+PRACTICE.length-1)%PRACTICE.length;render(false);return;
 case 'speak-next':s.practice=(s.practice+1)%PRACTICE.length;render(false);return;
 case 'mark-spoken':if(!s.spoken.includes(s.practice))s.spoken.push(s.practice);set('✓ Повторение отмечено. Проверка тонов не проводилась.');return;
 case 'record':record();return;
 case 'replay':if(!recUrl){set('Сначала сделай запись.','bad');return}new Audio(recUrl).play().catch(()=>set('Не удалось воспроизвести запись.','bad'));return;
 case 'choose-test':s.qtype=Math.max(0,Math.min(4,i));s.qi=0;s.qchars=[];s.feedback='';render();return;
 case 'quiz-home':s.qtype=null;s.feedback='';render();return;
 case 'quiz-next':if(s.qi===7){s.qtype=null;s.qi=0}else s.qi++;s.qchars=[];s.feedback='';render();return;
 case 'quiz-sound':play(W[s.qi].zh);return;
 case 'answer':if(i===s.qi){s.done[s.qtype+'-'+s.qi]=true;set('✓ Верно! '+W[s.qi].zh+' — '+W[s.qi].ru)}else set('Не совпало. Попробуй другой ответ.','bad');return;
 case 'char':if(!s.qchars.includes(i))s.qchars.push(i);render(false);return;
 case 'char-clear':s.qchars=[];s.feedback='';render(false);return;
 case 'char-check':if(s.qchars.join(',')===[...W[s.qi].zh].map((_,j)=>j).join(',')){s.done[s.qtype+'-'+s.qi]=true;set('✓ Правильно собрал: '+W[s.qi].zh)}else set('Неправильный порядок иероглифов.','bad');return;
 case 'plan-sound':play('我们'+DAYS[s.day][0]+TIMES[s.time][0]+ACTIVITIES[s.activity][0]+'吧。');return;
 case 'plan-save':s.planSaved=true;set('✓ Твой вариант встречи сохранён.');return;
 case 'plan-example':play(['我们星期六下午三点见面吧。','我们周末一起看电影吧。','你明天下午有时间吗？'][i]);return;
 case 'dialog-sound':play(DIALOG[i].q[0]);return;
 case 'dialog-answer':{const t=DIALOG[s.dialog.length];if(t&&t.choices[i]){s.dialog.push(i);render()}return}
 case 'dialog-reset':s.dialog=[];render();return;
 case 'restart':if(confirm('Начать урок 5 заново?')){s=blank();go(1)}return;
 }
}
document.addEventListener('click',e=>{const tab=e.target.closest('[data-tab]');if(tab){go(Number(tab.dataset.tab));return}const b=e.target.closest('[data-action]');if(b&&!b.disabled)action(b.dataset.action,b)});
document.addEventListener('change',e=>{
 const field=e.target.id;
 if(['day','time','activity'].includes(field)){const n=Number(e.target.value),list={day:DAYS,time:TIMES,activity:ACTIVITIES}[field];if(Number.isInteger(n)&&n>=0&&n<list.length){s[field]=n;s.planSaved=false;s.feedback='';render(false)}}
});
$('prev').addEventListener('click',()=>s.step===1?location.assign('./hsk2-life-course.html?view=map'):go(s.step-1));
$('next').addEventListener('click',()=>s.step===8?go(1):s.step===5&&s.qtype!==null?(s.qtype=null,render()):go(s.step+1));
window.addEventListener('pagehide',()=>{stopRecording();if(recUrl)URL.revokeObjectURL(recUrl);window.speechSynthesis?.cancel()});
render();
})();
</script></body></html>
