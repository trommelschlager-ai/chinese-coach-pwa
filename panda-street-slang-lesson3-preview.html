<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f9dcfa"><title>Panda Street · Урок 3</title><link rel="stylesheet" href="./assets/panda-street-approved-v582.css?v=588"><style>
#app.l3 #pg-content{overflow:auto;display:flex;flex-direction:column;justify-content:center;gap:8px;flex:1;min-height:0;padding:10px 12px}
#app.l3 .headrow a{color:#502078;font-weight:800;text-decoration:none}
#app.l3 .hero3{display:flex;flex-direction:column;flex:1;justify-content:space-evenly;gap:8px}
#app.l3 .hero3 h1{font-size:clamp(38px,12vw,64px);margin:0;color:#260c48}
#app.l3 .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
#app.l3 .tiles span{background:linear-gradient(#fff,#f2d5fa);border:1px solid #dcb4ed;border-radius:13px;font-size:clamp(25px,8vw,40px);padding:7px 0;font-weight:900}
#app.l3 .tiles span:nth-child(4n+2){background:#fff1cf}#app.l3 .tiles span:nth-child(4n+3){background:#dceffc}#app.l3 .tiles span:nth-child(4n){background:#e5f7ea}
#app.l3 .particle3{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:8px}
#app.l3 .particle3 .hanzi{font-size:clamp(66px,24vw,110px)}
#app.l3 .ex3{flex:1;display:flex;flex-direction:column;justify-content:center;gap:9px}
#app.l3 .ex3 .hanzi{font-size:clamp(23px,7vw,34px)}
#app.l3 .ex3 .py{font-size:clamp(16px,4.7vw,21px)}
#app.l3 .rule{font-size:clamp(15px,4.3vw,20px);line-height:1.35;text-align:center;padding:11px}
#app.l3 .switch3{display:flex;justify-content:center;gap:6px;flex:none}
#app.l3 .switch3 button{flex:1;min-height:44px;border-radius:15px;border:1px solid #dbb2eb;color:#502078;background:#fff;font-weight:800}
#app.l3 .switch3 [aria-pressed=true]{background:#e9cafb;border-color:#bc63da}
#app.l3 .choices button{min-height:55px;font-size:24px}
#app.l3 .choices .right{background:#d7f5de;border-color:#64ac77}#app.l3 .choices .wrong{background:#ffe0e4;border-color:#d8788a}
#app.l3 .d3{display:flex;flex-direction:column;gap:4px;justify-content:center}
#app.l3 .d3 .bubble{display:block;margin:0;text-align:left;padding:7px 10px}
#app.l3 .d3 .bubble:nth-child(even){margin-left:18px}#app.l3 .d3 .bubble:nth-child(odd){margin-right:18px}
#app.l3 .d3 .hanzi{font-size:clamp(19px,5.6vw,27px);margin:0}
#app.l3 .d3 .py{font-size:clamp(13px,3.8vw,17px);margin:2px 0}
#app.l3 .d3 .ru{font-size:clamp(12px,3.6vw,16px);margin:2px 0}
#app.l3 .coverbtn3{flex:none;min-height:50px;margin:0}
#app.l3 .quiet3{font-size:12px;color:#705381;margin:0}
#app.l3 .mini3{color:#502078;font-weight:800;min-height:44px}
@media(max-height:650px){#app.l3 #pg-content{justify-content:flex-start;padding:6px 9px;gap:4px}#app.l3 .d3 .bubble{padding:4px 8px}#app.l3 .particle3{gap:4px}#app.l3 .tiles span{padding:3px 0}#app.l3 .hero3{gap:4px}}
</style></head>
<body><main id="app" class="l3" data-stage="cover"><header class="screenhead"><strong>PANDA STREET</strong><div class="headrow"><a href="./panda-street-hsk1-map.html">‹ Все уроки</a><span>Урок 3</span><b id="counter"></b></div><div class="progress" role="progressbar" aria-label="Прогресс" id="progress"><i id="fill"></i></div></header><section id="pg-content" class="content" aria-live="polite"></section><footer class="footer"><button id="back">← Назад</button><button id="next">Начать →</button></footer></main>
<script>
'use strict';
const cards=[["呀","ya","Дружелюбный вопрос или эмоциональная реакция. Часто звучит мягче, но смысл зависит от интонации.","你去哪儿呀？","Nǐ qù nǎr ya?","А ты куда?","好呀！","Hǎo ya!","Давай! / Хорошо!"],["啊","a","Эмоциональная частица в конце реплики: согласие, удивление, обращение. В начале реплики может быть самостоятельным междометием.","早啊！","Zǎo a!","Доброе утро!","行啊！","Xíng a!","Давай! / Конечно!"],["呢","ne","Встречный вопрос или уточнение. В сочетании 在…呢 подчёркивает продолжающееся действие.","我很好，你呢？","Wǒ hěn hǎo, nǐ ne?","У меня всё хорошо, а у тебя?","你在干嘛呢？","Nǐ zài gànmá ne?","Чем ты сейчас занимаешься?"],["吧","ba","Предложение или неуверенная оценка. Может смягчить приказ, но не всегда означает вежливость.","我们走吧！","Wǒmen zǒu ba!","Давай пойдём!","还行吧。","Hái xíng ba.","Вроде нормально."],["嘛","ma","Напоминание о том, что говорящий считает очевидным, либо уговаривание. Не путать с вопросительной 吗.","很简单嘛！","Hěn jiǎndān ma!","Да это же просто!","别生气嘛！","Bié shēngqì ma!","Ну не сердись!"],["哦","ò","Реакция на новую информацию: «а, понятно». Восходящее ó может передавать удивление или уточнение.","哦，我知道了。","Ò, wǒ zhīdào le.","А, понятно.","哦，原来是这样。","Ò, yuánlái shì zhèyàng.","А, вот оно как."],["嗯","ǹg","Краткое подтверждение, что слушаешь или соглашаешься. Тон и длительность меняют значение; встречается также ńg.","嗯，我知道了。","Ǹg, wǒ zhīdào le.","Угу, понятно.","嗯，好。","Ǹg, hǎo.","Угу, хорошо."],["那","nà","Связующее слово «тогда», реакция на предыдущую реплику. Не конечная частица. Может также означать «тот».","那我们走吧！","Nà wǒmen zǒu ba!","Тогда пойдём!","那怎么办？","Nà zěnme bàn?","Тогда что делать?"],["呗","bei","Непринуждённое «ну тогда…», простой или очевидный выход. Иногда звучит равнодушно или резко.","那就走呗。","Nà jiù zǒu bei.","Ну тогда пойдём.","不知道就问呗。","Bù zhīdào jiù wèn bei.","Не знаешь — ну спроси."],["啦","la","Разговорное сочетание 了 и 啊; часто передаёт эмоциональное завершение или сообщение об изменении.","我先走啦！","Wǒ xiān zǒu la!","Ну, я пошёл!","我回来啦！","Wǒ huílái la!","Я вернулся!"],["哎","āi","Привлечение внимания. При других интонациях может выражать удивление, досаду или вздох.","哎，你去哪儿？","Āi, nǐ qù nǎr?","Эй, ты куда?","哎，等一下！","Āi, děng yíxià!","Эй, подожди!"],["哈哈","hāhā","Смех в речи и переписке. Не грамматическая частица; может смягчать тон сообщения.","哈哈，太好笑了！","Hāhā, tài hǎoxiào le!","Ха-ха, очень смешно!","哈哈，你真有意思！","Hāhā, nǐ zhēn yǒuyìsi!","Ха-ха, с тобой интересно!"]];
const dialogues=[[["你今天忙吗？","Nǐ jīntiān máng ma?","Ты сегодня занят?"],["不太忙，你呢？","Bú tài máng, nǐ ne?","Не очень, а ты?"],["我也不忙。那我们走吧！","Wǒ yě bù máng. Nà wǒmen zǒu ba!","Я тоже не занят. Тогда пойдём!"],["好呀！","Hǎo ya!","Давай!"]],[["这个怎么用啊？","Zhège zěnme yòng a?","А как этим пользоваться?"],["很简单嘛，我教你。","Hěn jiǎndān ma, wǒ jiāo nǐ.","Да это же просто, я научу тебя."],["哦，我知道了。","Ò, wǒ zhīdào le.","А, понятно."],["嗯，好。","Ǹg, hǎo.","Угу, хорошо."]],[["哎，你去哪儿呀？","Āi, nǐ qù nǎr ya?","Эй, ты куда?"],["我要回家啦！","Wǒ yào huí jiā la!","Я уже домой собираюсь!"],["那就明天见呗。","Nà jiù míngtiān jiàn bei.","Ну тогда до завтра."],["哈哈，好呀！","Hāhā, hǎo ya!","Ха-ха, давай!"]]];
const quizzes=[["Задай обычный вопрос «Ты занят?»","你忙___？",["吗","嘛","那"],0,"吗 — вопросительная частица, 嘛 — очевидность или уговор."],["Спроси в ответ «А ты?»","我很好，你___？",["啦","呢","呗"],1,"呢 помогает вернуть вопрос собеседнику."],["Предложи вместе пойти","我们走___！",["吗","那","吧"],2,"吧 — предложение совместного действия."],["Подчеркни: «Да это же просто!»","很简单___！",["嘛","吗","那"],0,"嘛 передаёт то, что говорящий считает очевидным."],["Начни реплику со слова «тогда»","___我们走吧！",["呢","那","吧"],1,"那 связывает реплику с предыдущим контекстом."],["Покажи, что новая информация стала понятна","___，原来是这样。",["吧","呢","哦"],2,"哦 с нисходящей интонацией — реакция на новую информацию."],["Подтверди, что услышал собеседника","___，好。",["嗯","那","嘛"],0,"嗯 — короткое подтверждение."],["Добавь дружелюбную частицу к вопросу «Ты куда?»","你去哪儿___？",["呗","呀","那"],1,"呀 часто используется в дружелюбных вопросах. 啊 тоже возможно в подходящем контексте."]];
const $=id=>document.getElementById(id), area=$('pg-content'), next=$('next'), back=$('back');
const key='panda-street-l3-particles-v1';let index=0,side=0,answers={},mistakes=0,first={},showPy=true,showRu=true;
const stages=[['cover',0],...cards.slice(0,8).map((_,i)=>['card',i]),['compare',0],...cards.slice(8).map((_,i)=>['card',i+8]),...dialogues.map((_,i)=>['dialogue',i]),...quizzes.map((_,i)=>['quiz',i]),['practice',0],['finish',0]];
try{const s=JSON.parse(localStorage.getItem(key)||'null');if(s){index=Math.max(0,Math.min(stages.length-1,Number(s.index)||0));answers=s.answers||{};first=s.first||{};mistakes=Number(s.mistakes)||0;}}catch{}
if(new URLSearchParams(location.search).get('welcome')==='1')index=0;
const save=()=>{try{localStorage.setItem(key,JSON.stringify({index,answers,first,mistakes}))}catch{}};
const title=(small,big)=>'<div class="eyebrow">'+small+'</div><h2>'+big+'</h2>';
const example=(c,i)=>'<div class="sheet"><div class="hanzi" lang="zh-Hans">'+c[i]+'</div>'+(showPy?'<div class="py">'+c[i+1]+'</div>':'')+(showRu?'<div class="ru">'+c[i+2]+'</div>':'')+'</div>';
function render(){const [type,n]=stages[index];$('app').dataset.stage=type;$('counter').textContent=String(index+1).padStart(2,'0')+' / '+stages.length;$('fill').style.width=((index+1)*100/stages.length)+'%';$('progress').setAttribute('aria-valuenow',index+1);$('progress').setAttribute('aria-valuemin',1);$('progress').setAttribute('aria-valuemax',stages.length);back.disabled=index===0;next.hidden=type==='finish';next.disabled=type==='quiz'&&answers[n]!==quizzes[n][3];next.textContent=type==='cover'?'Начать →':'Дальше →';
if(type==='cover')area.innerHTML='<div class="hero3"><div class="eyebrow">НОВЫЙ УРОК · STREET 3</div><h1 lang="zh-Hans">地道中文</h1><p class="py">Dìdào Zhōngwén</p><h2>Секреты живого китайского</h2><div class="tiles">'+cards.map(c=>'<span lang="zh-Hans">'+c[0]+'</span>').join('')+'</div><div class="sheet ru">8 основных · 4 дополнительных<br>Как звучать естественнее</div><p class="quiet3">Учебная версия · озвучка ожидает записи</p></div>';
if(type==='card'){const c=cards[n];area.innerHTML=title((n<8?'Основные':'Дополнительные')+' · '+(n+1)+'/12',side?'Примеры употребления':'Разговорное выражение')+(side?'<div class="ex3">'+example(c,3)+example(c,6)+'</div>':'<div class="sheet particle3"><div class="hanzi" lang="zh-Hans">'+c[0]+'</div><div class="py">'+c[1]+'</div><div class="rule">'+c[2]+'</div></div>')+'<div class="switch3"><button data-side="0" aria-pressed="'+(side===0)+'">Объяснение</button><button data-side="1" aria-pressed="'+(side===1)+'">Примеры</button></div><p class="quiet3">← Свайп влево / вправо →</p>';}
if(type==='compare')area.innerHTML=title('Грамматика','Не перепутай!')+'<div class="sheet"><div class="hanzi">吗 / 嘛</div><p class="rule">吗 — вопрос. 嘛 — очевидность или уговаривание. Оба обычно произносятся нейтральным тоном.</p><div class="ru">你忙吗？ — Ты занят?</div><div class="ru">很简单嘛！ — Да это же просто!</div></div><div class="sheet"><div class="hanzi">呀 / 啊</div><p class="rule">Обе частицы могут смягчать реплику или выражать эмоции. 呀 также может быть звуковым вариантом 啊 после некоторых слогов. Это не абсолютное различие.</p><div class="ru">好呀！ / 好啊！ — Хорошо! / Давай!</div></div>';
if(type==='dialogue')area.innerHTML=title('Диалог '+(n+1)+'/3','Живой разговор')+'<div class="d3">'+dialogues[n].map((l,i)=>'<div class="bubble"><small>'+(i%2?'Ты':'Panda Street')+'</small><div class="hanzi" lang="zh-Hans">'+l[0]+'</div>'+(showPy?'<p class="py">'+l[1]+'</p>':'')+(showRu?'<p class="ru">'+l[2]+'</p>':'')+'</div>').join('')+'</div><div class="switch3"><button data-toggle="py" aria-pressed="'+showPy+'">Пиньинь</button><button data-toggle="ru" aria-pressed="'+showRu+'">Перевод</button></div>';
if(type==='quiz'){const q=quizzes[n],a=answers[n];area.innerHTML=title('Мини-тест '+(n+1)+'/8','Выбери выражение')+'<div class="sheet"><p class="ru">'+q[0]+'</p><div class="hanzi" lang="zh-Hans">'+q[1]+'</div><div class="choices">'+q[2].map((v,i)=>'<button data-answer="'+i+'" class="choice '+(a===i?(i===q[3]?'right':'wrong'):'')+'" '+(a===q[3]?'disabled':'')+'>'+v+'</button>').join('')+'</div><p class="rule">'+(a===undefined?'Выбери вариант.':a===q[3]?'Верно! '+q[4]:'Попробуй ещё раз.')+'</p></div>';}
if(type==='practice')area.innerHTML=title('Разговорная практика','Скажи по-китайски')+'<div class="sheet"><p class="ru">1. Предложи Пандe пойти вместе.</p><p class="ru">2. Задай встречный вопрос.</p><p class="ru">3. Покажи, что ты понял новую информацию.</p><details class="rule"><summary>Возможные ответы</summary>我们走吧！<br>你呢？<br>哦，我知道了。</details></div><p class="quiet3">Тематический сценарий Panda Street AI и эталонная озвучка пока не подключены.</p>';
if(type==='finish'){const correct=quizzes.filter((q,i)=>answers[i]===q[3]).length;const firstCorrect=quizzes.filter((q,i)=>first[i]===q[3]).length;area.innerHTML=title('Итоги','Урок 3 завершён')+'<div class="sheet"><div class="hanzi">'+correct+'/8</div><p class="ru">Правильно с первой попытки: '+firstCorrect+'/8</p><p class="ru">Ошибочные попытки: '+mistakes+'</p></div><button class="wide pink coverbtn3" data-repeat>Повторить урок</button><a class="wide coverbtn3" href="./panda-street-hsk1-map.html">Все уроки</a>';}
area.scrollTop=0;save();}
function move(d){if(d>0&&next.disabled)return;index=Math.max(0,Math.min(stages.length-1,index+d));side=0;showPy=true;showRu=true;render()}
next.onclick=()=>move(1);back.onclick=()=>move(-1);
area.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.side!==undefined){side=Number(b.dataset.side);render()}if(b.dataset.toggle==='py'){showPy=!showPy;render()}if(b.dataset.toggle==='ru'){showRu=!showRu;render()}if(b.dataset.answer!==undefined){const n=stages[index][1],a=Number(b.dataset.answer);if(first[n]===undefined)first[n]=a;if(a!==quizzes[n][3])mistakes++;answers[n]=a;render()}if(b.hasAttribute('data-repeat')){index=0;side=0;answers={};first={};mistakes=0;render()}});
let start=null;area.addEventListener('pointerdown',e=>{if(stages[index][0]==='card'&&!e.target.closest('button'))start=[e.pointerId,e.clientX,e.clientY]});area.addEventListener('pointercancel',()=>start=null);area.addEventListener('pointerup',e=>{if(!start||start[0]!==e.pointerId)return;const dx=e.clientX-start[1],dy=e.clientY-start[2];start=null;if(stages[index][0]==='card'&&Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)*1.5){side=dx<0?1:0;render()}});
render();
</script></body></html>
