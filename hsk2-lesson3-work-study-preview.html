function mixedDay() {
  const order = [0,1,2,3,4,5];
  for (let i = order.length - 1; i > 0; i--) {

      const current = courseQuiz[state.courseQuizCursor];
      return !!(current && activeQuiz().quiz[current.type][current.index]);
    }
    case 5: return sectionComplete(3);
    case 7: return sectionComplete(4);
    case 8: return true;
    default: return false;
  }
}

// 5 visible chapter tabs cover 8 detailed screens; the welcome screen belongs to chapter 1.
const sectionForStep = step => step === 1 ? 0 : courseSections.findIndex(section => section.steps.includes(step));
const unlockedSection = () => Math.max(0,Math.min(courseSections.length - 1,Number(state.unlockedSection) || 0));
function canOpenStep(target,advance = false) {
  if (!courseMode) return true;
  const targetSection = sectionForStep(target);
  const currentSection = sectionForStep(state.step);
  if (targetSection < 0) return false;
  if (target === 5 && !coreQuizDone()) return false;
  if (target === 8 && !sectionComplete(4)) return false;
  if (targetSection <= unlockedSection()) return true;
  // A new chapter opens only after confirmed work on the current chapter.
  return advance && currentSection === unlockedSection() &&
    targetSection === currentSection + 1 && sectionComplete(currentSection);
}
function reconcileUnlockedProgress() {
  let earned = 0;
  while (earned < courseSections.length - 1 && sectionComplete(earned)) earned++;
  state.unlockedSection = Math.min(unlockedSection(),earned);
}

function move(step,advance = false) {
  const target = Math.max(1,Math.min(8,Number(step) || 1));
  if (!canOpenStep(target,advance)) {
    setStatus('Сначала пройди предыдущий раздел и нажми «Дальше».');
    return;
  }
  if (courseMode && sectionForStep(target) > unlockedSection())
    state.unlockedSection = sectionForStep(target);
  clearMedia();
  feedback = '';
  heardClip = null;
  state.step = target;
  if (state.step !== 3) state.quizTest = null;
  if (courseMode) {
    layoutParams.set('step',state.step);
    history.pushState({pgHsk2Lesson3:true,step:state.step},'','?' + layoutParams + location.hash);
  }
  save();
  render(true);
}

function render(resetScroll = false) {
  const step = state.step;
  const detailed = step === 3 || step === 6;
  app.classList.toggle('detail',detailed);
  app.dataset.view = step;
  if (courseMode && step === 3) {
    const task = courseQuiz[state.courseQuizCursor];
    state.quizTest = task?.type ?? null;
    if (task) state.quizIndex = task.index;
  }
  if(courseMode){
    const n=stepNumber(step);
    counter.textContent=['Начало','Слова','Правило','Речь','Тесты','Рассказ','Диалог','Итог'][n-1];
    counter.title='Шаг '+n+' из 8 · '+titles[step-1];
    chapter.textContent='Шаг '+n+' / 8';
    chapter.setAttribute('aria-label','Шаг '+n+' из восьми. '+titles[step-1]);
    nav.style.setProperty('--pg2-progress',(n*100/8)+'%');
  } else headLabel.textContent = 'HSK 2 · Урок 3 · Шаг ' + step + ' из 8';
  headBack.disabled = step === 1;
  stepButtons.forEach((button,index) => {
    const active = courseMode ? (index === 0 && step === 1) || courseSections[index].steps.includes(step) : index+1 === step;
    const locked = courseMode && index > unlockedSection();
    button.setAttribute('aria-current',active ? 'step' : 'false');
    if (courseMode) {
      button.classList.toggle('active',active);
      button.classList.toggle('section-locked',locked);
      button.disabled = locked;
      button.title = locked ? '🔒 Выполни предыдущий раздел, чтобы открыть' : 'Раздел открыт';
      button.setAttribute('aria-label',courseSections[index].name + (locked ? '. Закрыт — откроется после предыдущего раздела.' : '. Открыт.'));
    }
  });
  workspace.innerHTML = [intro,newWords,quiz,grammar,day,tones,chat,finish][step-1]();
  if(step===6)window.PandaToneTrainer?.mount();
  back.hidden = step === 1;
  const inQuiz = step === 3 && state.quizTest !== null;
  const canExitQuiz = inQuiz || (courseMode && step === 3 && state.courseQuizCursor !== null);
  back.textContent = canExitQuiz ? '← К тестам' : '← Назад';
  const backLabel = canExitQuiz ? 'К списку тестов' : 'Предыдущий шаг';
  back.setAttribute('aria-label',backLabel);
  headBack.setAttribute('aria-label',backLabel);
  if (courseMode) {
    const cursor = state.courseQuizCursor;
    const current = courseQuiz[cursor];
    const following = courseQuiz[adjacentCourseTask(1)];
    next.textContent = inQuiz
      ? (!activeQuiz().quiz[current.type][current.index] ? 'Сначала выполни'
        : !following ? (state.courseQuizType === null ? 'К результатам →' : 'К тестам →')
        : following.word !== current.word ? 'Следующее слово →' : 'Дальше →')
      : step === 8 ? 'К началу ↻' : step === 3 && cursor === null ? (coreQuizDone() ? 'К рассказу →' : 'Проверить 6 слов →') : 'Дальше →';
  } else {
    next.textContent = step === 1 ? 'Начать урок' : step === 8 ? 'К началу ↻' : titles[step] + ' →';
  }
  next.disabled = !currentStepComplete();
  next.setAttribute('aria-label',next.disabled ? 'Заверши текущее упражнение, чтобы продолжить' : next.textContent);
  if (resetScroll) workspace.scrollTop = 0;
}

async function play(text,button) {
  const clip = clips.get(normalize(text));
  if (!clip) {
    setStatus('Отдельной записи для «' + text + '» пока нет.');
    return;
  }
  clearMedia();
  const player = new Audio(clip);
  audio = player;
  const origin = scope();
  button.setAttribute('aria-pressed','true');
  const failure = () => {
    if (audio !== player || origin !== scope()) return;
    audio = null;
    button.removeAttribute('aria-pressed');
    setStatus('Аудио недоступно. Проверь интернет и повтори. Прогресс не засчитывается.');
  };
  player.addEventListener('error',failure,{once:true});
  player.addEventListener('ended',() => {
    if (audio !== player || origin !== scope()) return;
    audio = null;
    button.removeAttribute('aria-pressed');
    const wordIndex = words.findIndex(word => normalize(word.zh) === normalize(text));
    if (wordIndex >= 0 && !state.heardWords.includes(wordIndex)) {
      state.heardWords.push(wordIndex);
      save();
    }
    if (state.step === 3 && state.quizTest === 1) {
      heardClip = origin;
      for (const choice of workspace.querySelectorAll('[data-choice]')) choice.disabled = false;
      setStatus('Запись прослушана. Теперь выбери слово.',true);
    } else if (state.step === 2 && wordIndex >= 0) {
      setStatus('');
      render();
    } else {
      setStatus('');
    }
  },{once:true});
  try {
    await player.play();
    if (audio === player && origin === scope()) setStatus('Запись воспроизводится.',true);
  } catch {
    failure();
  }
}

function recognize(allowed,onMatch,onMiss) {
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Recognition || !window.isSecureContext) {
    state.practiceMode = 'self'; save();
    setStatus('Распознавание недоступно. Можно попробовать другой браузер или воспользоваться запасной самопроверкой в разделе «Речь».');
    return;
  }
  clearMedia();
  let instance;
  try {
    instance = new Recognition();
    speech = instance;
    instance.lang = 'zh-CN';
    instance.continuous = false;
    instance.interimResults = false;
    instance.maxAlternatives = 3;
    instance.onresult = event => {
      if (speech !== instance) return;
      speech = null;
      const alternatives = Array.from(event.results[event.resultIndex || 0], item => item.transcript);
      const match = allowed.find(text => alternatives.some(heard => normalize(heard) === normalize(text)));
      if (match) onMatch(match);
      else {
        if (onMiss) onMiss();
        setStatus('Распознано «' + (alternatives[0] || '…') + '». Попробуй ещё раз. Тоны не оценивались.');
      }
    };
    instance.onerror = event => {
      if (speech !== instance) return;
      speech = null;
      const errors = {
        'not-allowed':'Разреши доступ к микрофону в настройках браузера и попробуй снова.',
        'audio-capture':'Браузер не нашёл доступный микрофон.',
        network:'Сервис распознавания речи недоступен. Проверь соединение и попробуй снова.',
        'no-speech':'Браузер не распознал речь. Попробуй ещё раз.',
        'service-not-allowed':'Сервис распознавания отключён. Используй запасной режим.',
        'language-not-supported':'Китайский язык не поддерживается сервисом распознавания.'
      };
      setStatus((errors[event.error] || 'Распознавание речи недоступно. Попробуй ещё раз.') +
        ' Если проблема сохраняется, используй запасную самопроверку в разделе «Речь».');
    };
    instance.onend = () => {
      if (speech !== instance) return;
      speech = null;
      setStatus('Речь не распознана. Попробуй ещё раз.');
    };
    instance.start();
    setStatus('Слушаю…');
  } catch {
    if (speech === instance) speech = null;
    setStatus('Микрофон не запустился. Проверь разрешение и попробуй снова.');
  }
}

function markQuiz(ok,method) {
  const t = state.quizTest;
  const i = state.quizIndex;
  const attempt = activeQuiz();
  if (attempt.quiz[t][i]) return;
  if (ok) {
    const answer = {correctFirst:method !== 'self' && !attempt.missed[t][i],method};
    attempt.quiz[t][i] = answer;
    state.quiz[t][i] ??= {...answer,correctFirst:answer.correctFirst && !state.missed[t][i]};
    save();
    setStatus(method === 'self' ? '✓ Самостоятельная практика выполнена. Тоны не оценивались.'
      : method === 'speech' ? '✓ Слово распознано. Тоны не оценивались.' : '✓ Верно. Ответ засчитан.',true);
    render();
  } else {
    recordQuizMiss(t,i);
    save();
    setStatus('Пока неверно. Попробуй ещё раз.');
  }
}

function recordQuizMiss(type,index) {
  activeQuiz().missed[type][index] = true;
  if (!state.quiz[type][index]) state.missed[type][index] = true;
}

function adjacentCourseTask(direction) {
  const type = state.courseQuizType;
  for (let index = state.courseQuizCursor + direction; index >= 0 && index < courseQuiz.length; index += direction) {
    if (type === null || (type === -1 ? courseQuiz[index].type !== 0 : courseQuiz[index].type === type)) return index;
  }
  return direction === 1 && (type===null || type===-1) ? courseQuiz.length : -1;
}

function showCourseTask(cursor) {
  clearMedia();
  state.courseQuizCursor = cursor < 0 ? null : Math.min(cursor,courseQuiz.length);
  if (cursor < 0) {
    state.courseQuizType = null;
    state.quizRetry = null;
  }
  state.quizPicked = [];
  heardClip = null;
  feedback = '';
  render(true);
  save();
  workspace.querySelector('.section-panel h1[tabindex]')?.focus({preventScroll:true});
}

function startTests() {
  if (!courseMode) {
    openTest(Math.max(0,tests.findIndex((_,i) => correctCount(i) < words.length)));
    return;
  }
  state.courseQuizType=0;state.quizRetry=null;
  const firstPending=courseQuiz.findIndex(({type,index})=>type===0&&!state.quiz[0][index]);
  if(firstPending<0)showCourseTask(-1);else showCourseTask(firstPending);
}
function startOptionalTests(){
  state.courseQuizType=-1;state.quizRetry=null;
  const pending=courseQuiz.findIndex(({type,index})=>type!==0&&!state.quiz[type][index]);
  showCourseTask(pending<0?courseQuiz.length:pending);
}

function startCourseReplay(type) {
  state.courseQuizType = type;
  state.quizRetry = {
    quiz:tests.map(() => Array(words.length).fill(null)),
    missed:tests.map(() => Array(words.length).fill(false))
  };
  showCourseTask(courseQuiz.findIndex(task => type === null || task.type === type));
}

function startCourseType(type) {
  state.courseQuizType = type;
  const firstPending = courseQuiz.findIndex(task => task.type === type && !state.quiz[type][task.index]);
  if (firstPending < 0) startCourseReplay(type);
  else showCourseTask(firstPending);
}

function openTest(test) {
  clearMedia();
  state.quizTest = test;
  state.quizIndex = test === null ? 0 : Math.max(0,state.quiz[test].findIndex(result => !result));
  state.quizPicked = [];
  heardClip = null;
  feedback = '';
  save();
  render(true);
}

function changeQuestion(direction) {
  const index = state.quizIndex + direction;
  if (index >= words.length) {
    openTest(null);
    return;
  }
  if (index < 0) return;
  clearMedia();
  state.quizIndex = index;
  state.quizPicked = [];
  heardClip = null;
  feedback = '';
  save();
  render(true);
}

function update() {
  feedback = '';
  save();
  render();
}

function markSelfSpoken(index) {
  if (!Number.isInteger(index) || index < 0 || index >= words.length) return;
  if (!state.heardWords.includes(index)) {
    setStatus('Сначала изучи и отметь это слово на первом шаге, затем повтори.');
    return;
  }
  if (!state.selfSpoken.includes(index)) state.selfSpoken.push(index);
  save();
  setStatus('✓ Отмечено самостоятельное повторение. Правильность тонов не подтверждена.',true);
  render();
}
function onMic(id) {
  if (id === 'chat') {
    const row = dialogue[state.chat.length];
    if (!row) return;
    recognize(row.answers.map(a => a[0]),answer => {
      state.chat.push(answer);
      save();
      setStatus('✓ Ответ распознан.',true);
      render();
      followDialogue();
    });
  } else if (id === 'quiz') {
    recognize([words[state.quizIndex].zh],() => markQuiz(true,'speech'),() => {
      recordQuizMiss(state.quizTest,state.quizIndex);
      save();
    });
  } else {
    const index = Number(id);
    recognize([words[index].zh],match => {
      if (!state.mic.includes(index)) state.mic.push(index);
      save();
      setStatus('✓ Распознано «' + match + '». Тоны не оценивались.',true);
      render();
    });
  }
}

function followDialogue() {
  const target = workspace.querySelector('.dialogue .chat-bubble:last-of-type');
  if (target) target.scrollIntoView({block:'nearest'});
}

function checkOrder(part,length,success,failure) {
  const order = part === 'grammar' ? state.grammar : state.dayOrder;
  const ok = order.length === length && order.every((value,i) => value === i);
  state[part + 'Done'] = ok;
  save();
  setStatus(ok ? success : failure,ok);
  render();
}

const actions = {
  step: value => {
    if (courseMode && state.step === 3 && Number(value) === 3) showCourseTask(-1);
    else move(Number(value));
  },
  workChoice: value => {
    const i=Number(value);
    if(!Number.isInteger(i)||i<0||i>=5)return;
    state.workChoice=i;state.workRead=false;save();render();
  },
  workRead: () => {state.workRead=true;save();render();},
  say: (value,button) => play(value,button),
  test: value => openTest(Number(value)),
  quizType: value => startCourseType(Number(value)),
  quizRetry: value => startCourseReplay(value === 'all' ? null : Number(value)),
  start: startTests,
  quizExtended: startOptionalTests,
  question: value => changeQuestion(Number(value)),
  choice: value => {
    const correct = state.quizTest === 1 ? listening[state.quizIndex][1] : state.quizIndex;
    markQuiz(Number(value) === correct,'choice');
  },
  letter: value => { state.quizPicked.push(Number(value)); update(); },
  letterClear: () => { state.quizPicked = []; update(); },
  letterCheck: () => {
    const target = words[state.quizIndex].zh;
    markQuiz(state.quizPicked.map(i => [...target][i]).join('') === target,'assemble');
  },
  gram: value => { state.grammar.push(Number(value)); state.grammarDone = false; update(); },
  gramUndo: () => { state.grammar.pop(); state.grammarDone = false; update(); },
  gramClear: () => { state.grammar = []; state.grammarDone = false; update(); },
  gramCheck: () => checkOrder('grammar',5,'✓ Верно: 我在公司工作。','Порядок: 我 → 在 → 公司 → 工作 → 。'),
  day: value => { const i=Number(value); if(!Number.isInteger(i)||i<0||i>=6||state.dayOrder.includes(i))return; state.dayOrder.push(i); state.dayDone = false; update(); },
  storyCols: value => { const n=Number(value); if(n!==2&&n!==3)return; state.aboutStoryColumns=n; save();render(); },
  dayUndo: () => { state.dayOrder.pop(); state.dayDone = false; update(); },
  dayReset: () => { state.dayOrder = []; state.dayShuffled = mixedDay(); state.dayDone = false; update(); },
  dayCheck: () => checkOrder('day',6,'✓ Отлично: все шесть примеров собраны.','Порядок: компания → школа → коллега → одноклассница → компьютер → китайский.'),
  wordsRead: () => {
    if (words.every(word => clips.has(normalize(word.zh)))) return;
    state.heardWords = words.map((_,i) => i);
    save(); render();
    setStatus('✓ Повторено самостоятельно, без аудио. Тоны не проверялись.',true);
  },
  learn: value => {
    const i=Number(value);
    if(!Number.isInteger(i)||i<0||i>=words.length)return;
    if(!state.heardWords.includes(i))state.heardWords.push(i);
    save();render();
  },
  toneTab: value => { clearMedia(); state.toneTab = value; update(); },
  practiceMode: value => { if (value === 'mic' || value === 'self') {state.practiceMode = value; update();} },
  selfSpoken: value => markSelfSpoken(Number(value)),
  selfQuiz: () => { if (state.step === 3 && state.quizTest === 4) markQuiz(true,'self'); },
  mic: value => onMic(value),
  chat: value => {
    clearMedia();
    state.chat.push(dialogue[state.chat.length].answers[Number(value)][0]);
    update();
    followDialogue();
  },
  chatReset: () => { clearMedia(); state.chat = []; update(); },
  personalRead: value => {
    const i=Number(value);
    if(!Number.isInteger(i)||i<0||i>=6)return;
    const marked=new Set(state.personalRead||[]);
    if(marked.has(i))marked.delete(i);else marked.add(i);
    state.personalRead=[...marked].sort((a,b)=>a-b);save();
    const panel=workspace.querySelector('.pg2-rehearsal');
    if(panel)panel.outerHTML=personalReadControls(6);
  }
};
app.addEventListener('change',event=>{
  const customInput=event.target.closest('input[data-personal-custom]');
  if(customInput){
    const field=customInput.dataset.storyKey, kind=customInput.dataset.personalCustom;
    if(!Object.hasOwn(storyOptions,field) || !['zh','py'].includes(kind))return;
    const oldScroll=workspace.scrollTop;
    state.personalCustom ??= {};
    state.personalCustom[field] ??= {};
    state.personalCustom[field][kind]=customInput.value.trim().slice(0,kind==='py'?100:45);
    state.personalRead=[];
    save();refreshPersonalBuilder();workspace.scrollTop=oldScroll;
    return;
  }
  const target=event.target.closest('select[data-personal]');
  if(!target)return;
  const key=target.dataset.personal;
  if(!Object.hasOwn(storyOptions,key))return;
  if(!storyOptions[key].some(option=>option[0]===target.value))return;
  const oldScroll=workspace.scrollTop;
  state.personal[key]=target.value;
  state.personalRead=[];
  save();
  refreshPersonalBuilder();
  workspace.scrollTop=oldScroll;
});

let pressedNavButton;
let pressedNavTimer;
app.addEventListener('click',event => {
  const button = event.target.closest('.pg433-header button, .pg433-footer button');
  if (!button || button.disabled) return;
  pressedNavButton?.classList.remove('lesson-button-pressed');
  clearTimeout(pressedNavTimer);
  pressedNavButton = button;
  button.classList.add('lesson-button-pressed');
  pressedNavTimer = setTimeout(() => button.classList.remove('lesson-button-pressed'),160);
},true);

app.addEventListener('click',event => {
  const button = event.target.closest('button');
  if (!button || button.disabled) return;
  for (const [action,value] of Object.entries(button.dataset)) {
    if (Object.hasOwn(actions,action)) {
      actions[action](value,button);
      break;
    }
  }
});

function previousStep() {
  if (courseMode && state.step === 3 && state.courseQuizCursor !== null) {
    showCourseTask(-1);
  } else if (state.step === 3 && state.quizTest !== null) {
    openTest(null);
  } else {
    move(courseMode ? courseSteps[courseSteps.indexOf(state.step)-1] : state.step-1);
  }
}

back.addEventListener('click',previousStep);
headBack.addEventListener('click',previousStep);
next.addEventListener('click',() => {
  if (!currentStepComplete()) {
    setStatus('Заверши текущее упражнение, чтобы продолжить.');
    return;
  }
  if (courseMode && state.step === 3) {
    if (state.courseQuizCursor === null) {
      if(coreQuizDone())move(5,true);else startTests();
      return;
    }
    if (state.quizTest !== null) {
      showCourseTask(adjacentCourseTask(1));
      return;
    }
  }
  move(state.step === 8 ? 1 : (courseMode ? courseSteps[courseSteps.indexOf(state.step)+1] : state.step+1),true);
});

reconcileUnlockedProgress();
const fromQuery = Number(layoutParams.get('step'));
if (Number.isInteger(fromQuery) && fromQuery >= 1 && fromQuery <= 8 && canOpenStep(fromQuery)) {
  if (!courseMode || state.step !== fromQuery) state.quizTest = null;
  state.step = fromQuery;
}
if (!Number.isInteger(state.step) || state.step < 1 || state.step > 8) state.step = 1;
if (courseMode && !canOpenStep(state.step)) {
  state.step = 2;
  state.quizTest = null;
  state.courseQuizCursor = null;
}
if (courseMode) {
  layoutParams.set('step',state.step);
  history.replaceState({pgHsk2Lesson3:true,step:state.step},'','?' + layoutParams + location.hash);
  window.addEventListener('popstate',event => {
    if (!event.state?.pgHsk2Lesson3) return;
    const requested = Number(event.state.step);
    const target = Number.isInteger(requested) && requested >= 1 && requested <= 8 && canOpenStep(requested)
      ? requested : 2;
    clearMedia();
    state.step = target;
    state.quizTest = null;
    state.courseQuizCursor = null;
    feedback = '';
    layoutParams.set('step',target);
    save();
    render(true);
  });
}
save();
render(true);

window.PandaGoHSK2Preview = {
  getProgress: () => JSON.parse(JSON.stringify(state)),
  goToStep: move
};
</script>
