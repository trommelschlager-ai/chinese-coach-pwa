<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Знакомство · Panda Go</title><style>*{box-sizing:border-box}body{margin:0;background:#ece0f3;color:#42203f;font:18px/1.5 system-ui}main{max-width:460px;min-height:100svh;margin:auto;padding:22px;background:#fff5fb}article{background:white;padding:18px;border-radius:18px;border:1px solid #e3bfd7}h1{line-height:1.2}button,a{font:inherit;color:#733465}button{padding:10px;border:1px solid #dbb5d2;border-radius:14px;margin:4px;background:white}#next{background:#a83075;color:white;width:100%;margin:18px 0}b{font-size:24px}</style><main><a href="./index.html">← Главная</a><p id="step"></p><h1></h1><article></article><p role="status"></p><button id="next"></button><button id="back">← Назад</button></main>
<script src="./assets/human-audio-map.js?v=106"></script><script>
const pages=[
['Знакомство','После урока ты сможешь спросить имя собеседника и представиться.','Начать урок'],
['Три слова',['我|wǒ|я','你|nǐ|ты','叫|jiào|зваться'].map(row=>{const [word,py,ru]=row.split('|');return '<p><b>'+word+'</b> · '+py+' · '+ru+' <button data-word="'+word+'" aria-label="Послушать '+word+'">🔊</button></p>'}).join(''),'Составить фразу'],
['Как назвать своё имя','<b>我叫安娜。</b><br>Wǒ jiào Ānnà. — Меня зовут Анна.<p>Сначала скажи 我叫, затем добавь имя. Чтобы спросить «А ты?», скажи 你呢？ (Nǐ ne?).</p>','Прочитать разговор'],
['Знакомство в разговоре','<p>А · <b>你叫什么名字？</b><br>Nǐ jiào shénme míngzi?<br>Как тебя зовут?</p><p>Б · <b>我叫安娜。你呢？</b><br>Wǒ jiào Ānnà. Nǐ ne?<br>Меня зовут Анна. А тебя?</p><p>А · <b>我叫小明。</b><br>Wǒ jiào Xiǎomíng.<br>Меня зовут Сяомин.</p>什么名字 — «какое имя». Здесь вопрос уже содержит 什么, поэтому 吗 не требуется.','Проверить себя'],
['Как ответить на вопрос об имени?','<b>你叫什么名字？</b><p><button data-answer="no">你呢？</button><button data-answer="yes">我叫安娜。</button></p>','Ответить самостоятельно'],
['Теперь твоя очередь','Представься вслух по-китайски, используя своё имя.<details><summary>Сверить с образцом</summary>我叫… · Wǒ jiào…</details>','Завершить урок'],
['Урок пройден','Ты потренировался спрашивать имя и представляться. <p><a href="./index.html?panda=dialogues#panda/dialogues">Послушать диалог «Знакомство» →</a></p>','Повторить урок']];
const q=s=>document.querySelector(s);let i=0,clip,correct=false;try{i=Math.max(0,Math.min(6,parseInt(localStorage.getItem('pg-intro-step'))||0))}catch{}
function draw(){clip?.pause();q('#step').textContent='Урок 1 · '+(i<6?'Шаг '+(i+1)+' из 6':'Завершено');q('h1').textContent=pages[i][0];q('article').innerHTML=pages[i][1];q('#next').textContent=pages[i][2];q('#back').hidden=!i;q('#next').disabled=i===4&&!correct;q('[role=status]').textContent='';try{localStorage.setItem('pg-intro-step',i)}catch{}}
q('#next').onclick=()=>{i=(i+1)%pages.length;if(!i)correct=false;draw()};q('#back').onclick=()=>{i--;draw()};q('article').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.word){clip?.pause();clip=new Audio(window.courseHumanAudio[b.dataset.word]);clip.play().catch(()=>q('[role=status]').textContent='Не удалось включить запись.')}if(b.dataset.answer){correct=b.dataset.answer==='yes';q('#next').disabled=!correct;q('[role=status]').textContent=correct?'Верно. После 我叫 ставим имя.':'你呢？ означает «А ты?». Сначала назови своё имя.'}};draw();
</script></html>
