<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c86be0">
<meta name="description" content="Panda Go HSK 2 — чистая HTML-демоверсия утверждённого первого экрана.">
<title>Panda Go HSK 2 — Мой день · Чистый дизайн Шаг 1</title>
<style>
  :root{color-scheme:light;--rose:#b121c7;--gold:#ffd889}
  *{box-sizing:border-box}
  html{height:100%;background:#dbc0f4}
  body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif}
  button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .shell{height:100dvh;min-height:430px;max-width:480px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;position:relative;background:#efd5f6;box-shadow:0 0 28px #65118332}
  .top{flex:0 0 auto;width:100%;aspect-ratio:356/98;position:relative;overflow:hidden;z-index:10;background:#dfabe8;box-shadow:0 3px 10px #7f329b66}
  .top img{display:block;width:100%;height:100%;object-fit:fill;pointer-events:none}
  .step-nav{position:absolute;inset:0;display:block}
  .step-nav button{position:absolute;top:56%;width:8.5%;height:44%;transform:translate(-50%,0);border:none;background:transparent;border-radius:100%;opacity:1}
  .step-nav button:active{background:#ffffff45;box-shadow:0 0 0 3px #ffb6e5}
  .step-nav button:focus-visible{outline:3px solid #9e26b5;outline-offset:-2px}
  .step-nav button.active{cursor:default}
  .main{flex:1;min-height:0;position:relative;overflow-y:auto;overflow-x:hidden;background:linear-gradient(180deg,#fae4f9b5 0%,#f2d4f7a6 29%,#dcc0ed22 70%),url("./assets/hsk2-clean-v470/landscape.webp") 50% 50%/cover no-repeat}
  .main:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#fbdcf377,#ffffff00 30%,#d7a0e120);z-index:0}
  .art{position:relative;z-index:1;width:calc(100% - 14px);margin:clamp(18px,4.3dvh,42px) auto 0;border-radius:19px;overflow:hidden;border:2px solid #ffeac3;box-shadow:0 7px 22px #831f9c6b,0 0 0 2px #be7bc6;background:#f3d2ef}
  .art img{display:block;width:100%;height:auto;pointer-events:none}
  .main-caption{position:relative;z-index:1;display:block;text-align:center;color:#5b1a77;font-size:11px;font-weight:750;text-shadow:0 1px 2px #fff,0 1px #fff;margin:17px auto 14px;padding:5px 9px;width:max-content;max-width:96%;background:#fff9f6c4;border:1px solid #ffe6a9;border-radius:40px;box-shadow:0 3px 8px #8a419548}
  .bottom{flex:0 0 auto;padding:7px 7px calc(6px + env(safe-area-inset-bottom));background:linear-gradient(#fad2f2,#f3bdea);border-top:2px solid #ffe7a1;box-shadow:0 -4px 12px #a043b05d;z-index:10}
  .next{display:block;width:100%;padding:0;border:0;background:none;aspect-ratio:356/49;border-radius:40px;box-shadow:0 3px 8px #6b1a8c53;overflow:hidden;position:relative}
  .next img{display:block;width:100%;height:100%;object-fit:fill;pointer-events:none}
  .next:active{transform:translateY(2px) scale(.99);filter:brightness(1.1)}
  .next:focus-visible{outline:3px solid #a81db6;outline-offset:3px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  @media(min-width:480px){.shell{border:2px solid #dc91e3;border-radius:16px}}
  @media(max-height:620px){.art{margin-top:8px;width:calc(100% - 18px)}.main-caption{margin-top:8px;font-size:10px}.shell{min-height:0}}
  @media(prefers-reduced-motion:reduce){.next{transition:none}}
</style>
</head>
<body>
<div class="shell" id="panda-clean">
  <header class="top">
    <img src="./assets/hsk2-clean-v470/header.webp" alt="Panda Go · HSK 2. Урок 1 «Мой день». Навигация: восемь шагов." width="712" height="196" draggable="false">
    <nav class="step-nav" aria-label="Открыть шаг урока">
      <button class="active" style="left:12.6%" aria-current="step" aria-label="Шаг 1 — вступление"></button>
      <button style="left:25.5%" data-go="2" aria-label="Шаг 2 — новые слова"></button>
      <button style="left:36.2%" data-go="3" aria-label="Шаг 3 — пять мини-тестов"></button>
      <button style="left:46.5%" data-go="4" aria-label="Шаг 4 — грамматика"></button>
      <button style="left:56.9%" data-go="5" aria-label="Шаг 5 — мой распорядок"></button>
      <button style="left:67.2%" data-go="6" aria-label="Шаг 6 — произношение"></button>
      <button style="left:77.8%" data-go="7" aria-label="Шаг 7 — фразы и диалог"></button>
      <button style="left:87.8%" data-go="8" aria-label="Шаг 8 — результат"></button>
    </nav>
  </header>
  <main class="main">
    <section class="art" aria-label="Мой день. Wǒ de yì tiān. Тебя ждут шесть слов, пять мини-тестов, грамматика, распорядок, произношение и диалог.">
      <img src="./assets/hsk2-clean-v470/top-content.webp" width="710" height="678"
        alt="Утверждённая иллюстрация Панды с красной книгой. 我的⼀天 — Wǒ de yì tiān — Мой день. Ниже программа занятия: шесть слов, пять мини-тестов, грамматика, распорядок, произношение и диалог." draggable="false">
    </section>
    <div class="main-caption">Превью · утверждённая иллюстрация · урок не изменён</div>
  </main>
  <footer class="bottom">
    <button class="next" id="next-step" aria-label="Дальше: новые слова, шаг 2">
      <img src="./assets/hsk2-clean-v470/footer.webp" alt="" draggable="false" width="712" height="98">
    </button>
  </footer>
</div>
<script>
'use strict';
const oldPreview='./preview-hsk2-step6.html';
function openStep(n){
  if(n===1)return;
  if(!Number.isInteger(n)||n<2||n>8)return;
  window.location.href=oldPreview+'?step='+n+'&v=470';
}
document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>openStep(Number(b.dataset.go))));
document.querySelector('#next-step').addEventListener('click',()=>openStep(2));
</script>
</body>
</html>
