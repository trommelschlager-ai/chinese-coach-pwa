<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e7d1f6">
<title>Китайский в ритме · HSK 1 · Panda Go</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC",Arial,sans-serif;color:#4a2864;background:#eee0f7}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;overflow-x:hidden}
body{background:linear-gradient(#fff7ffbd,#f5e4fcce),url("./assets/approved-pastel-v112.webp") center/cover fixed no-repeat}
button{font:inherit;cursor:pointer}
button:focus-visible,.flash:focus-visible{outline:3px solid #ab3197;outline-offset:3px}
button:disabled{opacity:.38;cursor:default}
.frame{width:min(100%,480px);min-height:100svh;margin:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:15px;background:linear-gradient(160deg,#fff8ffdb,#f4e5fbe8);box-shadow:0 0 28px #6c3e9230}
.hero{position:relative;border:2px solid #ffefd9;border-radius:24px;padding:18px 18px 15px;text-align:center;background:linear-gradient(125deg,#7e4ba9,#a56cca 58%,#dd95d3);box-shadow:0 5px 18px #6b39863c;color:#fff}
.brand{font-size:12px;letter-spacing:.8px;font-weight:900;color:#ffe3fa}
h1{margin:5px 0 4px;font-size:clamp(25px,6.7vw,34px);line-height:1.16}
.subtitle{margin:0;font-size:12px;color:#fbe5ff}
.count{margin-top:10px;font-weight:850;font-size:13px;color:#ffeedb}
.study{flex:1;display:flex;flex-direction:column;justify-content:center}
.flash{position:relative;border:2px solid #e4c49d;border-radius:26px;background:linear-gradient(150deg,#fffbff,#fff6fb);min-height:clamp(285px,48svh,435px);width:100%;padding:30px 19px;box-shadow:inset 0 0 0 4px #fff,0 8px 20px #955daa2f;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;overflow-wrap:anywhere;overflow-y:auto;cursor:pointer}
.flash::before,.flash::after{content:"✿";position:absolute;color:#f4bfdc;font-size:24px;pointer-events:none}
.flash::before{top:11px;left:15px}.flash::after{bottom:11px;right:15px}
.hanzi{font-weight:850;font-size:clamp(29px,7.7vw,39px);line-height:1.55;color:#52296c}
.pinyin{font-size:16px;font-weight:750;line-height:1.5;color:#a74b91}
.translation{font-size:16px;font-weight:750;line-height:1.4;color:#51375e}
.words{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:7px;text-align:left}
.word{border-radius:11px;border:1px solid #efd8e7;background:#ffffffd6;padding:8px 9px;font-size:12px;color:#6c5878;line-height:1.4}
.word strong{display:block;font-size:16px;color:#663976}
.hint{font-size:12px;color:#a38ba8;line-height:1.4}
.controls{display:grid;grid-template-columns:60px minmax(0,1fr) 60px;gap:12px}
.controls button{height:59px;border-radius:18px;border:1.5px solid #e9b5db;font-size:24px;font-weight:900;box-shadow:0 3px 10px #b778b43a;background:linear-gradient(#fffaff,#f9d9ef);color:#7d3c80}
.controls #listen{background:linear-gradient(145deg,#fa78bf,#e7439d);border-color:#ffd4ed;color:#fff;font-size:17px;letter-spacing:.1px;box-shadow:0 5px 13px #d1499a52}
.controls button:active:not(:disabled){transform:translateY(1px)}
.note{min-height:19px;margin:0;text-align:center;color:#995179;font-size:12px;line-height:1.45}
@media(max-height:630px){.frame{gap:9px}.hero{padding:10px 12px}.count{margin-top:5px}.flash{min-height:230px;padding:15px}.controls button{height:51px}}
@media(max-width:345px){.frame{padding-left:10px;padding-right:10px}.controls{gap:7px;grid-template-columns:51px minmax(0,1fr) 51px}.words{grid-template-columns:1fr}.hanzi{font-size:26px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto;transition:none!important}}
</style>
</head>
<body>
<main class="frame">
  <header class="hero">
    <div class="brand">🐼 PANDA GO · HSK 1</div>
    <h1>Китайский в ритме</h1>
    <p class="subtitle">Слушай · Повторяй · Запоминай</p>
    <div class="count" id="counter" aria-live="polite">1 / 10</div>
  </header>
  <section class="study" aria-label="Карточка китайского предложения">
    <article class="flash" id="flash" role="button" tabindex="0" aria-expanded="false" aria-label="Показать пиньинь, перевод и разбор"></article>
  </section>
  <nav class="controls" aria-label="Переключение предложений">
    <button id="prev" type="button" aria-label="Предыдущее предложение">&lt;</button>
    <button id="listen" type="button">▶ Слушать</button>
    <button id="next" type="button" aria-label="Следующее предложение">&gt;</button>
  </nav>
  <p class="note" id="notice" role="status" aria-live="polite"></p>
</main>
<script>
"use strict";
const data=[
 {zh:"你好吗？我很好！",py:"Nǐ hǎo ma? Wǒ hěn hǎo!",ru:"Как дела? У меня всё хорошо!",w:[["你","ты"],["好","хорошо"],["吗","вопрос"],["我","я"],["很","очень"]]},
 {zh:"我很好，你呢？",py:"Wǒ hěn hǎo, nǐ ne?",ru:"У меня всё хорошо, а у тебя?",w:[["我","я"],["很好","хорошо"],["你呢","а у тебя?"]]},
 {zh:"你是老师，我是学生。",py:"Nǐ shì lǎoshī, wǒ shì xuésheng.",ru:"Ты учитель, я ученик.",w:[["是","быть"],["老师","учитель"],["学生","ученик"]]},
 {zh:"我喝水，你喝茶。",py:"Wǒ hē shuǐ, nǐ hē chá.",ru:"Я пью воду, ты пьёшь чай.",w:[["喝","пить"],["水","вода"],["茶","чай"]]},
 {zh:"我看书，你也看书。",py:"Wǒ kàn shū, nǐ yě kàn shū.",ru:"Я читаю книгу, ты тоже читаешь книгу.",w:[["看书","читать книгу"],["也","тоже"]]},
 {zh:"这是我的书，那是你的书。",py:"Zhè shì wǒ de shū, nà shì nǐ de shū.",ru:"Это моя книга, а то — твоя книга.",w:[["这","это"],["那","то"],["的","принадлежность"],["书","книга"]]},
 {zh:"我有一个朋友，你也有朋友。",py:"Wǒ yǒu yí ge péngyou, nǐ yě yǒu péngyou.",ru:"У меня есть друг, и у тебя тоже есть друзья.",w:[["有","иметь"],["一个","один"],["朋友","друг"],["也","тоже"]]},
 {zh:"妈妈喝水，爸爸喝茶。",py:"Māma hē shuǐ, bàba hē chá.",ru:"Мама пьёт воду, папа пьёт чай.",w:[["妈妈","мама"],["爸爸","папа"],["水","вода"],["茶","чай"]]},
 {zh:"今天星期一，明天星期二。",py:"Jīntiān xīngqīyī, míngtiān xīngqī'èr.",ru:"Сегодня понедельник, завтра вторник.",w:[["今天","сегодня"],["明天","завтра"],["星期一","понедельник"],["星期二","вторник"]]},
 {zh:"今天天气好，明天天气也好。",py:"Jīntiān tiānqì hǎo, míngtiān tiānqì yě hǎo.",ru:"Сегодня хорошая погода, завтра тоже будет хорошая.",w:[["天气","погода"],["好","хороший"],["明天","завтра"],["也","тоже"]]}
];
const $=id=>document.getElementById(id);
let pos=0,open=false,run=0,sound=null,noticeTimer=0;
function escapeHTML(value){return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function showNotice(message){$("notice").textContent=message;}
function render(){
 const entry=data[pos];
 $("counter").textContent=(pos+1)+" / "+data.length;
 $("prev").disabled=pos===0;$("next").disabled=pos===data.length-1;
 $("flash").setAttribute("aria-expanded",String(open));
 $("flash").setAttribute("aria-label",open?"Скрыть перевод":"Показать пиньинь, перевод и разбор");
 const details=open?'<div class="pinyin">'+escapeHTML(entry.py)+'</div><div class="translation">'+escapeHTML(entry.ru)+'</div><div class="words">'+entry.w.map(pair=>'<div class="word"><strong>'+escapeHTML(pair[0])+'</strong>'+escapeHTML(pair[1])+'</div>').join("")+'</div>':'<div class="hint">Нажми на карточку — перевод и разбор</div>';
 $("flash").innerHTML='<div class="hanzi" lang="zh-CN">'+escapeHTML(entry.zh)+'</div>'+details;
}
function cancel(){run++;if(sound){sound.pause();sound.removeAttribute("src");sound.load();sound=null;}$("listen").textContent="▶ Слушать";}
function move(step){const n=pos+step;if(n<0||n>=data.length)return;cancel();pos=n;open=false;showNotice("");render();}
$("prev").addEventListener("click",()=>move(-1));
$("next").addEventListener("click",()=>move(1));
function toggle(){open=!open;render();}
$("flash").addEventListener("click",toggle);
$("flash").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle();}});
function audioPath(i,lang){return "./assets/hsk1-rhythm/"+lang+"-"+String(i+1).padStart(2,"0")+".mp3";}
function playFile(file,token){
 return new Promise(resolve=>{
  if(token!==run)return resolve(false);
  const a=new Audio();sound=a;let finished=false;
  const done=ok=>{if(finished)return;finished=true;a.onended=null;a.onerror=null;resolve(ok&&token===run);};
  a.onended=()=>done(true);a.onerror=()=>done(false);a.src=file;
  a.play().catch(()=>done(false));
 });
}
function delay(ms,token){return new Promise(resolve=>setTimeout(()=>resolve(token===run),ms));}
async function listen(){
 cancel();const token=run;
 $("listen").textContent="■ Стоп";
 showNotice("🇨🇳 Слушаем китайский");
 const steps=[
  [audioPath(pos,"zh"),"🇨🇳 Слушаем китайский"],
  [null,"Повтори вслух · 4 секунды"],
  [audioPath(pos,"zh"),"🇨🇳 Слушаем повтор"],
  [null,"Повтори по памяти · 4 секунды"],
  [audioPath(pos,"ru"),"🇷🇺 Перевод"]
 ];
 for(const [src,label] of steps){
   if(token!==run)return;
   showNotice(label);
   const ok=src?await playFile(src,token):await delay(4000,token);
   if(token!==run)return;
   if(!ok){cancel();showNotice("Запись пока не загружена. Карточка доступна без звука.");return;}
 }
 if(token===run){cancel();showNotice("");}
}
$("listen").addEventListener("click",()=>{if($("listen").textContent.includes("Стоп")){cancel();showNotice("");}else listen();});
window.addEventListener("pagehide",cancel);
render();
</script>
</body>
</html>
