<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e7d1f6">
<title>Китайский в ритме · HSK 1 · Panda Go</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC",Arial,sans-serif;color:#4b2a64;background:#efe3f7}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;overflow-x:hidden}
body{background:linear-gradient(158deg,#faf3ffed 0%,#efe2faeb 55%,#ffeaf6e9 100%),url("./assets/approved-pastel-v112.webp") center/cover fixed no-repeat}
button{font:inherit;cursor:pointer}
button:focus-visible,.flash:focus-visible{outline:3px solid #a33194;outline-offset:3px}
button:disabled{opacity:.4;cursor:default}
.frame{position:relative;width:min(100%,480px);height:100dvh;min-height:530px;margin:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 17px calc(22px + env(safe-area-inset-bottom,0px));display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:16px;background:linear-gradient(175deg,#fff9ffcf,#f2e7fbd9);box-shadow:0 0 24px #6f49962b}
.hero{position:relative;border:1.5px solid #f5d6eb;border-radius:24px;padding:16px 18px 15px;background:linear-gradient(125deg,#8250b4 0%,#a975cb 58%,#d58dc9 100%);box-shadow:0 6px 17px #77449e36;color:white}
.hero-top,.hero-title{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hero-top{margin-bottom:11px}
.brand{font-size:13px;letter-spacing:.3px;font-weight:850;color:#fff7fb}
.level{border:1px solid #ffe4f4a3;border-radius:99px;background:#ffffff24;color:#fff6ff;padding:5px 10px;white-space:nowrap;font-size:11px;font-weight:850}
h1{margin:0;font-size:clamp(20px,5.7vw,27px);line-height:1.15;letter-spacing:-.35px;font-weight:900}
.count{display:block;flex:none;font-weight:850;font-size:13px;color:#fff6e7;white-space:nowrap}
.progress{height:5px;border-radius:99px;background:#61358560;overflow:hidden;margin-top:14px}
.progress span{display:block;height:100%;width:10%;border-radius:inherit;background:linear-gradient(90deg,#ffe8a4,#fff5ff);transition:width .18s}
.study{min-height:0;display:flex;align-items:stretch}
.flash{position:relative;display:flex;flex-direction:column;align-items:center;width:100%;height:100%;min-height:0;padding:24px 20px 17px;border:1.5px solid #e6c795;border-radius:29px;background:linear-gradient(165deg,#fffdfd 0%,#fffafc 65%,#fff4fb 100%);box-shadow:0 7px 20px #a55db02b,inset 0 0 0 3px #fffdfb;cursor:pointer;text-align:center;overflow-wrap:anywhere;overflow-y:auto;touch-action:pan-y;scrollbar-width:thin;scrollbar-color:#edc5e9 transparent}
.flash::before,.flash::after{content:"";position:absolute;width:35px;height:35px;border-top:2px solid #efcce8;top:15px;pointer-events:none}
.flash::before{left:14px;border-left:2px solid #efcce8;border-top-left-radius:13px}
.flash::after{right:14px;border-right:2px solid #efcce8;border-top-right-radius:13px}
.card-body{width:100%;min-height:0;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.flash[aria-expanded="true"] .card-body{justify-content:center}
.hanzi{font-weight:850;font-size:clamp(31px,8.4vw,42px);line-height:1.55;letter-spacing:.2px;color:#53266f}
.pinyin{font-size:clamp(14px,3.8vw,17px);font-weight:700;color:#a34c91;line-height:1.45}
.translation{font-size:16px;font-weight:800;color:#573665;line-height:1.45;border-top:1px solid #f3e4ed;padding-top:13px;width:100%}
.words{width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;text-align:left}
.word{min-width:0;border:1px solid #eedce9;border-radius:11px;background:#fff6fc;padding:7px 9px;font-size:12px;line-height:1.35;color:#765c7e}
.word strong{display:block;font-size:15px;color:#653478}
.hint{align-self:center;margin-top:auto;width:100%;padding-top:16px;padding-bottom:1px;color:#a38aa7;font-size:11.5px;line-height:1.45;text-align:center}
.controls{display:flex;justify-content:center;align-items:center;gap:28px;padding:0 0 2px}
.controls button{display:grid;place-items:center;width:64px;height:64px;border:2px solid #fff5e7;border-radius:50%;box-shadow:inset 0 2px 3px #fff8,0 4px 0 #b68b9b,0 6px 12px #a45eae42;transition:transform .12s}
.controls #listen{color:white;background:linear-gradient(145deg,#ffa7db 0%,#ef61ad 55%,#d5328c);box-shadow:inset 0 2px 3px #fff9,0 4px 0 #b5367f,0 7px 16px #d858a67d}
.controls #pinyin-btn{font-size:27px;font-weight:850;color:#7d4094;background:linear-gradient(145deg,#fffefc 0%,#f6e6ff 65%,#e5c3f3)}
.controls #pinyin-btn[aria-pressed="true"]{border-color:#ffe5ae;background:linear-gradient(145deg,#ffeec9,#f8d0ea);box-shadow:0 0 0 3px #ffeeb9a1,0 5px 13px #aa64a655}
.controls #listen svg{width:29px;height:29px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.controls button:active:not(:disabled){transform:scale(.94)}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
.note{position:absolute;z-index:4;left:24px;right:24px;bottom:calc(100px + env(safe-area-inset-bottom,0px));margin:0;text-align:center;color:#854a78;font-size:12px;line-height:1.45}
.note:not(:empty){padding:8px 12px;border:1px solid #ead2ed;border-radius:13px;background:#fffafef2;box-shadow:0 3px 13px #8a438b23}
.note:empty{display:none}
@media(max-height:690px){.frame{gap:10px;padding-top:calc(9px + env(safe-area-inset-top,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}.hero{padding:12px 15px}.hero-top{margin-bottom:7px}.progress{margin-top:9px}.flash{padding:15px 14px}.card-body{gap:9px}.controls button{width:56px;height:56px}.note{bottom:calc(79px + env(safe-area-inset-bottom,0px))}}
@media(max-width:345px){.frame{padding-left:10px;padding-right:10px}.hero{padding-left:13px;padding-right:13px}.hanzi{font-size:28px}.words{grid-template-columns:1fr}.controls{gap:22px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}

/* v309: fit the entire core exercise within the Android visual viewport.
   Reveal/details may scroll INSIDE the card only, preserving visible controls. */
html,body{height:100%;min-height:0;overscroll-behavior-y:contain}
.frame{
  width:min(100%,480px);
  height:100vh;height:100dvh;min-height:0;
  padding:calc(10px + env(safe-area-inset-top,0px)) clamp(10px,3.3vw,17px)
          max(22px,calc(18px + env(safe-area-inset-bottom,0px)));
  gap:clamp(10px,1.4dvh,14px);
  grid-template-rows:auto minmax(0,1fr) auto;
}
.hero{padding:10px 15px 11px;border-radius:22px}
.hero-top{margin-bottom:5px}
.brand{font-size:12px}
.level{font-size:11px;padding:4px 9px}
h1{font-size:clamp(19px,5.25vw,25px);line-height:1.16}
.count{font-size:12px}
.progress{margin-top:9px;height:5px}
.study{min-height:0;display:flex;align-items:center;justify-content:center}
.flash{
  flex:none;
  height:min(100%,clamp(235px,38dvh,340px));
  padding:17px clamp(13px,4vw,21px) 12px;
  border-radius:27px;
  overflow-y:auto;
  overscroll-behavior:contain;
  touch-action:pan-y;
  scrollbar-width:thin;
}
.flash[aria-expanded="true"]{height:min(100%,clamp(270px,53dvh,420px))}
.card-body{flex:1 0 auto;gap:8px;justify-content:center}
.flash[aria-expanded="true"] .card-body{
  flex:0 0 auto;justify-content:flex-start;gap:10px;padding:6px 0;
}
.hanzi{font-size:clamp(28px,7.6vw,41px);line-height:1.42}
.pinyin{font-size:clamp(13px,3.5vw,17px)}
.translation{font-size:clamp(13px,3.5vw,16px);padding-top:10px}
.words{gap:6px}
.word{padding:6px 8px;font-size:11.5px}
.word strong{font-size:14px}
.hint{margin-top:0;padding-top:9px;padding-bottom:0;font-size:11.5px}
.controls{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:clamp(5px,2vw,10px);
  justify-items:center;align-items:center;
  width:min(100%,360px);margin:0 auto;padding:4px 0 2px;
}
.controls button{
  width:clamp(44px,12vw,57px);
  height:clamp(44px,12vw,57px);
  font-size:25px;
  touch-action:manipulation;
}
.controls #pinyin-btn{font-size:24px}
.controls #prev,.controls #next{
  color:#6e2c89;
  background:linear-gradient(145deg,#ffffff,#f4deff);
  font-size:33px;font-weight:850;line-height:1;
}
.controls #translation-btn{
  color:#6c377f;
  background:linear-gradient(145deg,#fffdfc,#ffecf5);
  font-size:15px;font-weight:900;
}
.controls #translation-btn[aria-pressed="true"]{
  background:linear-gradient(145deg,#fff2cc,#f6d3ee);border-color:#ecc78a;
}
.controls #listen svg{width:27px;height:27px}
.note{bottom:calc(88px + env(safe-area-inset-bottom,0px));left:17px;right:17px}
@media(max-width:345px){
 .frame{padding-left:10px;padding-right:10px}
 .hero{padding:9px 12px 10px}
 .hero-top{margin-bottom:4px}
 .progress{margin-top:7px}
 .flash{padding:14px 12px 11px}
 .flash[aria-expanded="true"] .card-body{gap:7px}
 .words{grid-template-columns:repeat(2,minmax(0,1fr))}
 .word{padding:5px 6px;font-size:10.5px}
 .word strong{font-size:13px}
 .controls{gap:4px}
 .controls button{width:44px;height:44px}
 .controls #pinyin-btn{font-size:21px}
 .note{bottom:calc(72px + env(safe-area-inset-bottom,0px))}
}
@media(max-height:690px){
 .frame{gap:8px;padding-top:calc(7px + env(safe-area-inset-top,0px))}
 .hero{padding:8px 12px 9px}
 .hero-top{margin-bottom:4px}
 .progress{margin-top:7px}
 .flash{height:min(100%,clamp(210px,36dvh,275px))}
 .flash[aria-expanded="true"]{height:min(100%,clamp(245px,50dvh,340px))}
 .controls button{width:clamp(43px,11vw,51px);height:clamp(43px,11vw,51px)}
}
@media(max-height:530px){
 .frame{min-height:480px;height:auto}
 body{overflow-y:auto}
}
</style>
</head>
<body>
<main class="frame">
  <header class="hero">
    <div class="hero-top"><span class="brand">🐼 Panda Go</span><span class="level">HSK 1</span></div>
    <div class="hero-title"><h1>Китайский в ритме</h1><span class="count" id="counter" aria-live="polite">1 / 10</span></div>
    <div class="progress" aria-hidden="true"><span id="progress-fill"></span></div>
  </header>
  <section class="study" aria-label="Карточка китайского предложения">
    <article class="flash" id="flash" role="button" tabindex="0" aria-expanded="false" aria-label="Показать перевод и разбор слов"></article>
  </section>
  <nav class="controls" aria-label="Управление упражнениями">
    <button id="prev" type="button" aria-label="Предыдущее предложение" title="Назад">‹</button>
    <button id="listen" type="button" aria-label="Слушать китайскую фразу" title="Слушать">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15 9a5 5 0 0 1 0 6"/><path d="M18 6a9 9 0 0 1 0 12"/></svg>
    </button>
    <button id="pinyin-btn" type="button" aria-label="Показать пиньинь" aria-pressed="false" title="Пиньинь">汉</button>
    <button id="translation-btn" type="button" aria-label="Показать перевод и разбор" aria-pressed="false" title="Перевод и разбор">RU</button>
    <button id="next" type="button" aria-label="Следующее предложение" title="Дальше">›</button>
  </nav>
  <span class="sr-only">Перелистывай карточки свайпом вправо или влево, либо стрелками клавиатуры.</span>
  <p class="note" id="notice" role="status" aria-live="polite"></p>
</main>
<script>
"use strict";
const data=[
 {"zh":"我很好，你很好。","py":"Wǒ hěn hǎo, nǐ hěn hǎo.","ru":"У меня всё хорошо, у тебя всё хорошо.","w":[["我","я"],["你","ты"],["很","очень"],["好","хорошо"]]},
 {"zh":"你好，你好！","py":"Nǐ hǎo, nǐ hǎo!","ru":"Привет! Привет!","w":[["你","ты"],["好","хорошо"],["你好","привет"]]},
 {"zh":"他很好，她很好。","py":"Tā hěn hǎo, tā hěn hǎo.","ru":"У него всё хорошо, у неё всё хорошо.","w":[["他","он"],["她","она"],["很好","всё хорошо"]]},
 {"zh":"我是学生，你是老师。","py":"Wǒ shì xuésheng, nǐ shì lǎoshī.","ru":"Я ученик, ты учитель.","w":[["我","я"],["是","быть"],["学生","ученик"],["老师","учитель"]]},
 {"zh":"你是学生，我是老师。","py":"Nǐ shì xuésheng, wǒ shì lǎoshī.","ru":"Ты ученик, я учитель.","w":[["你","ты"],["是","быть"],["学生","ученик"],["老师","учитель"]]},
 {"zh":"他是老师，她是学生。","py":"Tā shì lǎoshī, tā shì xuésheng.","ru":"Он учитель, она ученица.","w":[["他","он"],["她","она"],["老师","учитель"],["学生","ученик"]]},
 {"zh":"她是老师，他是学生。","py":"Tā shì lǎoshī, tā shì xuésheng.","ru":"Она учительница, он ученик.","w":[["她","она"],["他","он"],["老师","учитель"],["学生","ученик"]]},
 {"zh":"我们是学生，你们是老师。","py":"Wǒmen shì xuésheng, nǐmen shì lǎoshī.","ru":"Мы ученики, вы учителя.","w":[["我们","мы"],["你们","вы"],["学生","ученики"],["老师","учителя"]]},
 {"zh":"你是学生吗？我是学生。","py":"Nǐ shì xuésheng ma? Wǒ shì xuésheng.","ru":"Ты ученик? Я ученик.","w":[["你","ты"],["是","быть"],["学生","ученик"],["吗","вопрос"]]},
 {"zh":"我们很好，你们很好。","py":"Wǒmen hěn hǎo, nǐmen hěn hǎo.","ru":"У нас всё хорошо, у вас всё хорошо.","w":[["我们","мы"],["你们","вы"],["很好","всё хорошо"]]}
];
const $=id=>document.getElementById(id);
let pos=0,open=false,showPinyin=false,run=0,sound=null,suppressClickUntil=0;
// Keep rhythm progress separate from all HSK1 and HSK2 lesson progress keys.
try{const saved=Number(localStorage.getItem("pg-hsk1-rhythm-v309-pos"));if(Number.isInteger(saved)&&saved>=0&&saved<data.length)pos=saved;}catch{}
const speakerIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15 9a5 5 0 0 1 0 6"/><path d="M18 6a9 9 0 0 1 0 12"/></svg>';
function escapeHTML(value){return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function showNotice(message){$("notice").textContent=message;}
function render(){
 const entry=data[pos];
 $("counter").textContent=(pos+1)+" / "+data.length;
 $("progress-fill").style.width=((pos+1)/data.length*100)+"%";
 $("flash").setAttribute("aria-expanded",String(open));
 $("flash").setAttribute("aria-label",open?"Скрыть перевод и разбор":"Показать перевод и разбор");
 $("pinyin-btn").setAttribute("aria-pressed",String(showPinyin));
 $("translation-btn").setAttribute("aria-pressed",String(open));
 $("translation-btn").setAttribute("aria-label",open?"Скрыть перевод и разбор":"Показать перевод и разбор");
 $("prev").disabled=pos===0;
 $("next").disabled=pos===data.length-1;
 $("pinyin-btn").setAttribute("aria-label",showPinyin?"Скрыть пиньинь":"Показать пиньинь");
 const py=showPinyin?'<div class="pinyin">'+escapeHTML(entry.py)+'</div>':'';
 const details=open?'<div class="translation">'+escapeHTML(entry.ru)+'</div><div class="words">'+entry.w.map(pair=>'<div class="word"><strong>'+escapeHTML(pair[0])+'</strong>'+escapeHTML(pair[1])+'</div>').join("")+'</div>':'';
 const hint=open?'':'<div class="hint">Нажми на карточку — перевод и разбор</div>';
 $("flash").innerHTML='<div class="card-body"><div class="hanzi" lang="zh-CN">'+escapeHTML(entry.zh)+'</div>'+py+details+'</div>'+hint;
}
function cancel(){run++;if(sound){sound.pause();sound.removeAttribute("src");sound.load();sound=null;}$("listen").innerHTML=speakerIcon;$("listen").setAttribute("aria-label","Слушать китайскую фразу");}
function move(step){const n=pos+step;if(n<0||n>=data.length)return;cancel();pos=n;open=false;showNotice("");try{localStorage.setItem("pg-hsk1-rhythm-v309-pos",String(pos));}catch{}render();$("flash").scrollTop=0;}
$("pinyin-btn").addEventListener("click",()=>{showPinyin=!showPinyin;render()});
function toggle(){open=!open;render();$("flash").scrollTop=0;}
$("translation-btn").addEventListener("click",toggle);
$("prev").addEventListener("click",()=>move(-1));
$("next").addEventListener("click",()=>move(1));
$("flash").addEventListener("click",()=>{if(Date.now()<suppressClickUntil)return;toggle()});
$("flash").addEventListener("keydown",e=>{
 if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle();}
 if(e.key==="ArrowLeft"){e.preventDefault();move(1);}
 if(e.key==="ArrowRight"){e.preventDefault();move(-1);}
});
let gesture=null;
$("flash").addEventListener("touchstart",e=>{if(e.touches.length===1)gesture={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});
$("flash").addEventListener("touchend",e=>{
 if(!gesture||!e.changedTouches.length)return;
 const dx=e.changedTouches[0].clientX-gesture.x,dy=e.changedTouches[0].clientY-gesture.y;
 gesture=null;
 if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.35){suppressClickUntil=Date.now()+450;move(dx<0?1:-1);}
},{passive:true});
$("flash").addEventListener("touchcancel",()=>{gesture=null},{passive:true});
function audioPath(i,lang){return "./assets/hsk1-rhythm/"+lang+"-"+String(i+1).padStart(2,"0")+".mp3";}
function playFile(file,token){
 return new Promise(resolve=>{
  if(token!==run)return resolve(false);
  const a=new Audio();sound=a;let finished=false;
  const done=ok=>{if(finished)return;finished=true;a.onended=null;a.onerror=null;resolve(ok&&token===run);};
  a.onended=()=>done(true);a.onerror=()=>done(false);a.src=file;
  a.play().catch(()=>done(false));
 });
}
function delay(ms,token){return new Promise(resolve=>setTimeout(()=>resolve(token===run),ms));}
async function listen(){
 cancel();const token=run;
 $("listen").textContent="■";$("listen").setAttribute("aria-label","Остановить прослушивание");
 showNotice("🇨🇳 Слушаем китайский");
 const steps=[
  [audioPath(pos,"zh"),"🇨🇳 Слушаем китайский"],
  [null,"Повтори вслух · 4 секунды"],
  [audioPath(pos,"zh"),"🇨🇳 Слушаем повтор"],
  [null,"Повтори по памяти · 4 секунды"],
  [audioPath(pos,"ru"),"🇷🇺 Перевод"]
 ];
 for(const [src,label] of steps){
   if(token!==run)return;
   showNotice(label);
   const ok=src?await playFile(src,token):await delay(4000,token);
   if(token!==run)return;
   if(!ok){cancel();showNotice("Запись пока не загружена. Карточка доступна без звука.");return;}
 }
 if(token===run){cancel();showNotice("");}
}
$("listen").addEventListener("click",()=>{if($("listen").getAttribute("aria-label")==="Остановить прослушивание"){cancel();showNotice("");}else listen();});
window.addEventListener("pagehide",cancel);
render();
</script>
</body>
</html>
