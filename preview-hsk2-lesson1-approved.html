.app[data-view="4"] .example img{height:clamp(80px,14dvh,123px)}

</style>

<body>
<div class="app" id="app">
  <header class="head">
    <div class="lesson-bar">
      <button type="button" class="orb" id="detail-back" aria-label="Предыдущий шаг">❮</button>
      <span id="head-label">HSK 2 · Урок 1 · Шаг 1 из 8</span>
    </div>
    <nav id="steps" aria-label="Восемь шагов урока"></nav>
  </header>
  <main id="workspace"></main>
  <footer aria-label="Переключение шагов">
    <button type="button" class="soft compact-footer" id="back" aria-label="Предыдущий шаг">‹ Назад</button>
    <button type="button" class="primary" id="next"></button>
  </footer>
</div>
<script src="./assets/hsk2-lesson1-voice-v459.js?v=459"></script>
<script>
'use strict';

const asset = 'assets/hsk2-preview-v457/';
const decoration = 'assets/hsk2-lesson1-preview/';
const words = [
  {zh:'起床', py:'qǐchuáng', ru:'вставать с постели', tones:[3,2], fill:'我每天七点____。', hint:'Я каждый день встаю в семь.'},
  {zh:'洗脸', py:'xǐliǎn', ru:'умываться', tones:[3,3], fill:'我起床以后____。', hint:'После того как встаю, я умываюсь.'},
  {zh:'刷牙', py:'shuāyá', ru:'чистить зубы', tones:[1,2], fill:'我每天早上____。', hint:'Я чищу зубы каждое утро.'},
  {zh:'吃早饭', py:'chī zǎofàn', ru:'завтракать', tones:[1,3,4], fill:'我早上____。', hint:'Я завтракаю утром.'},
  {zh:'去上班', py:'qù shàngbān', ru:'идти на работу', tones:[4,4,1], fill:'我八点____。', hint:'Я иду на работу в восемь.'},
  {zh:'睡觉', py:'shuìjiào', ru:'спать, ложиться спать', tones:[4,4], fill:'我晚上十点____。', hint:'Я ложусь спать в десять вечера.'}
];

const phrases = [
  ['你每天几点起床？','Nǐ měitiān jǐ diǎn qǐchuáng?','Во сколько ты каждый день встаёшь?'],
  ['我每天七点起床。','Wǒ měitiān qī diǎn qǐchuáng.','Я каждый день встаю в семь часов.'],
  ['我起床以后洗脸。','Wǒ qǐchuáng yǐhòu xǐliǎn.','После того как я встаю, я умываюсь.'],
  ['我早上吃早饭。','Wǒ zǎoshang chī zǎofàn.','Утром я завтракаю.'],
  ['我八点去上班。','Wǒ bā diǎn qù shàngbān.','Я иду на работу в восемь.'],
  ['我晚上十点睡觉。','Wǒ wǎnshang shí diǎn shuìjiào.','Я ложусь спать в десять вечера.']
];

const dialogue = [
  {prompt:phrases[0], answers:[[phrases[1][0],'В семь часов'],['我每天八点起床。','В восемь часов']]},
  {prompt:['你早上做什么？','Nǐ zǎoshang zuò shénme?','Что ты делаешь утром?'], answers:[['我早上洗脸。','Умываюсь'],[phrases[3][0],'Завтракаю']]},
  {prompt:['你起床以后做什么？','Nǐ qǐchuáng yǐhòu zuò shénme?','Что ты делаешь после подъёма?'], answers:[[phrases[2][0],'Умываюсь'],['我起床以后刷牙。','Чищу зубы']]}
];

const normalize = text => text.replace(/[\p{P}\s]/gu, '');
const clips = new Map([
  ['你早上做什么','p019'], ['我早上吃早饭','p020'],
  ['你起床以后做什么','p021'], ['我起床以后洗脸','p022']
].map(([text,id]) => [text, 'assets/panda-voice-clips-v365/' + id + '.mp3']));
for (const [text,id] of [
  ['我七点起床','g033'], ['我晚上十点睡觉','g034'],
  ['我八点去上班','g035'], ['我每天六点起床','g036']
]) clips.set(text, 'assets/panda-grammar-voice-v451/' + id + '.mp3');
// User-supplied 2026-11-19 Luvvoice recording, cut into eleven exact same-speaker MP3 phrases.
for (const [text,recording] of Object.entries(window.PandaGoHSK2Lesson1NativeAudioV459 || {})) {
  clips.set(normalize(text), recording);
}

const listening = [
  ['我七点起床。',0], ['我起床以后洗脸。',1], ['我早上吃早饭。',3],
  ['我八点去上班。',4], ['我晚上十点睡觉。',5], ['我每天六点起床。',0]
];
const layoutParams = new URLSearchParams(location.search);
const courseMode = layoutParams.get('layout') === 'course';
const courseSteps = [1,2,4,6,3,5,7,8];
const courseSections = [
  {name:'Слова',steps:[2]},
  {name:'Правило',steps:[4]},
  {name:'Речь',steps:[6]},
  {name:'Тест',steps:[3,5]},
  {name:'Примеры',steps:[7,8]}
];
const courseCover = './hsk2-life-course.html?start=1';
const stepNumber = step => courseMode ? courseSteps.indexOf(step)+1 : step;
const titles = ['Вступление','Новые слова','Проверь слова','Грамматика','Мой распорядок','Тренировка тонов','Фразы и диалог','Завершение'];
const tests = ['Значение слова','По аудио','Собери слово','Заполни фразу','Произнеси'];
const testHelp = ['Выбери правильный перевод.','Послушай и выбери действие.','Расставь иероглифы по порядку.','Подставь слово в предложение.','Скажи слово в микрофон.'];
const tokens = ['我','起床','以后','洗脸','。'];
const key = 'panda-go-hsk2-lesson1-approved-preview-v2';
const previousKey = 'panda-go-hsk2-lesson1-approved-preview-v1';

function mixedDay() {
  const order = [0,1,2,3,4,5];
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [order[i],order[j]] = [order[j],order[i]];
  }
  if (order.every((item,i) => item === i)) order.push(order.shift());
  return order;
}

function blank() {
  return {
    step:1, quiz:tests.map(() => words.map(() => null)),
    missed:tests.map(() => words.map(() => false)), quizTest:null, quizIndex:0, quizPicked:[],
    grammar:[], grammarDone:false, dayOrder:[], dayShuffled:mixedDay(), dayDone:false,
    mic:[], chat:[], toneTab:'words'
  };
}

function restore() {
  try {
    const saved = JSON.parse(localStorage.getItem(key));
    if (saved) return Object.assign(blank(),saved);
    const previous = JSON.parse(localStorage.getItem(previousKey));
    if (!previous) return blank();
    const next = blank();
    for (const field of ['step','grammar','grammarDone','dayOrder','dayShuffled','dayDone','mic']) {
      if (Object.hasOwn(previous,field)) next[field] = previous[field];
    }
    // Listening prompts and dialogue questions changed in this version.
    for (const index of [0,2,3,4]) {
      if (Array.isArray(previous.quiz?.[index]) && previous.quiz[index].length === words.length) {
        next.quiz[index] = previous.quiz[index];
      }
    }
    if (dialogue[0].answers.some(([answer]) => answer === previous.chat?.[0])) {
      next.chat = previous.chat.slice(0,2);
    }
    return next;
  } catch {
    return blank();
  }
}

let state = restore();
let audio = null;
let speech = null;
let feedback = '';
let positive = false;
let heardClip = null;
const app = document.getElementById('app');
const workspace = document.getElementById('workspace');
const nav = document.getElementById('steps');
const headLabel = document.getElementById('head-label');
const headBack = document.getElementById('detail-back');
const back = document.getElementById('back');
const next = document.getElementById('next');
let counter;
if (courseMode) {
  const frame = document.createElement('div');
  frame.id = 'pg433';
  frame.append(...app.children);
  app.append(frame);
  nav.removeAttribute('id');
  nav.className = 'pg433-tabs';
  nav.setAttribute('aria-label','Разделы урока');
  const top = headBack.parentElement;
  top.className = 'pg433-topline';
  top.parentElement.className = 'pg433-header';
  headBack.className = 'pg433-back';
  headBack.textContent = '‹';
  headLabel.className = 'pg433-title';
  headLabel.removeAttribute('id');
  headLabel.innerHTML = '<small>HSK 2 · Тема 1</small><strong>Мой день</strong>';
  const chapter = document.createElement('span');
  chapter.className = 'pg433-pill';
  chapter.textContent = 'Мини-урок 1 · Начало дня';
  top.append(chapter);
  nav.innerHTML = courseSections.map(({name,steps},i) =>
    '<button type="button" data-step="' + steps[0] + '"><b>' + (i+1) + '</b><span>' + name + '</span></button>').join('');
  workspace.className = 'pg433-content';
  back.parentElement.className = 'pg433-footer';
  back.className = 'pg433-secondary';
  next.className = 'pg433-primary';
  counter = document.createElement('span');
  counter.className = 'pg433-counter';
  back.after(counter);
} else {
  nav.innerHTML = titles.map((title,i) => '<button type="button" class="nav-step" data-step="' + (i+1) +
    '" aria-label="Шаг ' + (i+1) + ' · ' + title + '"><span>' + (i+1) + '</span></button>').join('');
}
const stepButtons = [...nav.querySelectorAll('button')];
const escape = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const playIcon = '<span class="play" aria-hidden="true"></span>';
const speaker = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor" stroke-linejoin="round"/><path d="M16 8a6 6 0 0 1 0 8m2.5-10a9 9 0 0 1 0 12" stroke-linecap="round"/></svg>';
const microphone = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5 11v1a7 7 0 0 0 14 0v-1M12 19v3m-3 0h6"/></svg>';
const wave = '<svg class="wave" viewBox="0 0 70 18" aria-hidden="true"><path d="M2 8v2m4-3v4m4-5v6m4-8v10m4-7v4m4-7v10m4-13v16m4-12v8m4-6v4m4-7v10m4-8v6m4-5v4m4-7v10m4-13v16m4-11v6m4-8v10m4-7v4" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/></svg>';
const scope = () => state.step + ':' + state.quizTest + ':' + state.quizIndex;
const correctCount = index => state.quiz[index].filter(Boolean).length;
const quizCount = () => state.quiz.flat().filter(Boolean).length;
const dayScenes = ['wake','wash','brush','breakfast','work','sleep'];
const vocabImage = i => i === 5 ? art('sleep') : '<img src="' + asset + 'word-' + (i+1) + '.webp" alt="">';
const art = name => '<img src="' + decoration + name + '.webp" alt="">';
const hanzi = html => '<strong class="cn" lang="zh-Hans">' + html + '</strong>';
const pitchRow = values => '<div class="tonemarks">' + values.map(v => '<span class="tone-number">' + v + '</span>').join('') + '</div>';
const translate = item => '<span class="py">' + item[1] + '</span><span class="ru">' + item[2] + '</span>';
const safeStatus = () => '<div id="feedback" class="feedback' + (positive ? ' good' : '') + '" role="status">' + escape(feedback) + '</div>';

function audioButton(text, icon = speaker, blind = false) {
  const available = clips.has(normalize(text));
  const label = blind ? 'Прослушать запись' : available ? 'Прослушать ' + text : 'Для «' + text + '» отдельной записи нет';
  return '<button type="button" class="orb' + (available ? '' : ' missing') + '" data-say="' +
    escape(text) + '" aria-label="' + escape(label) + '" title="' + escape(label) + '">' + (available ? icon : '<span aria-hidden="true">♪</span>') + '</button>';
}

function micButton(id, label, recognized = false) {
  return '<button type="button" class="orb mic' + (recognized ? ' recognized' : '') + '" data-mic="' + id +
    '" aria-label="' + escape(label) + '">' + microphone + '</button>';
}

function save() {
  try { localStorage.setItem(key,JSON.stringify(state)); } catch {}
}

function setStatus(message, good = false) {
  feedback = message;
  positive = good;
  const box = document.getElementById('feedback');
  if (box) {
    box.classList.toggle('good',good);
    box.textContent = message;
  }
}

function clearMedia() {
  if (audio) {
    audio.pause();
    audio = null;
    workspace.querySelector('[data-say][aria-pressed=true]')?.removeAttribute('aria-pressed');
  }
  if (speech) {
    const current = speech;
    speech = null;
    current.abort();
  }
}

function move(step) {
  clearMedia();
  feedback = '';
  heardClip = null;
  state.step = Math.max(1,Math.min(8,step));
  if (courseMode && state.step === 1) {
    location.assign(courseCover);
    return;
  }
  if (state.step !== 3) state.quizTest = null;
  if (courseMode) {
    layoutParams.set('step',state.step);
    history.replaceState(null,'','?' + layoutParams);
  }
  save();
  render(true);
}

function render(resetScroll = false) {
  const step = state.step;
  const detailed = step === 3 || step === 6;
  app.classList.toggle('detail',detailed);
  app.dataset.view = step;
  if (courseMode) counter.textContent = stepNumber(step) + ' / 8';
  else headLabel.textContent = 'HSK 2 · Урок 1 · Шаг ' + step + ' из 8';
  headBack.disabled = step === 1;
  stepButtons.forEach((button,index) => {
    const active = courseMode ? courseSections[index].steps.includes(step) : index+1 === step;
    button.setAttribute('aria-current',active ? 'step' : 'false');
    if (courseMode) button.classList.toggle('active',active);
  });
  workspace.innerHTML = [intro,newWords,quiz,grammar,day,tones,chat,finish][step-1]();
  back.hidden = step === 1;
  const inQuiz = step === 3 && state.quizTest !== null;
  back.textContent = courseMode ? (inQuiz ? '← Тесты' : '← Назад') : (inQuiz ? '‹ Тесты' : '‹ Назад');
  const backLabel = inQuiz ? 'К списку тестов' : 'Предыдущий шаг';
  back.setAttribute('aria-label',backLabel);
  headBack.setAttribute('aria-label',backLabel);
  if (courseMode) {
    next.textContent = inQuiz ? (state.quizIndex === 5 ? 'К списку →' : 'Дальше →') :
      (step === 8 ? 'К началу ↻' : 'Дальше →');
  } else {
    next.textContent = step === 1 ? 'Начать урок' : step === 8 ? 'К началу ↻' : titles[step] + ' →';
  }
  if (resetScroll) workspace.scrollTop = 0;
}
function intro() {
  return '<img class="welcome-art" src="assets/hsk2-lesson1-preview/welcome-start-lesson.webp" width="959" height="1639" alt="" draggable="false">' +
    '<section class="welcome-copy"><h1><span lang="zh-Hans">我的一天</span> · Wǒ de yì tiān · Мой день</h1>' +
    '<p>Научиться говорить о том, когда встаёшь, умываешься, чистишь зубы, завтракаешь, идёшь на работу и ложишься спать.</p>' +
    '<p>6 слов, 5 мини-тестов, грамматика, распорядок, произношение и диалог.</p></section>';
}

function newWords() {
  return '<h1 class="pill-title">Новые слова</h1><div class="word-list">' + words.map((word,i) =>
    '<article class="word-row">' + vocabImage(i) + hanzi(word.zh) + '<div>' +
    translate([word.zh,word.py,word.ru]) + '</div>' + audioButton(word.zh,playIcon) + '</article>').join('') +
    '</div><p class="hint audio-note">🔊 Все шесть слов озвучены единым женским голосом.</p>' + safeStatus();
}

function hero(kind,step,title,subtitle) {
  return '<div class="detail-hero ' + kind + '-hero">' + art(kind + '-panda') +
    '<div class="hero-message"><span class="tag">Шаг ' + stepNumber(step) + '</span><h1>' + title + '</h1><p>' + subtitle + '</p></div>' +
    (kind === 'quiz' ? '<img class="quiz-clipboard" src="' + decoration + 'quiz-clipboard.webp" alt="">' : '') + '</div>';
}

function quiz() {
  if (state.quizTest !== null) return question();
  return hero('quiz',3,'Проверь слова!','5 интерактивных тестов,<br>чтобы лучше запомнить<br>новые слова.') +
    '<div class="test-list">' + tests.map((title,i) => {
      const total = correctCount(i);
      return '<button type="button" class="test-card" data-test="' + i + '"><span class="badge">' + (i+1) + '</span>' +
        art('test-' + (i+1)) + '<span><strong>Тест ' + (i+1) + ' · ' + title +
        '</strong><small>' + testHelp[i] + (total ? ' · ' + total + '/6' : '') + '</small></span><span class="orb' +
        (total === 6 ? ' done' : '') + '" aria-hidden="true">' + (total === 6 ? '✓' : playIcon) + '</span></button>';
    }).join('') + '</div><div class="reward panel">' + art('trophy') +
    '<strong>Закрепи слова урока в пяти разных заданиях!</strong></div><button type="button" class="primary large" data-start>Начать тесты ' + playIcon + '</button>';
}

function choices(correct,category,seed,locked) {
  const ids = [0,1,2,3].map(offset => (correct+offset)%words.length);
  for (let i=0; i<seed%4; i++) ids.push(ids.shift());
  return '<div class="choice-grid">' + ids.map(id => '<button type="button" class="choice" data-choice="' + id +
    '"' + (category === 'zh' ? ' lang="zh-Hans"' : '') + (locked ? ' disabled' : '') + '>' +
    words[id][category] + '</button>').join('') + '</div>';
}

function question() {
  const t = state.quizTest;
  const i = state.quizIndex;
  const word = words[i];
  const done = state.quiz[t][i];
  let content;
  switch (t) {
    case 0:
      content = '<div class="quiz-word" lang="zh-Hans">' + word.zh + '</div><p class="py">' + word.py + '</p>' +
        (done ? '' : choices(i,'ru',i,false));
      break;
    case 1: {
      const [clip,answer] = listening[i];
      content = '<p class="hint">Какое действие звучит в конце фразы?</p><div class="controls">' +
        audioButton(clip,speaker,true) + '</div>' + (done ? '' : choices(answer,'zh',i+1,heardClip !== scope()));
      break;
    }
    case 2: {
      const chars = [...word.zh];
      const order = chars.map((_,j) => (j+1)%chars.length);
      const current = state.quizPicked.map(j => chars[j]).join('');
      content = '<div class="quiz-word">' + word.ru + '</div><p class="py">' + word.py + '</p>' +
        (done ? '' : '<div class="answer" lang="zh-Hans" data-placeholder="Нажимай на иероглифы">' + current + '</div>' +
          '<div class="tokens">' + order.map(j => '<button type="button" class="token" lang="zh-Hans" data-letter="' + j + '"' +
          (state.quizPicked.includes(j) ? ' disabled' : '') + '>' + chars[j] + '</button>').join('') + '</div>' +
          '<div class="controls"><button type="button" class="soft" data-letter-clear>Очистить</button><button type="button" class="primary" data-letter-check>Проверить</button></div>');
      break;
    }
    case 3:
      content = '<div class="quiz-word" lang="zh-Hans">' + word.fill + '</div><p class="hint">' + word.hint + '</p>' +
        (done ? '' : choices(i,'zh',i+3,false));
      break;
    case 4:
      content = '<div class="quiz-word" lang="zh-Hans">' + word.zh + '</div><p class="py">' + word.py + '</p>' +
        (done ? '' : '<div class="controls">' + micButton('quiz','Произнести ' + word.zh) + '</div>') +
        '<p class="hint">Проверяем, распознано ли слово. Тоны здесь не оцениваются.</p>';
      break;
  }
  return '<article class="panel section-panel"><h1>Тест ' + (t+1) + ' · ' + tests[t] + '</h1><p class="hint">Задание ' +
    (i+1) + ' из 6 · выполнено ' + correctCount(t) + '</p>' + content + safeStatus() +
    (done && !feedback ? '<div class="feedback good">✓ ' + (t === 4 ? 'Слово распознано' : 'Ответ засчитан') + '</div>' : '') +
    '<div class="controls"><button type="button" class="soft" data-question="-1"' + (!i ? ' disabled' : '') +
    '>‹ Предыдущее</button><button type="button" class="primary" data-question="1">' +
    (i === 5 ? 'К списку' : 'Следующее →') + '</button></div></article>';
}

function tokenButtons(order,selected,key) {
  return order.map(i => '<button type="button" class="token" lang="zh-Hans" data-' + key + '="' + i +
    '"' + (selected.includes(i) ? ' disabled' : '') + '>' + tokens[i] + '</button>').join('');
}

function grammar() {
  const current = state.grammar.map(i => tokens[i]).join('');
  return '<h1 class="pill-title">📚 Грамматика</h1><div class="cloud rule-cloud">' + hanzi('以后') +
    '<span class="py">yǐhòu</span><b>после того как…</b></div><p class="grammar-explain hint">Ставим 以后 после первого действия, чтобы сказать, что делаем потом.</p>' +
    '<article class="panel example"><span class="tag">Пример</span>' + vocabImage(1) + '<div>' +
    hanzi('我起床<em>以后</em>洗脸。') + translate(phrases[2]) + '</div>' + audioButton(phrases[2][0]) + '</article>' +
    '<h2 class="builder-title">Составь предложение</h2><div class="tokens">' + tokenButtons([2,0,3,1,4],state.grammar,'gram') +
    '</div><div class="answer" lang="zh-Hans" data-placeholder="Нажимай на карточки по порядку">' + current + '</div>' +
    '<div class="controls"><button type="button" class="soft" data-gram-undo>↶ Отменить</button>' +
    '<button type="button" class="soft" data-gram-clear>Очистить</button></div>' +
    '<button type="button" class="primary large" data-gram-check>✓ Проверить</button>' + safeStatus() +
    (state.grammarDone && !feedback ? '<p class="feedback good">✓ Предложение собрано верно</p>' : '');
}

function day() {
  return '<h1 class="pill-title day-title">🎯 Практика · Мой распорядок</h1><p class="hint">Расположи действия по порядку.</p>' +
    '<div class="practice-grid">' + state.dayShuffled.map(i => {
      const position = state.dayOrder.indexOf(i);
      return '<button type="button" class="day-card' + (position >= 0 ? ' selected' : '') + '" data-day="' + i + '"' +
        (position >= 0 ? ' disabled' : '') + ' aria-label="' + words[i].ru + '">' + art('day-' + dayScenes[i]) + hanzi(words[i].zh) +
        '<span class="py">' + words[i].py + '</span>' + (position >= 0 ? '<span class="position">' + (position+1) + '</span>' : '') + '</button>';
    }).join('') + '</div><div class="answer" lang="zh-Hans" data-placeholder="Выбери первое действие">' +
    state.dayOrder.map(i => words[i].zh).join(' → ') + '</div><div class="controls"><button type="button" class="soft" data-day-undo>↶ Отменить</button>' +
    '<button type="button" class="soft" data-day-reset>Сброс</button></div><button type="button" class="primary large" data-day-check>' + playIcon + ' Проверить порядок</button>' +
    safeStatus() + (state.dayDone && !feedback ? '<p class="feedback good">✓ Все шесть действий по порядку</p>' : '');
}

function phraseCards() {
  return '<div class="phrases">' + phrases.map(item => '<article class="phrase panel"><div>' + hanzi(item[0]) +
    translate(item) + '</div>' + audioButton(item[0]) + '</article>').join('') + '</div>';
}

function toneGuide() {
  const samples = [
    ['ā','высокий, ровный','M3 9h39'],
    ['á','идёт вверх','M3 14 41 3m-7 0h7l-4 6'],
    ['ǎ','низкий, затем вверх в изоляции','M3 4q18 23 38-1m-7 2 7-2-2 7'],
    ['à','резко падает','M3 3l38 12m-7-1 7 1-4-5']
  ];
  return '<section class="tone-guide"><h2>Подсказка · 4 тона в китайском</h2><div class="tone-grid">' +
    samples.map(([sample,name,path],i) => '<div><b>' + (i+1) + '-й тон</b><svg viewBox="0 0 45 18" aria-hidden="true">' +
    '<path d="' + path + '" stroke="#af183e" stroke-width="2.5" stroke-linecap="round" fill="none"/></svg><strong>' +
    sample + '</strong>' + name + '</div>').join('') + '</div></section>';
}

function tones() {
  const wordView = state.toneTab === 'words';
  return hero('tones',6,'Тренировка тонов','Повтори слова урока. Микрофон распознаёт речь.') +
    '<div class="tone-tabs panel" aria-label="Материалы тренировки"><button type="button" data-tone-tab="words" aria-pressed="' + wordView +
    '" class="' + (wordView ? 'primary' : 'soft') + '">📖 Слова урока (6)</button><button type="button" data-tone-tab="phrases" aria-pressed="' + !wordView +
    '" class="' + (!wordView ? 'primary' : 'soft') + '">💬 Фразы (6)</button></div>' +
    (wordView ? '<div class="tone-list">' + words.map((word,i) => '<article class="tone-row">' + vocabImage(i) + '<div>' +
      hanzi(word.zh) + translate([word.zh,word.py,word.ru]) + '</div>' + audioButton(word.zh) + '<div>' +
      pitchRow(word.tones) + wave + '</div>' + micButton(i,'Произнести ' + word.zh,state.mic.includes(i)) + '</article>').join('') + '</div>' : phraseCards()) +
    safeStatus() + toneGuide() + '<div class="progress-panel panel">' + art('medal') + '<div><b>Распознавание слов</b>' +
    '<progress max="6" value="' + state.mic.length + '" aria-label="Распознано слов"></progress></div><b>' + state.mic.length +
    ' из 6</b></div><p class="hint audio-note">洗脸 — xǐliǎn (3 + 3). В связной речи первый слог звучит со 2-м тоном. Волна декоративная, оценки тонов нет.</p>' +
    (wordView ? '<p class="hint audio-note">🔊 Для всех шести слов доступны отдельные записи.</p>' : '');
}

function bubble(role,item) {
  return '<article class="panel chat-bubble' + (role === 'Ты' ? ' me' : '') + '"><b class="chat-role">' + role + '</b>' +
    '<div class="phrase"><div>' + hanzi(item[0]) + (item.length === 3 ? translate(item) : '<span class="ru">' + item[1] + '</span>') +
    '</div>' + audioButton(item[0]) + '</div></article>';
}

function chat() {
  const i = state.chat.length;
  const exchange = dialogue[i];
  return '<h1 class="pill-title">💬 Фразы и диалог</h1>' + phraseCards() + '<p class="hint audio-note">🔊 Все фразы и ответы этого диалога озвучены.</p>' +
    '<section class="dialogue"><h2>Разговор с Пандой</h2><p class="hint">Учебный сценарий. Выбери или произнеси один из ответов.</p>' +
    state.chat.map((reply,j) => bubble('Панда',dialogue[j].prompt) + bubble('Ты',dialogue[j].answers.find(a => a[0] === reply) ?? [reply,''])).join('') +
    (exchange ? bubble('Панда',exchange.prompt) + '<div class="choice-grid">' + exchange.answers.map(([answer,translation],j) =>
      '<button type="button" class="choice" data-chat="' + j + '"><span lang="zh-Hans">' + answer + '</span><span class="ru">' +
      translation + '</span></button>').join('') + '</div><div class="controls"><button type="button" class="soft" data-mic="chat">🎙 Ответить голосом</button></div>' :
      '<p class="feedback good">✓ Ты ответил на все три вопроса.</p>') + safeStatus() +
    (i ? '<div class="controls"><button type="button" class="soft" data-chat-reset>Начать диалог заново</button></div>' : '') + '</section>';
}

function finish() {
  const completed = quizCount() === 30 && state.grammarDone && state.dayDone && state.mic.length === 6 && state.chat.length === 3;
  const result = (label,value,className='') => '<div class="' + className + '"><dt>' + label + '</dt><dd>' + value + '</dd></div>';
  return '<div class="final-hero panel"><img src="' + asset + 'hero-reading.webp" alt="Панда с красной книгой"><div>' +
    '<img class="award" src="' + decoration + (completed ? 'trophy' : 'medal') + '.webp" alt=""><h1>' + (completed ? 'Урок пройден!' : 'Твой прогресс') +
    '</h1><p class="hint">Урок 1 «Мой день»</p></div></div><section class="results panel"><h2>Результаты урока</h2><dl>' +
    result('Все мини-тесты',quizCount() + ' / 30','all') + tests.map((test,i) => result(test,correctCount(i) + ' / 6')).join('') +
    result('Грамматика 以后',state.grammarDone ? '✓ Выполнено' : 'Ожидает проверки') +
    result('Распорядок',state.dayDone ? '✓ Выполнено' : 'Ожидает проверки') + result('Распознано слов',state.mic.length + ' / 6') +
    result('Ответы в диалоге',state.chat.length + ' / 3') + '</dl><div class="controls"><button type="button" class="soft" data-step="3">Вернуться к тестам</button></div></section>';
}
async function play(text,button) {
  const clip = clips.get(normalize(text));
  if (!clip) {
    setStatus('Отдельной записи для «' + text + '» пока нет.');
    return;
  }
  clearMedia();
  const player = new Audio(clip);
  audio = player;
  const origin = scope();
  button.setAttribute('aria-pressed','true');
  const failure = () => {
    if (audio !== player || origin !== scope()) return;
    audio = null;
    button.removeAttribute('aria-pressed');
    setStatus('Запись не загрузилась. Попробуй прослушать ещё раз.');
  };
  player.addEventListener('error',failure,{once:true});
  player.addEventListener('ended',() => {
    if (audio !== player || origin !== scope()) return;
    audio = null;
    button.removeAttribute('aria-pressed');
    if (state.step === 3 && state.quizTest === 1) {
      heardClip = origin;
      for (const choice of workspace.querySelectorAll('[data-choice]')) choice.disabled = false;
      setStatus('Выбери действие, которое прозвучало в конце.',true);
    } else {
      setStatus('');
    }
  },{once:true});
  try {
    await player.play();
    if (audio === player && origin === scope()) setStatus('Запись воспроизводится.',true);
  } catch {
    failure();
  }
}

function recognize(allowed,onMatch,onMiss) {
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Recognition || !window.isSecureContext) {
    setStatus('Распознавание недоступно. Открой урок по HTTPS в браузере с поддержкой китайского распознавания речи.');
    return;
  }
  clearMedia();
  let instance;
  try {
    instance = new Recognition();
    speech = instance;
    instance.lang = 'zh-CN';
    instance.continuous = false;
    instance.interimResults = false;
    instance.maxAlternatives = 3;
    instance.onresult = event => {
      if (speech !== instance) return;
      speech = null;
      const alternatives = Array.from(event.results[event.resultIndex || 0], item => item.transcript);
      const match = allowed.find(text => alternatives.some(heard => normalize(heard) === normalize(text)));
      if (match) onMatch(match);
      else {
        if (onMiss) onMiss();
        setStatus('Распознано «' + (alternatives[0] || '…') + '». Попробуй ещё раз. Тоны не оценивались.');
      }
    };
    instance.onerror = event => {
      if (speech !== instance) return;
      speech = null;
      const errors = {
        'not-allowed':'Разреши доступ к микрофону в настройках браузера и попробуй снова.',
        'audio-capture':'Браузер не нашёл доступный микрофон.',
        network:'Сервис распознавания речи недоступен. Проверь соединение и попробуй снова.',
        'no-speech':'Браузер не распознал речь. Попробуй ещё раз.'
      };
      setStatus(errors[event.error] || 'Распознавание речи недоступно. Попробуй ещё раз.');
    };
    instance.onend = () => {
      if (speech !== instance) return;
      speech = null;
      setStatus('Речь не распознана. Попробуй ещё раз.');
    };
    instance.start();
    setStatus('Слушаю…');
  } catch {
    if (speech === instance) speech = null;
    setStatus('Микрофон не запустился. Проверь разрешение и попробуй снова.');
  }
}

function markQuiz(ok,method) {
  const t = state.quizTest;
  const i = state.quizIndex;
  if (state.quiz[t][i]) return;
  if (ok) {
    state.quiz[t][i] = {correctFirst:!state.missed[t][i],method};
    save();
    setStatus(method === 'speech' ? '✓ Слово распознано. Тоны не оценивались.' : '✓ Верно. Ответ засчитан.',true);
    render();
  } else {
    state.missed[t][i] = true;
    save();
    setStatus('Пока неверно. Попробуй ещё раз.');
  }
}

function openTest(test) {
  clearMedia();
  state.quizTest = test;
  state.quizIndex = test === null ? 0 : Math.max(0,state.quiz[test].findIndex(result => !result));
  state.quizPicked = [];
  heardClip = null;
  feedback = '';
  save();
  render(true);
}

function changeQuestion(direction) {
  const index = state.quizIndex + direction;
  if (index >= words.length) {
    openTest(null);
    return;
  }
  if (index < 0) return;
  clearMedia();
  state.quizIndex = index;
  state.quizPicked = [];
  heardClip = null;
  feedback = '';
  save();
  render(true);
}

function update() {
  feedback = '';
  save();
  render();
}

function onMic(id) {
  if (id === 'chat') {
    const row = dialogue[state.chat.length];
    if (!row) return;
    recognize(row.answers.map(a => a[0]),answer => {
      state.chat.push(answer);
      save();
      setStatus('✓ Ответ распознан.',true);
      render();
      followDialogue();
    });
  } else if (id === 'quiz') {
    recognize([words[state.quizIndex].zh],() => markQuiz(true,'speech'),() => {
      state.missed[state.quizTest][state.quizIndex] = true;
      save();
    });
  } else {
    const index = Number(id);
    recognize([words[index].zh],match => {
      if (!state.mic.includes(index)) state.mic.push(index);
      save();
      setStatus('✓ Распознано «' + match + '». Тоны не оценивались.',true);
      render();
    });
  }
}

function followDialogue() {
  const target = workspace.querySelector('.dialogue .chat-bubble:last-of-type');
  if (target) target.scrollIntoView({block:'nearest'});
}

function checkOrder(part,length,success,failure) {
  const order = part === 'grammar' ? state.grammar : state.dayOrder;
  const ok = order.length === length && order.every((value,i) => value === i);
  state[part + 'Done'] = ok;
  save();
  setStatus(ok ? success : failure,ok);
  render();
}

const actions = {
  step: value => move(Number(value)),
  say: (value,button) => play(value,button),
  test: value => openTest(Number(value)),
  start: () => openTest(Math.max(0,tests.findIndex((_,i) => correctCount(i) < 6))),
  question: value => changeQuestion(Number(value)),
  choice: value => {
    const correct = state.quizTest === 1 ? listening[state.quizIndex][1] : state.quizIndex;
    markQuiz(Number(value) === correct,'choice');
  },
  letter: value => { state.quizPicked.push(Number(value)); update(); },
  letterClear: () => { state.quizPicked = []; update(); },
  letterCheck: () => {
    const target = words[state.quizIndex].zh;
    markQuiz(state.quizPicked.map(i => [...target][i]).join('') === target,'assemble');
  },
  gram: value => { state.grammar.push(Number(value)); state.grammarDone = false; update(); },
  gramUndo: () => { state.grammar.pop(); state.grammarDone = false; update(); },
  gramClear: () => { state.grammar = []; state.grammarDone = false; update(); },
  gramCheck: () => checkOrder('grammar',5,'✓ Верно. После 起床 ставим 以后, затем 洗脸。','Проверь порядок. Сначала подлежащее и первое действие, затем 以后 и второе действие.'),
  day: value => { state.dayOrder.push(Number(value)); state.dayDone = false; update(); },
  dayUndo: () => { state.dayOrder.pop(); state.dayDone = false; update(); },
  dayReset: () => { state.dayOrder = []; state.dayShuffled = mixedDay(); state.dayDone = false; update(); },
  dayCheck: () => checkOrder('day',6,'✓ Все шесть действий по порядку.','Проверь все шесть действий, от подъёма до сна.'),
  toneTab: value => { clearMedia(); state.toneTab = value; update(); },
  mic: value => onMic(value),
  chat: value => {
    clearMedia();
    state.chat.push(dialogue[state.chat.length].answers[Number(value)][0]);
    update();
    followDialogue();
  },
  chatReset: () => { clearMedia(); state.chat = []; update(); }
};

app.addEventListener('click',event => {
  const button = event.target.closest('button');
  if (!button || button.disabled) return;
  for (const [action,value] of Object.entries(button.dataset)) {
    if (Object.hasOwn(actions,action)) {
      actions[action](value,button);
      break;
    }
  }
});

function previousStep() {
  if (state.step === 3 && state.quizTest !== null) openTest(null);
  else move(courseMode ? courseSteps[courseSteps.indexOf(state.step)-1] : state.step-1);
}

back.addEventListener('click',previousStep);
headBack.addEventListener('click',previousStep);
next.addEventListener('click',() => {
  if (courseMode && state.step === 3 && state.quizTest !== null) {
    changeQuestion(1);
    return;
  }
  move(state.step === 8 ? 1 : (courseMode ? courseSteps[courseSteps.indexOf(state.step)+1] : state.step+1));
});

const fromQuery = Number(layoutParams.get('step'));
if (Number.isInteger(fromQuery) && fromQuery >= 1 && fromQuery <= 8) {
  if (!courseMode || state.step !== fromQuery) state.quizTest = null;
  state.step = fromQuery;
}
if (courseMode && fromQuery === 1) {
  location.replace(courseCover);
} else {
  if (!Number.isInteger(state.step) || state.step < 1 || state.step > 8) state.step = 1;
  if (courseMode && state.step === 1) state.step = 2;
  render(true);
}

window.PandaGoHSK2Preview = {
  getProgress: () => JSON.parse(JSON.stringify(state)),
  goToStep: move
};
</script>
</body>
