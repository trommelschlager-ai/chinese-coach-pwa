.hero-intro:after{content:"";position:absolute;pointer-events:none;left:0;bottom:-1px;right:0;height:18%;background:linear-gradient(0deg,#f9d7f4bc,transparent)}
.hero-intro img{left:0;bottom:0;width:52%;height:100%;object-fit:contain;object-position:left bottom;border-radius:19px;mask-image:linear-gradient(to right,#000 80%,transparent 100%)}
.hero-cloud{right:3%;top:21%;width:53%;min-height:98px;padding:8px 5px;border-radius:44% 45% 43% 45%;z-index:1}
.hero-cloud .cn{font-size:clamp(25px,7vw,33px)}.hero-cloud .py{font-size:13px}.hero-cloud .ru{font-size:clamp(16px,5vw,20px)}
.sparkle{font-size:15px;max-width:220px;padding:5px 12px;margin:-6px auto 5px;border:1px solid #fff0b8}
.feature-frame{margin-top:11px;padding:9px 7px 6px}
.feature{min-height:57px;gap:1px;padding:3px 1px;font-size:clamp(10px,2.7vw,12px)}
.feature .icon-illustration{font-size:19px;filter:drop-shadow(0 2px 2px #9f63a254)}
.word-list,.test-list,.tone-rows,.phrase-list{gap:7px}
.word-row{min-height:67px;padding:4px 6px;grid-template-columns:clamp(69px,22vw,92px) minmax(0,1fr) 38px;border-radius:17px;box-shadow:0 3px 7px #99449a42}
.word-row img{height:59px}.word-row .cn{font-size:clamp(19px,5.5vw,24px)}.word-row .py{font-size:13px}
.round{width:38px;height:38px;font-size:18px}
.hero-test{grid-template-columns:38% 1fr;margin-bottom:9px;padding:0;border-radius:22px}
.hero-test img{height:110px}.hero-test h2{font-size:18px}.hero-test p{font-size:11px}
.test-card{min-height:62px;padding:5px 7px;grid-template-columns:29px 46px 1fr 18px;gap:7px;border-radius:18px}
.test-card .circle{width:29px;height:29px;font-size:15px}.test-card .test-icon{font-size:25px;min-height:45px;border-radius:12px}
.test-card strong{font-size:clamp(13px,3.5vw,16px)}.test-card small{font-size:10px;margin-top:1px}
.rule{padding:9px 12px 7px;margin-bottom:9px;border-radius:43% 48% 43% 47% / 28% 31% 27% 29%;background:linear-gradient(#fffdf6,#fff0fb);border:2px solid #efd18d;box-shadow:0 3px 9px #a351a34f}
.rule .cn{font-size:clamp(32px,8.5vw,42px);color:#cd304e}.rule .py{font-size:13px}.rule p{font-size:11px;margin:4px 0 0;line-height:1.33}
.example{grid-template-columns:77px minmax(0,1fr);gap:7px;margin-bottom:9px;padding:6px}
.example img{height:72px;border-radius:13px}
.example .cn{font-size:clamp(15px,4.5vw,19px);white-space:normal;overflow-wrap:anywhere}
.example .py{font-size:11px}.example .ru{font-size:11px}
.stage>.glass>h3{text-align:center;font-size:15px}
.tokens,.answer-box{margin:7px 0;gap:5px;min-height:43px}
.token{min-width:35px;min-height:34px;font-size:17px;padding:5px 7px;border-radius:19px;box-shadow:0 2px 3px #a057ad4a}
.answer-box{font-size:17px;padding:7px;border-radius:14px}
.controls{margin:8px 0 3px;gap:5px}
.soft{padding:7px 11px;font-size:12px;border-radius:16px}
.inline-primary{font-size:13px;padding:8px 12px}
.practice-grid{gap:6px}.day-card{padding:4px 3px 7px;border-radius:15px}
.day-card img{height:clamp(60px,11dvh,90px);border-radius:10px}
.day-card .cn{font-size:clamp(14px,4vw,18px)}.day-card .py{font-size:10px}
.tone-hero img{height:105px}.tone-hero h2{font-size:19px}
.tone-row{min-height:65px;grid-template-columns:58px minmax(0,1fr) 36px 38px;gap:5px;padding:3px 5px}
.tone-row img{height:57px;width:58px}.tone-row .cn{font-size:20px}
.tones-tip{margin:9px 0}.tones-tip h3{font-size:15px;padding:7px}
.four-tones strong{font-size:25px}.four-tones b{font-size:11px}
@media (max-width:370px){.workspace{padding:8px 7px 12px}.mini-logo{width:30px;height:30px}.back{width:27px;height:27px}.header-label{font-size:12px}.demo-pill{font-size:9px;padding:3px 5px}.progress-steps{gap:1px}.nav-step{width:25px}.hero-cloud{right:2%;width:56%}.hero-intro img{width:54%}.word-row{grid-template-columns:65px minmax(0,1fr) 36px}.tone-row{grid-template-columns:53px minmax(0,1fr) 34px 34px}}

</style>

<body>
<div class="app" id="app">
<header>
 <div class="head-line"><button type="button" class="back" id="back" aria-label="Предыдущий шаг">‹</button><div class="header-label" id="header-label">HSK 2 · Урок 1 · Шаг 1 из 8</div><img class="mini-logo" src="./assets/hsk2-storyboard-v433-avatar.jpg" alt="Panda Go"><span class="demo-pill">👑 ДЕМО</span></div>
 <nav id="steps" class="progress-steps" aria-label="Навигация: 8 шагов урока"></nav>
</header>
<main id="workspace" class="workspace" aria-live="polite"></main>
<div class="footer"><button type="button" class="primary" id="next">Дальше: Новые слова ▶</button><div class="footer-note">Отдельная preview-версия · действующий урок не изменён</div></div>
</div>
<script>
(function(){"use strict";
const assets="./assets/hsk2-preview-v457/";
const avatar="./assets/hsk2-storyboard-v433-avatar.jpg";
const vocab=[
{zh:"起床",py:"qǐchuáng",ru:"вставать с постели",tones:[3,2]},
{zh:"洗脸",py:"xǐliǎn",ru:"умываться",tones:[3,3],spoken:[2,3]},
{zh:"刷牙",py:"shuāyá",ru:"чистить зубы",tones:[1,2]},
{zh:"吃早饭",py:"chī zǎofàn",ru:"завтракать",tones:[1,3,4]},
{zh:"去上班",py:"qù shàngbān",ru:"идти на работу",tones:[4,4,1]},
{zh:"睡觉",py:"shuìjiào",ru:"ложиться спать",tones:[4,4]}
];
const phrases=[
{zh:"你每天几点起床？",py:"Nǐ měitiān jǐ diǎn qǐchuáng?",ru:"Во сколько ты каждый день встаёшь?"},
{zh:"我每天七点起床。",py:"Wǒ měitiān qī diǎn qǐchuáng.",ru:"Я каждый день встаю в семь часов."},
{zh:"我起床以后洗脸。",py:"Wǒ qǐchuáng yǐhòu xǐliǎn.",ru:"После того как встаю, я умываюсь."},
{zh:"我早上吃早饭。",py:"Wǒ zǎoshang chī zǎofàn.",ru:"Утром я завтракаю."}
];
const dialogue=[
{q:"你每天几点起床？",py:"Nǐ měitiān jǐ diǎn qǐchuáng?",ru:"Во сколько ты каждый день встаёшь?",answers:[["我每天七点起床。","В семь часов"],["我每天八点起床。","В восемь часов"]]},
{q:"你早上做什么？",py:"Nǐ zǎoshang zuò shénme?",ru:"Что ты делаешь утром?",answers:[["我早上洗脸。","Умываюсь"],["我早上吃早饭。","Завтракаю"]]},
{q:"你几点睡觉？",py:"Nǐ jǐ diǎn shuìjiào?",ru:"Во сколько ты ложишься спать?",answers:[["我晚上十点睡觉。","В десять"],["我晚上十一点睡觉。","В одиннадцать"]]}
];
const titles=["Вступление","Новые слова","Проверь слова","Грамматика","Мой распорядок","Тренировка тонов","Фразы и диалог","Завершение"];
const testTitles=["Значение слова","По аудио","Собери слово","Заполни фразу","Произнеси"];
const testIcons=["📖","🔊","🧩","📝","🎙️"];
const key="panda-go-hsk2-lesson1-approved-preview-v1";
const blank=()=>({step:1,quiz:Array.from({length:5},()=>Array(6).fill(null)),mistakes:0,quizTest:null,quizIndex:0,quizPicked:[],quizWrong:false,grammar:[],grammarDone:false,dayOrder:[],dayShuffled:shuffle([0,1,2,3,4,5]),dayDone:false,mic:[],chat:[],wordSeen:[],audioNotice:""});
function shuffle(a){let b=a.slice();for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
let S;
try{let old=JSON.parse(localStorage.getItem(key));S=old&&Array.isArray(old.quiz)&&old.quiz.length===5?Object.assign(blank(),old):blank()}catch(e){S=blank()}
let alertText="",alertGood=false,recognition=null;
const W=document.getElementById("workspace"),nav=document.getElementById("steps"),next=document.getElementById("next"),back=document.getElementById("back"),header=document.getElementById("header-label");
const img=(i)=>assets+"word-"+(i+1)+".webp";
const escape=(s)=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sayBtn=(text,small)=>'<button type="button" class="round" data-say="'+escape(text)+'" aria-label="Прослушать '+escape(text)+'" title="Голос браузера, не запись носительницы">'+(small||"🔊")+'</button>';
const mark=(v)=>'<span class="tonemark'+(v===3?" sandhi":"")+'">'+v+'</span>';
const showMessage=(v,ok)=>{alertText=v;alertGood=!!ok;render(false)};
const htmlMessage=()=>alertText?'<div class="feedback'+(alertGood?" ok":"")+'" role="status">'+escape(alertText)+'</div>':"";
const storage=()=>{try{localStorage.setItem(key,JSON.stringify(S))}catch(e){}};
function recordDone(t,i,reason){if(!S.quiz[t][i])S.quiz[t][i]={correctFirst:!S.quizWrong,method:reason};S.quizWrong=false;S.quizPicked=[];S.mistakes=Math.max(0,S.mistakes);alertText="Верно! Ответ засчитан.";alertGood=true;storage();render(false)}
function quizCount(){return S.quiz.flat().filter(Boolean).length}
function tonesCount(){return S.mic.length}
function quizSuccess(t){return S.quiz[t].filter(Boolean).length}
function showNav(){nav.innerHTML=titles.map((label,i)=>'<button type="button" class="nav-step'+(S.step===i+1?" active":"")+'" data-step="'+(i+1)+'" aria-current="'+(S.step===i+1?"step":"false")+'" aria-label="Шаг '+(i+1)+': '+label+'">'+(i+1)+'</button>').join("")}
function go(n){if(recognition){try{recognition.abort()}catch(e){}recognition=null}S.step=Math.max(1,Math.min(8,n));alertText="";storage();render(true)}
function render(scroll){showNav();header.textContent="HSK 2 · Урок 1 · Шаг "+S.step+" из 8";back.disabled=S.step===1;
let layout=[intro,words,test,grammar,day,tones,chat,finish][S.step-1]();
W.innerHTML=layout+htmlMessage();
let nextText=["Дальше: Новые слова ▶","Дальше: Проверь слова ▶","Дальше: Грамматика ▶","Дальше: Мой распорядок ▶","Дальше: Тренировка тонов ▶","Дальше: Диалог ▶","Дальше: Результаты ▶","Вернуться к началу ↻"][S.step-1];
next.textContent=S.step===3&&S.quizTest!==null?"К списку тестов ◀":S.step===4&&!S.grammarDone?"✓ Проверить предложение":S.step===5&&!S.dayDone?"✓ Проверить порядок":nextText;
if(scroll)W.scrollTop=0;
}
function intro(){const fs=[["📚","6 слов"],["🎯","5 мини-тестов"],["🧩","грамматика"],["🗓️","распорядок"],["🎙️","произношение"],["💬","диалог"]];
return '<section class="stage"><div class="hero-intro"><img src="'+assets+'hero-reading.webp" alt="Панда с красной книгой"><div class="hero-cloud"><strong class="cn" lang="zh">我的一天</strong><span class="py">Wǒ de yì tiān</span><b class="ru">Мой день</b></div></div><section class="glass feature-frame"><h2 class="sparkle">✦ Тебя ждут ✦</h2><div class="feature-grid">'+fs.map(x=>'<div class="feature"><span class="icon-illustration">'+x[0]+'</span>'+x[1]+'</div>').join("")+'</div></section><p class="helper">6 слов, 5 видов проверки, грамматика 以后, распорядок дня, произношение и мини-диалог.</p></section>'}
function words(){return '<section class="stage"><h1 class="pill-title">🌸 Новые слова</h1><div class="word-list">'+vocab.map((v,i)=>'<article class="word-row"><img src="'+img(i)+'" alt="Панда: '+v.ru+'"><div><strong class="cn" lang="zh">'+v.zh+'</strong><span class="py">'+v.py+'</span><span class="ru">'+v.ru+'</span></div>'+sayBtn(v.zh)+'</article>').join("")+'</div><p class="helper">🔊 Озвучка в preview: голос браузера, пока проверенные MP3 не подключены.</p></section>'}
function test(){if(S.quizTest===null){return '<section class="stage"><article class="glass hero-test"><img src="'+assets+'hero-reading.webp" alt="Панда готова к тестам"><div><h2>🎯 Проверь слова!</h2><p>Пять настоящих мини-тестов по шести словам.</p></div></article><div class="test-list">'+testTitles.map((t,i)=>'<button class="test-card'+(quizSuccess(i)===6?" complete":"")+'" data-test="'+i+'"><span class="circle">'+(i+1)+'</span><span class="test-icon">'+testIcons[i]+'</span><span><strong>Тест '+(i+1)+' · '+t+'</strong><small>'+quizSuccess(i)+'/6 выполнено</small></span><span class="arrow">'+(quizSuccess(i)===6?"✓":"▶")+'</span></button>').join("")+'</div><div class="glass" style="margin-top:14px;text-align:center"><b>Общий прогресс: '+quizCount()+' из 30</b><div class="progressbar" style="margin-top:9px"><div style="width:'+(100*quizCount()/30)+'%"></div></div></div></section>'}
const t=S.quizTest,i=S.quizIndex,v=vocab[i],already=S.quiz[t][i];
const headerBlock='<div class="glass"><h2 class="section-title" style="font-size:19px;margin:0">Тест '+(t+1)+' · '+testTitles[t]+'</h2><p class="helper">Слово '+(i+1)+' из 6 · завершено '+quizSuccess(t)+'/6</p><div class="progressbar"><div style="width:'+(100*quizSuccess(t)/6)+'%"></div></div></div>';
let prompt="",buttons="";
if(t===0){prompt='<div class="quiz-prompt">Выбери правильный перевод</div><div class="quiz-word" lang="zh">'+v.zh+'</div><p class="helper">'+v.py+'</p>';buttons=choices(i,t,"ru")}
if(t===1){prompt='<div class="quiz-prompt">Прослушай и выбери иероглифы</div><div style="display:flex;justify-content:center;margin:10px">'+sayBtn(v.zh)+'</div><p class="helper">Используется обозначенный голос браузера.</p>';buttons=choices(i,t,"zh")}
if(t===2){let chars=[...v.zh],order=chars.map((_,j)=>j).reverse();prompt='<div class="quiz-prompt">Собери слово: '+v.ru+'</div><p class="helper">'+v.py+'</p><div class="answer-box">'+(S.quizPicked.map(k=>chars[k]).join("")||"Нажимай на иероглифы")+'</div>';buttons='<div class="tokens">'+order.map(k=>'<button class="token" data-letter="'+k+'" '+(S.quizPicked.includes(k)?"disabled":"")+'>'+chars[k]+'</button>').join("")+'</div><div class="controls"><button class="soft" data-clear-letter>Очистить</button><button class="primary inline-primary" data-check-letter>✓ Проверить</button></div>'}
if(t===3){prompt='<div class="quiz-prompt">Заполни пропуск</div><div class="quiz-word" lang="zh" style="font-size:28px">我每天 ____ 。</div><p class="helper">Подставь слово: '+v.ru+'</p>';buttons=choices(i,t,"zh")}
if(t===4){prompt='<div class="quiz-prompt">Произнеси в микрофон</div><div class="quiz-word" lang="zh">'+v.zh+'</div><p class="helper">'+v.py+'</p><div style="display:flex;justify-content:center;gap:15px;margin:15px">'+sayBtn(v.zh)+'<button class="round mic" data-mic="quiz" aria-label="Произнести в микрофон">🎙</button></div><p class="helper">Проверяется только распознанный текст, не точность тонов.</p>'}
if(already){buttons='<div class="feedback ok">✓ Слово выполнено · '+(already.correctFirst?"с первой попытки":"после исправления")+'</div>'}
return '<section class="stage">'+headerBlock+'<article class="glass" style="margin-top:11px">'+prompt+buttons+'</article><div class="controls"><button class="soft" data-quiz-prev>‹ Назад</button><button class="soft" data-quiz-home>Все тесты</button><button class="primary inline-primary" data-quiz-next>'+(i===5?"Завершить тест":"Следующее ▶")+'</button></div><p class="helper">Ответы сохраняются при переходах между экранами.</p></section>'}
function choices(i,t,field){let opts=[0,1,2,3].map(k=>(i+k)%6);opts=opts.slice((i+t)%4).concat(opts.slice(0,(i+t)%4));return '<div class="choice-grid">'+opts.map(k=>'<button type="button" class="choice" data-choice="'+k+'">'+(field==="ru"?vocab[k].ru:vocab[k].zh)+'</button>').join("")+'</div>'}
const grammTokens=["我","起床","以后","洗脸","。"],grammShuffled=[2,0,3,1,4];
function grammar(){return '<section class="stage"><h1 class="pill-title">📚 Грамматика</h1><div class="rule"><b class="cn" lang="zh">以后</b><span class="py">yǐhòu — после того как</span><p>Ставим 以后 после первого действия, чтобы сказать, что делаем потом.</p></div><div class="glass example"><img src="'+img(1)+'" alt="Панда умывается"><div><b class="cn" lang="zh">我起床以后洗脸。</b><span class="py">Wǒ qǐchuáng yǐhòu xǐliǎn.</span><span class="ru">После того как я встаю, я умываюсь.</span></div></div><div class="glass"><h3 style="text-align:center;margin:3px 0 10px">🧩 Составь предложение</h3><div class="tokens">'+grammShuffled.map(i=>'<button type="button" class="token" data-gram="'+i+'" '+(S.grammar.includes(i)?"disabled":"")+'>'+grammTokens[i]+'</button>').join("")+'</div><div class="answer-box">'+(S.grammar.map(i=>grammTokens[i]).join("")||"Выбирай слова по порядку")+'</div><div class="controls"><button class="soft" data-gram-undo>↶ Отменить</button><button class="soft" data-gram-clear>Очистить</button><button class="primary inline-primary" data-gram-check>✓ Проверить</button></div><p class="helper">Схема: 我 + 起床 + 以后 + 洗脸 + 。</p>'+(S.grammarDone?'<div class="feedback ok">✓ Грамматика выполнена</div>':"")+'</div></section>'}
function day(){return '<section class="stage"><h1 class="pill-title">🎯 Мой распорядок</h1><p class="helper">Нажимай на карточки в порядке дня Панды — от подъёма до сна.</p><div class="practice-grid">'+S.dayShuffled.map(i=>'<button class="day-card'+(S.dayOrder.includes(i)?" selected":"")+'" data-day="'+i+'" '+(S.dayOrder.includes(i)?"disabled":"")+'><img src="'+img(i)+'" alt="'+vocab[i].ru+'"><strong class="cn" lang="zh">'+vocab[i].zh+'</strong><span class="py">'+vocab[i].py+'</span>'+(S.dayOrder.includes(i)?'<span class="position">'+(S.dayOrder.indexOf(i)+1)+'</span>':"")+'</button>').join("")+'</div><div class="glass" style="margin-top:11px"><b>Твой порядок:</b><div class="answer-box" style="font-size:13px;min-height:53px">'+(S.dayOrder.map(i=>vocab[i].zh).join(" → ")||"Выбери первое действие")+'</div><div class="controls"><button class="soft" data-day-undo>↶ Отменить</button><button class="soft" data-day-reset>Сброс</button><button class="primary inline-primary" data-day-check>✓ Проверить</button></div>'+(S.dayDone?'<div class="feedback ok">✓ Порядок всех шести действий верный!</div>':"")+'</div></section>'}
function tones(){return '<section class="stage"><article class="glass tone-hero"><img src="'+assets+'hero-reading.webp" alt="Панда в розовых наушниках"><div><h2>🎙 Тренировка тонов</h2><p>Слушай и повторяй слова урока.</p></div></article><div class="tone-rows">'+vocab.map((v,i)=>'<article class="tone-row"><img src="'+img(i)+'" alt="Панда: '+v.ru+'"><div><strong class="cn" lang="zh">'+v.zh+'</strong><span class="py">'+v.py+'</span><div class="tonemarks">'+v.tones.map(mark).join("")+'</div><div class="tone-curve">'+(v.spoken?"В речи: 2 → 3":"▂▅▃▇▂▅")+'</div></div>'+sayBtn(v.zh)+'<button type="button" class="round mic'+(S.mic.includes(i)?" recognized":"")+'" data-mic="'+i+'" aria-label="Произнести '+v.zh+'">🎙</button></article>').join("")+'</div><article class="glass tones-tip"><h3>Подсказка: 4 тона в китайском</h3><div class="four-tones"><div><b>1-й</b><strong>ā</strong><small>ровный</small></div><div><b>2-й</b><strong>á</strong><small>восходящий</small></div><div><b>3-й</b><strong>ǎ</strong><small>низкий, затем вверх</small></div><div><b>4-й</b><strong>à</strong><small>резко падающий</small></div></div></article><div class="glass prize"><span class="medal">🏅</span><div style="flex:1"><b>Распознано слов: '+S.mic.length+' из 6</b><div class="progressbar" style="margin-top:6px"><div style="width:'+(S.mic.length/6*100)+'%"></div></div></div></div><p class="helper">洗脸 пишется 3 + 3; в обычной речи первый слог звучит как 2-й тон. Распознавание текста не проверяет контур тона.</p></section>'}
function chat(){const i=S.chat.length;return '<section class="stage"><h1 class="pill-title">💬 Фразы и диалог</h1><div class="phrase-list">'+phrases.map(p=>'<article class="glass phrase"><div><strong class="cn" lang="zh">'+p.zh+'</strong><span class="py">'+p.py+'</span><span class="ru">'+p.ru+'</span></div>'+sayBtn(p.zh)+'</article>').join("")+'</div><h2 class="section-title" style="font-size:20px;margin-top:14px">Разговор с Пандой</h2><p class="helper">Учебный сценарий с выбором ответов — не свободный AI-диалог.</p>'+S.chat.map((r,j)=>'<div class="chat"><b>Панда</b><strong class="cn" lang="zh">'+dialogue[j].q+'</strong></div><div class="chat me"><b>Ты</b><strong class="cn" lang="zh">'+r+'</strong></div>').join("")+(i<3?'<div class="chat"><b>Панда '+sayBtn(dialogue[i].q,'▶')+'</b><strong class="cn" lang="zh">'+dialogue[i].q+'</strong><span class="py">'+dialogue[i].py+'</span><span class="ru">'+dialogue[i].ru+'</span></div><div class="choice-grid">'+dialogue[i].answers.map((a,j)=>'<button class="choice" data-chat="'+j+'">'+a[0]+'<span class="ru">'+a[1]+'</span></button>').join("")+'</div><div class="controls"><button class="soft" data-dialogue-mic>🎙 Ответить голосом</button></div>':'<div class="feedback ok">✓ Ты ответил на три вопроса Панды.</div>')+'<div class="controls"><button class="soft" data-chat-reset>Повторить диалог</button></div><p class="helper">Интеграция Panda AI — отдельный будущий этап, существующий Panda AI не изменён.</p></section>'}
function finish(){let qq=quizCount(),correctFirst=S.quiz.flat().filter(x=>x&&x.correctFirst).length,all=qq===30&&S.grammarDone&&S.dayDone&&S.chat.length===3;
return '<section class="stage"><div class="glass hero-finish"><img src="'+assets+'hero-reading.webp" alt="Панда поздравляет с завершением"><div><h2>'+(all?"Поздравляем!":"Твой прогресс")+'</h2><p class="helper" style="text-align:left">HSK 2 · Мой день</p></div></div><div class="trophy">'+(all?"🏆":"🏅")+'</div><h1 class="section-title">'+(all?"Основные задания выполнены!":"Что уже получилось")+'</h1><div class="glass"><div class="stats"><div class="stat">Мини-тесты <span>'+qq+' / 30</span></div><div class="stat">С первой попытки <span>'+correctFirst+' / '+qq+'</span></div><div class="stat">Грамматика 以后 <span>'+(S.grammarDone?"✓ Выполнено":"Не выполнено")+'</span></div><div class="stat">Распорядок <span>'+(S.dayDone?"✓ Выполнено":"Не выполнено")+'</span></div><div class="stat">Распознано слов <span>'+tonesCount()+' / 6</span></div><div class="stat">Ответы в диалоге <span>'+S.chat.length+' / 3</span></div></div><p class="helper">'+(all?"Результаты получены из выполненных заданий.":"Здесь показаны только фактические результаты. Можно вернуться к любому шагу.")+'</p><div class="controls"><button class="soft" data-review>Вернуться к тестам</button><button class="soft" data-restart>Сбросить результаты</button></div></div></section>'}
function playChinese(text){alertText="Демо: проигрывается голос браузера, не MP3 носительницы.";alertGood=false;
if(!("speechSynthesis" in window)){showMessage("Нет MP3 для «"+text+"», и браузер не поддерживает озвучивание.",false);return}
try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="zh-CN";u.rate=.78;const vv=speechSynthesis.getVoices();u.voice=vv.find(v=>/^zh[-_]CN/i.test(v.lang))||vv.find(v=>/^zh[-_]/i.test(v.lang))||null;u.onerror=()=>{showMessage("Не удалось воспроизвести голос браузера. Проверенный MP3 не найден.",false)};speechSynthesis.speak(u);showMessage("Демо: голос браузера для «"+text+"». Проверенная MP3-запись не подключена.",false)}catch(e){showMessage("Невозможно воспроизвести звук: "+e.message,false)}
}
function micChinese(expected,callback){const Rec=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!Rec){showMessage("Распознавание речи недоступно в этом браузере. Попробуй Chrome на Android по HTTPS.",false);return}
if(recognition){try{recognition.abort()}catch(e){}}
try{const r=new Rec();recognition=r;r.lang="zh-CN";r.continuous=false;r.interimResults=false;r.maxAlternatives=1;
r.onresult=e=>{let heard=e.results[0][0].transcript||"";let norm=s=>s.replace(/[\s。，？！.,!?]/g,"");let ok=norm(heard)===norm(expected);recognition=null;if(ok)callback(heard);else showMessage("Распознано: "+heard+". Ожидалось: "+expected+". Попробуй ещё раз. Тоны не оценивались.",false)};
r.onerror=e=>{recognition=null;showMessage("Микрофон: "+e.error+". Для распознавания дай разрешение браузеру.",false)};
r.onend=()=>{if(recognition===r)recognition=null};
r.start();showMessage("🎙 Слушаю: произнеси «"+expected+"». Распознавание текста ≠ проверка тонов. Браузер может отправлять аудио на обработку.",false)
}catch(e){showMessage("Микрофон не запустился: "+e.message,false)}
}
document.addEventListener("click",function(e){
const b=e.target.closest("button");if(!b)return;const d=b.dataset;
if(d.step){go(Number(d.step));return}
if(d.say){playChinese(d.say);return}
if(d.test!==undefined){S.quizTest=Number(d.test);S.quizIndex=S.quiz[S.quizTest].findIndex(v=>!v);if(S.quizIndex<0)S.quizIndex=0;S.quizWrong=false;S.quizPicked=[];storage();render(true);return}
if(d.quizHome!==undefined){S.quizTest=null;alertText="";storage();render(true);return}
if(d.quizPrev!==undefined){S.quizIndex=Math.max(0,S.quizIndex-1);S.quizPicked=[];alertText="";storage();render(false);return}
if(d.quizNext!==undefined){if(S.quizIndex<5){S.quizIndex++;S.quizPicked=[];S.quizWrong=false;alertText="";storage();render(false)}else{S.quizTest=null;storage();render(true)}return}
if(d.choice!==undefined){let t=S.quizTest,i=S.quizIndex,k=Number(d.choice);if(S.quiz[t][i])return;if(k===i){recordDone(t,i,"choice")}else{S.quizWrong=true;S.mistakes++;showMessage("Пока неверно. Попробуй ещё раз — ответ не засчитан.",false)}return}
if(d.letter!==undefined){const i=Number(d.letter);if(!S.quizPicked.includes(i)){S.quizPicked.push(i);storage();render(false)}return}
if(d.clearLetter!==undefined){S.quizPicked=[];storage();render(false);return}
if(d.checkLetter!==undefined){let i=S.quizIndex;if(S.quizPicked.map(k=>[...vocab[i].zh][k]).join("")===vocab[i].zh){recordDone(2,i,"assemble")}else{S.quizWrong=true;S.mistakes++;showMessage("Порядок иероглифов неправильный. Очисти и повтори.",false)}return}
if(d.gram!==undefined){let k=Number(d.gram);if(!S.grammar.includes(k)){S.grammar.push(k);S.grammarDone=false;storage();render(false)}return}
if(d.gramUndo!==undefined){S.grammar.pop();S.grammarDone=false;storage();render(false);return}
if(d.gramClear!==undefined){S.grammar=[];S.grammarDone=false;storage();render(false);return}
if(d.gramCheck!==undefined){S.grammarDone=S.grammar.join(",")==="0,1,2,3,4";storage();showMessage(S.grammarDone?"✓ Отлично! После 起床 ставим 以后, затем 洗脸.":"Порядок неверный. Сначала 我起床, затем 以后, потом 洗脸。",S.grammarDone);return}
if(d.day!==undefined){const k=Number(d.day);if(!S.dayOrder.includes(k)){S.dayOrder.push(k);S.dayDone=false;storage();render(false)}return}
if(d.dayUndo!==undefined){S.dayOrder.pop();S.dayDone=false;storage();render(false);return}
if(d.dayReset!==undefined){S.dayOrder=[];S.dayDone=false;S.dayShuffled=shuffle([0,1,2,3,4,5]);storage();render(false);return}
if(d.dayCheck!==undefined){S.dayDone=S.dayOrder.length===6&&S.dayOrder.every((v,i)=>v===i);storage();showMessage(S.dayDone?"✓ Верно! Так проходит день Панды.":"Порядок не совпадает с распорядком Панды. Проверь все шесть действий.",S.dayDone);return}
if(d.mic!==undefined){const i=Number(d.mic);
if(d.mic==="quiz"){const t=S.quizTest,j=S.quizIndex;micChinese(vocab[j].zh,heard=>{recordDone(t,j,"speech-recognition");showMessage("✓ Браузер распознал: "+heard+". Точность тонов не проверялась.",true)})}
else{micChinese(vocab[i].zh,heard=>{if(!S.mic.includes(i))S.mic.push(i);storage();showMessage("✓ Распознано: "+heard+". Это не оценка произношения тонов.",true)})}return}
if(d.chat!==undefined){let i=S.chat.length;if(i>=3)return;S.chat.push(dialogue[i].answers[Number(d.chat)][0]);storage();alertText="";render(false);return}
if(d.dialogueMic!==undefined){let i=S.chat.length;if(i>=3)return;const acceptable=dialogue[i].answers.map(a=>a[0]);const Rec=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Rec){showMessage("Голосовой ответ недоступен в этом браузере.",false);return}
try{let r=new Rec();recognition=r;r.lang="zh-CN";r.onresult=e=>{const heard=e.results[0][0].transcript||"";const norm=x=>x.replace(/[\s。，？！.,!?]/g,"");let matched=acceptable.find(a=>norm(a)===norm(heard));recognition=null;if(matched){S.chat.push(matched);storage();showMessage("✓ Распознано: "+heard+". Тоны не оценивались.",true)}else showMessage("Распознано: "+heard+". Выбери или произнеси один из предложенных ответов.",false)};r.onerror=e=>showMessage("Ошибка микрофона: "+e.error,false);r.start();showMessage("🎙 Ответь на китайском. Это сценарная проверка текста, не Panda AI.",false)}catch(e){showMessage("Не удалось открыть микрофон.",false)}return}
if(d.chatReset!==undefined){S.chat=[];storage();render(false);return}
if(d.review!==undefined){S.quizTest=null;go(3);return}
if(d.restart!==undefined){if(window.confirm("Сбросить результаты упражнений этого preview?")){S=blank();storage();go(1)}return}
});
back.addEventListener("click",()=>{if(S.step===3&&S.quizTest!==null){S.quizTest=null;storage();render(true)}else go(S.step-1)});
next.addEventListener("click",()=>{if(S.step===3&&S.quizTest!==null){S.quizTest=null;storage();render(true)}
else if(S.step===4&&!S.grammarDone){document.querySelector('[data-gram-check]')?.click()}
else if(S.step===5&&!S.dayDone){document.querySelector('[data-day-check]')?.click()}
else go(S.step===8?1:S.step+1)});
if("speechSynthesis" in window){speechSynthesis.getVoices()}
if(!Number.isInteger(S.step)||S.step<1||S.step>8)S.step=1;
const fromQuery=Number(new URLSearchParams(location.search).get("step"));if(Number.isInteger(fromQuery)&&fromQuery>=1&&fromQuery<=8)S.step=fromQuery;
render(true);
window.PandaGoHSK2Preview={getProgress:()=>JSON.parse(JSON.stringify(S)),goToStep:go};
})();
</script>
</body>
</html>
