  var w=g.words[state.card];
  main='<div class="kicker">Тема '+(state.stage+1)+' из 6 · слово '+(state.card+1)+' из 5</div><h2>'+safe(g.title)+'</h2><p class="lead">Учимся понимать слово, затем проверяем себя без подсказок.</p>'+
   '<section class="card"><div class="counter">Базовая лексика</div><div class="hanzi" lang="zh-Hans">'+safe(w[0])+'</div><div class="pinyin">'+(state.showPinyin?safe(w[1]):'Пиньинь скрыт')+'</div><div class="ru">'+safe(w[2])+'</div><div class="audio">'+(window.PandaHsk2AudioV330?.button(w[0],true)||'')+'</div></section>'+
   '<div class="row"><button class="btn" type="button" data-action="prev" '+(state.card===0?'disabled':'')+'>‹ Назад</button>'+
   '<button class="btn" type="button" data-action="pinyin">'+(state.showPinyin?'Скрыть':'Показать')+' пиньинь</button>'+
   '<button class="btn primary" type="button" data-action="next">'+(state.card===4?'К проверке ✓':'Дальше ›')+'</button></div>'+
   '<div class="bridge-tabs" role="tablist" aria-label="Объяснение и примеры">'+
    '<button type="button" role="tab" data-action="detail" data-tab="rule" aria-selected="'+(state.detailTab==='rule')+'">✏️ Правило</button>'+
    '<button type="button" role="tab" data-action="detail" data-tab="examples" aria-selected="'+(state.detailTab==='examples')+'">💬 Примеры</button></div>'+
   '<section class="bridge-detail" aria-label="'+(state.detailTab==='rule'?'Правило':'Примеры')+'">'+
   (state.detailTab==='rule'
     ?'<div class="rule-title">✏️ Как говорить правильно</div><p class="rule-copy">'+safe(WORD_RULES[w[0]]||g.hint)+'</p>'
     :examplesForWord(w[0],g).map(function(x){return '<div class="example"><span class="zh" lang="zh-Hans">'+safe(x[0])+'</span><span class="py">'+safe(x[1])+'</span><span class="ru">'+safe(x[2])+'</span>'+(window.PandaHsk2AudioV330?.button(x[0])||'')+'</div>'}).join(''))+
   '</section>'+
   '<p class="notice">🔊 Звук слова есть только при наличии записи именно этого слова. Для фраз используйте вкладку «Примеры».</p>';
  button.textContent='Проверить 5 слов';button.disabled=false;
 }else if(state.mode==='quiz'){
  var q=state.quizIndex,w2=g.words[q],opts=optionData(q);
  main='<div class="kicker">Проверка · тема '+(state.stage+1)+'</div><h2>'+safe(g.title)+'</h2>'+
   '<p class="lead">Выбери правильный перевод. Ошибка не засчитывается как изученное слово.</p>'+
   '<section class="quiz"><div class="count">Вопрос '+(q+1)+' из 5</div><div class="hanzi" lang="zh-Hans">'+safe(w2[0])+'</div><div class="answers">'+opts.map(function(o,i){return '<button type="button" data-action="answer" data-index="'+i+'">'+safe(o.text)+'</button>'}).join('')+'</div></section>'+
   '<div class="feedback '+feedbackType+'" role="status">'+safe(feedback)+'</div>';
  button.textContent='Вернуться к карточкам';button.disabled=false;
 }else{
  main='<section class="finish"><div class="icon">🐼✨</div><h2>Тема пройдена!</h2><p>Пять слов проверены. Результат сохранён только для этого переходного блока. Можно вернуться к карточкам или перейти к следующей теме.</p>'+
   '<button type="button" class="btn primary" data-action="nextstage">'+(state.stage===5?'Продолжить HSK 2 →':'Следующая тема →')+'</button></section>'+
   '<p class="notice">Пройдено тем: '+done+' из 6. Повторять можно сколько угодно раз.</p>';
  button.textContent=state.stage===5?'К курсу HSK 2':'Повторить карточки';button.disabled=false;
 }
 $('content').innerHTML=main;
 window.PandaHsk2AudioV330?.bind($('content'));
}
function goStage(i){state.stage=i;state.card=0;state.quizIndex=0;state.mode='study';state.detailTab='rule';feedback='';feedbackType='';save();draw();$('content').scrollTop=0}
function action(name,index,tab){
 if(name==='stage')return goStage(index);
 if(name==='detail'){state.detailTab=tab==='examples'?'examples':'rule';save();draw();return}
 if(name==='prev'){state.card=Math.max(0,state.card-1)}
 if(name==='next'){if(state.card===4){state.mode='quiz';state.quizIndex=0;feedback='';feedbackType=''}else state.card++}
 if(name==='pinyin'){state.showPinyin=!state.showPinyin}
 if(name==='nextstage'){if(state.stage===5){location.href='./hsk2-start.html#map';return}return goStage(state.stage+1)}
 if(name==='answer'){
  var opts=optionData(state.quizIndex);
  if(!opts[index])return;
  if(opts[index].correct){
   state.quizIndex++;
   feedback='';feedbackType='';
   if(state.quizIndex>=5){state.completed[state.stage]=true;state.mode='done'}
  }else{
   state.wrong++;feedback='Пока неверно. Посмотри внимательнее и попробуй ещё раз.';feedbackType='wrong';
  }
 }
 save();draw();
}
$('chips').addEventListener('click',function(e){var target=e.target.closest('button[data-action="stage"]');if(target)action('stage',Number(target.dataset.index))});
$('content').addEventListener('click',function(e){var target=e.target.closest('button[data-action]');if(target)action(target.dataset.action,Number(target.dataset.index),target.dataset.tab)});
$('main-action').addEventListener('click',function(){
 if(state.mode==='done'&&state.stage===5){location.href='./hsk2-start.html#map';return}
 if(state.mode==='study'){state.mode='quiz';state.quizIndex=0;feedback='';feedbackType=''}
 else{state.mode='study';state.card=0;feedback='';feedbackType=''}
 save();draw();$('content').scrollTop=0;
});
if(groups.length!==6||groups.some(function(g){return g.words.length!==5||g.examples.length!==2}))throw Error('Bridge data incomplete');
draw();
})();
</script>
</body></html>
