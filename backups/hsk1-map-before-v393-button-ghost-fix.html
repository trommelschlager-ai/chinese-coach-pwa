<style>
:root{color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;width:100%;height:100dvh;overflow:hidden;font-family:Arial,system-ui,sans-serif;background:linear-gradient(180deg,#a854c8 0%,#8b5bdd 18%,#5e73e8 46%,#2f72d8 74%,#1561c5 100%)}
body{display:grid;place-items:center;position:relative}
/* One approved bitmap only. On portrait Android, fill the complete viewport;
   hotspots stay in the SAME coordinate space as the bitmap. No cloned gutters. */
.artboard{position:relative;isolation:isolate;width:min(100vw,45.1768dvh);height:min(100dvh,221.3523vw);overflow:hidden;margin:auto;touch-action:manipulation;background:#6447ab;box-shadow:0 0 10px #26063750;z-index:1}
@media(orientation:portrait) and (min-aspect-ratio:37/100) and (max-aspect-ratio:69/100){
 html,body{width:100vw;max-width:100vw;height:100dvh;overflow:hidden}
 body{display:block}
 .artboard{width:100vw;height:100dvh;max-width:none;max-height:none;margin:0;box-shadow:none}
}
.approved{display:block;position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:0;user-select:none;-webkit-user-drag:none;pointer-events:none}
.hotspots{position:absolute;inset:0;z-index:2;pointer-events:none}
.hotspots a{pointer-events:auto;position:absolute;display:block;text-decoration:none;cursor:pointer;background:transparent;outline-offset:2px;-webkit-tap-highlight-color:transparent}
.hotspots a:focus-visible{outline:3px solid white;border-radius:22px;box-shadow:0 0 0 5px #ba2dcd}
/* The ribbon/button artwork stays inside the approved PNG. These transparent
   hit-areas only add a restrained shadow and a temporary light/tap overlay. */
.hotspots a{transition:filter 130ms ease,box-shadow 130ms ease;isolation:isolate}
/* v377: soft elevation, separately tuned to the approved button shapes. */
.top-link{
  box-shadow:0 7px 14px rgba(37,5,73,.36),0 2px 5px rgba(22,2,48,.22),inset 0 1px 2px rgba(255,255,255,.12);
}
.lesson{
  box-shadow:0 7px 13px rgba(37,5,73,.30),0 3px 6px rgba(22,2,48,.18),inset 0 1px 2px rgba(255,255,255,.09);
}
.footer-link{
  box-shadow:0 8px 16px rgba(27,5,65,.37),0 3px 6px rgba(15,4,40,.21),inset 0 1px 3px rgba(255,255,255,.11);
}
.hotspots a::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(145deg,rgba(255,255,255,.28),rgba(255,255,255,.06));
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.6),inset 0 3px 10px rgba(255,255,255,.12);
  opacity:0;transition:opacity 115ms ease;
}
.hotspots a:active::after,.hotspots a.is-pressed::after{opacity:1}
.hotspots a:active,.hotspots a.is-pressed{
  filter:brightness(1.08);
  box-shadow:0 2px 5px rgba(35,4,73,.22),inset 0 2px 7px rgba(48,10,80,.22);
}
.hotspots a.locked:active::after,.hotspots a.locked.is-pressed::after{
  background:rgba(255,208,91,.21);
  box-shadow:inset 0 0 0 2px rgba(255,224,100,.67);
}
@media(prefers-reduced-motion:reduce){.hotspots a,.hotspots a::after{transition:none}}

.lesson{left:var(--x);top:var(--y);width:var(--w);height:var(--h);border-radius:999px}
.lesson.locked{cursor:not-allowed}
.lesson .gate{position:absolute;right:var(--gate-right,8%);top:var(--gate-top,50%);transform:translateY(-50%);width:15%;aspect-ratio:1;border:2px solid #ffec7d;border-radius:50%;display:none;place-items:center;color:#134d29;background:linear-gradient(150deg,#f8ffca 0%,#74e587 36%,#24b65b 76%,#087b45 100%);font:700 clamp(14px,3.7vw,22px)/1 Arial,system-ui,sans-serif;text-shadow:0 1px 1px #fff9;box-shadow:0 6px 13px rgba(36,5,70,.38),0 2px 5px rgba(29,6,58,.25),inset 0 1px 5px #fff;z-index:3}
.lesson.done:not([data-num="1"]) .gate,.lesson.current:not([data-num="1"]) .gate{display:grid}
.lesson.current .gate{background:linear-gradient(145deg,#fffcc8 0%,#ffe481 42%,#e9ac29 100%);color:#6d4602}
.lesson[data-num="2"] .gate{--gate-right:8.5%;--gate-top:47%}
.lesson[data-num="3"] .gate{--gate-right:6.7%;--gate-top:47%}
.lesson[data-num="4"] .gate{--gate-right:8%;--gate-top:48%}
.lesson[data-num="5"] .gate{--gate-right:8%;--gate-top:48%}
.lesson[data-num="6"] .gate{--gate-right:7%;--gate-top:48%}
.lesson[data-num="7"] .gate{--gate-right:5.3%;--gate-top:48%}
.top-link{top:4.6%;height:6.9%;width:14%;border-radius:18px}
.top-link.back{left:1%}.top-link.write{right:1%}
.footer-link{top:83.6%;height:8.2%;border-radius:24px}
.footer-link.rhythm{left:1%;width:33%}.footer-link.trainer{left:34.1%;width:32%}.footer-link.ai{left:66.3%;width:32.7%}
.toast{position:absolute;z-index:10;left:7%;right:7%;top:21%;padding:11px 15px;text-align:center;color:white;border:2px solid #ffe189;border-radius:15px;background:#4b156ce9;font:700 clamp(11px,2.9vw,15px)/1.35 Arial,sans-serif;box-shadow:0 5px 18px #290c5588}
.toast[hidden]{display:none!important}
@media (max-height:650px){.toast{top:17%}}
</style>
</head>
<body>
<main class="artboard" aria-label="Panda Go — уроки HSK 1">
<img class="approved" src="./assets/hsk1-approved-v373.png" alt="Panda Go, начальный уровень HSK 1. Семь цветных уроков, панда в китайском костюме на фоне заката." width="694" height="1536" fetchpriority="high">
<nav class="hotspots" aria-label="Уроки HSK 1">
<a class="top-link back" href="./index.html#panda/home" aria-label="Назад к выбору уровня"></a>

<a class="lesson" data-num="6" style="--x:29.0%;--y:31.95%;--w:68%;--h:7.15%" href="./hsk1-lesson.html?lesson=6" aria-label="Урок 6. Моя семья"><span class="gate" aria-hidden="true"></span></a>

<a class="lesson" data-num="3" style="--x:36.0%;--y:53.38%;--w:61%;--h:7.1%" href="./hsk1-third-v212.html" aria-label="Урок 3. Числа"><span class="gate" aria-hidden="true"></span></a>
<a class="lesson" data-num="2" style="--x:36.5%;--y:60.53%;--w:62%;--h:7.05%" href="./hsk1-second-v203.html" aria-label="Урок 2. Местоимения"><span class="gate" aria-hidden="true"></span></a>
<a class="lesson" data-num="1" style="--x:35.3%;--y:67.7%;--w:63%;--h:7.1%" href="./hsk1-first-v189.html" aria-label="Урок 1. Знакомство"><span class="gate" aria-hidden="true"></span></a>

</nav>
<div class="toast" role="status" aria-live="polite" hidden></div>
</main>
<script>
(function(){
  'use strict';
  const KEY='pg-hsk1-path-v371', IDS=['foundations','pronouns','numbers','weekdays','dates','family','weather'];
  let completed=0;
  try{const v=Number(localStorage.getItem(KEY)||'0');if(Number.isInteger(v))completed=Math.min(7,Math.max(0,v))}catch{}
  // The existing course progress key is authoritative; no old progress is erased.
  const toast=document.querySelector('.toast');
  let timer=0;
  const lessons=Array.from(document.querySelectorAll('.lesson'));
  function paint(){
    const next=Math.min(7,completed+1);
    for(const a of lessons){
      const num=Number(a.dataset.num), locked=num>next,done=num<=completed;
      a.classList.toggle('locked',locked);
      a.classList.toggle('done',done);
      a.classList.toggle('current',!done&&!locked);
      a.setAttribute('aria-disabled',String(locked));
      a.querySelector('.gate').textContent=done?'✓':'▶';
      a.setAttribute('aria-label',a.getAttribute('aria-label').replace(/ · (?:закрыт|доступен|пройден)$/,'')+(locked?' · закрыт':done?' · пройден':' · доступен'));
      if(locked)a.setAttribute('title','Сначала пройди урок '+(num-1));else a.removeAttribute('title');
    }
  }
  function deny(num){
    toast.textContent='🔒 Сначала заверши урок '+(num-1)+', затем откроется урок '+num+'.';
    toast.hidden=false;
    clearTimeout(timer);timer=setTimeout(()=>toast.hidden=true,2600);
  }
  document.querySelector('.hotspots').addEventListener('click',e=>{
    const a=e.target.closest('a.lesson.locked');
    if(!a)return;
    e.preventDefault();e.stopPropagation();deny(Number(a.dataset.num));
  });
  document.querySelector('.hotspots').addEventListener('keydown',e=>{
    const a=e.target.closest('a.lesson.locked');
    if(a&&(e.key==='Enter'||e.key===' ')){e.preventDefault();deny(Number(a.dataset.num))}
  });
  function refresh(){try{const v=Number(localStorage.getItem(KEY)||'0');if(Number.isInteger(v))completed=Math.min(7,Math.max(0,v))}catch{}paint()}
  // Short, perceptible mobile touch response, including on locked lessons.
  // Delay same-tab navigation a fraction of a second so the pupil can SEE it.
  const links=Array.from(document.querySelectorAll('.hotspots a'));
  let navigating=false;
  for(const a of links){
    let release=0;
    function mark(){clearTimeout(release);a.classList.add('is-pressed')}
    function unmark(delay=155){clearTimeout(release);release=setTimeout(()=>a.classList.remove('is-pressed'),delay)}
    a.addEventListener('pointerdown',mark,{passive:true});
    a.addEventListener('pointerup',()=>unmark());
    a.addEventListener('pointercancel',()=>unmark(0));
    a.addEventListener('pointerleave',()=>unmark());
    a.addEventListener('blur',()=>unmark(0));
    a.addEventListener('click',e=>{
      if(a.classList.contains('locked')){
        // The existing lock handler above blocks navigation and shows a toast.
        mark();unmark(230);return;
      }
      if(e.defaultPrevented||e.button!==0||e.ctrlKey||e.metaKey||e.altKey||e.shiftKey||a.target==='_blank')return;
      e.preventDefault();
      if(navigating)return;
      navigating=true;
      mark();
      const destination=a.href;
      setTimeout(()=>{window.location.assign(destination)},165);
    });
  }
  window.addEventListener('pageshow',()=>{navigating=false;for(const a of links)a.classList.remove('is-pressed')});
  window.addEventListener('pageshow',refresh);
  window.addEventListener('focus',refresh);
  window.addEventListener('storage',refresh);
  paint();
})();
</script>
</body>
