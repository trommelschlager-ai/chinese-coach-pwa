var defaults={completed:[],coins:0,xp:0,view:'home',lesson:0,step:0,pick:null,build:[],showPy:true};
var s=load();
function load(){try{var v=JSON.parse(localStorage.getItem(STORAGE)||'null');if(v&&Array.isArray(v.completed))return Object.assign({},defaults,v,{view:'home',step:0,build:[],pick:null})}catch(e){}return Object.assign({},defaults)}
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(s))}catch(e){}}
function esc(x){return String(x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function canOpen(i){return i===0||s.completed.includes(i-1)}
function completeCount(){return L.filter(function(_,i){return s.completed.includes(i)}).length}
function audio(zh){return !!(window.PandaHsk2AudioV330&&window.PandaHsk2AudioV330.lookup(zh))}
function sound(zh){return audio(zh)?'<button class="audio-btn" type="button" data-play="'+esc(zh)+'" aria-label="Прослушать '+esc(zh)+'">🔊</button>':'<span class="audio-missing" title="Нет подтверждённой записи для этой фразы">🎧 нет MP3</span>'}
function text3(a){return '<div class="han" lang="zh-Hans">'+esc(a[0])+'</div>'+(s.showPy?'<div class="py">'+esc(a[1])+'</div>':'')+'<div class="ru">'+esc(a[2])+'</div>'}
function navigate(v){s.view=v;s.step=0;s.pick=null;s.build=[];save();render()}
function openLesson(i){if(!canOpen(i))return;s.lesson=i;s.view='lesson';s.step=0;s.pick=null;s.build=[];save();render()}
function headerStats(){document.getElementById('coins').textContent='🪙 '+s.coins;document.getElementById('xp').textContent='⚡ '+s.xp+' XP';document.getElementById('stars').textContent='⭐ '+completeCount()+'/10'}
function lTile(x,i){var done=s.completed.includes(i),locked=!canOpen(i);return '<button type="button" class="lesson-tile'+(done?' done':'')+(locked?' locked':'')+'" data-lesson="'+i+'"'+(locked?' aria-label="Урок '+(i+1)+' пока закрыт"':'')+'><span class="num">'+(done?'✅':locked?'🔒':x.icon)+'</span><span class="copy"><b>Урок '+(i+1)+' · '+esc(x.title)+'</b><small>'+esc(x.place)+' · '+esc(x.rule)+'</small></span><span class="state">'+(done?'↻':locked?'🔒':'▶')+'</span></button>'}
function renderHome(){return '<section class="screen"><div class="panel hero"><div class="hero-text"><div class="eyebrow" style="color:#ffe5ae">ИГРОВОЙ КУРС №2 · HSK 2+</div><h1>Мой город</h1><p>Привет! Я Маркс — 马克斯 (Mǎkèsī). Давай изучать китайский и открывать районы нашего города!</p></div><div class="boy"><img src="./assets/marks-city-avatar-v1.svg" alt="Герой Маркс"></div></div><div class="panel"><h2>🌸 Приключение начинается</h2><p class="text">Сначала выучи слова, затем правило, послушай диалог, ответь на вопрос и собери предложение. За пройденные уроки получай награды.</p><div class="intro-grid"><div class="intro-stat"><b>10</b>уроков</div><div class="intro-stat"><b>5</b>шагов</div><div class="intro-stat"><b>'+completeCount()+'/10</b>пройдено</div></div><div class="meter"><i style="width:'+(completeCount()*10)+'%"></i></div><button class="primary wide" data-action="continue">'+(completeCount()?'▶ Продолжить путешествие':'▶ Начать путешествие')+'</button></div><div class="panel soft"><h2>🏙️ Открой свой город</h2><p class="text">Квартира, работа, кафе, магазин, метро, парк и встречи. Каждое место связано с живой ситуацией.</p><button class="secondary wide" data-nav="city" style="margin-top:10px">Посмотреть карту →</button></div><p class="smallnote">Учебный игровой курс по мотивам уровня HSK 2: часть тематических слов выходит за рамки строгого экзаменационного списка. Прогресс хранится на этом устройстве.</p></section>'}
function renderCity(){return '<section class="screen"><div class="topline"><div><div class="eyebrow">Карта Маркса</div><h2>🏙️ Мой город</h2></div><span class="badge">⭐ '+completeCount()+' района</span></div><div class="map" role="group" aria-label="Карта тематических мест">'+L.map(function(x,i){return '<button type="button" class="spot'+(!canOpen(i)?' locked':'')+'" style="left:'+SITES[i][0]+'%;top:'+SITES[i][1]+'%" data-lesson="'+i+'" aria-label="'+esc(x.place)+' · Урок '+x.id+'"><span class="spoticon">'+(canOpen(i)?x.icon:'🔒')+'</span>'+x.id+'</button>'}).join('')+'<div class="map-label">Нажми на открытое место, чтобы начать урок</div></div><div class="panel"><h2>📍 Районы</h2><div class="lesson-list">'+L.map(lTile).join('')+'</div></div></section>'}
function renderLessons(){return '<section class="screen"><div class="panel"><div class="eyebrow">Panda Go · курс 2</div><h2>📖 Десять уроков</h2><p class="text">Новый район открывается после правильного выполнения предыдущего урока. К пройденным урокам можно возвращаться.</p><div class="meter"><i style="width:'+(completeCount()*10)+'%"></i></div><div class="lesson-list">'+L.map(lTile).join('')+'</div></div></section>'}
function renderMissions(){var n=completeCount();var ms=[['📗','Первый шаг',1,'Пройти первый урок'],['🤝','Знакомство с городом',3,'Пройти 3 урока'],['☕','Завсегдатай кафе',6,'Открыть кафе'],['🚇','Путешественник',8,'Открыть метро'],['🏆','Хозяин города',10,'Завершить все 10 уроков']];return '<section class="screen"><div class="panel"><h2>🏆 Миссии Маркса</h2><p class="text">Выполняй реальные учебные задачи, чтобы продвигаться по городу.</p>'+ms.map(function(m){return '<div class="mission"><span class="symbol">'+m[0]+'</span><div class="copy"><b>'+m[1]+'</b>'+m[3]+'</div><span class="status">'+(n>=m[2]?'✅':'🔒 '+m[2]+'/10')+'</span></div>'}).join('')+'</div><div class="panel soft"><h2>🎁 Награды</h2><p class="text">За каждый урок один раз начисляется 🪙 150 монет и ⚡ 50 XP. Повторение урока доступно без ограничений и не накручивает награды.</p></div></section>'}
function renderHero(){return '<section class="screen"><div class="panel"><div class="avatar"><span class="face"><img src="./assets/marks-city-avatar-v1.svg" alt="Мальчик Маркс"></span><div><span class="eyebrow">Главный герой</span><h2>Маркс</h2><div class="py">马克斯 · Mǎkèsī</div><span class="badge">Исследователь города</span></div></div><p class="text" style="margin-top:14px">Маркс — твой проводник по китайскому городу. Он будет знакомить тебя с героями, задавать вопросы и помогать тренировать язык.</p><div class="intro-grid"><div class="intro-stat"><b>'+s.coins+'</b>монет</div><div class="intro-stat"><b>'+s.xp+'</b>опыта</div><div class="intro-stat"><b>'+completeCount()+'</b>звёзд</div></div></div><div class="panel"><h2>💬 Знакомство</h2><div class="sentence">'+text3(['我叫马克斯。','Wǒ jiào Mǎkèsī.','Меня зовут Маркс.'])+'</div><p class="smallnote">Персонаж и игровые награды — часть этого курса. Это не платёжные единицы.</p></div></section>'}
function stepControls(locked){return '<div class="controls"><button class="ghost" type="button" data-action="prev">'+(s.step===0?'‹ К урокам':'‹ Назад')+'</button><button class="primary" type="button" data-action="next"'+(locked?' disabled':'')+'>'+(s.step>=4?'Завершить ✓':'Дальше ›')+'</button></div>'}
function renderLesson(){var x=L[s.lesson],i=s.lesson,step=s.step;var html='<section class="screen"><div class="panel"><div class="topline"><div><div class="eyebrow">Урок '+x.id+' из 10 · Маркс</div><div class="heading">'+x.icon+' '+esc(x.title)+'</div></div><span class="badge">'+(step+1)+'/5</span></div><div class="meter"><i style="width:'+((step+1)*20)+'%"></i></div>';
if(step===0){html+='<div class="lesson-scene"><strong>📍 '+esc(x.place)+'</strong><img src="./assets/hsk2-approved-panda-v357.svg" alt="Панда помогает Марксу"></div><h2>📖 Слова урока</h2><p class="text">Прослушай доступные записи и обрати внимание на тоны. Запоминай значение каждого слова.</p>'+x.words.map(function(w){return '<div class="word"><div class="who">'+text3(w)+'</div>'+sound(w[0])+'</div>'}).join('')}
if(step===1){html+='<h2>🎓 Грамматика</h2><div class="rule-box"><b>'+esc(x.rule)+'</b><p class="text">Посмотри, как слова объединяются в готовое предложение. Обрати внимание на порядок слов.</p></div><div class="sentence">'+text3(x.phrase)+sound(x.phrase[0])+'</div><div class="notice">Подсказка: сначала выучи смысл фразы, потом прочитай её вслух. Проверяй каждый тон по пиньиню.</div>'}
if(step===2){html+='<h2>💬 Диалог с Марксом</h2><p class="text">Прочитай диалог, затем попробуй повторить обе реплики.</p>'+x.dialog.map(function(d){return '<div class="dialogue"><span class="speaker">'+(d[0]==='Маркс'?'<img src="./assets/marks-city-avatar-v1.svg" alt="Маркс" width="35" height="35">':'👩🏻')+'</span><div class="bubble"><span class="eyebrow">'+esc(d[0])+'</span>'+text3([d[1],d[2],d[3]])+sound(d[1])+'</div></div>'}).join('')+'<p class="smallnote">Если нет точной MP3-записи, аудио не подменяется другим голосом.</p>'}
if(step===3){html+='<h2>🎯 Выбери перевод</h2><p class="text">Как правильно перевести предложение?</p><div class="sentence">'+text3([x.phrase[0],x.phrase[1],''])+sound(x.phrase[0])+'</div><div class="choices">'+[0,1,2].map(function(j){var n=(j+x.id)%3,o=x.options[n];return '<button type="button" data-pick="'+n+'" class="choice'+(s.pick===n?(n===x.answer?' correct':' wrong'):'')+'">'+esc(o)+'</button>'}).join('')+'</div>'+(s.pick!==null?'<p class="feedback'+(s.pick===x.answer?' good':'')+'">'+(s.pick===x.answer?'✓ Верно! Можно продолжать.':'✕ Неверно. Попробуй ещё раз.')+'</p>':'')}
if(step===4){var built=s.build.map(function(k){return x.tokens[k]}),correct=built.length===x.solution.length&&built.every(function(t,j){return t===x.solution[j]});html+='<h2>🧩 Собери предложение</h2><p class="target">Собери: «'+esc(x.phrase[2])+'»</p><div class="tiles" aria-label="Собранное предложение">'+(s.build.length?s.build.map(function(k,n){return '<button class="tile" type="button" data-remove="'+n+'" title="Убрать слово">'+esc(x.tokens[k])+'</button>'}).join(''):'<span class="small">Нажимай на слова ниже по порядку</span>')+'</div><div class="tiles" style="margin-top:10px">'+x.tokens.map(function(t,k){return '<button class="tile'+(s.build.includes(k)?' used':'')+'" type="button" data-tile="'+k+'"'+(s.build.includes(k)?' disabled':'')+'>'+esc(t)+'</button>'}).join('')+'</div><p class="feedback'+(correct?' good':'')+'">'+(correct?'✓ Предложение собрано правильно!':built.length===x.solution.length?'✕ Порядок слов неверный. Убери слова и попробуй ещё раз.':'Порядок слов в китайском важен.')+'</p>'}
html+='<button type="button" class="ghost" data-action="pinyin" style="margin-top:9px;width:100%">'+(s.showPy?'汉 Скрыть пиньинь':'汉 Показать пиньинь')+'</button></div>'+stepControls(step===3?s.pick!==x.answer:step===4?!correct:false)+'</section>';return html}
function renderDone(){var x=L[s.lesson];return '<section class="screen"><div class="panel"><div class="done-art">🏆</div><h2 style="text-align:center">Урок пройден!</h2><p class="text" style="text-align:center">Маркс благодарит тебя. Теперь следующий район города открыт.</p><div class="reward">⭐ +1 · 🪙 +150 · ⚡ +50 XP</div><div class="sentence">'+text3(x.phrase)+'</div><div class="buttons" style="margin-top:12px"><button class="ghost" data-action="again">↻ Повторить</button><button class="primary" data-action="forward">Дальше →</button></div></div></section>'}
function render(){headerStats();document.querySelectorAll('[data-nav]').forEach(function(b){if(b.closest('.bottom'))b.classList.toggle('active',b.dataset.nav===s.view)});var h=s.view==='home'?renderHome():s.view==='city'?renderCity():s.view==='lessons'?renderLessons():s.view==='missions'?renderMissions():s.view==='hero'?renderHero():s.view==='done'?renderDone():renderLesson();document.getElementById('main').innerHTML=h;document.getElementById('main').scrollTop=0}
function award(){var i=s.lesson;if(!s.completed.includes(i)){s.completed.push(i);s.coins+=150;s.xp+=50}save()}
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var action=b.dataset.action;
if(b.dataset.nav){navigate(b.dataset.nav);return}
if(b.hasAttribute('data-lesson')){openLesson(Number(b.dataset.lesson));return}
if(b.hasAttribute('data-play')){window.PandaHsk2AudioV330&&window.PandaHsk2AudioV330.play(b.dataset.play,function(msg){if(msg&&msg.indexOf('не ')>=0)console.warn(msg)});return}
if(b.hasAttribute('data-pick')){s.pick=Number(b.dataset.pick);save();render();return}
if(b.hasAttribute('data-tile')){var n=Number(b.dataset.tile);if(!s.build.includes(n)){s.build.push(n);save();render()}return}
if(b.hasAttribute('data-remove')){s.build.splice(Number(b.dataset.remove),1);save();render();return}
if(action==='pinyin'){s.showPy=!s.showPy;save();render();return}
if(action==='continue'){var next=L.findIndex(function(_,i){return !s.completed.includes(i)});openLesson(next<0?9:next);return}
if(action==='prev'){if(s.step===0)navigate('lessons');else{s.step--;save();render()}return}
if(action==='next'){var x=L[s.lesson];if(s.step===3&&s.pick!==x.answer)return;if(s.step===4){var built=s.build.map(function(k){return x.tokens[k]});if(built.length!==x.solution.length||!built.every(function(t,j){return t===x.solution[j]}))return;award();s.view='done'}else{s.step++;s.pick=null;s.build=[]}save();render();return}
if(action==='again'){openLesson(s.lesson);return}
if(action==='forward'){var j=s.lesson+1;if(j<L.length)openLesson(j);else navigate('city');return}
});
if(L.length!==10||L.some(function(x){return x.words.length!==3||x.tokens.length!==x.solution.length||x.answer<0||x.answer>=x.options.length}))throw Error('Неполные данные курса 2');
render();
})();
</script>
