name: HSK2 learner regression

on:
  push:
    branches: [main]
    paths:
      - 'hsk2-*.html'
      - 'hsk1-hsk2-bridge.html'
      - 'assets/hsk2-*.js'
      - 'assets/panda-brain-v341.js'
      - 'scripts/verify-hsk2-learner-v344.cjs'
      - 'scripts/verify-hsk2-intro-v349.cjs'
      - 'scripts/verify-hsk2-city-work.cjs'
      - 'tests/hsk2-city-marks.test.cjs'
      - 'tests/hsk2-bastian-intro.test.cjs'
      - 'tests/hsk2-bastian-voice-five-v397.test.cjs'
      - 'assets/bastian-voice-five-v397.js'
      - 'assets/bastian-voice-five-v397.css'
      - 'tests/hsk2-three-screens-v6.test.cjs'
      - 'hsk2-life-course.html'
      - 'assets/hsk2-life-course-data-v1.js'
      - 'assets/hsk2-life-course-app-v1.js'
      - 'assets/hsk2-life-course-v1.css'
      - 'tests/hsk2-life-course-v1.test.cjs'
      - 'tests/hsk2-entry-lilac-v444.test.cjs'
      - 'tests/hsk2-day-upgrades-v441.test.cjs'
      - 'assets/hsk2-day-first-data-v1.js'
      - 'assets/hsk2-day-first-ui-v1.js'
      - 'assets/hsk2-day-first-v1.css'
      - 'tests/hsk2-day-first-speech-v1.test.cjs'
      - 'assets/hsk2-life-approved-welcome-v2.css'
      - 'assets/hsk2-life-landing-approved-v1/**'
      - 'tests/hsk2-life-approved-welcome-v2.test.cjs'
      - 'assets/bastian-three-screens-v6.css'
      - 'assets/hsk2-one-screen-map-v6.css'
      - 'tests/hsk2-bastian-exact-v5.test.cjs'
      - 'assets/bastian-exact-reference-v5.css'
      - 'assets/bastian-approved-reference-v5.jpg'
      - 'tests/hsk2-bastian-visual-contract-v4.test.cjs'
      - 'assets/bastian-approved-layout-v4.css'
      - 'assets/bastian-night-city-v4.svg'
      - 'assets/bastian-approved-v1.avif'
      - 'assets/marks-city-avatar-v1.svg'
      - 'scripts/verify-hsk2-welcome-v348.cjs'
      - '.github/workflows/hsk2-learner-v344.yml'
      - 'sw.js'
  pull_request:
    branches: [main]
    paths:
      - 'tests/hsk2-entry-lilac-v444.test.cjs'
      - 'hsk2-life-course.html'
      - 'assets/hsk2-life-course-*.js'
      - 'assets/hsk2-day-first-ui-v1.js'
      - 'tests/hsk2-life-course-v1.test.cjs'
      - 'tests/hsk2-day-first-speech-v1.test.cjs'
      - 'scripts/qa-hsk2-life-audio-v407.cjs'
      - '.github/workflows/hsk2-learner-v344.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  life-course-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check audio text coverage
        run: node scripts/qa-hsk2-life-audio-v407.cjs
      - name: Check complete 30-mini-lesson navigation and reload
        run: node tests/hsk2-life-course-v1.test.cjs
      - name: Verify HSK2 start entry and lilac visuals
        run: node tests/hsk2-entry-lilac-v444.test.cjs
      - name: Check My Day timeline and guided dialogue v442
        run: node tests/hsk2-day-upgrades-v441.test.cjs
      - name: Check microphone consent and five genuine attempts
        run: node tests/hsk2-day-first-speech-v1.test.cjs
      - name: Check Mandarin guided Panda answers
        run: node --test tests/panda-hsk2-day-chat-v1.test.mjs
  learner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Verify exact HSK2 audio coverage without fabricated clips
        run: node scripts/qa-hsk2-life-audio-v407.cjs
      - name: Verify first-launch HSK2 course plan
        run: node scripts/verify-hsk2-welcome-v348.cjs
      - name: Verify new lesson 1 interactive flow
        run: node scripts/verify-hsk2-intro-v349.cjs
      - name: Verify My City work lesson
        run: node scripts/verify-hsk2-city-work.cjs
      - name: Verify approved Bastian night-city layout
        run: node tests/hsk2-bastian-visual-contract-v4.test.cjs
      - name: Verify exact Bastian reference and interactive hotspots
        run: node tests/hsk2-bastian-exact-v5.test.cjs
      - name: Verify exact approved seven-part welcome poster
        run: node tests/hsk2-life-approved-welcome-v2.test.cjs
      - name: Verify first lesson five-time voice practice
        run: node tests/hsk2-day-first-speech-v1.test.cjs
      - name: Verify complete ten-theme life course
        run: node tests/hsk2-life-course-v1.test.cjs
      - name: Verify three compact Android screens
        run: node tests/hsk2-three-screens-v6.test.cjs
      - name: Verify Bastian stage-two 50-attempt speech practice
        run: node tests/hsk2-bastian-voice-five-v397.test.cjs
      - name: Verify approved Bastian introduction
        run: node tests/hsk2-bastian-intro.test.cjs
      - name: Verify archived city prototype
        run: node tests/hsk2-city-marks.test.cjs
      - name: Verify HSK2 learner path
        run: node scripts/verify-hsk2-learner-v344.cjs
      - name: Verify Panda Brain responses
        run: node tests/panda-brain-v341.test.cjs
