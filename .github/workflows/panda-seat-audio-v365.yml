name: Panda seat and audio v365
on:
  push:
    branches: [fix/panda-seat-audio-20261115]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check:panda-screen
      - run: node scripts/audit-panda-clips-v365.mjs
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/panda-server.log 2>&1 &
          node scripts/qa-panda-audio-v365.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panda-seat-audio-v365
          path: qa/panda-v365/
