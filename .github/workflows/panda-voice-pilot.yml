name: Panda Android voice pilot QA
on:
  push:
    branches:
      - main
      - fix/panda-v323-family-conversation-live
      - feat/panda-voice-android-pilot-2026-11-11
      - feat/panda-voice-minimal-2026-11-11
      - feat/panda-lesson1-avatar-dialogue-2026-11-11
      - fix/panda-real-voice-mic-avatar-2026-11-11
      - feat/panda-exact-mascot-animated-2026-11-11
    paths:
      - 'panda-voice-pilot.html'
      - 'assets/panda-voice-v411.mjs'
      - 'assets/panda-voice-clips-v411/**'
      - 'tests/panda-voice-v411-assets.test.mjs'
      - 'assets/panda-live-*'
      - 'assets/panda-mic-help-*'
      - 'tests/panda-mic-visible-*'
      - 'tests/panda-hello-followup-*'
      - 'tests/panda-wellbeing-followup-*'
      - 'tests/panda-text-only-audio-*'
      - 'tests/panda-calendar-*'
      - 'assets/panda-hsk1-*'
      - 'assets/panda-brain-*'
      - 'assets/panda-hsk2-*'
      - 'tests/panda-hsk2-day-chat-v1.test.mjs'
      - 'assets/panda-nonstop-*'
      - 'tests/panda-nonstop-*'
      - 'assets/panda-family-turn-*'
      - 'tests/panda-family-turn-*'
      - 'assets/panda-conversation-memory-*'
      - 'tests/panda-conversation-memory-*'
      - 'assets/panda-topic-memory-*'
      - 'tests/panda-topic-memory-*'
      - 'sw.js'
      - 'tests/panda-live-*'
      - 'scripts/verify-panda-hsk2-bridge-v304.cjs'
      - 'scripts/verify-panda-sentence-coach-v319.cjs'
      - 'assets/panda-voice-pilot*'
      - 'tests/panda-voice-pilot.test.mjs'
      - 'tests/panda-live-lesson2.test.mjs'
      - 'tests/panda-live-batch.test.mjs'
      - 'scripts/qa-panda-voice-pilot-mobile.mjs'
      - 'scripts/qa-hsk2-day-panda-mobile-v1.mjs'
      - '.github/workflows/panda-voice-pilot.yml'
  pull_request:
    branches: [main]
    paths:
      - 'panda-voice-pilot.html'
      - 'assets/panda-voice-v411.mjs'
      - 'assets/panda-voice-clips-v411/**'
      - 'tests/panda-voice-v411-assets.test.mjs'
      - 'assets/panda-voice-pilot*'
      - 'assets/panda-live-*'
      - 'assets/panda-mic-help-*'
      - 'tests/panda-mic-visible-*'
      - 'tests/panda-hello-followup-*'
      - 'tests/panda-wellbeing-followup-*'
      - 'tests/panda-text-only-audio-*'
      - 'tests/panda-calendar-*'
      - 'assets/panda-hsk1-*'
      - 'assets/panda-brain-*'
      - 'assets/panda-hsk2-*'
      - 'assets/panda-nonstop-*'
      - 'tests/panda-nonstop-*'
      - 'assets/panda-family-turn-*'
      - 'tests/panda-family-turn-*'
      - 'assets/panda-conversation-memory-*'
      - 'tests/panda-conversation-memory-*'
      - 'assets/panda-topic-memory-*'
      - 'tests/panda-topic-memory-*'
      - 'sw.js'
      - 'tests/panda-live-*'
      - 'scripts/verify-panda-hsk2-bridge-v304.cjs'
      - 'scripts/verify-panda-sentence-coach-v319.cjs'
      - 'tests/panda-voice-pilot.test.mjs'
      - 'tests/panda-live-lesson2.test.mjs'
      - 'tests/panda-live-batch.test.mjs'
      - 'scripts/qa-panda-voice-pilot-mobile.mjs'
      - 'scripts/qa-hsk2-day-panda-mobile-v1.mjs'
permissions:
  contents: read
jobs:
  mobile-pilot:
    runs-on: ubuntu-24.04 # Playwright 1.56.1 Chromium is unsupported on ubuntu-26.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test pilot response checks and mock microphone
        run: npm run check:panda-screen
      - name: Android profession speech alternative regression v563
        run: node --test tests/panda-android-speech-v563.test.mjs tests/panda-routine-questions-v563.test.mjs tests/panda-conversation-coverage-v563.test.mjs
      - name: Verify Panda AI My Day lesson-linked dialogue
        run: node tests/panda-hsk2-day-chat-v1.test.mjs
      - name: Validate Panda HSK2 preview bridge
        run: node scripts/verify-panda-hsk2-bridge-v304.cjs
      - name: Validate contextual Panda sentence coach
        run: node scripts/verify-panda-sentence-coach-v319.cjs
      - name: Install mobile Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify responsive Android voice interaction
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/panda-voice-pilot.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/panda-voice-pilot.html >/dev/null; then break; fi
            sleep 1
          done
          node scripts/qa-panda-voice-pilot-mobile.mjs
          node scripts/qa-hsk2-day-panda-mobile-v1.mjs
      - name: Save Android viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panda-voice-android-pilot-screenshots
          path: qa/panda-voice-pilot/
          if-no-files-found: warn

  hsk2-day-answer-regression:
    name: HSK2 My Day answer rules
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Node test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify HSK2 My Day accepted and rejected responses
        run: node tests/panda-hsk2-day-chat-v1.test.mjs
      - name: Check screenshot regression phrases, pinyin, translations and social responses
        run: node --test tests/panda-hsk2-basic-context-v1.test.mjs
      - name: Verify HSK1 weather and HSK2 My Day Q&A routing and exact MP3
        run: node --test tests/panda-live-recorded-qa-v358.test.mjs

  calendar-answer-pinyin-regression:
    name: HSK1 calendar pinyin exactness
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser-fixture dependencies for the calendar conversation test
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify tone-marked pinyin matches only the learner's written answer
        run: node --test tests/panda-calendar-pinyin-v382.test.mjs
      - name: Verify standalone calendar free-chat and the removed redundant message bubble
        run: node --test tests/panda-calendar-chat-v383.test.mjs
      - name: Verify responsive calendar replies, correct follow-up questions and audio honesty
        run: node --test tests/panda-calendar-reaction-v401.test.mjs

  approved-mic-recovery:
    name: Approved mobile microphone recovery and exact audio
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify microphone lifecycle, fallback and approved audio index
        run: node --test tests/panda-mic-visible-v407.test.mjs tests/panda-live-mic-recovery-v318.test.mjs tests/panda-live-first-tap-v367.test.mjs tests/panda-live-audio-v365.test.mjs
      - name: Install mobile Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify visible recovery controls on Android-sized Chrome
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/panda-voice-recovery.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/panda-voice-pilot.html >/dev/null; then break; fi
            sleep 1
          done
          node scripts/qa-panda-voice-pilot-mobile.mjs
      - name: Save mock Android recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panda-visible-mic-recovery-qa
          path: qa/panda-voice-pilot/
          if-no-files-found: warn

  greeting-reciprocity:
    name: Non-Stop greeting and microphone follow-up
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install UI simulation dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify 你好 speech goes to approved 你好吗 recording, not 你呢
        run: node --test tests/panda-hello-followup-v408.test.mjs tests/panda-wellbeing-followup-v409.test.mjs


  text-only-audio-regression:
    name: Exact recorded voice versus text-only dialogue
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify sound safety and preservation of working Non-Stop greetings
        run: node --test tests/panda-text-only-audio-v410.test.mjs

  voice-v411-integrity:
    name: Original 10 Mandarin MP3 exact phrase validation
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate user MP3 SHA-256 and exact Panda voice mapping
        run: node --test tests/panda-voice-v411-assets.test.mjs

  nonstop-topic-continuity-v425:
    name: Voiced Non-Stop family and availability transitions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prevent repeated and off-topic voice questions on Android-sized Non-Stop
        run: node --test tests/panda-nonstop-continuity-v425.test.mjs

  family-third-turn-v426:
    name: Third-turn family answers stay natural and voiced
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install regression dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check sibling answer acknowledgment and next family question
        run: node --test tests/panda-family-turn-v426.test.mjs

  panda-brain-memory-v430:
    name: Reviewed conversation memory and Android-size speech continuity
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify memory, sibling age, no-repeat, exact approved MP3 and mobile chat
        run: node --test tests/panda-conversation-memory-v430.test.mjs

  panda-brain-topic-memory-v431:
    name: Topic memory, exact voices and Android-like Non-Stop continuity
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install current regression test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check 13 introduction, time and weather memory scenarios
        run: node --test tests/panda-topic-memory-v431.test.mjs
