name: Panda profession conversation diagnostic audit
on:
  push:
    branches: [audit/panda-professions-v1-20261125]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profession-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/audit-panda-professions-v1.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panda-professions-audit
          path: panda-professions-audit.json
