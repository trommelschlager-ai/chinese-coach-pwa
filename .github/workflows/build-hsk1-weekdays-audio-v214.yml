name: HSK1 weekday cleaned voice pack
on:
  push:
    paths:
      - scripts/build-hsk1-weekdays-audio-v214.py
      - .github/workflows/build-hsk1-weekdays-audio-v214.yml
permissions:
  contents: write
jobs:
  build-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: FFmpeg
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
      - name: Prepare authentic same-speaker Mandarin samples
        run: python3 scripts/build-hsk1-weekdays-audio-v214.py
      - name: Publish cleaned files without overwriting concurrent lesson commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hsk1-weekdays-clean-v214/ assets/hsk1-weekdays-audio-map-v214.js
          if ! git diff --cached --quiet; then
            git commit -m "HSK1 lesson 4 cleaned weekday audio pack"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
