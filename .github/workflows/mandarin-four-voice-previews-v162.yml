name: Four slower Mandarin female voice previews (not production)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  four-voice-previews:
    if: ${{ github.event.pull_request.head.ref == 'test/mandarin-voice-4-choices-20261106' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Determine if preview audio exists
        id: existing
        run: |
          if test -f assets/mandarin-choice-samples-v162/manifest.json; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install preview-only Chinese speech client and audio tools
        if: steps.existing.outputs.present == 'false'
        run: |
          python -m pip install --upgrade pip
          python -m pip install "edge-tts>=7.0,<8.0" "pydub>=0.25"
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Generate 4 Mandarin voices at relaxed learning speed
        if: steps.existing.outputs.present == 'false'
        run: python scripts/preview-four-native-mandarin-voices-v162.py
      - name: Keep samples on this review branch only
        if: steps.existing.outputs.present == 'false'
        run: |
          git config user.name "Panda Go Preview Audio QA"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/mandarin-choice-samples-v162/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audio(preview): four separate Chinese female voices at -18 percent rate"
          git push origin "HEAD:refs/heads/${{ github.head_ref }}"
      - name: Share samples as a single downloadable ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Panda-Go-4-Slow-Mandarin-Voice-Choices
          path: assets/mandarin-choice-samples-v162/
          if-no-files-found: warn
          retention-days: 7
