name: Chinese course QA
on:
  push:
    branches: [main, fix/chinese-course-quality-2026-10-28]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/verify-hsk1-fifth-v227.cjs
      - run: npm run check
      - run: npm run check:release
      - run: node scripts/verify-quality.cjs
      - run: node scripts/verify-offline.cjs
      - run: node scripts/verify-hanzi.cjs
      - run: node scripts/verify-launch.cjs
