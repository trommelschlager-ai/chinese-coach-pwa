name: Chinese course QA
on:
  push:
    branches: [main, fix/chinese-course-quality-2026-10-28]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:pronunciation
      - run: node scripts/verify-hsk1-fifth-v227.cjs
      - run: node scripts/verify-panda-go-approved-v231.cjs
      - run: node scripts/verify-hsk1-lesson2-xiaoxiao-v261.cjs
      - run: node scripts/verify-hsk1-lesson3-xiaoxiao-v263.cjs
      - run: node scripts/verify-hsk1-lesson4-xiaoxiao-v265.cjs
      - run: node scripts/verify-hsk1-lesson5-xiaoxiao-v272.cjs
      - run: node scripts/verify-lesson6-grandparents-v275.cjs
      - run: node scripts/verify-lesson6-photos-v276.cjs
      - run: node scripts/verify-lesson6-words-v280.cjs
      - run: node scripts/verify-lesson4-visual-v269.cjs
      - run: node scripts/verify-panda-lesson4-voice-labels-v282.cjs
      - run: node scripts/verify-panda-go-audio-v236.cjs
      - run: node scripts/verify-panda-mobile-repairs-v290.cjs
      - run: node scripts/verify-lesson7-opening-male-v291.cjs
      - run: node scripts/verify-panda-native-real-v246.cjs
      - run: node scripts/verify-panda-audio-v244.cjs
      - run: node scripts/verify-lesson-viewport-v237.cjs
      - run: node scripts/verify-mic-retention-v237.cjs
      - run: npm run check
      - run: npm run check:release
      - run: node scripts/verify-quality.cjs
      - run: node scripts/verify-offline.cjs
      - run: node scripts/verify-hanzi.cjs
      - run: node scripts/verify-hanzi-writing-v283.cjs
      - run: node scripts/verify-hanzi-writing-interactions-v283.cjs
      - run: node scripts/verify-hsk1-diagnostic-v287.cjs
      - run: node scripts/verify-launch.cjs
