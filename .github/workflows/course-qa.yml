      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node scripts/verify-panda-hsk1-variants-v301.cjs
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node scripts/verify-panda-brain-v302.cjs
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node scripts/verify-panda-hsk2-seed-v303.cjs
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node scripts/verify-panda-hsk2-bridge-v304.cjs
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node scripts/verify-panda-sentence-coach-v319.cjs
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node --test tests/panda-basic-conversation-v323.test.mjs
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node --test tests/panda-ask-catalog-v326.test.mjs
