name: Chinese course QA
on:
  push:
    branches: [main, fix/chinese-course-quality-2026-10-28, fix/panda-v323-family-conversation-live]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - id: dependencies
        run: npm ci
      - name: Check offline coverage of current HSK1, Panda AI and HSK2 screens
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node --test tests/offline-active-assets-v434.test.mjs
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run check:pronunciation
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node scripts/verify-hsk1-fifth-v227.cjs
      - name: Fetch preserved HSK1 baseline for control-protection checks
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: git fetch --depth=1 origin 404e142c20aab37a6c8a24d60b60aa57028f8043
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node scripts/verify-hsk1-final-unification-v421.cjs
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node scripts/verify-hsk1-fourth-v216.cjs
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node scripts/verify-weather-one-voice-v239.cjs
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node scripts/verify-panda-go-approved-v231.cjs
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node scripts/verify-hsk1-lesson2-xiaoxiao-v261.cjs
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node scripts/verify-hsk1-lesson3-xiaoxiao-v263.cjs
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node scripts/verify-hsk1-lesson4-xiaoxiao-v265.cjs
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node scripts/verify-hsk1-lesson5-xiaoxiao-v272.cjs
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node scripts/verify-lesson6-grandparents-v275.cjs
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node scripts/verify-lesson6-photos-v276.cjs
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node scripts/verify-lesson6-words-v280.cjs
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node scripts/verify-lesson4-visual-v269.cjs
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node scripts/verify-panda-lesson4-voice-labels-v282.cjs
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node scripts/verify-panda-go-audio-v236.cjs
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node scripts/verify-mic-raw-v292.cjs
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node scripts/verify-panda-mobile-repairs-v290.cjs
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node scripts/verify-lesson7-opening-male-v291.cjs
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node scripts/verify-hsk1-full-restart-v291.cjs
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node scripts/verify-hsk1-exercise-replay-v293.cjs
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
