name: Verify Panda Go lesson 6 v234 (legacy manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Confirm complete content, dialogues and audio mapping
        run: node scripts/verify-lessons-preserved-v233.cjs
      - name: Check family and weather lesson UI
        run: node scripts/verify-panda-go-approved-v231.cjs
      - name: Check offline pack
        run: node scripts/verify-offline.cjs
