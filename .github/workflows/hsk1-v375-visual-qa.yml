name: Panda Go HSK1 v375 Android visual regression
on:
  push:
    branches:
      - review/hsk1-v375-safe-mobile-layers-2026-11-16
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install browser, assertions and image decoder
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright@1.56.1 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Compare actual rendered mobile pixels to approved artwork and test progress
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/pandago-v375-server.log 2>&1 &
          for i in $(seq 1 40); do if curl -fsS http://127.0.0.1:4173/hsk1-map.html >/dev/null; then break; fi; sleep 1; done
          node scripts/verify-hsk1-v373.mjs
          node scripts/verify-hsk1-v375.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panda-go-hsk1-v375-android-visual-regression
          path: qa/hsk1-v375/
          if-no-files-found: warn
