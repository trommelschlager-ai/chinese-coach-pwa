name: Panda Go HSK1 v373 pre-publication checks
on:
  push:
    branches:
      - review/hsk1-v373-exact-art-2026-11-16
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Chromium and test runner
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check live routes, mobile layout, lesson locking and preserve approved image
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/panda-hsk1-v373-server.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4173/hsk1-map.html > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/assets/hsk1-approved-v373.png > /dev/null
          node scripts/verify-hsk1-v373.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panda-go-hsk1-v373-mobile-screenshots
          path: qa/hsk1-v373/
          if-no-files-found: warn
