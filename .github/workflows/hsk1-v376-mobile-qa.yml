name: Panda Go HSK1 v376 press and mobile QA
on:
  push:
    branches:
      - review/hsk1-v376-touch-feedback-2026-11-16
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install test browser
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check artwork, scroll, 7 lessons and button feedback
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/v376-server.log 2>&1 &
          for i in $(seq 1 40); do if curl -fsS http://127.0.0.1:4173/hsk1-map.html >/dev/null; then break; fi; sleep 1; done
          node scripts/verify-hsk1-v373.mjs
          node scripts/verify-hsk1-v376.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panda-go-v376-mobile-screenshots
          path: qa/hsk1-v376/
          if-no-files-found: warn
