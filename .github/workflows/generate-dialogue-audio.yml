name: Improve Mandarin dialogue timbre
on:
  push:
    paths:
      - ".github/workflows/generate-dialogue-audio.yml"
      - "scripts/mature_dialogue_audio.py"
  workflow_dispatch:
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  generate:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[generate-dialogue-audio]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out current branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audio validation utility (ffprobe)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffprobe
      - name: Improve and validate existing dialogue recordings
        run: python scripts/mature_dialogue_audio.py
      - name: Commit all validated outputs together
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dialogue-voices assets/dialogue-voices-map.js assets/offline-pack.json sw.js
          if git diff --cached --quiet; then
            echo "All MP3 files already up to date"
          else
            git commit -m "Apply warmer mature timbre to 25 Mandarin dialogue recordings"
            git push
          fi
