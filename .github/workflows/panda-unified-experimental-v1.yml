name: Panda unified experimental free chat
on:
  pull_request:
    paths:
      - 'assets/panda-unified-**'
      - 'assets/panda-hsk2-preview-core-v1.mjs'
      - 'assets/panda-natural-statements-v552.mjs'
      - 'tests/panda-unified-**'
      - 'tests/panda-living-conversation-v1.test.mjs'
      - 'scripts/qa-panda-unified-experimental-v1.mjs'
      - '.github/workflows/panda-unified-experimental-v1.yml'
permissions:
  contents: read
jobs:
  isolated-pilot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --test tests/panda-unified-*.test.mjs tests/panda-living-conversation-v1.test.mjs
      - run: node --test scripts/verify-panda-voice-20261127.mjs tests/panda-ai-xiaoxiao-voice-boundary-v1.test.mjs tests/offline-active-assets-v434.test.mjs
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: |
          npm run dev -- --port 4173 > /tmp/panda-static.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/panda-voice-pilot.html >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4173/panda-voice-pilot.html >/dev/null || { cat /tmp/panda-static.log; exit 1; }
          node scripts/qa-panda-unified-experimental-v1.mjs
