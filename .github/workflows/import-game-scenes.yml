name: Import illustrated game scenery
on:
  push:
    paths:
      - '.github/workflows/import-game-scenes.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-scenery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and optimize licensed fantasy illustrations
        run: |
          python -m pip install --quiet requests Pillow
          python - <<'PY'
          import io,requests
          from PIL import Image,ImageOps
          scenes={
            'build':'https://cdn.pixabay.com/photo/2023/07/11/06/24/ai-generated-8119677_1280.jpg',
            'choose':'https://cdn.pixabay.com/photo/2024/02/09/14/46/ai-generated-8563197_1280.png'
          }
          for name,url in scenes.items():
              resp=requests.get(url,timeout=60,headers={'User-Agent':'Mozilla/5.0 (compatible; ChineseCoach/1.0)'})
              print(name,'http',resp.status_code, 'bytes',len(resp.content))
              resp.raise_for_status()
              image=Image.open(io.BytesIO(resp.content)).convert('RGB')
              print('illustration dimensions:',image.size)
              assert image.width >= 530 and image.height >= 850
              image=ImageOps.fit(image,(1080,1920),Image.Resampling.LANCZOS,centering=(.5,.45))
              image.save(f'assets/game-scene-{name}-v94.webp','WEBP',quality=89,method=6)
          PY
      - name: Commit locally hosted illustrations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/game-scene-build-v94.webp assets/game-scene-choose-v94.webp
          git commit -m "art(game): save cherry blossom and pavilion portraits [scene v94]"
          git push
