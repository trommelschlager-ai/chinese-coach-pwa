name: Import licensed high-resolution game scenery
on:
  push:
    paths:
      - '.github/workflows/import-game-scenes.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-scenery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download two full-resolution backgrounds
        run: |
          python -m pip install --quiet requests Pillow
          python - <<'PY'
          import io,requests
          from PIL import Image,ImageOps
          sources={
             'build':'https://images.unsplash.com/photo-1768837383080-4cc790c57ff7',
             'choose':'https://images.unsplash.com/photo-1554190354-aff7005e20ee',
          }
          for name,url in sources.items():
              response=requests.get(url,params={'w':2400,'q':91,'fit':'max','auto':'format'},timeout=60)
              response.raise_for_status()
              image=Image.open(io.BytesIO(response.content)).convert('RGB')
              print(name, 'original size:',image.size)
              assert image.width>=1000 and image.height>=800, 'Too small for phone wallpaper'
              image=ImageOps.fit(image,(1080,1920),method=Image.Resampling.LANCZOS,centering=(.55,.5))
              image.save(f'assets/game-scene-{name}-v93.webp','WEBP',quality=86,method=6)
          PY
      - name: Commit locally hosted game images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/game-scene-build-v93.webp assets/game-scene-choose-v93.webp
          git commit -m "art(game): store sharp licensed China photos for both game exercises [scene assets]"
          git push
