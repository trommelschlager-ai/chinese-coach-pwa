name: Panda Street native HSK1 standard — Android QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'panda-street-slang-lesson*-preview.html'
      - 'panda-street-ai-preview.html'
      - 'assets/panda-street-hsk1-standard-v2.*'
      - 'scripts/qa-street-native-standard.mjs'
      - '.github/workflows/street-native-standard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-standard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: |
          node --check assets/panda-street-hsk1-standard-v2.js
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/street-native.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/panda-street-slang-lesson1-preview.html >/dev/null; then break; fi
            sleep 1
          done
          node scripts/qa-street-native-standard.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panda-street-native-standard-screenshots
          path: qa/street-native-standard/
          if-no-files-found: warn
