name: HSK2 mobile visual QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'hsk2-*.html'
      - 'assets/hsk2-*.js'
      - 'assets/hsk2-*.css'
      - 'tests/hsk2-visual-qa-pr161.cjs'
      - '.github/workflows/hsk2-visual-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-cover-and-interior:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/hsk2-webserver.log 2>&1 &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8765/hsk2-about-me.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/hsk2-webserver.log
          exit 1
      - name: Check 10 lessons on 3 phone viewports
        run: node tests/hsk2-visual-qa-pr161.cjs
      - name: Save screenshots and result JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hsk2-mobile-qa
          path: qa-artifacts/hsk2/
          if-no-files-found: warn
          retention-days: 14
