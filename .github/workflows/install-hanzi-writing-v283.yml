name: Install offline Hanzi writing data v283
on:
  push:
    branches: [main]
    paths:
      - 'assets/hanzi-writing-curriculum-v283.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: panda-writing-v283-install
  cancel-in-progress: false
jobs:
  install-writing-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download permitted character stroke data for offline handwriting
        run: node scripts/import-hanzi-writing-data-v283.cjs
      - name: Verify all seven lessons, pages and writing engine
        run: node scripts/verify-hanzi-writing-v283.cjs
      - name: Publish offline data and metadata
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hanzi-data/ assets/offline-pack.json sw.js
          if git diff --cached --quiet; then
            echo 'All writing data already present'
            exit 0
          fi
          git commit -m 'assets: include HanziWriter data for all 7 lessons'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
