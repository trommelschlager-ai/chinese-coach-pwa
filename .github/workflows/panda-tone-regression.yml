name: Panda Go tone analyzer regression
on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/hsk2-lesson3-tone-meter-pilot-20261122.js'
      - 'hsk2-lesson3-work-study-preview.html'
      - 'tests/panda-tone-lesson3-smoke.cjs'
      - 'panda-tone-test-lab.html'
      - 'tests/panda-tone-regression.cjs'
      - 'tests/panda-tone-window-sweep.cjs'
      - 'assets/hsk2-lesson3-voice/**'
      - '.github/workflows/panda-tone-regression.yml'
  pull_request:
    paths:
      - 'assets/hsk2-lesson3-tone-meter-pilot-20261122.js'
      - 'hsk2-lesson3-work-study-preview.html'
      - 'tests/panda-tone-lesson3-smoke.cjs'
      - 'panda-tone-test-lab.html'
      - 'tests/panda-tone-regression.cjs'
      - 'tests/panda-tone-window-sweep.cjs'
      - 'assets/hsk2-lesson3-voice/**'
      - '.github/workflows/panda-tone-regression.yml'
permissions:
  contents: read
jobs:
  tone-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install MP3 decoder (FFmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          command -v ffmpeg
          ffmpeg -hide_banner -version
      - name: Analyze tone algorithm and six HSK2 MP3 clips
        run: node tests/panda-tone-regression.cjs
      - name: Compare previous 90/60/18 F0 settings against promoted analyzer
        if: ${{ always() }}
        run: PANDA_TONE_EXPERIMENT=90-60-18 node tests/panda-tone-regression.cjs
      - name: Compare experimental F0 windows on six real MP3 clips
        if: ${{ always() }}
        run: node tests/panda-tone-window-sweep.cjs
      - name: Verify HSK2 lesson 3 tone pilot and saved progress
        if: ${{ always() }}
        run: node tests/panda-tone-lesson3-smoke.cjs
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panda-tone-regression-report
          path: |
            tone-regression-report.json
            tone-window-sweep.json
            tone-regression-baseline.json
          retention-days: 14
          if-no-files-found: warn
