name: Test Canva image source route
on:
  push:
    paths: [".github/workflows/test-canva-route-v371.yml"]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check public design access and original media endpoints
        run: |
          set +e
          for url in           "https://www.canva.com/d/eGaGTqnWrJoUz0e"           "https://www.canva.com/design/DAHbAU_FYUg/view"           "https://media.canva.com/ifs/M/6fd49500-7d0c-4988-97f5-1f74444baead"           "https://media.canva.com/v2/image-resize/format:PNG/height:1672/uri:ifs%3A%2F%2FM%2F6fd49500-7d0c-4988-97f5-1f74444baead/width:941"; do
            echo "URL=$url"
            status=$(curl --location --max-time 20 --silent --show-error --output /tmp/file --write-out '%{http_code}' "$url")
            echo "STATUS:$status LENGTH:$(wc -c </tmp/file) TYPE:$(file -b /tmp/file)"
            head -c 280 /tmp/file | strings | tr '\n' ' ' | cut -c1-280
            echo
          done
