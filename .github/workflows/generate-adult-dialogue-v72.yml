name: Record 25 Mandarin dialogues with new voices
on:
  push:
    paths:
      - ".github/workflows/generate-adult-dialogue-v72.yml"
      - "scripts/generate_adult_dialogue_v72.py"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Edge TTS and ffprobe
        run: |
          python -m pip install --disable-pip-version-check edge-tts==7.3.1
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Generate and individually validate all 25 adult-voice dialogue MP3s
        run: python scripts/generate_adult_dialogue_v72.py
      - name: Commit new MP3s atomically after all pass validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dialogue-voices-v72/
          if git diff --cached --quiet; then
            echo "All clips already present"
          else
            git commit -m "Record 25 genuine new dialogue MP3s with Xiaoxuan and Yunjian"
            git push
          fi
