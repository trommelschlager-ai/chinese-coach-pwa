name: Prepare natural soft male greeting previews v299
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lesson1-soft-male-v299.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: panda-natural-male-v299
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install TTS and MP3 validation
        run: |
          python -m pip install --disable-pip-version-check 'edge-tts==7.3.1'
          command -v ffprobe
      - name: Create three pitch-unmodified natural adult male voices
        run: |
          python - <<'PY'
          import asyncio, pathlib, subprocess
          import edge_tts
          voices = {
            'yunhao': 'zh-CN-YunhaoNeural',
            'yunjie': 'zh-CN-YunjieNeural',
            'yunye': 'zh-CN-YunyeNeural',
          }
          async def main():
              for name, voice in voices.items():
                  output = pathlib.Path('assets') / f'lesson1-hello-{name}-v299.mp3'
                  await edge_tts.Communicate('你好！', voice=voice, rate='-5%', volume='-5%', pitch='+0Hz').save(str(output))
                  duration = float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1',str(output)], text=True).strip())
                  assert 0.45 < duration < 6 and output.stat().st_size > 4500, (output,duration,output.stat().st_size)
                  print(voice, output, duration, output.stat().st_size)
          asyncio.run(main())
          PY
      - name: Commit new original-rate MP3 previews only (not old processed voice)
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/lesson1-hello-{yunhao,yunjie,yunye}-v299.mp3
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audio: prepare softer Mandarin adult male greeting voices v299'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
