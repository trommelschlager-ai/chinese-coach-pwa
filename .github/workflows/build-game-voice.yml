name: Generate unified Mandarin game recordings
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-game-voice.yml'
      - '.github/scripts/generate_game_voice.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install voice generator
        run: python -m pip install 'edge-tts>=7.0,<8'
      - name: Generate and clean recordings
        run: python .github/scripts/generate_game_voice.py
      - name: Commit new game recordings only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/game-unified-voice-v100/
          if ! git diff --cached --quiet; then
            git commit -m "Add consistent, normalized Mandarin game voice v100"
            git push
          fi
