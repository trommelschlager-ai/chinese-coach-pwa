name: Transfer approved HSK2 welcome artwork v445
on:
  push:
    paths:
      - ".github/workflows/transfer-hsk2-home-v445.yml"
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch exact approved image from user supplied file
        env:
          APPROVED_IMAGE_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/0c4f7a7d-3693-4f99-8b53-d7a7d0276540.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiOWE2MTMwYzZkM2E4YzU2NCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NTA5NDM0Mn0.IdHOTDmzZY_NMzIJjlyY2JC26m8bUbN-8X65Zicz2Js"
        run: |
          set -euo pipefail
          python -m pip install -q pillow
          python - <<'PY'
          import io,os,pathlib,urllib.request
          from PIL import Image
          data=urllib.request.urlopen(urllib.request.Request(os.environ["APPROVED_IMAGE_URL"],headers={"User-Agent":"PandaGo/1.0"}),timeout=60).read()
          im=Image.open(io.BytesIO(data))
          if im.width!=941 or im.height!=1602:
            raise RuntimeError("Unexpected artwork dimensions "+repr(im.size)+"; refusing to publish!")
          output=pathlib.Path("assets/hsk2-home-v445.webp")
          im.convert("RGB").save(output,"WEBP",quality=95,method=6)
          print("Approved exact image",im.size,"bytes",output.stat().st_size)
          PY
      - name: Save verified image to repository
        run: |
          set -e
          git config user.name "Panda Go Artwork Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hsk2-home-v445.webp
          if ! git diff --cached --quiet; then
            git commit -m "assets(hsk2): install approved HSK2 welcome picture v445"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
