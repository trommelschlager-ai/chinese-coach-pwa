name: Add approved HSK2 intro and test preview art
on:
  push:
    paths:
      - ".github/workflows/transfer-hsk2-approved-previews-v449.yml"
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve approved image and make two display-only panels
        env:
          ART_SOURCE_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/9979a114-0910-46e0-9053-edaf2453c00d.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMjE3NTg0MTY2YzJiZGNlNiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NTA1NTI1NH0.CkF8XZREwaV5cSyHWt4MsxKNXHWkF67kNQa2CwQNSPY"
        run: |
          set -euo pipefail
          python -m pip install -q pillow
          python - <<'PY'
          import urllib.request,io,os,pathlib,sys
          from PIL import Image
          u=os.environ['ART_SOURCE_URL']
          candidates=[
              u.replace('/height:150/','/height:1086/').replace('/width:200?', '/width:1448?').replace('&x-canva-quality=thumbnail',''),
              u.replace('/height:150/','/height:1086/').replace('/width:200?', '/width:1448?'),
              u.replace('/height:150/','/height:900/').replace('/width:200?', '/width:1200?'),
              u,
          ]
          original=None
          for i,src in enumerate(candidates):
            try:
              request=urllib.request.Request(src,headers={'User-Agent':'Mozilla/5.0'})
              data=urllib.request.urlopen(request,timeout=25).read()
              im=Image.open(io.BytesIO(data))
              print('Candidate',i,'dims',im.size,'bytes',len(data))
              if im.width>=1200 and im.height>=900:
                original=im.convert('RGB')
                break
            except Exception as e: print('Candidate',i,'failed:',type(e).__name__,str(e)[:130])
          if original is None: raise SystemExit('No approved high-resolution image. Keep demo untouched.')
          w,h=original.size
          if abs(w/h-1448/1086)>0.02: raise SystemExit('Incorrect source aspect ratio.')
          sx=w/1448;sy=h/1086
          crops={'1':(80,12,686,1048),'3':(718,12,1334,1048)}
          outdir=pathlib.Path('assets/hsk2-preview-v449');outdir.mkdir(parents=True,exist_ok=True)
          for n,rect in crops.items():
             bounds=tuple(round(v*(sx if j%2==0 else sy)) for j,v in enumerate(rect))
             panel=original.crop(bounds)
             panel.thumbnail((650,1120),Image.Resampling.LANCZOS)
             dest=outdir/('step-'+n+'-approved.webp')
             panel.save(dest,format='WEBP',quality=88,method=6)
             print('saved',dest,panel.size,dest.stat().st_size)
          PY
      - name: Commit approved preview image assets
        run: |
          set -e
          git config user.name "Panda Go Preview Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hsk2-preview-v449/*.webp
          if ! git diff --cached --quiet; then
            git commit -m "assets: exact Panda Go HSK2 approved step 1 and 3 preview art"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
