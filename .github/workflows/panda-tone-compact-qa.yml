name: Panda Tone compact mobile QA
on:
  pull_request:
    paths:
      - 'panda-hsk2-tone-sentence-pilot.html'
      - '.github/workflows/panda-tone-compact-qa.yml'
      - 'scripts/verify-panda-tone-compact.cjs'
jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 4173 --bind 127.0.0.1 & 
      - run: node scripts/verify-panda-tone-compact.cjs
