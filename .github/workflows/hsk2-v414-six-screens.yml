name: HSK2 lesson 1 six-screen Android regression
on:
  push:
    branches: [feature/hsk2-lesson1-six-screens-v414, fix/hsk2-lesson1-fullheight-nojump-audio-v416]
  pull_request:
    paths:
      - "hsk2-life-course.html"
      - "assets/hsk2-six-screens-v414.js"
      - "assets/hsk2-six-screens-v414.css"
      - "assets/hsk2-life-course-app-v1.js"
      - "assets/hsk2-lesson1-android-fixes-v416.css"
      - "scripts/qa-hsk2-six-screens-v414.mjs"
      - "scripts/qa-hsk2-day-panda-mobile-v1.mjs"
      - "sw.js"
      - "tests/hsk2-six-screens-v414.test.cjs"
jobs:
  functional:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify six interactive screens and legacy audio honesty
        run: |
          node tests/hsk2-six-screens-v414.test.cjs
          node tests/hsk2-day-v413.test.cjs
      - run: npm install --no-save --no-audit --no-fund playwright
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - run: npx playwright install chromium
      - name: Verify the current learning stages at Android sizes
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/hsk2-v414.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 25); do if curl -fsS http://127.0.0.1:4173/hsk2-life-course.html >/dev/null; then break; fi; sleep 1; done
          node scripts/qa-hsk2-six-screens-v414.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panda-go-hsk2-v414-six-screen-android
          path: qa/hsk2-v414-six-screens/
          if-no-files-found: warn
