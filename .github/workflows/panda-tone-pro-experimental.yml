name: Panda Tone PRO experimental unit QA
on:
  pull_request:
    paths:
      - 'assets/panda-tone-pro-v1.mjs'
      - 'scripts/test-panda-tone-pro.mjs'
      - '.github/workflows/panda-tone-pro-experimental.yml'
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-panda-tone-pro.mjs
