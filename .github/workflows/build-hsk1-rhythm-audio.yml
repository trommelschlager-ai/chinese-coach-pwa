name: Build HSK1 rhythm male-voice previews
on:
  push:
    paths:
      - "scripts/build-hsk1-rhythm-audio.py"
      - ".github/workflows/build-hsk1-rhythm-audio.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hsk1-rhythm-audio
  cancel-in-progress: false
jobs:
  generate-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audio tools
        run: |
          python -m pip install --disable-pip-version-check edge-tts==7.3.1
          command -v ffprobe || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Generate and validate the exact ten Mandarin sentences and Russian translations
        run: python scripts/build-hsk1-rhythm-audio.py
      - name: Commit only verified preview recordings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hsk1-rhythm/zh-*.mp3 assets/hsk1-rhythm/ru-*.mp3 assets/hsk1-rhythm/status.json
          if git diff --cached --quiet; then
            echo "Preview recordings already current"
          else
            git commit -m "HSK1 rhythm: add 10 male Mandarin and 10 Russian audio previews"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
