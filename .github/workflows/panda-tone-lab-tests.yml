name: Panda Go tone and audio checks

on:
  push:
    paths:
      - 'assets/panda-tone-*'
      - 'panda-tone-lab.html'
      - 'tests/panda-tone-lab.test.mjs'
      - 'tests/panda-tone-audio-roundtrip.test.mjs'
      - 'tests/panda-tone-ma-ui.test.mjs'
      - 'tests/panda-tone-recording-v464.test.mjs'
      - 'tests/panda-tone-short-syllables-v465.test.mjs'
      - 'tests/panda-tone-segmentation-v467.test.mjs'
      - 'tests/panda-tone-short-movement-v468.test.mjs'
      - 'tests/panda-tone-lesson-exercises-v469.test.mjs'
      - 'panda-tone-exercises.html'
      - 'hsk1-*.html'
      - 'assets/panda-tone-recording-analysis-v465.mjs'
      - 'scripts/audit-panda-audio.cjs'
      - 'scripts/benchmark-panda-tones.mjs'
      - 'scripts/check-panda-audio-references.cjs'
      - '.github/workflows/panda-tone-lab-tests.yml'
      - 'assets/**/*.mp3'
      - 'assets/**/*.m4a'
      - 'assets/**/*.wav'
      - 'assets/**/*.ogg'
      - 'assets/**/*.webm'
  pull_request:
    paths:
      - 'assets/panda-tone-*'
      - 'panda-tone-lab.html'
      - 'tests/panda-tone-lab.test.mjs'
      - 'tests/panda-tone-audio-roundtrip.test.mjs'
      - 'tests/panda-tone-ma-ui.test.mjs'
      - 'tests/panda-tone-recording-v464.test.mjs'
      - 'tests/panda-tone-short-syllables-v465.test.mjs'
      - 'tests/panda-tone-segmentation-v467.test.mjs'
      - 'tests/panda-tone-short-movement-v468.test.mjs'
      - 'tests/panda-tone-lesson-exercises-v469.test.mjs'
      - 'panda-tone-exercises.html'
      - 'hsk1-*.html'
      - 'assets/panda-tone-recording-analysis-v465.mjs'
      - 'scripts/audit-panda-audio.cjs'
      - 'scripts/benchmark-panda-tones.mjs'
      - 'scripts/check-panda-audio-references.cjs'
      - '.github/workflows/panda-tone-lab-tests.yml'
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

concurrency:
  group: panda-tone-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-tone-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify quiet 0.29 second syllables, silence, and local mic UI
        run: node --test tests/panda-tone-lab.test.mjs tests/panda-tone-ma-ui.test.mjs tests/panda-tone-recording-v464.test.mjs tests/panda-tone-short-syllables-v465.test.mjs tests/panda-tone-segmentation-v467.test.mjs tests/panda-tone-short-movement-v468.test.mjs tests/panda-tone-lesson-exercises-v469.test.mjs
  tone-and-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install audio decoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Install test DOM dependencies
        run: npm ci --ignore-scripts
      - name: Verify tone math and safe failure handling
        run: node --test tests/panda-tone-lab.test.mjs tests/panda-tone-audio-roundtrip.test.mjs tests/panda-tone-ma-ui.test.mjs tests/panda-tone-recording-v464.test.mjs tests/panda-tone-short-syllables-v465.test.mjs tests/panda-tone-segmentation-v467.test.mjs tests/panda-tone-short-movement-v468.test.mjs tests/panda-tone-lesson-exercises-v469.test.mjs
      - name: Check decoder availability
        run: |
          command -v ffmpeg
          command -v ffprobe
      - name: Check audio buttons for missing static MP3 files
        run: node scripts/check-panda-audio-references.cjs
      - name: Diagnose four existing lesson tone recordings (no grading)
        run: node scripts/benchmark-panda-tones.mjs
      - name: Inventory and decode all repository audio
        run: node scripts/audit-panda-audio.cjs --deep
      - name: Upload machine-readable audio report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panda-go-audio-audit
          path: |
            reports/panda-audio-audit.json
            reports/panda-real-tone-diagnostics.json
            reports/panda-audio-references.json
          if-no-files-found: warn
          retention-days: 14
