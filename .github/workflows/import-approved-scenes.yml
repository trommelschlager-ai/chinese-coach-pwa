name: Import approved Chinese painting backgrounds
on:
  push:
    paths:
      - .github/workflows/import-approved-scenes.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-pictures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe full image download and record HTTP response
        env:
          FULL_IMAGE: 'https://media.canva.com/v2/image-resize/format:JPG/height:680/quality:75/uri:ifs%3A%2F%2FM%2F88302e69-1fce-420b-b532-98f3b8055976/watermark:F/width:1200?csig=AAAAAAAAAAAAAAAAAAAAAD9RArSwcQk9Ql8Rd20NYCPGJUcYygVEd0khlEFQ1_gi&exp=1793088648&osig=AAAAAAAAAAAAAAAAAAAAAHuZph7qL2L_cOpDH5NjBf1nI3ALbO9JDHwchdkE0TC5&signer=media-rpc&token=AAIAAU0AJDg4MzAyZTY5LTFmY2UtNDIwYi1iNTMyLTk4ZjNiODA1NTk3NgAAAAABoXxpc0BormTfdEVljcB-zJwy7PijgMe5C5i4n0mFZKXuKBh0SA&x-canva-quality=thumbnail'
        run: |
          mkdir -p assets
          printf "Tested user photo delivery\n" > assets/image-import-diagnostic.txt
          curl -L --silent --show-error --max-time 45 -w 'HTTP %{http_code}, bytes %{size_download}\n' "$FULL_IMAGE" -o /tmp/scenery.jpg >> assets/image-import-diagnostic.txt 2>&1 || true
          file /tmp/scenery.jpg >> assets/image-import-diagnostic.txt 2>&1 || true
          wc -c /tmp/scenery.jpg >> assets/image-import-diagnostic.txt 2>&1 || true
          python3 - <<'PY' >> assets/image-import-diagnostic.txt 2>&1
          try:
              from PIL import Image
              im=Image.open('/tmp/scenery.jpg')
              print('dimensions', im.size)
              if im.width>=600:
                  im.save('assets/approved-scenic-01.webp',format='WEBP',quality=80)
          except Exception as exc:
              print('image_error:',repr(exc))
          PY
      - name: Commit downloadable assets or diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/image-import-diagnostic.txt
          if test -e assets/approved-scenic-01.webp; then git add assets/approved-scenic-01.webp; fi
          git commit -m "Diagnose external image import into Chinese course"
          git push
