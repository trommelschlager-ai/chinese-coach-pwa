name: HSK1 approved Xiaoni female voice production
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  generate-xiaoni:
    if: ${{ github.event.pull_request.head.ref == 'feat/hsk1-xiaoni-approved-female-v159-20261106' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check if the female audio pack has been generated
        id: existing
        shell: bash
        run: |
          if test -f assets/hsk1-voices-v159/manifest.json; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install free Kokoro Mandarin TTS
        if: steps.existing.outputs.exists == 'false'
        run: |
          python -m pip install --upgrade pip
          python -m pip install "kokoro==0.9.4" "misaki[zh]>=0.9" numpy soundfile
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Produce 123 new approved Mandarin female MP3s
        if: steps.existing.outputs.exists == 'false'
        run: python scripts/render-approved-xiaoni-v159.py --render
      - name: Commit audio files only to approved candidate branch
        if: steps.existing.outputs.exists == 'false'
        run: |
          git config user.name "Panda Go Audio"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hsk1-voices-v159/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audio(hsk1): add 123 Xiaoni female MP3 for approved voice timbre"
          git push origin "HEAD:refs/heads/${{ github.head_ref }}"
      - name: Keep candidates available for quality review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panda-go-xiaoni-v159-female-mandarin-123
          path: assets/hsk1-voices-v159/
          retention-days: 7
          if-no-files-found: warn
