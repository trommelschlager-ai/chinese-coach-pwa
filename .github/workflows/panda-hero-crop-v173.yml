name: Create cleaned approved Panda Go hero v173
on:
  push:
    branches:
      - fix/panda-reference-accurate-v173
    paths:
      - scripts/crop-panda-hero-v173.py
      - .github/workflows/panda-hero-crop-v173.yml
permissions:
  contents: write
jobs:
  crop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/panda-reference-accurate-v173
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow==11.2.1
      - run: python scripts/crop-panda-hero-v173.py
      - name: Commit only derived hero to the review branch
        run: |
          git config user.name "Panda Go Design QA"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/panda-go-panda-only-v173.webp assets/panda-hsk1-landscape-clean-v173.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "art(panda): add clean crop from approved home panda without baked controls"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin fix/panda-reference-accurate-v173
            if git push origin HEAD:fix/panda-reference-accurate-v173; then exit 0; fi
            sleep 2
          done
          echo 'Unable to update review branch without losing intervening edits' >&2
          exit 1
