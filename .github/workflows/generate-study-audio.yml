name: Build natural Mandarin vocabulary MP3 previews
on:
  push:
    paths:
      - ".github/workflows/generate-study-audio.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  study-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MP3 synthesizer and validation utilities
        run: |
          python -m pip install --disable-pip-version-check edge-tts==7.3.1
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffprobe -version | head -n 1
      - name: Generate 30 verified Mandarin MP3 recordings
        run: python scripts/generate_study_audio.py
      - name: Publish audio and references as one commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/study-voices assets/study-audio-map.js assets/offline-pack.json sw.js index.html
          if ! git diff --cached --quiet; then
            git commit -m "Publish 30 Mandarin vocabulary and rule MP3 previews; PWA v59"
            git push
          fi
