name: Panda Go lesson 1 dedicated male greeting v297
on:
  push:
    branches: [main]
    paths:
      - 'scripts/prepare-lesson1-male-hello-v297.sh'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: panda-lesson1-male-hello-v297
  cancel-in-progress: false
jobs:
  build-male-greeting:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Process existing male narrator into deeper greeting without changing speed
        run: bash scripts/prepare-lesson1-male-hello-v297.sh
      - name: Verify male voice audio
        run: |
          test -s assets/lesson1-hello-male-v297.mp3
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 assets/lesson1-hello-male-v297.mp3
      - name: Commit final male-voice asset
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/lesson1-hello-male-v297.mp3
          if git diff --cached --quiet; then echo 'Already generated'; exit 0; fi
          git commit -m 'audio: distinct lower male hello in first lesson'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
