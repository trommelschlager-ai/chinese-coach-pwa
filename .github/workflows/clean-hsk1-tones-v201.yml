name: Stronger noise cleanup for HSK1 ma2 and ma3 (v202)
on:
  push:
    paths:
      - ".github/workflows/clean-hsk1-tones-v201.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  clean-two-tones:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install audio utilities only if missing
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n 1
      - name: Denoise exactly two existing human voice examples
        run: python3 scripts/clean-ma-tones-v201.py
      - name: Commit only the two newly filtered audio files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hsk1-tone-clean-v202/ma2.mp3 assets/hsk1-tone-clean-v202/ma3.mp3
          if ! git diff --cached --quiet; then
            git commit -m "audio(hsk1): publish stronger-denoised original má and mǎ samples v202"
            git push
          fi
