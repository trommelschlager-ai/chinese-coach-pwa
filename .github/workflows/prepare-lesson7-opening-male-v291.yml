name: Prepare deeper male weather opening v291
on:
  push:
    branches: [main]
    paths: ['scripts/prepare-lesson7-opening-male-v291.sh']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: panda-weather-opening-male-v291
  cancel-in-progress: false
jobs:
  prepare-male:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Prepare dedicated male weather opening and update course replay
        run: bash scripts/prepare-lesson7-opening-male-v291.sh
      - name: Verify generated voice
        run: |
          test -s assets/lesson7-opening-male-v291.mp3
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 assets/lesson7-opening-male-v291.mp3
          node scripts/verify-lesson7-opening-male-v291.cjs
      - name: Commit regenerated voice and active lesson pages
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/lesson7-opening-male-v291.mp3 assets/lesson7-opening-male-v291.js assets/offline-pack.json sw.js hsk1-weather-v231.html hsk1-family-v231.html hsk1-fifth-v227.html hsk1-second-v203.html scripts/verify-hsk1-fifth-v227.cjs scripts/verify-hsk1-lesson5-xiaoxiao-v272.cjs scripts/verify-panda-native-real-v246.cjs scripts/verify-hsk1-second-v203.cjs scripts/verify-panda-go-approved-v231.cjs scripts/verify-lesson6-photos-v276.cjs scripts/verify-lesson7-opening-male-v291.cjs scripts/verify-panda-mobile-repairs-v290.cjs
          if git diff --cached --quiet; then echo 'Already ready'; exit 0; fi
          git commit -m 'audio: dedicated deeper male weather opening and repeatable HSK1 v291'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
