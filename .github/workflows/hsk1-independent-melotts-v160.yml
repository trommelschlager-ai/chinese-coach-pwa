name: HSK1 Chinese voice replacement (MeloTTS, not Kokoro)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  render-melotts-hsk1:
    if: ${{ github.event.pull_request.head.ref == 'fix/hsk1-melotts-real-mandarin-v160' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Check if new independent voice has already been synthesized
        id: check
        run: |
          if test -f assets/hsk1-voices-v160/manifest.json; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install free independent Chinese MeloTTS and pronunciation dictionaries
        if: steps.check.outputs.present == 'false'
        run: |
          python -m pip install --upgrade pip setuptools wheel
          git clone --depth=1 https://github.com/myshell-ai/MeloTTS.git /tmp/MeloTTS
          python -m pip install -e /tmp/MeloTTS
          python -m pip install 'setuptools<81'
          python -m unidic download
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Synthesize all 123 native Chinese model audio clips
        if: steps.check.outputs.present == 'false'
        run: python scripts/render-melotts-mandarin-v160.py --render
      - name: Commit replacement audio into review branch only
        if: steps.check.outputs.present == 'false'
        run: |
          git config user.name "Panda Go Chinese Audio QA"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hsk1-voices-v160/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audio(hsk1): new independent MeloTTS Mandarin pronunciation for 123 lines"
          git push origin "HEAD:refs/heads/${{ github.head_ref }}"
      - name: Upload review bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panda-go-melotts-v160-123-Chinese-recordings
          path: assets/hsk1-voices-v160/
          if-no-files-found: warn
          retention-days: 7
