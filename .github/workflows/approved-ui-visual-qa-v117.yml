name: Panda Go mobile browser QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshot-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install app and Chromium
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise mobile screens and save screenshots
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/vite-v117.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/index.html >/dev/null || { cat /tmp/vite-v117.log; exit 1; }
          node scripts/visual-panda-v130.mjs
          node scripts/visual-mobile-v119.mjs
          node scripts/visual-hsk1-v152.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chinese-coach-mobile-v130-screenshots
          path: |
            qa/v130/browser/
            qa/v119/
            qa/hsk1-v152/
          if-no-files-found: warn
  hanzi-focused:
    needs: hanzi-phrase-audio
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install existing browser test dependencies
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright@1.56.1 sharp@0.34.4
          npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: hanzi-v141-phrase-audio
          path: assets
      - name: Check exact Hanzi screen directly
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/hanzi-v141-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/hanzi-lab.html >/dev/null; then break; fi
            sleep 1
          done
          node scripts/visual-hanzi-v141.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hanzi-v141-mobile-evidence
          path: qa/hanzi-v141/
          if-no-files-found: error
  hanzi-phrase-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install edge-tts==7.3.1
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: python scripts/generate-hanzi-phrases-v141.py
      - uses: actions/upload-artifact@v4
        with:
          name: hanzi-v141-phrase-audio
          path: |
            assets/hanzi-phrases-v141/
            assets/hanzi-phrases-v141.js
          if-no-files-found: error

  kokoro-voice-samples:
    # Generate *candidate* Chinese speech only for the explicitly approved voice preview branch.
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/hsk1-kokoro-two-voice-preflight-20261106' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free local TTS runtime and MP3 encoder
        run: |
          python -m pip install --upgrade pip
          python -m pip install "kokoro==0.9.4" "misaki[zh]>=0.9" numpy soundfile
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Render 6 sample phrases only (never publish app changes)
        run: python scripts/hsk1_kokoro_audio_v155.py --render-samples
      - name: Share preview as a private CI artifact for manual tone review
        uses: actions/upload-artifact@v4
        with:
          name: panda-go-mandarin-kokoro-v155-6-samples
          path: .voice-staging/hsk1-kokoro-v155/
          if-no-files-found: error
          retention-days: 7

  kokoro-full-voice-review:
    # User approved the six sample timbres. Build complete candidate recordings
    # into this PR only; never deploy to main until every phrase passes review.
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/hsk1-kokoro-two-voice-preflight-20261106' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check whether candidate audio bundle is already staged
        id: existing
        run: |
          if test -f assets/hsk1-voices-v156/manifest.json; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install local Kokoro runtime
        if: steps.existing.outputs.exists == 'false'
        run: |
          python -m pip install --upgrade pip
          python -m pip install "kokoro==0.9.4" "misaki[zh]>=0.9" numpy soundfile
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Render all 138 Mandarin candidate clips and validate
        if: steps.existing.outputs.exists == 'false'
        run: |
          python scripts/hsk1_kokoro_audio_v155.py --render-all
          python scripts/hsk1_kokoro_stage_v156.py
      - name: Push candidate binary assets into the draft review PR only
        if: steps.existing.outputs.exists == 'false'
        run: |
          git config user.name "Panda Go Audio QA"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hsk1-voices-map-v156.js assets/hsk1-voices-v156/
          git diff --cached --quiet && exit 0
          git commit -m "audio(hsk1): stage 138 Kokoro clips for tone QA only"
          git push origin "HEAD:refs/heads/${{ github.head_ref }}"
      - name: Upload audio artifacts for manual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panda-go-hsk1-v156-full-voice-candidates
          path: |
            assets/hsk1-voices-map-v156.js
            assets/hsk1-voices-v156/
          if-no-files-found: warn
          retention-days: 7
