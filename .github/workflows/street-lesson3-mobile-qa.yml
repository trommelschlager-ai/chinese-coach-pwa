name: Panda Street lesson 3 mobile QA
on:
  pull_request:
    paths:
      - 'panda-street-slang-lesson3-preview.html'
      - 'panda-street-hsk1-map.html'
      - 'assets/panda-street-*'
      - 'scripts/qa-street-lesson3.mjs'
      - '.github/workflows/street-lesson3-mobile-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Run mobile browser tests
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/street-server.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/panda-street-slang-lesson3-preview.html >/dev/null && break; sleep 1; done
          node scripts/qa-street-lesson3.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: street-lesson3-mobile-report
          path: qa/street-lesson3/
          if-no-files-found: warn
