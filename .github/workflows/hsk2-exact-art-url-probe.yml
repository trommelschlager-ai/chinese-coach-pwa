              try:
                  with urllib.request.urlopen(url,timeout=20) as r:
                      data=r.read()
                      print(i,'status',r.status,'len',len(data),'mime',r.headers.get('Content-Type'))
                  im=Image.open(io.BytesIO(data))
                  print('IMAGE DIMENSIONS',i,im.size)
              except Exception as e: print(i,'FAILED',repr(e))
          PY
