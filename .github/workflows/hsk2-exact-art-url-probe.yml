name: Probe approved Panda Go original artwork transfer
on:
  push:
    branches: [feature/hsk2-lesson1-six-screens-v414]
    paths: [.github/workflows/hsk2-exact-art-url-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip -q install pillow
      - name: Test original-resolution image CDN variants
        run: |
          python3 - <<'PY'
          import urllib.request,io
          from PIL import Image
          urls=["https://media.canva.com/v2/image-resize/format:JPG/height:200/quality:75/uri:ifs%3A%2F%2FM%2F592336c0-af6a-4fdd-a2e5-4bba804aff26/watermark:F/width:112?csig=AAAAAAAAAAAAAAAAAAAAAB61z6hyJBBrdH1fnYx-8SkAk_kuOXjT_fuonktrejCT&exp=1794897353&osig=AAAAAAAAAAAAAAAAAAAAAE4zMg6QKwD5AoGD8PcuE8tBRG5-O8eJepsmAHC93P3V&signer=media-rpc&token=AAIAAU0AJDU5MjMzNmMwLWFmNmEtNGZkZC1hMmU1LTRiYmE4MDRhZmYyNgAAAAABoeg4GSiTtZ7Ml9BcN3FLW3MMjMhyix_yzNoCv9tP_zmtWL5Bow&x-canva-quality=thumbnail","https://media.canva.com/v2/image-resize/format:JPG/height:1672/quality:75/uri:ifs%3A%2F%2FM%2F592336c0-af6a-4fdd-a2e5-4bba804aff26/watermark:F/width:941?csig=AAAAAAAAAAAAAAAAAAAAAB61z6hyJBBrdH1fnYx-8SkAk_kuOXjT_fuonktrejCT&exp=1794897353&osig=AAAAAAAAAAAAAAAAAAAAAE4zMg6QKwD5AoGD8PcuE8tBRG5-O8eJepsmAHC93P3V&signer=media-rpc&token=AAIAAU0AJDU5MjMzNmMwLWFmNmEtNGZkZC1hMmU1LTRiYmE4MDRhZmYyNgAAAAABoeg4GSiTtZ7Ml9BcN3FLW3MMjMhyix_yzNoCv9tP_zmtWL5Bow&x-canva-quality=thumbnail","https://media.canva.com/v2/image-resize/format:JPG/height:1200/quality:75/uri:ifs%3A%2F%2FM%2F592336c0-af6a-4fdd-a2e5-4bba804aff26/watermark:F/width:675?csig=AAAAAAAAAAAAAAAAAAAAAB61z6hyJBBrdH1fnYx-8SkAk_kuOXjT_fuonktrejCT&exp=1794897353&osig=AAAAAAAAAAAAAAAAAAAAAE4zMg6QKwD5AoGD8PcuE8tBRG5-O8eJepsmAHC93P3V&signer=media-rpc&token=AAIAAU0AJDU5MjMzNmMwLWFmNmEtNGZkZC1hMmU1LTRiYmE4MDRhZmYyNgAAAAABoeg4GSiTtZ7Ml9BcN3FLW3MMjMhyix_yzNoCv9tP_zmtWL5Bow&x-canva-quality=thumbnail","https://media.canva.com/v2/image-resize/format:JPG/height:1672/quality:75/uri:ifs%3A%2F%2FM%2F592336c0-af6a-4fdd-a2e5-4bba804aff26/watermark:F/width:112?csig=AAAAAAAAAAAAAAAAAAAAAB61z6hyJBBrdH1fnYx-8SkAk_kuOXjT_fuonktrejCT&exp=1794897353&osig=AAAAAAAAAAAAAAAAAAAAAE4zMg6QKwD5AoGD8PcuE8tBRG5-O8eJepsmAHC93P3V&signer=media-rpc&token=AAIAAU0AJDU5MjMzNmMwLWFmNmEtNGZkZC1hMmU1LTRiYmE4MDRhZmYyNgAAAAABoeg4GSiTtZ7Ml9BcN3FLW3MMjMhyix_yzNoCv9tP_zmtWL5Bow&x-canva-quality=thumbnail"]
