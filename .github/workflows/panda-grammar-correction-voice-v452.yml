name: Panda grammar correction auto-voice v452
on:
  push:
    branches:
      - 'fix/panda-grammar-correction-auto-voice-v452'
  pull_request:
    paths:
      - 'assets/panda-live-screen-v270.mjs'
      - 'assets/offline-pack.json'
      - 'panda-voice-pilot.html'
      - 'sw.js'
      - 'tests/panda-grammar-auto-voice-v452.test.mjs'
      - 'tests/panda-grammar-voice-v451.test.mjs'
      - '.github/workflows/panda-grammar-correction-voice-v452.yml'
permissions:
  contents: read
jobs:
  grammar-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact grammar corrections and instant approved MP3 playback
        run: |
          node --test tests/panda-grammar-auto-voice-v452.test.mjs
          node --test tests/panda-grammar-voice-v451.test.mjs
          node --test tests/panda-grammar-hsk12-v2.test.mjs
      - name: Syntax checks
        run: |
          node --check assets/panda-live-screen-v270.mjs
          node --check assets/panda-live-audio.mjs
