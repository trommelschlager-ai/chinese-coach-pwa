name: Panda v174 scenic asset inspection
on:
  push:
    branches: [feat/panda-reference-v174-artwork-rebuild]
    paths: ['.github/workflows/panda-scenic-inspect-v174.yml']
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow==11.2.1
      - name: Preview approved scenic assets
        run: python scripts/preview-panda-scenery-v174.py
