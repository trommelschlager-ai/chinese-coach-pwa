name: Panda Street AI voice and shared memory checks
on:
  pull_request:
    paths:
      - 'panda-street-ai-preview.html'
      - 'panda-voice-pilot.html'
      - 'panda-shared-profile-settings.html'
      - 'assets/panda-street-shared-brain-v1.mjs'
      - 'assets/panda-street-face-rig-v1.mjs'
      - 'assets/panda-street-male-voice-queue-v1.json'
      - 'assets/panda-street-approved-male-mp3-v1.mjs'
      - 'tests/panda-street-approved-male-mp3-v1.test.mjs'
      - 'docs/panda-street-voice-audit-20261123.md'
      - 'tests/panda-street-male-voice-queue-v1.test.mjs'
      - 'assets/panda-cross-character-memory-v1.mjs'
      - 'assets/panda-live-screen-v270.mjs'
      - 'assets/panda-hsk2-preview-core-v1.mjs'
      - 'tests/panda-cross-character-memory-v1.test.mjs'
      - 'tests/panda-street-live-android-v2.test.mjs'
      - '.github/workflows/panda-street-live-v2.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check opt-in shared learner memory and Panda Street conversation
        run: node --test tests/panda-cross-character-memory-v1.test.mjs tests/panda-street-live-android-v2.test.mjs tests/panda-street-male-voice-queue-v1.test.mjs tests/panda-street-approved-male-mp3-v1.test.mjs
