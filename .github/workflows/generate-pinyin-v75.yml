name: Generate professional Mandarin pinyin audio v75
on:
  push:
    paths:
      - "scripts/generate_pinyin_adult_v75.py"
      - ".github/workflows/generate-pinyin-v75.yml"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MP3 generator and checker
        run: |
          python -m pip install --disable-pip-version-check edge-tts==7.3.1
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Record 190 distinct Yunyang Mandarin Pinyin MP3s
        run: python scripts/generate_pinyin_adult_v75.py
      - name: Persist verified new audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pinyin-reading-v5/
          if ! git diff --cached --quiet; then
            git commit -m "Add 190 fresh professional Mandarin pinyin MP3s v75"
            git push
          fi
