name: Generate two adult-sounding pinyin voices v75
on:
  push:
    paths:
      - "scripts/generate_pinyin_adult_v75.py"
      - ".github/workflows/generate-pinyin-v75.yml"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install speech generator and MP3 validation
        run: |
          python -m pip install --disable-pip-version-check edge-tts==7.3.1
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Record and validate Xiaomo and Yunyang Mandarin
        run: python scripts/generate_pinyin_adult_v75.py
      - name: Save new MP3s only after successful validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pinyin-voices-v75/
          if ! git diff --cached --quiet; then
            git commit -m "Add two complete Mandarin pinyin voice sets (380 validated MP3s)"
            git push
          fi
