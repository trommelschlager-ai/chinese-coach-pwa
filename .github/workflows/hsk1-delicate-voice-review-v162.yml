name: Delicate Mandarin voice review samples (not live lessons)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  download-delicate-samples:
    if: ${{ github.event.pull_request.head.ref == 'review/hsk1-delicate-independent-six-20261106' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download short review samples and validate MP3 format
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          python - <<'PY'
          import json, pathlib, subprocess, urllib.request
          src=pathlib.Path("review/delicate-voice-v162/manifest.json")
          base=src.parent/"audio-review-only"
          base.mkdir(parents=True,exist_ok=True)
          manifest=json.loads(src.read_text())
          assert len(manifest["files"])==6
          for item in manifest["files"]:
              assert item["url"].startswith("https://storage.googleapis.com/adm--audio-playback")
              target=base/item["file"]
              request=urllib.request.Request(item["url"],headers={"User-Agent":"PandaGoAudioQA/1.0"})
              with urllib.request.urlopen(request,timeout=25) as response:
                  assert response.status==200
                  target.write_bytes(response.read(1_000_000))
              assert target.stat().st_size>1200,(target,target.stat().st_size)
              probe=json.loads(subprocess.check_output(["ffprobe","-v","error","-select_streams","a:0","-show_entries","stream=codec_name:format=duration","-of","json",str(target)],text=True))
              assert probe["streams"][0]["codec_name"]=="mp3"
              print(item["text"],target,float(probe["format"]["duration"]))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PandaGo-Delicate-6-Standalone-Review-Only
          path: review/delicate-voice-v162/audio-review-only/
          retention-days: 7
          if-no-files-found: warn
