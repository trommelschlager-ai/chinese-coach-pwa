name: Panda AI beginner replies v536 — Android release gate
on:
  push:
    paths:
      - 'assets/panda-everyday-meaning-v515.mjs'
      - 'assets/panda-hsk2-preview-core-v1.mjs'
      - 'tests/panda-teacher-question-v548.test.mjs'
      - 'assets/panda-approved-voice-registry-v516.mjs'
      - 'assets/panda-ai-natural-voice-batch01-v546.mjs'
      - 'assets/panda-ai-natural-voice-batch01-20261124/**'
      - 'assets/panda-hsk2-preview-audio-v1.mjs'
      - 'assets/panda-hsk2-preview-ui-v1.mjs'
      - 'assets/panda-natural-statements-v544.mjs'
      - 'assets/panda-natural-statements-v552.mjs'
      - 'tests/panda-family-natural-v552.test.mjs'
      - 'tests/panda-social-replies-v552.test.mjs'
      - 'tests/panda-natural-routing-v556.test.mjs'
      - 'tests/panda-work-dialogue-v556.test.mjs'
      - 'tests/panda-introduction-dialogue-v556.test.mjs'
      - 'tests/panda-family-dialogue-v556.test.mjs'
      - 'tests/panda-everyday-dialogue-v556.test.mjs'
      - 'scripts/panda-dialogue-voice-audit-v556.mjs'
      - 'assets/panda-approved-soft-v500.js'
      - 'assets/panda-hsk2-preview-v506.css'
      - 'docs/panda-ai-voice-queue-v545.json'
      - 'scripts/panda-ai-voice-gap-v545.mjs'
      - 'tests/panda-android-keyboard-dialogue-v539.test.mjs'
      - 'tests/panda-natural-statements-v544.test.mjs'
      - 'tests/panda-ai-voice-queue-v545.test.mjs'
      - 'tests/panda-approved-natural-voice-v546.test.mjs'
      - 'assets/panda-live-dialogue-v272.mjs'
      - 'assets/panda-ai-approved-layout-v547.css'
      - 'assets/panda-ai-chat-readable-v551.css'
      - 'tests/panda-chat-readable-v551.test.mjs'
      - 'scripts/qa-panda-chat-readable-v551.mjs'
      - 'assets/panda-ai-approved-layout-v547.js'
      - 'tests/panda-ai-approved-layout-v547.test.mjs'
      - 'scripts/qa-panda-approved-layout-v547.mjs'
      - 'panda-voice-pilot.html'
      - 'panda-ai-hsk2-preview.html'
      - 'sw.js'
      - 'assets/offline-pack.json'
      - 'tests/panda-beginner-release-v536.test.mjs'
      - 'scripts/qa-panda-beginner-release-v536.mjs'
      - '.github/workflows/panda-beginner-release-v536.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  panda-beginner:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check learner meaning, live replies and offline files
        run: node --test tests/panda-beginner-release-v536.test.mjs
      - name: Regression — Panda Android keyboard, learner name and natural dialogue
        run: |
          node --test tests/panda-android-keyboard-dialogue-v539.test.mjs
          node --test tests/panda-natural-statements-v542.test.mjs
          node --test tests/panda-natural-statements-v544.test.mjs
          node --test tests/panda-family-natural-v552.test.mjs
          node --test tests/panda-social-replies-v552.test.mjs
          node --test tests/panda-natural-routing-v556.test.mjs tests/panda-work-dialogue-v556.test.mjs tests/panda-introduction-dialogue-v556.test.mjs tests/panda-family-dialogue-v556.test.mjs tests/panda-everyday-dialogue-v556.test.mjs
          node --test tests/panda-ai-voice-queue-v545.test.mjs
          node --test tests/panda-approved-natural-voice-v546.test.mjs
          node scripts/panda-ai-voice-gap-v545.mjs
      - name: Teacher question 你是老师吗 — correct response and three approved MP3s
        run: node --test tests/panda-teacher-question-v548.test.mjs
      - name: Check approved interactive Panda AI v547 layout and readable v551 chat
        run: |
          node --test tests/panda-ai-approved-layout-v547.test.mjs
          node --test tests/panda-chat-readable-v551.test.mjs
      - name: Install mobile Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check real UI on three Android widths
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/panda-beginner.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/panda-voice-pilot.html >/dev/null; then break; fi
            sleep 1
          done
          node scripts/qa-panda-beginner-release-v536.mjs
          node scripts/qa-panda-approved-layout-v547.mjs
          node scripts/qa-panda-chat-readable-v551.mjs
      - name: Generate exact missing voice queue
        run: node scripts/panda-dialogue-voice-audit-v556.mjs
      - name: Preserve screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panda-beginner-v536-android
          path: |
            qa/panda-beginner-release/
            qa/panda-approved-layout-v547/
            qa/panda-chat-readable-v551/
            qa/panda-dialogue-v556/
          if-no-files-found: warn
