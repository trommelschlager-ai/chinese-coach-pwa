name: Panda AI beginner replies v536 — Android release gate
on:
  push:
    paths:
      - 'assets/panda-everyday-meaning-v515.mjs'
      - 'assets/panda-hsk2-preview-core-v1.mjs'
      - 'assets/panda-natural-statements-v544.mjs'
      - 'assets/panda-approved-soft-v500.js'
      - 'assets/panda-hsk2-preview-v506.css'
      - 'docs/panda-ai-voice-queue-v545.json'
      - 'scripts/panda-ai-voice-gap-v545.mjs'
      - 'tests/panda-android-keyboard-dialogue-v539.test.mjs'
      - 'tests/panda-natural-statements-v544.test.mjs'
      - 'tests/panda-ai-voice-queue-v545.test.mjs'
      - 'assets/panda-live-dialogue-v272.mjs'
      - 'panda-voice-pilot.html'
      - 'panda-ai-hsk2-preview.html'
      - 'sw.js'
      - 'assets/offline-pack.json'
      - 'tests/panda-beginner-release-v536.test.mjs'
      - 'scripts/qa-panda-beginner-release-v536.mjs'
      - '.github/workflows/panda-beginner-release-v536.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  panda-beginner:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check learner meaning, live replies and offline files
        run: node --test tests/panda-beginner-release-v536.test.mjs
      - name: Regression — Panda Android keyboard, learner name and natural dialogue
        run: |
          node --test tests/panda-android-keyboard-dialogue-v539.test.mjs
          node --test tests/panda-natural-statements-v542.test.mjs
          node --test tests/panda-natural-statements-v544.test.mjs
          node --test tests/panda-ai-voice-queue-v545.test.mjs
          node scripts/panda-ai-voice-gap-v545.mjs
      - name: Install mobile Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check real UI on three Android widths
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/panda-beginner.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/panda-voice-pilot.html >/dev/null; then break; fi
            sleep 1
          done
          node scripts/qa-panda-beginner-release-v536.mjs
      - name: Preserve screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panda-beginner-v536-android
          path: qa/panda-beginner-release/
          if-no-files-found: warn
