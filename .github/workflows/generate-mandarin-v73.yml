name: Record mature pinyin and correct Anna dialogue voices
on:
  push:
    paths:
      - ".github/workflows/generate-mandarin-v73.yml"
      - "scripts/generate_mandarin_v73.py"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TTS and ffprobe
        run: |
          python -m pip install --disable-pip-version-check edge-tts==7.3.1
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Record all 190 pinyin samples plus 25 dialogue lines
        run: python scripts/generate_mandarin_v73.py
      - name: Commit all tested files to the same preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pinyin-reading-v3/ assets/dialogue-voices-v73/
          if git diff --cached --quiet; then
            echo "All recordings already present"
          else
            git commit -m "Record 190 new mature pinyin and 25 corrected Mandarin dialogue MP3s"
            git push
          fi
