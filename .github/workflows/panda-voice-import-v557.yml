name: Import exact Panda AI voice batch v557
on:
  push:
    branches: [panda-ai-voice-v557-20261125]
    paths: ['Panda_AI_v556_64_MP3.zip']
permissions:
  contents: write
jobs:
  import:
    if: github.ref == 'refs/heads/panda-ai-voice-v557-20261125'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python3 scripts/import-panda-voice-v557.py Panda_AI_v556_64_MP3.zip
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check:panda-screen
      - run: node scripts/verify-offline.cjs
      - name: Commit validated assets to the release branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm Panda_AI_v556_64_MP3.zip
          git add assets/panda-ai-voice-v557 assets/panda-approved-voice-registry-v516.mjs assets/offline-pack.json sw.js
          git commit -m 'Connect 64 exact user-supplied Xiaoxiao clips'
          git push origin HEAD:panda-ai-voice-v557-20261125
