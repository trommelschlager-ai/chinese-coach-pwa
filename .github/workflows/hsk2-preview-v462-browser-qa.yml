name: Panda Go HSK2 approved v464 mobile preview QA
on:
  push:
    paths:
      - .github/workflows/hsk2-preview-v462-browser-qa.yml
permissions:
  contents: write
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: google-chrome --version
      - name: Install CJK rendering fonts for accurate Chinese screenshots
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk && fc-cache -f
      - name: Test fixed navigation, design and actual interactive lesson controls
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/hsk2preview.log 2>&1 &
          sleep 2
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true,channel:'chrome',args:['--no-sandbox']});
          const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true});
          const errors=[];
          page.on('pageerror',e=>errors.push(e.message));
          await page.goto('http://127.0.0.1:4173/preview-hsk2-step6.html',{waitUntil:'networkidle'});
          const nav=page.locator('.steps button.step');
          assert.equal(await nav.count(),8,'Expected 8 step controls');
          const out='qa/hsk2-preview-v462';fs.mkdirSync(out,{recursive:true});
          const head=[];
          for(let step=1;step<=8;step++){
            await nav.nth(step-1).click();
            await page.waitForTimeout(150);
            const h=await page.locator('.top').boundingBox();
            const f=await page.locator('.bottom').boundingBox();
            assert(h&&f,'Header and footer present step '+step);
            assert(Math.abs(h.y)<1,'Header jump at step '+step);
            assert(f.y+f.height<=845,'Footer cut off step '+step);
            const horizontalOverflow=await page.evaluate(()=>document.documentElement.scrollWidth-innerWidth);
            assert(horizontalOverflow<=2,'Horizontal overflow on step '+step+': '+horizontalOverflow);
            head.push({step,top:h.y,headerHeight:h.height,footerY:f.y,footerHeight:f.height});
            if(step<=5){
              assert.equal(await page.locator('#demo-other .v460-stage').count(),1,'Approved layout present step '+step);
              if(step===1)assert.equal(await page.locator('.v460-feature-grid>div').count(),6);
              if(step===2){
                assert.equal(await page.locator('.v460-word-card').count(),6);
                const imgLoaded=await page.locator('.v460-word-card img').evaluateAll(xs=>xs.every(x=>x.complete&&x.naturalWidth>0));
                assert(imgLoaded,'Missing Panda photos on words step');
              }
              if(step===3)assert.equal(await page.locator('.v460-test-list button').count(),5);
              if(step===4)assert.equal(await page.locator('.v460-tokens button').count(),5);
              if(step===5)assert.equal(await page.locator('.v460-practice-grid button').count(),6);
              await page.screenshot({path:out+'/step-'+step+'.png'});
            }
          }
          assert.deepEqual(head.map(x=>Math.round(x.headerHeight)),Array(8).fill(Math.round(head[0].headerHeight)),'Inconsistent header heights');
          assert.equal(errors.length,0,'JS errors: '+errors.join('; '));
          await nav.nth(2).click();
          await page.locator('.bottom .go').click();
          assert.equal(await page.locator('.pg-choice').count(),4,'Test 1 opens');
          await nav.nth(3).click();
          for(let i of [0,1,2,3,4])await page.locator('[data-gram-token="'+i+'"]').click();
          await page.locator('[data-gram-check]').click();
          assert.match(await page.locator('#v460-gram-feedback').textContent(),/Верно/,'Grammar builder works');
          await nav.nth(4).click();
          for(let i=0;i<6;i++)await page.locator('[data-order="'+i+'"]').click();
          await page.locator('[data-order-check]').click();
          assert.match(await page.locator('.v460-stage .pg-feedback').textContent(),/Правильная|✓/,'Practice order works');
          console.log('PASS '+JSON.stringify(head));
          await browser.close();
          JS
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panda-go-hsk2-v462-android-390x844
          path: qa/hsk2-preview-v462
          if-no-files-found: warn
      - name: Save images to repo for visual review
        if: success()
        run: |
          git config user.name "Panda Go QA"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/hsk2-preview-v462/*.png
          if ! git diff --cached --quiet; then
            git commit -m "qa(hsk2): reviewed screenshots of approved 5 step demo"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
