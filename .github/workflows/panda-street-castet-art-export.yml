name: Panda Street castet art preview ONLY (no deploy)
on:
  push:
    branches:
      - experiment/panda-street-arm-rig-20261123
    paths:
      - '.github/workflows/panda-street-castet-art-export.yml'
      - 'tools/panda_street/castet_art_export.py'
      - 'art/panda-street/castet-mask-source-v1.UNAPPROVED.json'
      - 'assets/panda-street-day-night/night.webp'
      - 'assets/panda-street-day-night/day.webp'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export-static-layers-only:
    name: Prepare NON-PRODUCTION source-pixel layers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout experimental branch only
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pillow for exact source pixels
        run: python -m pip install 'Pillow>=11,<13'
      - name: Export original night/day castet cutouts, masks and comparison
        run: |
          python tools/panda_street/castet_art_export.py \
            --night assets/panda-street-day-night/night.webp \
            --day assets/panda-street-day-night/day.webp \
            --geometry art/panda-street/castet-mask-source-v1.UNAPPROVED.json \
            --output castet-art-preview
      - name: Upload only an isolated review artifact; never commit or deploy
        uses: actions/upload-artifact@v4
        with:
          name: panda-street-castet-art-UNAPPROVED
          path: castet-art-preview/
          if-no-files-found: error
          retention-days: 14
