name: HSK2 v458 illustrated demo hero
on:
  push:
    paths:
      - .github/workflows/hsk2-v458-hero.yml
permissions:
  contents: write
jobs:
  hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract approved Panda reading scene
        run: |
          python -m pip install -q pillow
          python - <<'PY'
          from PIL import Image
          import pathlib
          src=Image.open('assets/hsk2-preview-v449/step-1-approved.webp').convert('RGB')
          print('Original',src.size)
          if src.size!=(606,1036): raise RuntimeError('Unexpected source dimensions')
          out=pathlib.Path('assets/hsk2-preview-v457/hero-reading.webp')
          img=src.crop((23,195,292,461)).resize((485,480),Image.Resampling.LANCZOS)
          img.save(out,'WEBP',quality=94,method=6)
          print('Saved',out,out.stat().st_size)
          PY
      - name: Commit approved art
        run: |
          git config user.name "Panda Go Preview"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hsk2-preview-v457/hero-reading.webp
          if ! git diff --cached --quiet; then
            git commit -m "assets(hsk2): extract approved Panda reading hero v458"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
