name: Generate softer Chinese Pinyin MP3s v74
on:
  push:
    paths:
      - ".github/workflows/generate-soft-pinyin-v74.yml"
      - "scripts/generate_soft_pinyin_v74.py"
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install required audio tools
        run: |
          python -m pip install --disable-pip-version-check edge-tts==7.3.1
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Generate 190 MP3s with soft Xiaoxuan Mandarin voice
        run: python scripts/generate_soft_pinyin_v74.py
      - name: Commit only tested Pinyin recordings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pinyin-reading-v4/
          if ! git diff --cached --quiet; then
            git commit -m "Add 190 softer Xiaoxuan Pinyin MP3s"
            git push
          fi
