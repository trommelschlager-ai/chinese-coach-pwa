name: Import approved illustration preview
on:
  push:
    paths:
      - .github/workflows/import-approved-illustration-v370.yml
jobs:
  test-asset:
    runs-on: ubuntu-latest
    steps:
      - name: Package exact approved source preview as WebP
        env:
          SOURCE: "https://media.canva.com/v2/document-image/hash:-2015321024/height:596/id:DAHbAU_FYUg/type:B/width:335?brand=BAF96kU1tvQ&csig=AAAAAAAAAAAAAAAAAAAAAMQX3u0c2QdF6-4uAadVG43N3EBQ3LG5_DjMjfkmTYVj&exp=1794771068&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2F_FYUg%2FDAHbAU_FYUg%2F1%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUHW27RK5IK%252F20261114%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20261114T201843Z%26X-Amz-Expires%3D85126%26X-Amz-Signature%3D4dfcab122112e96e1ebcba641124acbd95c85845db5395c43f97cc025cb1c450%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DSun%252C%252015%2520Nov%25202026%252019%253A57%253A29%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAABKNH2NLTy3htik7kvyT2rhzRvEsFRnMpYSMZY21JBj2&page=1&signed=brand%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=1"
        run: |
          set -eu
          curl --fail --location --retry 2 --silent --show-error --max-time 40 -o /tmp/approved.png "$SOURCE"
          file /tmp/approved.png
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          im=Image.open("/tmp/approved.png").convert("RGB")
          print("dimensions", im.size)
          im.save("/tmp/approved.webp","WEBP",quality=83,method=6)
          print("bytes",__import__("os").path.getsize("/tmp/approved.webp"))
          PY
          echo IMAGEBEGIN
          base64 -w 3000 /tmp/approved.webp | while IFS= read -r line; do echo "IMAGECHUNK:$line"; done
          echo IMAGEEND
