name: HSK 1 human 日 correction install
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  install-native-ri:
    if: ${{ github.head_ref == 'fix/hsk1-female-pacing-ri-v157-20261106' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure ffprobe is available
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Download and inspect original native rì pronunciation
        run: python scripts/install-native-ri-v157.py
      - name: Keep correct source MP3 in this review branch only
        run: |
          git config user.name "Panda Go Pronunciation QA"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hsk1-voice-corrections-v157/ri-native-yue-tan.mp3
          if git diff --cached --quiet; then
            echo "Native correction already committed."
            exit 0
          fi
          git commit -m "audio(hsk1): add source-attributed native Mandarin 日"
          git push origin "HEAD:refs/heads/${{ github.head_ref }}"
