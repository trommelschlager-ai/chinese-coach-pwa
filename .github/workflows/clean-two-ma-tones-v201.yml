name: Clean HSK1 Mandarin second and third tone recordings
on:
  push:
    paths:
      - .github/workflows/clean-two-ma-tones-v201.yml
permissions:
  contents: write
jobs:
  clean-tone-samples:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Check ffmpeg tools
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
      - name: Remove noise from tone 2 and 3 only
        run: python3 scripts/clean-two-ma-tones-v201.py
      - name: Commit just two cleaned MP3 files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'assets/course-human-clean-v201/cmn-麻.mp3' 'assets/course-human-clean-v201/cmn-马.mp3'
          if ! git diff --cached --quiet; then
            git commit -m "Audio: retain native voice, reduce noise in má and mǎ only"
            git push origin HEAD:main
          fi
