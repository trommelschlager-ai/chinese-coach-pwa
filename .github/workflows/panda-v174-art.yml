name: Panda Go v174 approved artwork assets
on:
  push:
    branches: [feat/panda-reference-v174-artwork-rebuild]
    paths: ['scripts/build-panda-art-v174.py','.github/workflows/panda-v174-art.yml']
permissions: {contents: write}
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/panda-reference-v174-artwork-rebuild
          persist-credentials: true
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pillow==11.2.1 numpy opencv-python-headless
      - run: python scripts/build-panda-art-v174.py
      - name: Commit generated assets without stomping later edits
        run: |
          git config user.name "Panda Go Design QA"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/panda-go-hero-clean-v174.webp assets/panda-hsk1-mountain-v174.webp assets/panda-stone-staircase-v174.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "art(panda): reference-inspired clean hero and detailed mountain stone staircase"
          for i in 1 2 3 4 5; do
            git pull --rebase origin feat/panda-reference-v174-artwork-rebuild
            if git push origin HEAD:feat/panda-reference-v174-artwork-rebuild; then exit 0; fi
            sleep 2
          done
          exit 1
