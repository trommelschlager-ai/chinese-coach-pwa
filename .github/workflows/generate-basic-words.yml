name: Generate basic-word Mandarin preview MP3
on:
  push:
    paths:
      - ".github/workflows/generate-basic-words.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install synthesizer and ffprobe
        run: |
          python -m pip install --disable-pip-version-check edge-tts==7.3.1
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Generate all new vocabulary MP3 clips
        run: python scripts/generate_basic_word_audio.py
      - name: Commit reviewed preview files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/basic-words-audio/
          if ! git diff --cached --quiet; then
            git commit -m "Publish slow Xiaoyi preview audio for expanded basic words"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
