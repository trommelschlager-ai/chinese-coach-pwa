let take = null;
let recordUrl = '';
function cancelRecording() {
  const current = take;
  take = null;
  if (!current) return;
  if (current.recorder?.state === 'recording') {
    current.recorder.onstop = null;
    current.recorder.stop();
  }
  current.stream?.getTracks().forEach(track=>track.stop());
}
async function toggleRecording() {
  if (take?.recorder?.state === 'recording') {
    take.recorder.stop();
    return;
  }
  if (take) return;
  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
    setStatus('Запись недоступна в этом браузере.');
    return;
  }
  const current = {};
  const chunks = [];
  take = current;
  try {
    const input = await navigator.mediaDevices.getUserMedia({audio:true});
    if (take !== current) {
      input.getTracks().forEach(track=>track.stop());
      return;
    }
    current.stream = input;
    const recorder = new MediaRecorder(input);
    current.recorder = recorder;
    recorder.ondataavailable = event => { if (event.data.size) chunks.push(event.data); };
    recorder.onerror = () => {
      cancelRecording();
      setStatus('Не удалось записать звук.');
      render();
    };
    recorder.onstop = () => {
      if (take !== current) return;
      cancelRecording();
      if (recordUrl) URL.revokeObjectURL(recordUrl);
      recordUrl = URL.createObjectURL(new Blob(chunks,{type:recorder.mimeType}));
      setStatus('Запись готова. Нажми «Моя запись».',true);
      render();
    };
    recorder.start();
    setStatus('● Идёт запись. Нажми «Остановить», когда закончишь.');
    render();
  } catch {
    if (take !== current) return;
    cancelRecording();
    setStatus('Не удалось получить доступ к микрофону.');
  }
}
function replayRecording() {
  if (!recordUrl) return;
  clearMedia();
  audio = new Audio(recordUrl);
  audio.play().catch(()=>setStatus('Не удалось воспроизвести запись.'));
}
window.addEventListener('pagehide',()=>{
  clearMedia();
  if (recordUrl) URL.revokeObjectURL(recordUrl);
  recordUrl = '';
});

function play(text,button) {
  const clip = approvedLessonClips[normalize(text)];
  if (!clip) { setStatus('Для этой фразы пока нет утверждённой записи.'); return; }
  clearMedia();
  const player = new Audio(clip.src);
  audio = player;
  player.preload = 'auto';
  button.setAttribute('aria-pressed','true');
  let ready = !Number.isFinite(clip.start);
  player.muted = !ready;
  let timer = null;
  const done = () => {
    if (timer !== null) { clearInterval(timer); timer=null; }
    if (audio !== player) return;
    player.pause(); audio = null;
    button.removeAttribute('aria-pressed');
  };
  const fail = () => {
    if (audio !== player) return;
    done(); setStatus('MP3 не воспроизвёлся. Проверь соединение и повтори.');
  };
  const seek = () => {
    if (audio !== player || ready) return;
    try { player.currentTime = clip.start; } catch { fail(); }
  };
  player.addEventListener('loadedmetadata',seek,{once:true});
  player.addEventListener('seeked',() => {
    if (audio === player && !ready && Math.abs(player.currentTime - clip.start) < .12) {
      ready = true; player.muted = false;
    }
  });
  if (Number.isFinite(clip.end)) timer = setInterval(() => {
    if (audio !== player) { clearInterval(timer); timer=null; return; }
    if (ready && player.currentTime >= clip.end) done();
  },20);
  player.addEventListener('error',fail,{once:true});
  player.addEventListener('ended',done,{once:true});
  if (player.readyState >= 1) seek();
  try { const pending = player.play(); if (pending?.catch) pending.catch(fail); } catch { fail(); }
}

function recognize(allowed,onMatch,onMiss) {
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Recognition || !window.isSecureContext) {
    state.practiceMode = 'self'; save();
    setStatus('Распознавание недоступно. Можно попробовать другой браузер или воспользоваться запасной самопроверкой в разделе «Речь».');
    return;
  }
  clearMedia();
  let instance;
  try {
    instance = new Recognition();
    speech = instance;
    instance.lang = 'zh-CN';
    instance.continuous = false;
    instance.interimResults = false;
    instance.maxAlternatives = 3;
    instance.onresult = event => {
      if (speech !== instance) return;
      speech = null;
      const alternatives = Array.from(event.results[event.resultIndex || 0], item => item.transcript);
      const match = allowed.find(text => alternatives.some(heard => normalize(heard) === normalize(text)));
      if (match) onMatch(match);
      else {
        if (onMiss) onMiss();
        setStatus('Распознано «' + (alternatives[0] || '…') + '». Попробуй ещё раз. Тоны не оценивались.');
      }
    };
    instance.onerror = event => {
      if (speech !== instance) return;
      speech = null;
      const errors = {
        'not-allowed':'Разреши доступ к микрофону в настройках браузера и попробуй снова.',
        'audio-capture':'Браузер не нашёл доступный микрофон.',
        network:'Сервис распознавания речи недоступен. Проверь соединение и попробуй снова.',
        'no-speech':'Браузер не распознал речь. Попробуй ещё раз.',
        'service-not-allowed':'Сервис распознавания отключён. Используй запасной режим.',
        'language-not-supported':'Китайский язык не поддерживается сервисом распознавания.'
      };
      setStatus((errors[event.error] || 'Распознавание речи недоступно. Попробуй ещё раз.') +
        ' Если проблема сохраняется, используй запасную самопроверку в разделе «Речь».');
    };
    instance.onend = () => {
      if (speech !== instance) return;
      speech = null;
      setStatus('Речь не распознана. Попробуй ещё раз.');
    };
    instance.start();
    setStatus('Слушаю…');
  } catch {
    if (speech === instance) speech = null;
    setStatus('Микрофон не запустился. Проверь разрешение и попробуй снова.');
  }
}

function markQuiz(ok,method) {
  const t = state.quizTest;
  const i = state.quizIndex;
  const attempt = activeQuiz();
  if (attempt.quiz[t][i]) return;
  if (ok) {
    const answer = {correctFirst:method !== 'self' && !attempt.missed[t][i],method};
    attempt.quiz[t][i] = answer;
    state.quiz[t][i] ??= {...answer,correctFirst:answer.correctFirst && !state.missed[t][i]};
    save();
    setStatus(method === 'self' ? '✓ Самостоятельная практика выполнена. Тоны не оценивались.'
      : method === 'speech' ? '✓ Слово распознано. Тоны не оценивались.' : '✓ Верно. Ответ засчитан.',true);
    render();
  } else {
    recordQuizMiss(t,i);
    save();
    setStatus('Пока неверно. Попробуй ещё раз.');
  }
}

function recordQuizMiss(type,index) {
  activeQuiz().missed[type][index] = true;
  if (!state.quiz[type][index]) state.missed[type][index] = true;
}

function adjacentCourseTask(direction) {
  const type = state.courseQuizType;
  for (let index = state.courseQuizCursor + direction; index >= 0 && index < courseQuiz.length; index += direction) {
    if (type === null || (type === -1 ? courseQuiz[index].type !== 0 : courseQuiz[index].type === type)) return index;
  }
  return direction === 1 && (type===null || type===-1) ? courseQuiz.length : -1;
}

function showCourseTask(cursor) {
  clearMedia();
  state.courseQuizCursor = cursor < 0 ? null : Math.min(cursor,courseQuiz.length);
  if (cursor < 0) {
    state.courseQuizType = null;
    state.quizRetry = null;
  }
  state.quizPicked = [];
  heardClip = null;
  feedback = '';
  render(true);
  save();
  workspace.querySelector('.section-panel h1[tabindex]')?.focus({preventScroll:true});
}

function startTests() {
  if (!courseMode) {
    openTest(Math.max(0,tests.findIndex((_,i) => correctCount(i) < words.length)));
    return;
  }
  state.courseQuizType=0;state.quizRetry=null;
  const firstPending=courseQuiz.findIndex(({type,index})=>type===0&&!state.quiz[0][index]);
  if(firstPending<0)showCourseTask(-1);else showCourseTask(firstPending);
}
function startOptionalTests(){
  state.courseQuizType=-1;state.quizRetry=null;
  const pending=courseQuiz.findIndex(({type,index})=>type!==0&&!state.quiz[type][index]);
  showCourseTask(pending<0?courseQuiz.length:pending);
}

function startCourseReplay(type) {
  state.courseQuizType = type;
  state.quizRetry = {
    quiz:tests.map(() => Array(words.length).fill(null)),
    missed:tests.map(() => Array(words.length).fill(false))
  };
  showCourseTask(courseQuiz.findIndex(task => type === null || task.type === type));
}

function startCourseType(type) {
  state.courseQuizType = type;
  const firstPending = courseQuiz.findIndex(task => task.type === type && !state.quiz[type][task.index]);
  if (firstPending < 0) startCourseReplay(type);
  else showCourseTask(firstPending);
}

function openTest(test) {
  clearMedia();
  state.quizTest = test;
  state.quizIndex = test === null ? 0 : Math.max(0,state.quiz[test].findIndex(result => !result));
  state.quizPicked = [];
  heardClip = null;
  feedback = '';
  save();
  render(true);
}

function changeQuestion(direction) {
  const index = state.quizIndex + direction;
  if (index >= words.length) {
    openTest(null);
    return;
  }
  if (index < 0) return;
  clearMedia();
  state.quizIndex = index;
  state.quizPicked = [];
  heardClip = null;
  feedback = '';
  save();
  render(true);
}

function update() {
  feedback = '';
  save();
  render();
}

function markSelfSpoken(index) {
  if (!Number.isInteger(index) || index < 0 || index >= words.length) return;
  if (!state.heardWords.includes(index)) {
    setStatus('Сначала изучи и отметь это слово на первом шаге, затем повтори.');
    return;
  }
  if (!state.selfSpoken.includes(index)) state.selfSpoken.push(index);
  save();
  setStatus('✓ Отмечено самостоятельное повторение. Правильность тонов не подтверждена.',true);
  render();
}
function onMic(id) {
  if (id === 'chat') {
    const row = dialogue[state.chat.length];
    if (!row) return;
    recognize(row.answers.map(a => a[0]),answer => {
      state.chat.push(answer);
      save();
      setStatus('✓ Ответ распознан.',true);
      render();
      followDialogue();
    });
  } else if (id === 'quiz') {
    recognize([words[state.quizIndex].zh],() => markQuiz(true,'speech'),() => {
      recordQuizMiss(state.quizTest,state.quizIndex);
      save();
    });
  } else {
    const index = Number(id);
    recognize([words[index].zh],match => {
      if (!state.mic.includes(index)) state.mic.push(index);
      save();
      setStatus('✓ Распознано «' + match + '». Тоны не оценивались.',true);
      render();
    });
  }
}

function followDialogue() {
  const target = workspace.querySelector('.dialogue .chat-bubble:last-of-type');
  if (target) target.scrollIntoView({block:'nearest'});
}

function checkOrder(part,length,success,failure) {
  const order = part === 'grammar' ? state.grammar : state.dayOrder;
  const ok = order.length === length && order.every((value,i) => value === i);
  state[part + 'Done'] = ok;
  save();
  setStatus(ok ? success : failure,ok);
  render();
}

const actions = {
  step: value => {
    if (courseMode && state.step === 3 && Number(value) === 3) showCourseTask(-1);
    else move(Number(value));
  },
  say: (value,button) => play(value,button),
  test: value => openTest(Number(value)),
  quizType: value => startCourseType(Number(value)),
  quizRetry: value => startCourseReplay(value === 'all' ? null : Number(value)),
  start: startTests,
  quizExtended: startOptionalTests,
  question: value => changeQuestion(Number(value)),
  choice: value => {
    const correct = state.quizTest === 1 ? listening[state.quizIndex][1] : state.quizIndex;
    markQuiz(Number(value) === correct,'choice');
  },
  letter: value => { state.quizPicked.push(Number(value)); update(); },
  letterClear: () => { state.quizPicked = []; update(); },
  letterCheck: () => {
    const target = words[state.quizIndex].zh;
    markQuiz(state.quizPicked.map(i => [...target][i]).join('') === target,'assemble');
  },
  gram: value => { state.grammar.push(Number(value)); state.grammarDone = false; update(); },
  gramUndo: () => { state.grammar.pop(); state.grammarDone = false; update(); },
  gramClear: () => { state.grammar = []; state.grammarDone = false; update(); },
  gramCheck: () => checkOrder('grammar',5,'✓ Верно: 我们一起去吧。','Порядок: 我们 → 一起 → 去 → 吧 → 。'),
  wordsRead: () => {
    state.heardWords = words.map((_,i) => i);
    save(); render();
    setStatus('✓ Повторение отмечено. Тоны не проверялись.',true);
  },
  learn: value => {
    const i=Number(value);
    if(!Number.isInteger(i)||i<0||i>=words.length)return;
    if(!state.heardWords.includes(i))state.heardWords.push(i);
    save();render();
  },
  toneTab: value => { clearMedia(); state.toneTab = value; update(); },
  practiceMode: value => { if (value === 'mic' || value === 'self') {state.practiceMode = value; update();} },
  selfSpoken: value => markSelfSpoken(Number(value)),
  selfQuiz: () => { if (state.step === 3 && state.quizTest === 4) markQuiz(true,'self'); },
  mic: value => onMic(value),
  chat: value => {
    clearMedia();
    state.chat.push(dialogue[state.chat.length].answers[Number(value)][0]);
    update();
    followDialogue();
  },
  chatReset: () => { clearMedia(); state.chat = []; update(); },
  hobby: value => {
    state.personal.hobby = value;
    state.personalRead = [];
    update();
  },
  personalRead: () => {
    state.personalRead = state.personalRead.length ? [] : [0];
    update();
  },
  record: () => toggleRecording(),
  replay: () => replayRecording()
};
app.addEventListener('change',event=>{
  if(event.target.id==='hobby-choice') actions.hobby(event.target.value);
});

let pressedNavButton;
let pressedNavTimer;
app.addEventListener('click',event => {
  const button = event.target.closest('.pg433-header button, .pg433-footer button');
  if (!button || button.disabled) return;
  pressedNavButton?.classList.remove('lesson-button-pressed');
  clearTimeout(pressedNavTimer);
  pressedNavButton = button;
  button.classList.add('lesson-button-pressed');
  pressedNavTimer = setTimeout(() => button.classList.remove('lesson-button-pressed'),160);
},true);

app.addEventListener('click',event => {
  const button = event.target.closest('button');
  if (!button || button.disabled) return;
  for (const [action,value] of Object.entries(button.dataset)) {
    if (Object.hasOwn(actions,action)) {
      actions[action](value,button);
      break;
    }
  }
});

function previousStep() {
  if (courseMode && state.step === 3 && state.courseQuizCursor !== null) {
    showCourseTask(-1);
  } else if (state.step === 3 && state.quizTest !== null) {
    openTest(null);
  } else {
    move(courseMode ? courseSteps[courseSteps.indexOf(state.step)-1] : state.step-1);
  }
}

back.addEventListener('click',previousStep);
headBack.addEventListener('click',previousStep);
next.addEventListener('click',() => {
  if (!currentStepComplete()) {
    setStatus('Заверши текущее упражнение, чтобы продолжить.');
    return;
  }
  if (courseMode && state.step === 3) {
    if (state.courseQuizCursor === null) {
      if(coreQuizDone())move(5);else startTests();
      return;
    }
    if (state.quizTest !== null) {
      showCourseTask(adjacentCourseTask(1));
      return;
    }
  }
  move(state.step === 8 ? 1 : (courseMode ? courseSteps[courseSteps.indexOf(state.step)+1] : state.step+1));
});

const fromQuery = Number(layoutParams.get('step'));
if (Number.isInteger(fromQuery) && fromQuery >= 1 && fromQuery <= 8) {
  if (!courseMode || state.step !== fromQuery) state.quizTest = null;
  state.step = fromQuery;
}
if (!Number.isInteger(state.step) || state.step < 1 || state.step > 8) state.step = 1;
if (courseMode) {
  layoutParams.set('step',state.step);
  history.replaceState({pgHsk2Lesson5:true,step:state.step},'','?' + layoutParams + location.hash);
  window.addEventListener('popstate',event => {
    if (!event.state?.pgHsk2Lesson5) return;
    const requested = Number(event.state.step);
    const target = Number.isInteger(requested) && requested >= 1 && requested <= 8
      ? requested : 2;
    clearMedia();
    state.step = target;
    state.quizTest = null;
    state.courseQuizCursor = null;
    feedback = '';
    layoutParams.set('step',target);
    save();
    render(true);
  });
}
save();
render(true);

window.PandaGoHSK2Preview = {
  getProgress: () => JSON.parse(JSON.stringify(state)),
  goToStep: move
};
