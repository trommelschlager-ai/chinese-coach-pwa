e span{display:block;font-size:11px;color:#a35db1}.bubble small{display:block;font-size:12px;color:#665077;margin-top:4px}.options{display:grid;gap:8px}.choice{border:1.5px solid #e7c7eb;background:#fff;border-radius:13px;padding:11px;text-align:left;color:#59387e;font-size:15px;font-weight:800}.choice:focus-visible,.next:focus-visible{outline:3px solid #b578e8;outline-offset:2px}.choice.correct{background:#e5f9ec;border-color:#69bd85}.choice.incorrect{background:#ffebee;border-color:#f0a4a6}.feedback{text-align:center;font-size:12px;font-weight:850;min-height:18px}.feedback.ok{color:#248651}.feedback.bad{color:#ba456a}.toggle{align-self:center;border:0;background:transparent;color:#8758a0;font-size:12px;text-decoration:underline;padding:4px}.actions{display:flex;gap:10px;padding:9px 20px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,#e9dcf5 40%)}.actions button{border-radius:16px;padding:14px 15px;font-weight:900;border:1.5px solid #d9b4e2}.prev{background:#fff8ff;color:#6c3d91;min-width:95px}.next{flex:1;border-color:#a973cc!important;background:linear-gradient(135deg,#a977da,#8e4dc6);color:white;box-shadow:0 6px 15px #a766c84d}.only-end{text-align:center;font-size:13px;color:#80608f}.voice{background:#fff5dc;border:1px solid #ead196;border-radius:11px;padding:8px 10px;font-size:11px;color:#856535;text-align:center;line-height:1.3}.hidden-pinyin .pinyin,.hidden-pinyin .term em,.hidden-pinyin .bubble span,.hidden-pinyin .example span{visibility:hidden}.small{font-size:12px!important}.done-badge{font-size:42px;text-align:center}.fineprint{margin:4px 0 0;color:#9478a6;font-size:10px;text-align:center}@media(min-width:550px){.app{height:min(850px,98svh);border:2px solid #d5b5e5;border-radius:29px;box-shadow:0 20px 75px #5d306b44}}@media(max-height:680px){header{padding-top:calc(7px + env(safe-area-inset-top));padding-bottom:6px}.meter{margin-bottom:7px}.heading{margin:3px 0 4px;font-size:21px}.subtitle{margin-bottom:5px;font-size:12px}.hero{gap:5px;padding:10px}.panda{font-size:34px}.hanzi{font-size:27px}.term{padding:5px 9px}.term strong{font-size:17px}.bubble{padding:7px 10px}.bubble b{font-size:15px}.bubble small{font-size:11px}.actions{padding-top:5px;padding-bottom:calc(7px + env(safe-area-inset-bottom))}.actions button{padding:11px}.voice{padding:5px 7px}}

<script>
(()=>{
'use strict';
const data=JSON.parse(document.getElementById('lesson-data').textContent);
const stages=[
 {kind:'intro',title:'Сначала изучим слова',sub:'Потом из знакомых слов составим предложения. Никакой перегрузки.'},
 {kind:'words',title:'Новые слова · 1',sub:'Язык, занят, изучать, 很.',range:[0,4]},
 {kind:'words',title:'Новые слова · 2',sub:'Сейчас, 在, дом, работа.',range:[4,8]},
 {kind:'words',title:'Новые слова · 3',sub:'Использовать, телефон, затем, отдыхать.',range:[8,12]},
 {kind:'quiz',title:'Узнай слово · 1',sub:'Что означает 忙 (máng)?',choices:['дом','занят','затем'],correct:1},
 {kind:'quiz',title:'Узнай слово · 2',sub:'Как переводится 用 (yòng)?',choices:['изучать','использовать','работать'],correct:1},
 {kind:'word-review',title:'Закрепим слова',sub:'Повтори их прежде, чем строить предложение.'},
 {kind:'rule-svo',title:'Кто + делает + что?',sub:'Основной порядок: подлежащее → глагол → дополнение.'},
 {kind:'rule-adj',title:'Как сказать «я занят»?',sub:'Прилагательное может быть сказуемым без 是.'},
 {kind:'rule-time',title:'Когда?',sub:'Слово времени обычно ставится перед глаголом.'},
 {kind:'rule-place',title:'Где?',sub:'В 在家 слово 在 показывает место.'},
 {kind:'rule-contrast',title:'Два значения 在',sub:'«Где нахожусь» и «что делаю сейчас» — разные конструкции.'},
 {kind:'rule-use',title:'Чем пользуюсь?',sub:'用 + предмет + действие: «с помощью чего».'},
 {kind:'rule-then',title:'Что происходит потом?',sub:'然后 соединяет два последовательных действия.'},
 {kind:'dialogue',title:'Диалог · часть 1',sub:'Все основные слова уже знакомы.',range:[0,2]},
 {kind:'dialogue',title:'Диалог · часть 2',sub:'Прочитай без пиньинь, если получается.',range:[2,4]},
 {kind:'build',title:'Собери предложение',sub:'Нажимай на слова по порядку.',tokens:['中文','现在','学习','我'],answer:['我','现在','学习','中文']},
 {kind:'quiz',title:'Проверка: 在',sub:'Как перевести 我在家?',choices:['Я занят','Я дома','Я сейчас работаю'],correct:1},
 {kind:'quiz',title:'Проверка: 用',sub:'Что значит 我用手机学习中文?',choices:['Я покупаю телефон.','Я изучаю китайский с помощью телефона.','Сейчас телефон занят.'],correct:1},
 {kind:'end',title:'Первый шаг пройден!',sub:'12 слов → понятные правила → реальные предложения. Можно повторять.'}
];
const $=id=>document.getElementById(id),key='pg-hsk2-foundation-v3-progress';
let state={step:0,answers:{},builds:{},showPinyin:true};
try{const v=JSON.parse(localStorage.getItem(key)||'null');if(v&&Number.isInteger(v.step))state={...state,...v,step:Math.max(0,Math.min(stages.length-1,v.step)),answers:v.answers||{},builds:v.builds||{}}}catch{}
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch{}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function term(w){return '<div class="term"><div><strong lang="zh-Hans">'+esc(w.hanzi)+'</strong><em>'+esc(w.pinyin)+'</em></div><small>'+esc(w.ru)+'</small></div>'}
function eg(o){return '<div class="example"><b lang="zh-Hans">'+esc(o.hanzi)+'</b><span>'+esc(o.pinyin)+'</span><small>'+esc(o.ru)+'</small></div>'}
function line(o){return '<div class="bubble '+(o.who==='B'?'b':'')+'"><b lang="zh-Hans">'+esc(o.hanzi)+'</b><span>'+esc(o.pinyin)+'</span><small>'+esc(o.ru)+'</small></div>'}
function render(){
 const s=stages[state.step],a=state.answers[state.step];
 $('stepnote').textContent=(state.step+1)+' / '+stages.length;
 $('progress').style.width=(100*(state.step+1)/stages.length)+'%';
 $('kicker').textContent='HSK 2 · УРОК 1 · ГРАММАТИЧЕСКИЙ ФУНДАМЕНТ';
 $('heading').textContent=s.title;$('subtitle').textContent=s.sub;
 let html='';
 if(s.kind==='intro')html='<div class="panda" aria-hidden="true">🐼🌸</div><span class="tag">Слова → Фразы → Правила → Практика</span><div class="hanzi">中文 · 忙 · 学习</div><div class="pinyin">Zhōngwén · máng · xuéxí</div><div class="translation">китайский · занят · изучать</div><div class="note">20 небольших экранов. Все слова сначала объясняются отдельно.</div>';
 if(s.kind==='words')html='<div class="terms">'+data.vocabulary.slice(...s.range).map(term).join('')+'</div><div class="note">Читай пиньинь с тонами. Если слова незнакомы, повтори карточки.</div>';
 if(s.kind==='word-review')html='<div class="rule">ВСПОМНИ БЕЗ ПОДСКАЗКИ</div><div class="terms">'+[data.vocabulary[0],data.vocabulary[1],data.vocabulary[4],data.vocabulary[8]].map(term).join('')+'</div><div class="note">Проверь перевод и тон: 中文 zhōngwén, 忙 máng, 现在 xiànzài, 用 yòng.</div>';
 if(s.kind==='rule-svo')html='<div class="rule">КТО + ГЛАГОЛ + ЧТО</div>'+eg(data.examples[0])+'<div class="note">我 — кто? 学习 — что делает? 中文 — что изучает? Глагол не изменяется по лицам.</div>';
 if(s.kind==='rule-adj')html='<div class="rule">КТО + 很 + ПРИЛАГАТЕЛЬНОЕ</div>'+eg(data.examples[1])+'<div class="note">忙 — «занят». Перед прилагательным обычно не ставим 是. 很 нередко звучит нейтрально и не обязательно подчёркивает «очень».</div>';
 if(s.kind==='rule-time')html='<div class="rule">КТО + КОГДА + ДЕЙСТВИЕ</div>'+eg(data.examples[2])+'<div class="note">现在 значит «сейчас», а 在 перед 工作 показывает действие в процессе.</div>';
 if(s.kind==='rule-place')html='<div class="rule">КТО + 在 + МЕСТО + ДЕЙСТВИЕ</div>'+eg(data.examples[3])+'<div class="note">在家 (zài jiā) — «дома». Пример: 我在家学习中文 — «Я учу китайский дома».</div>';
 if(s.kind==='rule-contrast')html='<div class="rule">在 + МЕСТО ≠ 在 + ГЛАГОЛ</div>'+eg(data.examples[6])+eg(data.examples[5])+'<div class="note">我在家 — «я дома». 我在学习中文 — «я сейчас учу китайский». Один знак, две функции.</div>';
 if(s.kind==='rule-use')html='<div class="rule">КТО + 用 + ЧЕМ + ДЕЙСТВИЕ</div>'+eg(data.examples[7])+'<div class="note">用 (yòng) — «использовать, при помощи». Показывает средство действия: 用手机 — «с помощью телефона».</div>';
 if(s.kind==='rule-then')html='<div class="rule">ДЕЙСТВИЕ 1 + 然后 + ДЕЙСТВИЕ 2</div>'+eg(data.examples[8])+'<div class="note">然后 (ránhòu) значит «затем». Используем его, когда одно действие следует за другим.</div>';
 if(s.kind==='dialogue')html='<div class="dialogue">'+data.dialogue.slice(...s.range).map(line).join('')+'</div><div class="note">Вопросительная частица 吗 знакома из HSK 1. Сначала прочитай с пиньинь, затем без.</div>';
 if(s.kind==='build'){
  const chosen=state.builds[state.step]||[];
  const complete=chosen.length===s.tokens.length,answer=chosen.map(i=>s.tokens[i]).join('');
  const ok=complete&&answer===s.answer.join('');
  html='<div class="rule">Я сейчас учу китайский.</div><div class="terms"><div class="example"><b lang="zh-Hans">'+(chosen.length?esc(answer):'…')+'</b><small>Кто → когда → глагол → что</small></div><div class="word-buttons">'+s.tokens.map((v,i)=>'<button type="button" class="choice" data-token="'+i+'" '+(chosen.includes(i)?'disabled':'')+'>'+esc(v)+'</button>').join('')+'</div><button type="button" class="toggle" data-reset="1">Начать заново ↻</button></div><div class="feedback '+(complete?(ok?'ok':'bad'):'')+'">'+(complete?(ok?'✓ Правильно!':'Проверь порядок и повтори.'):'Нажми на слова в правильном порядке.')+'</div>';
 }
 if(s.kind==='quiz')html='<div class="options">'+s.choices.map((v,i)=>'<button type="button" class="choice '+(a!=null?(i===s.correct?'correct':i===a?'incorrect':''):'')+'" data-choice="'+i+'" '+(a!=null?'disabled':'')+'>'+esc(v)+'</button>').join('')+'</div><div role="status" class="feedback '+(a==null?'':a===s.correct?'ok':'bad')+'">'+(a==null?'Выбери ответ.':a===s.correct?'✓ Верно!':'✗ Правильный вариант выделен зелёным.')+'</div>';
 if(s.kind==='end')html='<div class="done-badge" aria-hidden="true">🌸🐼</div>'+eg(data.examples[4])+'<div class="note">Важно: мы пока прошли только вводную часть грамматического фундамента, не весь экзаменационный HSK 2. Аудио добавим после проверки.</div>';
 $('hero').innerHTML=html;
 $('app').classList.toggle('hidden-pinyin',!state.showPinyin);
 $('pinyin-toggle').textContent=state.showPinyin?'Скрыть пиньинь':'Показать пиньинь';
 $('pinyin-toggle').setAttribute('aria-pressed',String(state.showPinyin));
 $('prev').disabled=state.step===0;
 const full=s.kind==='build'&&(state.builds[state.step]||[]).length===s.tokens.length;
 const correctBuild=full&&(state.builds[state.step]||[]).map(i=>s.tokens[i]).join('')===s.answer.join('');
 $('next').disabled=(s.kind==='quiz'&&a==null)||(s.kind==='build'&&!correctBuild);
 $('next').textContent=s.kind==='end'?'Повторить урок ↻':'Дальше →';
 $('hero').querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{state.answers[state.step]=Number(b.dataset.choice);save();render()}));
 $('hero').querySelectorAll('[data-token]').forEach(b=>b.addEventListener('click',()=>{const chosen=state.builds[state.step]||[];if(!chosen.includes(Number(b.dataset.token))){state.builds[state.step]=[...chosen,Number(b.dataset.token)];save();render()}}));
 $('hero').querySelectorAll('[data-reset]').forEach(b=>b.addEventListener('click',()=>{state.builds[state.step]=[];save();render()}));
}
$('prev').addEventListener('click',()=>{if(state.step>0){state.step--;save();render()}});
$('next').addEventListener('click',()=>{
 if(state.step===stages.length-1){state={step:0,answers:{},builds:{},showPinyin:state.showPinyin};save();render();return}
 const s=stages[state.step];
 if(s.kind==='quiz'&&state.answers[state.step]==null)return;
 if(s.kind==='build'&&(state.builds[state.step]||[]).map(i=>s.tokens[i]).join('')!==s.answer.join(''))return;
 state.step++;save();render()
});
$('pinyin-toggle').addEventListener('click',()=>{state.showPinyin=!state.showPinyin;save();render()});
render();
})();
</script>
</body></html>
