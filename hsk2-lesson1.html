<script>

const words = [

  {zh:'睡觉', py:'shuìjiào', ru:'спать, ложиться спать', tones:[4,4], fill:'我晚上十点____。', hint:'Я ложусь спать в десять вечера.'}

const phrases = [
  ['你每天几点起床？','Nǐ měitiān jǐ diǎn qǐchuáng?','Во сколько ты каждый день встаёшь?'],
  ['我每天七点起床。','Wǒ měitiān qī diǎn qǐchuáng.','Я каждый день встаю в семь часов.'],
  ['我起床以后洗脸。','Wǒ qǐchuáng yǐhòu xǐliǎn.','После того как я встаю, я умываюсь.'],
  ['我早上吃早饭。','Wǒ zǎoshang chī zǎofàn.','Утром я завтракаю.'],
  ['我八点去上班。','Wǒ bā diǎn qù shàngbān.','Я иду на работу в восемь.'],
  ['我晚上十点睡觉。','Wǒ wǎnshang shí diǎn shuìjiào.','Я ложусь спать в десять вечера.']

const dialogue = [
  {prompt:phrases[0], answers:[[phrases[1][0],'В семь часов'],['我每天八点起床。','В восемь часов']]},
  {prompt:['你早上做什么？','Nǐ zǎoshang zuò shénme?','Что ты делаешь утром?'], answers:[['我早上洗脸。','Умываюсь'],[phrases[3][0],'Завтракаю']]},
  {prompt:['你起床以后做什么？','Nǐ qǐchuáng yǐhòu zuò shénme?','Что ты делаешь после подъёма?'], answers:[[phrases[2][0],'Умываюсь'],['我起床以后刷牙。','Чищу зубы']]}
];

const normalize = text => text.replace(/[\p{P}\s]/gu, '');
const clips = new Map([
  ['你早上做什么','p019'], ['我早上吃早饭','p020'],
  ['你起床以后做什么','p021'], ['我起床以后洗脸','p022']
].map(([text,id]) => [text, 'assets/panda-voice-clips-v365/' + id + '.mp3']));
for (const [text,id] of [
  ['我七点起床','g033'], ['我晚上十点睡觉','g034'],
  ['我八点去上班','g035'], ['我每天六点起床','g036']
]) clips.set(text, 'assets/panda-grammar-voice-v451/' + id + '.mp3');
// User-supplied 2026-11-19 Luvvoice recording, cut into eleven exact same-speaker MP3 phrases.
for (const [text,recording] of Object.entries(window.PandaGoHSK2Lesson1NativeAudioV459 || {})) {
  clips.set(normalize(text), recording);
}

// Exactly one listening exercise for each of the six vocabulary items.
const listening = [
  ['我每天七点起床。',0],
  ['我起床以后洗脸。',1],
  ['我起床以后刷牙。',2],
  ['我早上吃早饭。',3],
  ['我八点去上班。',4],
  ['我晚上十点睡觉。',5]
];
const layoutParams = new URLSearchParams(location.search);
const courseMode = true;
const courseSteps = [1,2,4,6,3,5,7,8];
const courseSections = [
  {name:'Слова',steps:[2]},
  {name:'Правило',steps:[4]},
  {name:'Речь',steps:[6]},
  {name:'Тест',steps:[3,5]},
  {name:'Примеры',steps:[7,8]}
];
// Listening results retain their original indices so completed work survives the switch.
const courseQuiz = words.flatMap((_,word) =>
  [0,1,2,3,4].map(type => ({type,index:word,word})));
const stepNumber = step => courseMode ? courseSteps.indexOf(step)+1 : step;
const titles = ['Вступление','Новые слова','Проверь слова','Грамматика','Мой распорядок','Тренировка тонов','Фразы и диалог','Завершение'];
const tests = ['Значение слова','По аудио','Собери слово','Заполни фразу','Произнеси'];
const testHelp = ['Выбери правильный перевод.','Послушай и выбери действие.','Расставь иероглифы по порядку.','Подставь слово в предложение.','Скажи слово в микрофон.'];
const tokens = ['我','起床','以后','洗脸','。'];
const key = 'panda-go-hsk2-lesson1-word-flow-review-v1';
const priorLessonKey = 'panda-go-hsk2-lesson1-approved-preview-v2';
const courseProgressKey = 'pg-hsk2-my-day-main-v1';

function mixedDay() {
  const order = [0,1,2,3,4,5];
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [order[i],order[j]] = [order[j],order[i]];
  }
  if (order.every((item,i) => item === i)) order.push(order.shift());
  return order;
}

function blank() {
  return {
    step:1, quiz:tests.map(() => words.map(() => null)),
    missed:tests.map(() => words.map(() => false)), quizTest:null, quizIndex:0, quizPicked:[], courseQuizCursor:null, courseQuizType:null, quizRetry:null,
    grammar:[], grammarDone:false, dayOrder:[], dayShuffled:mixedDay(), dayDone:false,
    mic:[], chat:[], toneTab:'words', unlockedSection:0,
    heardWords:[], selfSpoken:[], practiceMode:'mic', routine:{wake:'7',breakfast:'yes',work:'go',sleep:'10'}
  };
}

function readProgress(storageKey) {
  try {
    return JSON.parse(localStorage.getItem(storageKey));
  } catch {
    return null;
  }
}

function restore() {
  const defaults = blank();
  const approved = readProgress(key);
  const prior = approved?.migrationV1 ? null : readProgress(priorLessonKey);
  if (!prior) return Object.assign(defaults,approved,{migrationV1:true});
  const result = Object.assign(defaults,prior,approved);
  result.quiz = tests.map((_,type) => words.map((_,index) =>
    approved?.quiz?.[type]?.[index] ?? prior.quiz?.[type]?.[index] ?? null));
  result.missed = tests.map((_,type) => words.map((_,index) =>
    Boolean(approved?.missed?.[type]?.[index] || prior.missed?.[type]?.[index])));
  for (const [flag,order] of [['grammarDone','grammar'],['dayDone','dayOrder']]) {
    if (prior[flag] && !result[flag]) {
      result[flag] = true;
      result[order] = prior[order];
    }
  }
  result.mic = [...new Set([...(prior.mic ?? []),...(approved?.mic ?? [])])];
  if ((prior.chat?.length ?? 0) > (result.chat?.length ?? 0)) result.chat = prior.chat;
  result.migrationV1 = true;
  return result;
}

let state = restore();
state.heardWords = [...new Set((Array.isArray(state.heardWords) ? state.heardWords : []).filter(i => Number.isInteger(i) && i >= 0 && i < words.length))];
state.selfSpoken = [...new Set((Array.isArray(state.selfSpoken) ? state.selfSpoken : []).filter(i => Number.isInteger(i) && i >= 0 && i < words.length))];
state.mic = [...new Set((Array.isArray(state.mic) ? state.mic : []).filter(i => Number.isInteger(i) && i >= 0 && i < words.length))];
state.practiceMode = 'mic'; // Start each session with the primary microphone mode.
let audio = null;
let speech = null;
let feedback = '';
let positive = false;
let heardClip = null;
const app = document.getElementById('app');
const workspace = document.getElementById('workspace');
const nav = document.getElementById('steps');
const headLabel = document.getElementById('head-label');
const headBack = document.getElementById('detail-back');
const back = document.getElementById('back');
const next = document.getElementById('next');
let counter;
if (courseMode) {
  const frame = document.createElement('div');
  frame.id = 'pg433';
  frame.append(...app.children);
  app.append(frame);
  nav.removeAttribute('id');
  nav.className = 'pg433-tabs';
  nav.setAttribute('aria-label','Разделы урока');
  const top = headBack.parentElement;
  top.className = 'pg433-topline';
  top.parentElement.className = 'pg433-header';
  headBack.className = 'pg433-back';
  headBack.textContent = '‹';
  headLabel.className = 'pg433-title';
  headLabel.removeAttribute('id');
  headLabel.innerHTML = '<small>HSK 2 · Урок 2</small><strong>Мой день</strong>';
  const chapter = document.createElement('span');
  chapter.className = 'pg433-pill';
  chapter.textContent = 'Урок 2 · Мой день';
  top.append(chapter);
  nav.innerHTML = courseSections.map(({name,steps},i) =>
    '<button type="button" data-step="' + steps[0] + '"><b>' + (i+1) + '</b><span>' + name + '</span></button>').join('');
  workspace.className = 'pg433-content';
  back.parentElement.className = 'pg433-footer';
  back.className = 'pg433-secondary';
  next.className = 'pg433-primary';
  counter = document.createElement('span');
  counter.className = 'pg433-counter';
  back.after(counter);
} else {
  nav.innerHTML = titles.map((title,i) => '<button type="button" class="nav-step" data-step="' + (i+1) +
    '" aria-label="Шаг ' + (i+1) + ' · ' + title + '"><span>' + (i+1) + '</span></button>').join('');
}
const stepButtons = [...nav.querySelectorAll('button')];
const escape = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const playIcon = '<span class="play" aria-hidden="true"></span>';
const speaker = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor" stroke-linejoin="round"/><path d="M16 8a6 6 0 0 1 0 8m2.5-10a9 9 0 0 1 0 12" stroke-linecap="round"/></svg>';
const microphone = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5 11v1a7 7 0 0 0 14 0v-1M12 19v3m-3 0h6"/></svg>';
const scope = () => state.step + ':' + state.quizTest + ':' + state.quizIndex;
const correctCount = index => state.quiz[index].filter(Boolean).length;
const quizCount = () => state.quiz.flat().filter(Boolean).length;
const speechCount = () => new Set([...state.mic,...state.selfSpoken]).size;
const speechDone = () => speechCount() === words.length;
const selfQuizCount = () => state.quiz[4].filter(record => record?.method === 'self').length;
function coreQuizDone(){const x=state.quiz?.[0];return Array.isArray(x)&&x.length===words.length&&x.every(Boolean)}
function sectionComplete(section) {
  switch(section) {
    case 0: return state.heardWords.length === words.length;
    case 1: return state.grammarDone === true;
    case 2: return speechDone();
    case 3: return coreQuizDone() && state.dayDone === true;
    case 4: return state.chat.length === dialogue.length;
    default: return false;
  }
}
function currentStepComplete() {
  switch(state.step) {
    case 1: return true;
    case 2: return sectionComplete(0);
    case 4: return sectionComplete(1);
    case 6: return sectionComplete(2);

      if (state.courseQuizCursor === null) return true; // Opens the test list.
      if (state.courseQuizCursor === courseQuiz.length) return coreQuizDone();

const dayScenes = ['wake','wash','brush','breakfast','work','sleep'];

const safeStatus = () => '<div id="feedback" class="feedback' + (positive ? ' good' : '') + '" role="status">' + escape(feedback) + '</div>';

function audioButton(text, icon = speaker, blind = false) {
  const available = clips.has(normalize(text));
  const label = blind ? 'Прослушать запись' : available ? 'Прослушать ' + text : 'Для «' + text + '» отдельной записи нет';
  return '<button type="button" class="orb' + (available ? '' : ' missing') + '" data-say="' +

}

function micButton(id, label, recognized = false) {
  return '<button type="button" class="orb mic' + (recognized ? ' recognized' : '') + '" data-mic="' + id +
    '" aria-label="' + escape(label) + '">' + microphone + '</button>';
}

  try { localStorage.setItem(key,JSON.stringify(state)); } catch {}
}

function setStatus(message, good = false) {
  feedback = message;
  positive = good;
  const box = document.getElementById('feedback');
  if (box) {
    box.classList.toggle('good',good);
    box.textContent = message;
  }
}

function clearMedia() {
  if (audio) {
    audio.pause();
    audio = null;
    workspace.querySelector('[data-say][aria-pressed=true]')?.removeAttribute('aria-pressed');
  }
  if (speech) {
    const current = speech;
    speech = null;
    current.abort();
  }
}

// 5 visible chapter tabs cover 8 detailed screens; the welcome screen belongs to chapter 1.
const sectionForStep = step => step === 1 ? 0 : courseSections.findIndex(section => section.steps.includes(step));
const unlockedSection = () => Math.max(0,Math.min(courseSections.length - 1,Number(state.unlockedSection) || 0));
function canOpenStep(target,advance = false) {
  if (!courseMode) return true;
  const targetSection = sectionForStep(target);
  const currentSection = sectionForStep(state.step);
  if (targetSection < 0) return false;
  if (target === 5 && !coreQuizDone()) return false;
  if (target === 8 && !sectionComplete(4)) return false;
  if (targetSection <= unlockedSection()) return true;
  // A new chapter opens only after confirmed work on the current chapter.
  return advance && currentSection === unlockedSection() &&
    targetSection === currentSection + 1 && sectionComplete(currentSection);
}
function reconcileUnlockedProgress() {
  let earned = 0;
  while (earned < courseSections.length - 1 && sectionComplete(earned)) earned++;
  state.unlockedSection = Math.min(unlockedSection(),earned);
}

function move(step,advance = false) {
  const target = Math.max(1,Math.min(8,Number(step) || 1));
  if (!canOpenStep(target,advance)) {
    setStatus('Сначала пройди предыдущий раздел и нажми «Дальше».');
    return;
  }
  if (courseMode && sectionForStep(target) > unlockedSection())
    state.unlockedSection = sectionForStep(target);
  clearMedia();
  feedback = '';
  heardClip = null;
  state.step = target;
  if (state.step !== 3) state.quizTest = null;
  if (courseMode) {
    layoutParams.set('step',state.step);
    history.pushState({pgHsk2Lesson1:true,step:state.step},'','?' + layoutParams + location.hash);
  }
  save();
  render(true);
}

function render(resetScroll = false) {
  const step = state.step;
  const detailed = step === 3 || step === 6;
  app.classList.toggle('detail',detailed);
  app.dataset.view = step;
  if (courseMode && step === 3) {
    const task = courseQuiz[state.courseQuizCursor];
    state.quizTest = task?.type ?? null;
    if (task) state.quizIndex = task.index;
  }
  if (courseMode) counter.textContent = 'Шаг ' + stepNumber(step) + ' из 8';
  else headLabel.textContent = 'HSK 2 · Урок 2 · Шаг ' + step + ' из 8';
  headBack.disabled = step === 1;
  stepButtons.forEach((button,index) => {
    const active = courseMode ? (index === 0 && step === 1) || courseSections[index].steps.includes(step) : index+1 === step;
    const locked = courseMode && index > unlockedSection();
    button.setAttribute('aria-current',active ? 'step' : 'false');
    if (courseMode) {
      button.classList.toggle('active',active);
      button.classList.toggle('section-locked',locked);
      button.disabled = locked;
      button.title = locked ? '🔒 Выполни предыдущий раздел, чтобы открыть' : 'Раздел открыт';
      button.setAttribute('aria-label',courseSections[index].name + (locked ? '. Закрыт — откроется после предыдущего раздела.' : '. Открыт.'));
    }
  });
  workspace.innerHTML = [intro,newWords,quiz,grammar,day,tones,chat,finish][step-1]();
  back.hidden = step === 1;
  const inQuiz = step === 3 && state.quizTest !== null;
  const canExitQuiz = inQuiz || (courseMode && step === 3 && state.courseQuizCursor !== null);
  back.textContent = canExitQuiz ? '← К тестам' : '← Назад';
  const backLabel = canExitQuiz ? 'К списку тестов' : 'Предыдущий шаг';
  back.setAttribute('aria-label',backLabel);
  headBack.setAttribute('aria-label',backLabel);
  if (courseMode) {
    const cursor = state.courseQuizCursor;
    const current = courseQuiz[cursor];
    const following = courseQuiz[adjacentCourseTask(1)];
    next.textContent = inQuiz
      ? (!activeQuiz().quiz[current.type][current.index] ? 'Сначала выполни'
        : !following ? (state.courseQuizType === null ? 'К результатам →' : 'К тестам →')
        : following.word !== current.word ? 'Следующее слово →' : 'Дальше →')
      : step === 8 ? 'К началу ↻' : step === 3 && cursor === null ? (coreQuizDone() ? 'К распорядку →' : 'Проверить 6 слов →') : 'Дальше →';
  } else {
    next.textContent = step === 1 ? 'Начать урок' : step === 8 ? 'К началу ↻' : titles[step] + ' →';
  }
  next.disabled = !currentStepComplete();
  next.setAttribute('aria-label',next.disabled ? 'Заверши текущее упражнение, чтобы продолжить' : next.textContent);
  if (resetScroll) workspace.scrollTop = 0;
}

async function play(text,button) {
  const clip = clips.get(normalize(text));
  if (!clip) {
    setStatus('Отдельной записи для «' + text + '» пока нет.');
    return;
  }
  clearMedia();
  const player = new Audio(clip);
  audio = player;
  const origin = scope();
  button.setAttribute('aria-pressed','true');
  const failure = () => {
    if (audio !== player || origin !== scope()) return;
    audio = null;
    button.removeAttribute('aria-pressed');
    setStatus('Запись не загрузилась. Попробуй прослушать ещё раз.');
  };
  player.addEventListener('error',failure,{once:true});
  player.addEventListener('ended',() => {
    if (audio !== player || origin !== scope()) return;
    audio = null;
    button.removeAttribute('aria-pressed');
    const wordIndex = words.findIndex(word => normalize(word.zh) === normalize(text));
    if (wordIndex >= 0 && !state.heardWords.includes(wordIndex)) {
      state.heardWords.push(wordIndex);
      save();
    }
    if (state.step === 3 && state.quizTest === 1) {
      heardClip = origin;
      for (const choice of workspace.querySelectorAll('[data-choice]')) choice.disabled = false;
      setStatus('Выбери действие, которое прозвучало в конце.',true);
    } else if (state.step === 2 && wordIndex >= 0) {
      setStatus('✓ Прослушано ' + state.heardWords.length + ' из 6 слов.',true);
      render();
    } else {
      setStatus('');
    }
  },{once:true});
  try {
    await player.play();
    if (audio === player && origin === scope()) setStatus('Запись воспроизводится.',true);
  } catch {
    failure();
  }
}

function recognize(allowed,onMatch,onMiss) {
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Recognition || !window.isSecureContext) {
    setStatus('Распознавание недоступно. Можно попробовать другой браузер или воспользоваться запасной самопроверкой в разделе «Речь».');
    return;
  }
  clearMedia();
  let instance;
  try {
    instance = new Recognition();
    speech = instance;
    instance.lang = 'zh-CN';
    instance.continuous = false;
    instance.interimResults = false;
    instance.maxAlternatives = 3;
    instance.onresult = event => {
      if (speech !== instance) return;
      speech = null;
      const alternatives = Array.from(event.results[event.resultIndex || 0], item => item.transcript);
      const match = allowed.find(text => alternatives.some(heard => normalize(heard) === normalize(text)));
      if (match) onMatch(match);
      else {
        if (onMiss) onMiss();
        setStatus('Распознано «' + (alternatives[0] || '…') + '». Попробуй ещё раз. Тоны не оценивались.');
      }
    };
    instance.onerror = event => {
      if (speech !== instance) return;
      speech = null;
      const errors = {
        'not-allowed':'Разреши доступ к микрофону в настройках браузера и попробуй снова.',
        'audio-capture':'Браузер не нашёл доступный микрофон.',
        network:'Сервис распознавания речи недоступен. Проверь соединение и попробуй снова.',
        'no-speech':'Браузер не распознал речь. Попробуй ещё раз.'
      };
      setStatus((errors[event.error] || 'Распознавание речи недоступно. Попробуй ещё раз.') +
        ' Если проблема сохраняется, используй запасную самопроверку в разделе «Речь».');
    };
    instance.onend = () => {
      if (speech !== instance) return;
      speech = null;
      setStatus('Речь не распознана. Попробуй ещё раз.');
    };
    instance.start();
    setStatus('Слушаю…');
  } catch {
    if (speech === instance) speech = null;
    setStatus('Микрофон не запустился. Проверь разрешение и попробуй снова.');
  }
}

function markQuiz(ok,method) {
  const t = state.quizTest;
  const i = state.quizIndex;
  const attempt = activeQuiz();
  if (attempt.quiz[t][i]) return;
  if (ok) {
    const answer = {correctFirst:method !== 'self' && !attempt.missed[t][i],method};
    attempt.quiz[t][i] = answer;
    state.quiz[t][i] ??= {...answer,correctFirst:answer.correctFirst && !state.missed[t][i]};
    save();
    setStatus(method === 'self' ? '✓ Самостоятельная практика выполнена. Тоны не оценивались.'
      : method === 'speech' ? '✓ Слово распознано. Тоны не оценивались.' : '✓ Верно. Ответ засчитан.',true);
    render();
  } else {
    recordQuizMiss(t,i);
    save();
    setStatus('Пока неверно. Попробуй ещё раз.');
  }
}

function recordQuizMiss(type,index) {
  activeQuiz().missed[type][index] = true;
  if (!state.quiz[type][index]) state.missed[type][index] = true;
}

function adjacentCourseTask(direction) {
  const type = state.courseQuizType;
  for (let index = state.courseQuizCursor + direction; index >= 0 && index < courseQuiz.length; index += direction) {
    if (type === null || (type === -1 ? courseQuiz[index].type !== 0 : courseQuiz[index].type === type)) return index;
  }
  return direction === 1 && (type===null || type===-1) ? courseQuiz.length : -1;
}

function showCourseTask(cursor) {
  clearMedia();
  state.courseQuizCursor = cursor < 0 ? null : Math.min(cursor,courseQuiz.length);
  if (cursor < 0) {
    state.courseQuizType = null;
    state.quizRetry = null;
  }
  state.quizPicked = [];
  heardClip = null;
  feedback = '';
  render(true);
  save();
  workspace.querySelector('.section-panel h1[tabindex]')?.focus({preventScroll:true});
}

function startTests() {
  if (!courseMode) {
    openTest(Math.max(0,tests.findIndex((_,i) => correctCount(i) < words.length)));
    return;
  }
  state.courseQuizType=0;state.quizRetry=null;
  const firstPending=courseQuiz.findIndex(({type,index})=>type===0&&!state.quiz[0][index]);
  if(firstPending<0)showCourseTask(-1);else showCourseTask(firstPending);
}
function startOptionalTests(){
  state.courseQuizType=-1;state.quizRetry=null;
  const pending=courseQuiz.findIndex(({type,index})=>type!==0&&!state.quiz[type][index]);
  showCourseTask(pending<0?courseQuiz.length:pending);
}

function startCourseReplay(type) {
  state.courseQuizType = type;
  state.quizRetry = {
    quiz:tests.map(() => Array(words.length).fill(null)),
    missed:tests.map(() => Array(words.length).fill(false))
  };
  showCourseTask(courseQuiz.findIndex(task => type === null || task.type === type));
}

function startCourseType(type) {
  state.courseQuizType = type;
  const firstPending = courseQuiz.findIndex(task => task.type === type && !state.quiz[type][task.index]);
  if (firstPending < 0) startCourseReplay(type);
  else showCourseTask(firstPending);
}

function openTest(test) {
  clearMedia();
  state.quizTest = test;
  state.quizIndex = test === null ? 0 : Math.max(0,state.quiz[test].findIndex(result => !result));
  state.quizPicked = [];
  heardClip = null;
  feedback = '';
  save();
  render(true);
}

function changeQuestion(direction) {
  const index = state.quizIndex + direction;
  if (index >= words.length) {
    openTest(null);
    return;
  }
  if (index < 0) return;
  clearMedia();
  state.quizIndex = index;
  state.quizPicked = [];
  heardClip = null;
  feedback = '';
  save();
  render(true);
}

function update() {
  feedback = '';
  save();
  render();
}

function markSelfSpoken(index) {
  if (!Number.isInteger(index) || index < 0 || index >= words.length) return;
  if (!state.heardWords.includes(index)) {
    setStatus('Сначала прослушай запись этого слова, затем повтори его.');
    return;
  }
  if (!state.selfSpoken.includes(index)) state.selfSpoken.push(index);
  save();
  setStatus('✓ Отмечено самостоятельное повторение. Правильность тонов не подтверждена.',true);
  render();
}
function onMic(id) {
  if (id === 'chat') {
    const row = dialogue[state.chat.length];
    if (!row) return;
    recognize(row.answers.map(a => a[0]),answer => {
      state.chat.push(answer);
      save();
      setStatus('✓ Ответ распознан.',true);
      render();
      followDialogue();
    });
  } else if (id === 'quiz') {
    recognize([words[state.quizIndex].zh],() => markQuiz(true,'speech'),() => {
      recordQuizMiss(state.quizTest,state.quizIndex);
      save();
    });
  } else {
    const index = Number(id);
    recognize([words[index].zh],match => {
      if (!state.mic.includes(index)) state.mic.push(index);
      save();
      setStatus('✓ Распознано «' + match + '». Тоны не оценивались.',true);
      render();
    });
  }
}

function followDialogue() {
  const target = workspace.querySelector('.dialogue .chat-bubble:last-of-type');
  if (target) target.scrollIntoView({block:'nearest'});
}

function checkOrder(part,length,success,failure) {
  const order = part === 'grammar' ? state.grammar : state.dayOrder;
  const ok = order.length === length && order.every((value,i) => value === i);
  state[part + 'Done'] = ok;
  save();
  setStatus(ok ? success : failure,ok);
  render();
}

const actions = {
  step: value => {
    if (courseMode && state.step === 3 && Number(value) === 3) showCourseTask(-1);
    else move(Number(value));
  },
  say: (value,button) => play(value,button),
  test: value => openTest(Number(value)),
  quizType: value => startCourseType(Number(value)),
  quizRetry: value => startCourseReplay(value === 'all' ? null : Number(value)),
  start: startTests,
  quizExtended: startOptionalTests,
  question: value => changeQuestion(Number(value)),
  choice: value => {
    const correct = state.quizTest === 1 ? listening[state.quizIndex][1] : state.quizIndex;
    markQuiz(Number(value) === correct,'choice');
  },
  letter: value => { state.quizPicked.push(Number(value)); update(); },
  letterClear: () => { state.quizPicked = []; update(); },
  letterCheck: () => {
    const target = words[state.quizIndex].zh;
    markQuiz(state.quizPicked.map(i => [...target][i]).join('') === target,'assemble');
  },
  gram: value => { state.grammar.push(Number(value)); state.grammarDone = false; update(); },
  gramUndo: () => { state.grammar.pop(); state.grammarDone = false; update(); },
  gramClear: () => { state.grammar = []; state.grammarDone = false; update(); },
  gramCheck: () => checkOrder('grammar',5,'✓ Верно. После 起床 ставим 以后, затем 洗脸。','Проверь порядок. Сначала подлежащее и первое действие, затем 以后 и второе действие.'),
  day: value => { state.dayOrder.push(Number(value)); state.dayDone = false; update(); },
  dayUndo: () => { state.dayOrder.pop(); state.dayDone = false; update(); },
  dayReset: () => { state.dayOrder = []; state.dayShuffled = mixedDay(); state.dayDone = false; update(); },
  dayCheck: () => checkOrder('day',6,'✓ Все шесть действий по порядку.','Проверь все шесть действий, от подъёма до сна.'),
  toneTab: value => { clearMedia(); state.toneTab = value; update(); },
  practiceMode: value => { if (value === 'mic' || value === 'self') {state.practiceMode = value; update();} },
  selfSpoken: value => markSelfSpoken(Number(value)),
  selfQuiz: () => { if (state.step === 3 && state.quizTest === 4) markQuiz(true,'self'); },
  mic: value => onMic(value),
  chat: value => {
    clearMedia();
    state.chat.push(dialogue[state.chat.length].answers[Number(value)][0]);

    followDialogue();
  },
  chatReset: () => { clearMedia(); state.chat = []; update(); }
};

    if (!event.state?.pgHsk2Lesson1) return;
    const requested = Number(event.state.step);
    const target = Number.isInteger(requested) && requested >= 1 && requested <= 8 && canOpenStep(requested)
      ? requested : 2;
    clearMedia();
    state.step = target;
    state.quizTest = null;
    state.courseQuizCursor = null;
    feedback = '';
    layoutParams.set('step',target);
    save();
    render(true);
  });
}
save();
render(true);

window.PandaGoHSK2Preview = {
  getProgress: () => JSON.parse(JSON.stringify(state)),
  goToStep: move
};
</script>
</body>
