<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#533073;background:#f6edfb}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:radial-gradient(ellipse at 15% 7%,#fff8ff 2%,transparent 36%),linear-gradient(145deg,#f9edfb,#ded0f6)}button{font:inherit;cursor:pointer}button:disabled{opacity:.42;cursor:default}.app{width:min(100%,450px);height:100svh;max-height:940px;position:relative;overflow:hidden;display:flex;flex-direction:column;background:radial-gradient(ellipse at 82% 2%,#ffe9f5,transparent 35%),linear-gradient(180deg,#fbf2fc 0%,#f1e3fb 46%,#e5d9f5 100%);isolation:isolate}.app:before{content:'🌸';position:absolute;top:8%;right:-11px;font-size:80px;opacity:.23;transform:rotate(-21deg);z-index:-1}.app:after{content:'✿ ✿ ✿';position:absolute;bottom:14%;left:-20px;color:#edaed9;font-size:35px;letter-spacing:15px;opacity:.45;z-index:-1}header{padding:calc(14px + env(safe-area-inset-top)) 20px 10px;display:flex;align-items:center;gap:12px}.back{width:38px;height:38px;display:grid;place-items:center;border:1px solid #edc970;border-radius:13px;background:#fff8fe;color:#6c43a1;text-decoration:none;font-size:30px;line-height:1}.brand{font-size:17px;font-weight:900;color:#7342a6}.brand small{display:block;font-size:10px;letter-spacing:2px;color:#aa74ae;font-weight:800}.stepnote{margin-left:auto;font-size:12px;font-weight:800;color:#8656a5}.meter{height:6px;margin:0 20px 14px;background:#ead8f1;border-radius:8px;overflow:hidden}.meter span{display:block;height:100%;width:0;background:linear-gradient(90deg,#da9ce3,#9f65d7);border-radius:10px;transition:width .2s}main{min-height:0;flex:1;padding:0 20px 8px;display:flex;flex-direction:column;align-items:stretch}.kicker{text-align:center;letter-spacing:1.6px;font-size:10px;font-weight:900;color:#9e64aa}.heading{text-align:center;font-size:clamp(22px,6vw,29px);font-weight:900;line-height:1.16;color:#674093;margin:7px 0 8px}.subtitle{text-align:center;margin:0 auto 10px;font-size:13px;color:#765b88;line-height:1.35;max-width:32ch}.hero{flex:1;min-height:0;background:linear-gradient(150deg,#fffafd,#f9f1fc);border:1.7px solid #e7bb67;box-shadow:0 10px 23px #8d55b21a,inset 0 0 0 3px #fff9e9;border-radius:24px;padding:clamp(12px,3.3vw,20px);display:flex;flex-direction:column;justify-content:center;gap:8px;overflow:hidden}.hero > *{flex-shrink:0}.panda{text-align:center;font-size:58px;line-height:1}.tag{display:inline-block;margin-inline:auto;padding:5px 11px;border-radius:30px;background:#f4e4ff;color:#7c44ac;font-size:11px;font-weight:900}.hanzi{text-align:center;font-size:clamp(26px,9vw,41px);font-weight:800;line-height:1.17;color:#533073}.pinyin{text-align:center;color:#9c5db4;font-weight:750;font-size:16px}.translation{text-align:center;color:#573f6b;font-size:15px;font-weight:750}.note{text-align:center;font-size:12px;line-height:1.4;color:#826b8c}.terms{display:grid;gap:8px}.term{background:#f9effc;border:1px solid #ead4ef;border-radius:14px;padding:7px 11px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px}.term strong{font-size:19px;display:block}.term em{font-style:normal;font-size:12px;color:#905dac}.term small{font-size:12px;color:#694678;text-align:right;max-width:115px}.rule{background:#f3e7fc;border-radius:14px;padding:9px 12px;color:#754a9a;text-align:center;font-weight:900;font-size:14px}.example{background:white;border:1px solid #f1d6ec;border-radius:15px;text-align:center;padding:12px 8px}.example b{display:block;color:#613a87;font-size:clamp(22px,7.4vw,31px)}.example span{display:block;color:#9c5aac;font-size:13px;margin:4px 0}.example small{color:#644773;font-size:13px}.dialogue{display:flex;flex-direction:column;gap:8px}.bubble{width:94%;max-width:340px;border-radius:18px 18px 18px 5px;background:#f1e7fb;padding:9px 12px;align-self:flex-start}.bubble.b{background:#fae7ef;align-self:flex-end;border-radius:18px 18px 5px 18px}.bubble b{display:block;font-size:17px;color:#603489}.bubble span{display:block;font-size:11px;color:#a35db1}.bubble small{display:block;font-size:12px;color:#665077;margin-top:4px}.options{display:grid;gap:8px}.choice{border:1.5px solid #e7c7eb;background:#fff;border-radius:13px;padding:11px;text-align:left;color:#59387e;font-size:15px;font-weight:800}.choice:focus-visible,.next:focus-visible{outline:3px solid #b578e8;outline-offset:2px}.choice.correct{background:#e5f9ec;border-color:#69bd85}.choice.incorrect{background:#ffebee;border-color:#f0a4a6}.feedback{text-align:center;font-size:12px;font-weight:850;min-height:18px}.feedback.ok{color:#248651}.feedback.bad{color:#ba456a}.toggle{align-self:center;border:0;background:transparent;color:#8758a0;font-size:12px;text-decoration:underline;padding:4px}.actions{display:flex;gap:10px;padding:9px 20px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,#e9dcf5 40%)}.actions button{border-radius:16px;padding:14px 15px;font-weight:900;border:1.5px solid #d9b4e2}.prev{background:#fff8ff;color:#6c3d91;min-width:95px}.next{flex:1;border-color:#a973cc!important;background:linear-gradient(135deg,#a977da,#8e4dc6);color:white;box-shadow:0 6px 15px #a766c84d}.only-end{text-align:center;font-size:13px;color:#80608f}.voice{background:#fff5dc;border:1px solid #ead196;border-radius:11px;padding:8px 10px;font-size:11px;color:#856535;text-align:center;line-height:1.3}.hidden-pinyin .pinyin,.hidden-pinyin .term em,.hidden-pinyin .bubble span,.hidden-pinyin .example span{visibility:hidden}.small{font-size:12px!important}.done-badge{font-size:42px;text-align:center}.fineprint{margin:4px 0 0;color:#9478a6;font-size:10px;text-align:center}@media(min-width:550px){.app{height:min(850px,98svh);border:2px solid #d5b5e5;border-radius:29px;box-shadow:0 20px 75px #5d306b44}}@media(max-height:680px){header{padding-top:calc(7px + env(safe-area-inset-top));padding-bottom:6px}.meter{margin-bottom:7px}.heading{margin:3px 0 4px;font-size:21px}.subtitle{margin-bottom:5px;font-size:12px}.hero{gap:5px;padding:10px}.panda{font-size:34px}.hanzi{font-size:27px}.term{padding:5px 9px}.term strong{font-size:17px}.bubble{padding:7px 10px}.bubble b{font-size:15px}.bubble small{font-size:11px}.actions{padding-top:5px;padding-bottom:calc(7px + env(safe-area-inset-bottom))}.actions button{padding:11px}.voice{padding:5px 7px}}
</style>
</head>
<body>
<div class="app" id="app">
<header><a class="back" href="./hsk2-map.html" aria-label="Вернуться к карте HSK 2">‹</a><div class="brand">Panda Go<small>HSK 2 · УРОК 1</small></div><span class="stepnote" id="stepnote"></span></header>
<div class="meter" aria-label="Прогресс урока"><span id="progress"></span></div>
<main><div class="kicker" id="kicker"></div><h1 class="heading" id="heading"></h1><p class="subtitle" id="subtitle"></p><section class="hero" id="hero" aria-live="polite"></section><button type="button" class="toggle" id="pinyin-toggle" aria-pressed="true">Скрыть пиньинь</button><p class="fineprint">Проверенные записи носительницы для HSK 2 пока не подключены.</p></main>
<nav class="actions" aria-label="Навигация"><button class="prev" id="prev" type="button">← Назад</button><button class="next" id="next" type="button">Дальше →</button></nav>
</div>
<script type="application/json" id="lesson-data">
{
 "lessonId":"hsk2-hobbies-v1",
 "title":"Мои увлечения",
 "vocabulary":[
  {"hanzi":"爱好","pinyin":"àihào","ru":"хобби; увлечение","level":2},
  {"hanzi":"喜欢","pinyin":"xǐhuan","ru":"нравиться; любить","level":1},
  {"hanzi":"游泳","pinyin":"yóuyǒng","ru":"плавать","level":2},
  {"hanzi":"运动","pinyin":"yùndòng","ru":"спорт; заниматься спортом","level":2},
  {"hanzi":"足球","pinyin":"zúqiú","ru":"футбол","level":2},
  {"hanzi":"有意思","pinyin":"yǒuyìsi","ru":"интересный; увлекательный","level":2}
 ],
 "examples":[
  {"hanzi":"我喜欢游泳。","pinyin":"Wǒ xǐhuan yóuyǒng.","ru":"Мне нравится плавать."},
  {"hanzi":"我的爱好是游泳。","pinyin":"Wǒ de àihào shì yóuyǒng.","ru":"Моё хобби — плавание."},
  {"hanzi":"运动很有意思。","pinyin":"Yùndòng hěn yǒuyìsi.","ru":"Заниматься спортом интересно."}
 ],
 "dialogue":[
  {"who":"A","hanzi":"你有什么爱好？","pinyin":"Nǐ yǒu shénme àihào?","ru":"Какие у тебя увлечения?"},
  {"who":"B","hanzi":"我喜欢游泳。","pinyin":"Wǒ xǐhuan yóuyǒng.","ru":"Мне нравится плавать."},
  {"who":"A","hanzi":"你喜欢足球吗？","pinyin":"Nǐ xǐhuan zúqiú ma?","ru":"Тебе нравится футбол?"},
  {"who":"B","hanzi":"我喜欢足球，也喜欢游泳。","pinyin":"Wǒ xǐhuan zúqiú, yě xǐhuan yóuyǒng.","ru":"Мне нравится футбол, а ещё плавание."}
 ]
}
</script>
<script>
(()=>{
'use strict';
const data=JSON.parse(document.getElementById('lesson-data').textContent);
const stages=[
 {kind:'intro',title:'Мои увлечения',sub:'Научимся рассказывать, что нам нравится, и спрашивать о хобби.'},
 {kind:'words',title:'Новые слова · 1',sub:'Запоминаем три выражения.',range:[0,3]},
 {kind:'words',title:'Новые слова · 2',sub:'Ещё три слова для разговора.',range:[3,6]},
 {kind:'rule1',title:'Грамматика · 喜欢',sub:'Говорим, что нам нравится делать.'},
 {kind:'rule2',title:'Грамматика · 爱好',sub:'Различаем «нравится» и «моё хобби».'},
 {kind:'examples',title:'Три примера',sub:'Посмотри, как работают новые конструкции.'},
 {kind:'dialogue',title:'Диалог · часть 1',sub:'Сначала вопрос, затем ответ.',range:[0,2]},
 {kind:'dialogue',title:'Диалог · часть 2',sub:'Теперь говорим о футболе.',range:[2,4]},
 {kind:'quiz',title:'Проверь себя · 1',sub:'Что означает 我喜欢游泳？',choices:['Мне нравится плавать.','Мне нравится футбол.','Я не умею плавать.'],correct:0},
 {kind:'quiz',title:'Проверь себя · 2',sub:'Как сказать «Моё хобби — плавание»?',choices:['我的爱好是游泳。','我是喜欢游泳。','我爱好很游泳。'],correct:0},
 {kind:'end',title:'Отличное начало!',sub:'Ты изучил шесть слов и две полезные конструкции.'}
];
const $=id=>document.getElementById(id),key='pg-hsk2-hobbies-v1-progress';let state={step:0,answers:{},showPinyin:true};
try{const v=JSON.parse(localStorage.getItem(key)||'null');if(v&&Number.isInteger(v.step))state={...state,...v,step:Math.max(0,Math.min(stages.length-1,v.step)),answers:v.answers||{}}}catch{}
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch{}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function term(w){return `<div class="term"><div><strong lang="zh-Hans">${esc(w.hanzi)}</strong><em>${esc(w.pinyin)}</em></div><small>${esc(w.ru)}${w.level===1?' · повторение':''}</small></div>`}
function eg(o){return `<div class="example"><b lang="zh-Hans">${esc(o.hanzi)}</b><span>${esc(o.pinyin)}</span><small>${esc(o.ru)}</small></div>`}
function line(o){return `<div class="bubble ${o.who==='B'?'b':''}"><b lang="zh-Hans">${esc(o.hanzi)}</b><span>${esc(o.pinyin)}</span><small>${esc(o.ru)}</small></div>`}
function render(){let s=stages[state.step];$('stepnote').textContent=`${state.step+1} / ${stages.length}`;$('progress').style.width=100*(state.step+1)/stages.length+'%';$('kicker').textContent='HSK 2 · УРОК 1 · МОИ УВЛЕЧЕНИЯ';$('heading').textContent=s.title;$('subtitle').textContent=s.sub;
 let html='';
 if(s.kind==='intro')html='<div class="panda" aria-hidden="true">🐼🌸</div><span class="tag">Переход от HSK 1 к HSK 2</span><div class="hanzi">你有什么爱好？</div><div class="pinyin">Nǐ yǒu shénme àihào?</div><div class="translation">Какие у тебя увлечения?</div><div class="note">10 коротких шагов · слова, грамматика, диалог, проверка</div>';
 if(s.kind==='words')html='<div class="terms">'+data.vocabulary.slice(...s.range).map(term).join('')+'</div><div class="note">Обрати внимание на тоны и нейтральный слог в xǐhuan и yǒuyìsi.</div>';
 if(s.kind==='rule1')html='<div class="rule">Кто + 喜欢 + действие</div>'+eg(data.examples[0])+'<div class="note"><b>喜欢</b> (xǐhuan) — «нравится». После него можно сразу поставить действие. Не добавляем 是 перед 喜欢.</div>';
 if(s.kind==='rule2')html='<div class="rule">Моё хобби + 是 + действие</div>'+eg(data.examples[1])+'<div class="note"><b>爱好</b> (àihào) — «хобби», здесь существительное. В конструкции «моё хобби — ...» используем 是.</div>';
 if(s.kind==='examples')html=data.examples.map(eg).join('');
 if(s.kind==='dialogue')html='<div class="dialogue">'+data.dialogue.slice(...s.range).map(line).join('')+'</div><div class="note">Прочитай обе реплики сначала с пиньинь, затем без него.</div>';
 if(s.kind==='quiz'){const a=state.answers[state.step];html='<div class="options">'+s.choices.map((v,i)=>`<button type="button" class="choice ${a!=null?(i===s.correct?'correct':i===a?'incorrect':''):''}" data-choice="${i}" aria-label="Ответ ${i+1}: ${esc(v)}" ${a!=null?'disabled':''}>${esc(v)}</button>`).join('')+`</div><div role="status" class="feedback ${a==null?'':a===s.correct?'ok':'bad'}">${a==null?'Выбери один ответ.':a===s.correct?'✓ Правильно!':'✗ Посмотри верный ответ, затем продолжай.'}</div>`}
 if(s.kind==='end')html='<div class="done-badge" aria-hidden="true">🌸🐼</div><div class="hanzi">我喜欢学中文！</div><div class="pinyin">Wǒ xǐhuan xué Zhōngwén!</div><div class="translation">Мне нравится учить китайский!</div><div class="note">Ты можешь вернуться и повторить любой шаг. Аудиозаписи будут подключены после проверки.</div>';
 $('hero').innerHTML=html;
 $('app').classList.toggle('hidden-pinyin',!state.showPinyin);$('pinyin-toggle').textContent=state.showPinyin?'Скрыть пиньинь':'Показать пиньинь';$('pinyin-toggle').setAttribute('aria-pressed',String(state.showPinyin));$('prev').disabled=state.step===0;
 $('next').disabled=s.kind==='quiz'&&state.answers[state.step]==null;$('next').textContent=s.kind==='end'?'Повторить урок ↻':'Дальше →';
 $('hero').querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{state.answers[state.step]=Number(b.dataset.choice);save();render()}));
}
$('prev').addEventListener('click',()=>{if(state.step>0){state.step--;save();render()}});
$('next').addEventListener('click',()=>{if(state.step===stages.length-1){state={step:0,answers:{},showPinyin:state.showPinyin};save();render();return;}if(stages[state.step].kind==='quiz'&&state.answers[state.step]==null)return;state.step++;save();render()});
$('pinyin-toggle').addEventListener('click',()=>{state.showPinyin=!state.showPinyin;save();render()});
render();
})();
</script>
</body></html>
