<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#090817"><meta name="robots" content="noindex,nofollow">
<title>Panda Street AI — реакции персонажа · отдельный тест</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;height:100dvh;margin:0;background:#090817;color:#fff;overflow:hidden;font-family:system-ui,-apple-system,Arial,sans-serif}
main{position:relative;width:100%;height:100%;height:100dvh;overflow:hidden;touch-action:manipulation}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
#header{position:absolute;left:50%;transform:translateX(-50%);top:max(6px,env(safe-area-inset-top));z-index:3;width:min(94%,530px);border:1px solid #a580d3;border-radius:15px;padding:8px 10px;background:#111025e9;box-shadow:0 2px 14px #08081588}
h1{font-size:13px;line-height:1.3;margin:0 0 3px;color:#ffe3a8}
#header p{font-size:10px;line-height:1.3;color:#e8dced;margin:0}
#panel{position:absolute;left:50%;bottom:max(7px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:4;width:min(96%,560px);padding:9px;background:#111025ee;border:1px solid #ad85d4;border-radius:16px;box-shadow:0 5px 22px #050308bb;backdrop-filter:blur(9px)}
#controls{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
button{font:700 11px/1.2 system-ui,-apple-system,Arial,sans-serif;min-height:48px;border-radius:12px;border:1px solid #9b72c3;background:#322140;color:white;padding:5px;cursor:pointer}
button.primary{background:#7040a5;border-color:#f2baff}
button:active{transform:scale(.96)}
button[disabled]{opacity:.45;cursor:wait}
button[aria-pressed=true]{outline:2px solid #ffcf8a}
#tools{display:flex;gap:6px;margin-top:6px}
#tools button{min-height:34px;flex:1}
#status{color:#e0d6e8;font-size:10px;line-height:1.45;padding:7px 3px 0;min-height:25px}
#load{position:absolute;inset:0;z-index:8;display:grid;place-items:center;padding:25px;text-align:center;background:#090817f2;font-size:15px;line-height:1.5}
#load[hidden]{display:none}
#guides{display:none;gap:6px;margin-top:6px;font-size:10px;color:#eadcfa}
#guides.active{display:flex;align-items:center}
#part{min-width:0;max-width:48%;background:#332242;color:#fff;border:1px solid #9667c3;border-radius:8px;padding:6px;font:600 11px system-ui}
#guides label{display:flex;align-items:center;gap:4px;flex:1}
#degree{width:100%;accent-color:#ffc78b}
@media(min-aspect-ratio:10/9){#header{left:9px;transform:none;width:220px}#panel{left:auto;right:9px;transform:none;width:230px}#controls{grid-template-columns:1fr}#controls button{min-height:37px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<main>
 <canvas id="scene" role="img" aria-label="Оригинальная Panda Street AI: отдельная проверка жеста с кастетом, мимики и жеста свободной лапой"></canvas>
 <div id="load" role="status">Загружаю утверждённый образ Panda Street AI…</div>
 <header id="header"><h1>🐼 Panda Street · реакции №3</h1><p>Только тест · без изменения главного приложения, голосов и дизайна. Все детали — из исходного изображения, без генерации нового лица.</p></header>
 <section id="panel">
  <div id="controls">
   <button class="primary" id="ask" disabled>👊 Вопрос: кастет</button>
   <button id="answer" disabled>🗣 Ответ: мордочка</button>
   <button id="wrong" disabled>✋ Ошибка: лапа</button>
  </div>
  <div id="tools"><button id="reset" disabled>↺ Исходная поза</button><button id="theme" disabled>☀ День</button><button id="guide" disabled aria-pressed="false">✎ Контуры</button></div>
  <div id="guides"><select id="part" aria-label="Выбор области">
    <option value="brassUpper">Рука с кастетом: предплечье</option>
    <option value="brassFist">Рука с кастетом: кулак</option>
    <option value="plainPaw">Свободная лапа</option>
   </select><label>Угол <input id="degree" type="range" min="3" max="22" value="12"><b id="degree-label">12°</b></label></div>
  <div id="status">Проверка загрузки изображения…</div>
 </section>
</main>
<script>
(()=>{
'use strict';
// Isolated artwork experiment. Never modify production/main from this page.
// Coordinates use the approved 693x1444 ORIGINAL image, NOT screen pixels.
// The source-pixel contours are estimates from Android footage 38705.mp4 and
// MUST be manually refined before a production integration.
const W=693,H=1444;
const ROOT='https://raw.githubusercontent.com/trommelschlager-ai/chinese-coach-pwa/a442485be6088b07af6815bdb7a170665d2cfb38/assets/panda-street-day-night/';
const urls={night:ROOT+'night.webp',day:ROOT+'day.webp'};
const $=id=>document.getElementById(id);
const out=$('scene'),ctx=out.getContext('2d',{alpha:false});
const clickIds=['ask','answer','wrong','reset','theme','guide'];
const IMAGE={},LAYERS={},CLEAN={},TEMP={};const urlsCreated=[];
let day='night',mode='',started=0,raf=0,ready=false,guides=false,scale=1,ox=0,oy=0,held=false;
const make=()=>{let c=document.createElement('canvas');c.width=W;c.height=H;return c};
const shapes={
 // Brass knuckles are on the VIEWER-LEFT hand, not viewer-right.
 brassUpper:[[137,642],[158,622],[195,634],[222,662],[245,708],[263,750],[275,778],[241,814],[206,802],[178,773],[154,729],[127,698]],
 brassFist:[[222,756],[249,737],[284,745],[316,766],[349,778],[377,803],[385,837],[370,867],[351,885],[298,890],[263,867],[231,845],[213,806]],
 plainPaw:[[461,777],[489,763],[517,782],[531,820],[530,860],[519,915],[495,934],[472,916],[456,875],[456,820]],
 // Static other anatomy; never animated or cropped.
 brassShoulder:[168,682],brassElbow:[252,777],plainElbow:[483,801]
};
const shapeVersion='panda-street-rig-3';
try{const prev=JSON.parse(localStorage.getItem(shapeVersion)||'null');if(prev && Object.keys(shapes).every(k=>Array.isArray(prev[k])&&prev[k].length===shapes[k].length))Object.assign(shapes,prev)}catch{}
const status=s=>{$('status').textContent=s};
function trace(c,points){c.beginPath();c.moveTo(...points[0]);for(let i=1;i<points.length;i++)c.lineTo(...points[i]);c.closePath()}
function extract(image,points){const a=make(),c=a.getContext('2d');c.drawImage(image,0,0);c.globalCompositeOperation='destination-in';c.fillStyle='#fff';trace(c,points);c.fill();c.globalCompositeOperation='source-over';return a}
function inpaint(image,names){
 const paint=make(),p=paint.getContext('2d',{willReadFrequently:true});p.drawImage(image,0,0);
 const a=make(),ac=a.getContext('2d',{willReadFrequently:true});ac.fillStyle='#fff';names.forEach(name=>{trace(ac,shapes[name]);ac.fill()});
 const pixels=p.getImageData(0,0,W,H),pix=pixels.data,m=ac.getImageData(0,0,W,H).data;
 // Nearest outside pixel grows inward, then blur *only* the temporary exposed hole.
 // This is a placeholder clean plate, NOT a faithful reconstruction of hidden art.
 const n=W*H,owner=new Int32Array(n),distance=new Int16Array(n),queue=new Int32Array(n);
 let head=0,tail=0;
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  const k=y*W+x;if(m[k*4+3]<120)continue;distance[k]=-1;
  const nn=[x>0?k-1:-1,x<W-1?k+1:-1,y>0?k-W:-1,y<H-1?k+W:-1];
  for(const t of nn)if(t>=0&&m[t*4+3]<120){owner[k]=t;distance[k]=1;queue[tail++]=k;break}
 }
 while(head<tail){const k=queue[head++],x=k%W,y=(k/W)|0;const nbs=[x>0?k-1:-1,x<W-1?k+1:-1,y>0?k-W:-1,y<H-1?k+W:-1];for(const z of nbs)if(z>=0&&distance[z]===-1){distance[z]=distance[k]+1;owner[z]=owner[k];queue[tail++]=z}}
 for(let k=0;k<n;k++)if(m[4*k+3]>=120){const s=owner[k]*4,j=k*4;pix[j]=pix[s];pix[j+1]=pix[s+1];pix[j+2]=pix[s+2]}
 p.putImageData(pixels,0,0);return paint
}
function build(name){
 const image=IMAGE[name];
 LAYERS[name]={
  brassUpper:extract(image,shapes.brassUpper),
  brassFist:extract(image,shapes.brassFist),
  plainPaw:extract(image,shapes.plainPaw)
 };
 CLEAN[name]={
  brass:inpaint(image,['brassUpper','brassFist']),
  wrong:inpaint(image,['plainPaw'])
 };
 // Preserve original face area in a compact offscreen pixel buffer.
 const mouth=document.createElement('canvas');mouth.width=164;mouth.height=126;
 const mc=mouth.getContext('2d',{willReadFrequently:true});
 mc.drawImage(image,276,528,164,126,0,0,164,126);
 TEMP[name]={mouth:mc.getImageData(0,0,164,126),patch:mc.createImageData(164,126)};
}
function drawInPlace(c,image,p,angle,dx=0,dy=0){
 c.save();c.translate(p[0]+dx,p[1]+dy);c.rotate(angle);c.translate(-p[0],-p[1]);c.drawImage(image,0,0);c.restore()
}
function mouthMotion(c,wave){
 // Exactly original source pixels, moved inside a feathered elliptical area;
 // the nose, sunglasses, jacket and all edges outside the ellipse remain untouched.
 const t=TEMP[day],src=t.mouth.data,out=t.patch.data,ww=164,hh=126;
 const mx=82,my=60,rx=74,ry=50;
 for(let y=0;y<hh;y++)for(let x=0;x<ww;x++){
  const dst=(y*ww+x)*4,dd=((x-mx)/rx)**2+((y-my)/ry)**2;
  // smooth taper avoids a ring seam even as the mouth moves
  const feather=Math.max(0,Math.min(1,(1.08-dd)/.48));
  const blend=feather*feather*(3-2*feather);
  const yy=Math.max(0,Math.min(hh-1,Math.round(y-3.3*wave*blend)));
  const xx=Math.max(0,Math.min(ww-1,Math.round(x-.65*wave*blend)));
  const ss=(yy*ww+xx)*4;
  out[dst]=src[ss];out[dst+1]=src[ss+1];out[dst+2]=src[ss+2];out[dst+3]=255;
 }
 const canvas=t.canvas||(t.canvas=document.createElement('canvas'));
 canvas.width=ww;canvas.height=hh;
 canvas.getContext('2d').putImageData(t.patch,0,0);
 c.drawImage(canvas,276,528)
}
function dimensions(){
 const r=out.getBoundingClientRect(),w=r.width,h=r.height,dpr=Math.min(2,devicePixelRatio||1);
 const sw=Math.max(1,Math.round(w*dpr)),sh=Math.max(1,Math.round(h*dpr));
 if(out.width!==sw||out.height!==sh){out.width=sw;out.height=sh}
 const s=Math.min(w/W,h/H);scale=s;ox=(w-W*s)/2;oy=(h-H*s)/2;
 return{w,h,sw,sh,s,ox,oy}
}
function envelope(t){
 const u=Math.min(1,Math.max(0,t)),ease=x=>x*x*(3-2*x);
 if(u<.25)return ease(u/.25);
 if(u<.69)return 1;
 return ease((1-u)/.31)
}
function draw(ts=0){
 if(!ready)return;
 const d=dimensions();ctx.setTransform(d.sw/d.w,0,0,d.sh/d.h,0,0);
 ctx.fillStyle='#090817';ctx.fillRect(0,0,d.w,d.h);
 ctx.save();ctx.translate(d.ox,d.oy);ctx.scale(d.s,d.s);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
 const image=IMAGE[day];
 const duration=mode==='answer'?1600:mode==='wrong'?1050:1600;
 const elapsed=Math.max(0,ts-started),u=mode?Math.min(1,elapsed/duration):0,v=mode?envelope(u):0;
 if(!mode||v===0||guides)ctx.drawImage(image,0,0);
 else if(mode==='ask'){
  ctx.drawImage(CLEAN[day].brass,0,0);
  const strength=Number($('degree').value)*Math.PI/180*v;
  const sh=shapes.brassShoulder,el=shapes.brassElbow;
  // Brass fist is lifted at elbow, forearm follows with restrained shoulder twist.
  const upperAngle=-strength*.12,handAngle=-strength*.95;
  const rx=el[0]-sh[0],ry=el[1]-sh[1];
  const end=[sh[0]+rx*Math.cos(upperAngle)-ry*Math.sin(upperAngle),sh[1]+rx*Math.sin(upperAngle)+ry*Math.cos(upperAngle)];
  drawInPlace(ctx,LAYERS[day].brassUpper,sh,upperAngle);
  drawInPlace(ctx,LAYERS[day].brassFist,end,upperAngle+handAngle,end[0]-el[0],end[1]-el[1]);
 }else if(mode==='wrong'){
  ctx.drawImage(CLEAN[day].wrong,0,0);
  // Only the FREE paw moves on an incorrect answer. Castet stays still.
  drawInPlace(ctx,LAYERS[day].plainPaw,shapes.plainElbow,-.075*v,-4*v,-7*v);
 }else if(mode==='answer'){
  ctx.drawImage(image,0,0);
  // One response contains three subtle articulations; not an endless mouth wobble.
  const syllables=Math.sin(Math.PI*6*u);
  const active=Math.sin(Math.PI*u)**2;
  mouthMotion(ctx,syllables*active);
 }
 if(guides){
  const chosen=$('part').value;
  for(const name of ['brassUpper','brassFist','plainPaw']){
   ctx.save();ctx.fillStyle=name===chosen?'rgba(255,197,102,.2)':'rgba(140,210,240,.07)';
   ctx.strokeStyle=name===chosen?'#ffe2a5':'#80d2ee';ctx.lineWidth=name===chosen?2.4:1;
   trace(ctx,shapes[name]);ctx.fill();ctx.stroke();
   if(name===chosen){ctx.fillStyle='#ffd991';shapes[name].forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,4.5,0,Math.PI*2);ctx.fill()})}
   ctx.restore();
  }
  for(const k of ['brassShoulder','brassElbow','plainElbow']){const [x,y]=shapes[k];ctx.strokeStyle='#ffb888';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);ctx.stroke()}
 }
 ctx.restore();
 if(mode&&u<1&&!guides)raf=requestAnimationFrame(draw);
 else {
  raf=0;
  if(mode&&u>=1){mode='';$('status').textContent='Жест завершён. Исходная поза восстановлена без изменения лица, очков и одежды.'}
  syncButtons()
 }
}
function syncButtons(){['ask','answer','wrong'].forEach(k=>$(k).disabled=!ready||!!mode||guides);for(const k of ['reset','theme','guide'])$(k).disabled=!ready}
function run(which){
 if(!ready)return;
 cancelAnimationFrame(raf);mode=which;started=performance.now();
 const label={ask:'Вопрос: поднимается кулак с кастетом (лапа слева на экране)',answer:'Ответ: немного шевелится мордочка, очки неподвижны',wrong:'Ошибка: короткий жест свободной лапой, кастет неподвижен'};
 status(label[which]+'. Контуры рук предварительные: оцените швы.');
 syncButtons();raf=requestAnimationFrame(draw)
}
function reset(){mode='';cancelAnimationFrame(raf);status('Оригинальная поза. Никакой постоянной анимации.');syncButtons();draw()}
for(const k of ['ask','answer','wrong'])$(k).addEventListener('click',()=>run(k));
$('reset').onclick=reset;
$('theme').onclick=()=>{
 reset();day=day==='night'?'day':'night';$('theme').textContent=day==='night'?'☀ День':'☾ Ночь';draw()
};
$('guide').onclick=()=>{
 guides=!guides;reset();$('guide').setAttribute('aria-pressed',String(guides));$('guides').classList.toggle('active',guides);
 status(guides?'Редактор: точки приближены по Android-кадру. Перетащи границу кулака/лап.':'Контуры скрыты. Испытай три реакции.');syncButtons();draw()
};
$('part').onchange=()=>draw();
$('degree').oninput=()=>{$('degree-label').textContent=$('degree').value+'°'};
let drag=null;
function point(e){const b=out.getBoundingClientRect();return [(e.clientX-b.left-ox)/scale,(e.clientY-b.top-oy)/scale]}
out.addEventListener('pointerdown',e=>{
 if(!guides)return;const [x,y]=point(e),part=$('part').value;let nearest=20,idx=-1;
 shapes[part].forEach(([xx,yy],i)=>{let d=Math.hypot(xx-x,yy-y);if(d<nearest){nearest=d;idx=i}});
 if(idx<0)return;drag={part,idx};out.setPointerCapture(e.pointerId)
});
out.addEventListener('pointermove',e=>{
 if(!drag)return;const [x,y]=point(e),p=shapes[drag.part][drag.idx];p[0]=Math.max(0,Math.min(W,Math.round(x)));p[1]=Math.max(0,Math.min(H,Math.round(y)));draw()
});
function finish(){if(!drag)return;drag=null;try{localStorage.setItem(shapeVersion,JSON.stringify(shapes))}catch{}
 // Rebuild corrected masks and temporary under-arm patches only after release.
 try{for(const t of ['night','day'])build(t);draw();status('Контуры пересчитаны. Сохранены только в этом браузере.')}catch(e){status('Ошибка пересчёта: '+e.message)}
}
out.addEventListener('pointerup',finish);out.addEventListener('pointercancel',finish);
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);mode=''}else{syncButtons();draw()}});
window.addEventListener('resize',()=>draw());
window.addEventListener('pagehide',()=>urlsCreated.forEach(u=>URL.revokeObjectURL(u)),{once:true});
// Test-only adapter (not connected to real AI/audio recognition until separately approved).
window.PandaStreetReactionLab=Object.freeze({question:()=>run('ask'),pandaReply:()=>run('answer'),incorrect:()=>run('wrong'),reset});
async function load(name,url){
 const response=await fetch(url,{mode:'cors',credentials:'omit',cache:'no-store'});
 if(!response.ok||response.type==='opaque')throw Error(name+': ошибка CORS / HTTP '+response.status);
 const blob=await response.blob();
 if(!blob.type.startsWith('image/'))throw Error(name+': это не изображение');
 const objectUrl=URL.createObjectURL(blob);urlsCreated.push(objectUrl);
 const img=new Image();img.crossOrigin='anonymous';
 await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(Error('Не удалось декодировать '+name));img.src=objectUrl});
 if(img.naturalWidth!==W||img.naturalHeight!==H)throw Error(name+': размер изображения изменился');
 const test=document.createElement('canvas');test.width=test.height=1;
 const tc=test.getContext('2d',{willReadFrequently:true});tc.drawImage(img,0,0,1,1);tc.getImageData(0,0,1,1);
 IMAGE[name]=img;
}
Promise.all(Object.entries(urls).map(([name,url])=>load(name,url))).then(()=>{
 for(const key of ['night','day'])build(key);
 ready=true;$('load').hidden=true;status('Готово. Вопрос — кастет слева; ответ — мордочка; ошибка — свободная лапа. Это черновой тест.');syncButtons();draw()
}).catch(e=>{$('load').textContent='Ошибка загрузки: '+e.message;console.error(e)});
})();
</script></body></html>
