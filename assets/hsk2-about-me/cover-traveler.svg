<radialGradient id="cheek"><stop stop-color="#ff94b6" stop-opacity=".85"/><stop offset="1" stop-color="#fbb1c7" stop-opacity="0"/></radialGradient>
<filter id="ds" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur in="SourceAlpha" stdDeviation="8"/><feOffset dx="0" dy="12"/><feComponentTransfer><feFuncA type="linear" slope=".25"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glow"><feGaussianBlur stdDeviation="13"/></filter>
