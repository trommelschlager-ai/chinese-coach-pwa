 {zh:'你喜欢游泳吗？',py:'Nǐ xǐhuan yóuyǒng ma?',ru:'Ты любишь плавать?',opts:['Ты умеешь плавать?','Ты сейчас плаваешь?','Ты любишь плавать?'],correct:2}

function quizOptions(idx,mode){let field=['ru','zh','py','zh','eru'][mode];let choices=[idx,(idx+1+mode)%8,(idx+3+mode)%8,(idx+5+mode)%8];choices=[...new Set(choices)];while(choices.length<4)for(let i=0;i<8&&choices.length<4;i++)if(!choices.includes(i))choices.push(i);const offset=(idx+mode)%4;choices=[...choices.slice(offset),...choices.slice(0,offset)];return {choices:choices.map(i=>WORDS[i][field]),correct:choices.indexOf(idx)}}
function test(){let num=state.quiz%40,mode=Math.floor(num/8),idx=num%8,w=WORDS[idx],opts=quizOptions(idx,mode);let titles=['Выбери перевод','Выбери иероглифы','Выбери правильный пиньинь','Послушай и выбери слово','Переведи предложение'];let prompt=mode===0?w.zh:mode===1?w.ru:mode===2?w.zh:mode===3?'🔊 Аудиозадание':w.ex;return '<div class="eyebrow">🧩 Проверка '+(num+1)+'/40 · '+(state.qdone||[]).length+' верно</div><h2>'+titles[mode]+'</h2><div class="'+(mode===1?'ru':'subcn')+'">'+esc(prompt)+'</div>'+(mode===3?control('🔊 Воспроизвести слово','audio-test','primary'):'')+'<div class="choices">'+opts.choices.map((o,i)=>'<button type="button" class="btn '+(state.qanswer===i?(i===opts.correct?'selected':'error'):'')+'" data-act="test-answer" data-index="'+i+'">'+esc(o)+'</button>').join('')+'</div><div class="status" id="feedback" hidden></div><div class="controls">'+control('← Проверка','test-prev')+control('Следующая →','test-next','primary')+control('↻ Заново','test-reset')+'</div><p class="hint">Каждое слово — 5 видов проверки. Повторять можно неограниченно.</p>'}

function listening(){let a=LISTEN[state.listen];return '<div class="eyebrow">🎧 Аудирование · '+(state.listen+1)+'/3</div><h2>Прослушай и выбери перевод</h2>'+control('🔊 Прослушать фразу','audio-listen','primary')+'<div class="choices">'+a.opts.map((o,i)=>'<button type="button" class="btn '+(state.lanswer===i?(i===a.correct?'selected':'error'):'')+'" data-act="listen-answer" data-index="'+i+'">'+esc(o)+'</button>').join('')+'</div><div class="status" id="feedback" hidden></div><div class="controls">'+control('← Фраза','listen-prev')+control('Следующая →','listen-next','primary')+'</div><p class="hint">Демо-аудио: голос устройства. Финальные MP3 носителя ещё не подключены.</p>'}

function speaking(){let a=SPOKEN[state.speak];return '<div class="eyebrow">🎤 Говори сам · '+(state.speak+1)+'/3</div><div class="cn">'+a[0]+'</div><div class="py">'+a[1]+'</div><div class="ru">'+a[2]+'</div><div class="controls">'+control('🔊 Эталон (синтез)','audio-speak')+control(recorder&&recorder.state==='recording'?'■ Стоп':'🎙 Записать себя','record','primary')+control('▶ Моя запись','play-record')+'</div><div class="status" id="feedback">Запиши фразу и прослушай себя. Автоматической оценки тонов здесь нет.</div><div class="controls">'+control('← Фраза','speak-prev')+control('Следующая →','speak-next','primary')+'</div>'}
function dialogue(){let a=TALK[state.talk];return '<div class="eyebrow">💬 Диалог · реплика '+(state.talk+1)+'/6</div><h2>'+(a[0]==='Ты'?'Твой ответ':'Вопрос Панды')+'</h2><div class="chat '+(a[0]==='Ты'?'you':'')+'"><div class="tinybar">'+(a[0]==='Ты'?'🧑 Ты':'🐼 Панда')+'</div><div class="subcn">'+a[1]+'</div>'+(state.showPy?'<div class="py">'+a[2]+'</div>':'')+(state.showRu?'<p>'+a[3]+'</p>':'')+'</div><div class="controls">'+control('🔊 Слушать','audio-talk')+control(state.showPy?'Скрыть пиньинь':'Показать пиньинь','toggle-py')+control(state.showRu?'Скрыть перевод':'Показать перевод','toggle-ru')+'</div><div class="controls">'+control('← Реплика','talk-prev')+control('Дальше →','talk-next','primary')+'</div><p class="hint">Это учебный диалог. Отдельный разговорный сценарий Panda AI подключим после проверки.</p>'}
function results(){const a=WORDS[[3,4,5,6,7][state.hobby]],[zh,py,ru]=['','',''];let textZh='我喜欢'+a.zh+'。';let textPy='Wǒ xǐhuan '+a.py+'.';let textRu='Мне нравится '+a.ru+'.';return '<div class="eyebrow">🏆 Итог · Урок 4</div><h2>Моё хобби</h2><p>Составь свою фразу и произнеси её вслух.</p><div class="story"><div class="rowstory"><label for="hobby">Я люблю:</label><select id="hobby">'+[3,4,5,6,7].map((i,k)=>'<option value="'+k+'" '+(state.hobby===k?'selected':'')+'>'+WORDS[i].ru+'</option>').join('')+'</select></div><div class="subcn">'+textZh+'</div><div class="py">'+textPy+'</div><p>'+textRu+'</p></div><div class="minirow"><span class="pill">Слова: 8</span><span class="pill">Тесты: '+(state.qdone||[]).length+'/40</span><span class="pill">Аудирование: '+(state.ldone||[]).length+'/3</span></div><div class="controls">'+control('🔊 Слушать','audio-story')+control('📋 Копировать','copy-story')+control('↻ Повторить тесты','reset-tests')+'</div><p class="hint">Результаты сохраняются на устройстве. Носитель ещё должен проверить финальную озвучку.</p><div class="controls"><a class="btn" href="./panda-voice-pilot.html" style="text-decoration:none">🐼 Panda AI · общая практика</a></div>'}
const screens=[intro,words,test,grammar,listening,speaking,dialogue,results];
function render(){let st=state.step;$('stage').innerHTML=screens[st]();$('badge').textContent='Шаг '+(st+1)+'/8';$('progress').style.width=((st+1)/8*100)+'%';$('prev').textContent=st===0?'← Все уроки':'← Назад';$('next').textContent=st===7?'К началу ↻':'Далее →';save()}
async function toggleRecording(){if(recorder&&recorder.state==='recording'){recorder.stop();return}if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){message('Микрофон или запись недоступны в этом браузере.',false);return}try{stopRecord();recordStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});chunks=[];recorder=new MediaRecorder(recordStream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{if(recordUrl)URL.revokeObjectURL(recordUrl);recordUrl=URL.createObjectURL(new Blob(chunks,{type:recorder.mimeType||'audio/webm'}));if(recordStream){recordStream.getTracks().forEach(t=>t.stop());recordStream=null}message('Запись готова. Прослушай её кнопкой «Моя запись».');render()};recorder.start();message('● Идёт запись. Произнеси фразу и нажми «Стоп».');const b=document.querySelector('[data-act="record"]');if(b)b.textContent='■ Стоп'}catch(e){message('Не удалось включить микрофон. Проверь разрешение браузера.',false)}}
function stopRecord(){if(recorder&&recorder.state==='recording'){recorder.onstop=null;recorder.stop()}if(recordStream){recordStream.getTracks().forEach(t=>t.stop());recordStream=null}recorder=null}
function onAction(act,index){switch(act){
 case'start':nav(1);return;
 case'audio-word':speak(WORDS[state.word].zh);return;
 case'word-prev':state.word=(state.word+7)%8;break;
 case'word-next':state.word=(state.word+1)%8;break;
 case'audio-test':speak(WORDS[state.quiz%8].zh);return;
 case'test-prev':state.quiz=(state.quiz+39)%40;state.qanswer=null;break;
 case'test-next':state.quiz=(state.quiz+1)%40;state.qanswer=null;break;
 case'test-reset':state.quiz=0;state.qdone=[];state.qanswer=null;break;
 case'test-answer':{const mode=Math.floor(state.quiz/8),idx=state.quiz%8;const ans=quizOptions(idx,mode);state.qanswer=index;if(index===ans.correct){if(!state.qdone.includes(state.quiz))state.qdone.push(state.quiz);save();render();message('✓ Правильно! Можно повторять сколько угодно раз.');}else{save();render();message('Пока неверно. Попробуй другой вариант.',false)}return}
 case'rule-prev':state.grammar=(state.grammar+1)%2;break;
 case'rule-next':state.grammar=(state.grammar+1)%2;break;
 case'audio-rule':speak(RULES[state.grammar].zh);return;
 case'audio-listen':speak(LISTEN[state.listen].zh);return;
 case'listen-answer':{let i=state.listen;state.lanswer=index;if(index===LISTEN[i].correct){if(!state.ldone.includes(i))state.ldone.push(i);save();render();message('✓ Верно: '+LISTEN[i].zh+' — '+LISTEN[i].ru)}else{save();render();message('Не совпало. Слушай ещё раз и попробуй.',false)}return}
 case'listen-next':state.listen=(state.listen+1)%3;state.lanswer=null;break;
 case'listen-prev':state.listen=(state.listen+2)%3;state.lanswer=null;break;
 case'audio-speak':speak(SPOKEN[state.speak][0]);return;
 case'record':toggleRecording();return;
 case'play-record':if(!recordUrl){message('Сначала запиши свою речь.',false);return}new Audio(recordUrl).play().catch(()=>message('Не удалось воспроизвести запись.',false));return;
 case'speak-next':state.speak=(state.speak+1)%3;break;
 case'speak-prev':state.speak=(state.speak+2)%3;break;
 case'audio-talk':speak(TALK[state.talk][1]);return;
 case'talk-next':state.talk=(state.talk+1)%6;break;
 case'talk-prev':state.talk=(state.talk+5)%6;break;
 case'toggle-py':state.showPy=!state.showPy;break;
 case'toggle-ru':state.showRu=!state.showRu;break;
 case'audio-story':speak('我喜欢'+WORDS[[3,4,5,6,7][state.hobby]].zh+'。');return;
 case'copy-story':{const w=WORDS[[3,4,5,6,7][state.hobby]];if(navigator.clipboard?.writeText)navigator.clipboard.writeText('我喜欢'+w.zh+'。').then(()=>message('Фраза скопирована.')).catch(()=>message('Не удалось скопировать.',false));return}
 case'reset-tests':state.quiz=0;state.qdone=[];nav(2);return;
 default:return;
 }save();render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;onAction(b.dataset.act,Number(b.dataset.index))});
document.addEventListener('change',e=>{if(e.target.id==='hobby'){state.hobby=Number(e.target.value)||0;save();render()}});
$('prev').addEventListener('click',()=>state.step===0?location.assign('./hsk2-life-course.html?view=map'):nav(state.step-1));
$('next').addEventListener('click',()=>nav(state.step===7?0:state.step+1));
window.addEventListener('pagehide',()=>{stopRecord();if(recordUrl)URL.revokeObjectURL(recordUrl);window.speechSynthesis?.cancel()});
render();
})();
</script></body></html>
