function updateMsg(t,type='ok'){s.message=t;s.messageType=type;save();render();}
function closeRecord(){if(recorder&&recorder.state==='recording'){recorder.onstop=null;recorder.stop()}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}recorder=null}
function go(n){if(n!==4)closeRecord();s.step=Math.max(0,Math.min(8,n));s.message='';save();render();$('content').scrollTop=0;}
function welcome(){return panel(heading('Привет! Сегодня говорим о хобби','Шаг 1 / 8 · Расскажи о своих увлечениях и выходных.')+art(0)+'<div class="cn">我喜欢听音乐。</div><div class="py">Wǒ xǐhuan tīng yīnyuè.</div><p>Я люблю слушать музыку.</p><p>Узнаешь 8 выражений, научишься говорить, что тебе нравится, расскажешь о выходных и поговоришь с Пандой.</p><p class="endnote">40 проверок (по 5 на каждое слово) — повторять можно сколько угодно раз. Произношение не оценивается без надёжного анализа аудио.</p>');}
function words(){
 const w=WORDS[Math.max(0,Math.min(7,s.word))];
 return panel(heading('Новые слова','Шаг 2 / 8 · 8 выражений на тему «Моё хобби»')+'<div class="section-title">'+badge('Слово '+(s.word+1)+'/8')+badge('Тоны '+w.tones)+'</div>'+art(s.word)+'<div class="cn">'+w.zh+'</div><div class="py">'+w.py+'</div><div class="ru">'+w.ru+'</div>'+example([w.ex,w.p,w.r])+speakNote+'<div class="btnrow" style="margin-top:11px"><button class="action" data-act="audio-word">🔊 Слушать</button><button class="primary" data-act="word-next">Следующее слово →</button></div>')
 +panel('<h3>Все новые слова</h3><div class="grid">'+WORDS.map((w,i)=>'<button class="card '+(s.word===i?'correct':'')+'" data-act="word-set" data-index="'+i+'"><div class="cn">'+w.zh+'</div><div class="py">'+w.py+'</div><div class="ru">'+w.ru+'</div></button>').join('')+'</div>');
}
function grammar(){
 const tokens=['我','喜欢','听','音乐','。'];const order=[3,0,4,1,2];
 return panel(heading('Правило № 1 · 喜欢 + действие','Как говорить о том, что тебе нравится.')+art(0)+'<div class="cn">我喜欢听音乐。</div><div class="py">Wǒ xǐhuan tīng yīnyuè.</div><p>Я люблю слушать музыку.</p><p class="hint">Формула: <b>кто + 喜欢 + действие</b>. После 喜欢 можно сразу назвать занятие — без 是.</p>')
 +panel('<h2>Правило № 2 · Выходные и частота</h2><div class="cn">周末我常常看电影。</div><div class="py">Zhōumò wǒ chángcháng kàn diànyǐng.</div><p>По выходным я часто смотрю фильмы.</p><p class="hint">周末 — «выходные», 常常 — «часто». 常常 ставим перед действием.</p>')
 +panel('<h2>Собери предложение</h2><p>Составь: «Я люблю слушать музыку».</p><div class="answer" aria-live="polite">'+(s.build.length?s.build.map(i=>tokens[i]).join(''):'Выбирай карточки по порядку')+'</div><div class="token-grid">'+order.map(i=>'<button class="action token" data-act="token" data-index="'+i+'" '+(s.build.includes(i)?'disabled':'')+'>'+tokens[i]+'</button>').join('')+'</div><div class="btnrow" style="margin-top:10px"><button class="action" data-act="token-reset">Очистить</button><button class="primary" data-act="token-check">Проверить</button></div>'+msg());
}
function speaking(){
 let l=WORDS.map((w,i)=>'<div class="speech-card"><div class="section-title">'+badge((i+1)+'/8')+(s.spoken.includes(i)?badge('✓ Повторено'):'')+'</div><div class="cn">'+w.zh+'</div><div class="py">'+w.py+'</div><div class="ru">'+w.ru+'</div><div class="speech-actions"><button class="action" data-act="speak-word" data-index="'+i+'">🔊 Эталон</button><button class="primary" data-act="spoken" data-index="'+i+'">✓ Повторил</button></div></div>').join('');
 return panel(heading('Произношение и тоны','Шаг 4 / 8 · Прослушай эталон, произнеси сам и сравни.')+art(1)+'<p>Особое внимание: 喜欢 (xǐhuan) — второй слог безударный. Тоны автоматически не оцениваются.</p>'
 +'<div class="btnrow"><button class="action" data-act="record">'+(recorder&&recorder.state==='recording'?'■ Остановить':'🎙 Записать себя')+'</button><button class="primary" data-act="replay">▶ Моя запись</button></div>'+speakNote+msg())
 +panel('<h3>Практика восьми выражений</h3>'+l);
}
const TYPES=['Выбери перевод','Найди иероглифы','Собери слово','Вставь выражение','Скажи самостоятельно'];
const seq=(t,i)=>t+'-'+i;
function options(i,t){
 const ids=[i,(i+1+t)%8,(i+3+t)%8,(i+5+t)%8];const unique=[...new Set(ids)];
 for(let x=0;unique.length<4&&x<8;x++)if(!unique.includes(x))unique.push(x);
 const n=(i+t)%4;return unique.slice(n).concat(unique.slice(0,n));
}
function question(t,i){
 const w=WORDS[i],n=t*8+i,complete=!!s.done[seq(t,i)];
 let pre='<div class="section-title">'+badge('Задание '+(n+1)+'/40')+badge(t===0?'Основное':'Дополнительное')+'</div><h3>'+TYPES[t]+'</h3>';
 if(t===0)return pre+'<div class="cn">'+w.zh+'</div><p>Что означает выражение?</p><div class="question-choices">'+options(i,t).map(x=>'<button class="action option" data-act="quiz-choice" data-correct="'+(x===i)+'">'+WORDS[x].ru+'</button>').join('')+'</div>';
 if(t===1)return pre+'<div class="py">'+w.py+'</div><p>Какие иероглифы соответствуют пиньиню?</p><div class="question-choices">'+options(i,t).map(x=>'<button class="action option" data-act="quiz-choice" data-correct="'+(x===i)+'"><span class="cn">'+WORDS[x].zh+'</span></button>').join('')+'</div>';
 if(t===2){const bits=Array.isArray(s.qbits)?s.qbits:[];const permutation=w.ch.map((_,j)=>j).reverse();return pre+'<p>Собери выражение из иероглифов в правильном порядке.</p><div class="answer">'+(bits.length?bits.map(j=>w.ch[j]).join(''):'Выбирай иероглифы')+'</div><div class="token-grid">'+permutation.map(j=>'<button class="action token" data-act="quiz-char" data-index="'+j+'" '+(bits.includes(j)?'disabled':'')+'>'+w.ch[j]+'</button>').join('')+'</div><div class="btnrow" style="margin-top:10px"><button class="action" data-act="quiz-clear">Очистить</button><button class="primary" data-act="quiz-check">Проверить</button></div>';}
 if(t===3)return pre+'<div class="cn" style="font-size:25px">'+w.fill+'</div><p>Какое выражение пропущено?</p><div class="question-choices">'+options(i,t).map(x=>'<button class="action option" data-act="quiz-choice" data-correct="'+(x===i)+'">'+WORDS[x].zh+' · '+WORDS[x].py+'</button>').join('')+'</div>';
 return pre+art(i)+'<div class="cn">'+w.zh+'</div><div class="py">'+w.py+'</div><p>Повтори вслух. Здесь самостоятельная отметка, а не автоматическая проверка тонов.</p><div class="btnrow"><button class="action" data-act="speak-word" data-index="'+i+'">🔊 Слушать</button><button class="primary" data-act="quiz-spoken">✓ Я произнёс</button></div>'+speakNote;
}
function tests(){
 let main=s.qmode==='core',total=main?8:32,at=Math.max(0,Math.min(total-1,Number(s.qi)||0)),type=main?0:1+Math.floor(at/8),i=main?at:at%8,complete=main?coreCount()===8:optCount()===32;
 let h=heading('Проверка слов','Шаг 5 / 8 · 8 основных заданий и 32 дополнительных.');
 h+='<div class="btnrow"><button class="'+(main?'primary':'action')+'" data-act="q-mode" data-mode="core">Основные '+coreCount()+'/8</button><button class="'+(!main?'primary':'action')+'" data-act="q-mode" data-mode="optional">Дополнительные '+optCount()+'/32</button></div>';
 if(complete)h+=panel('<h3>✓ '+(main?'Все основные задания пройдены!':'Дополнительная практика пройдена!')+'</h3><p>Продолжай урок или повтори любое задание.</p>');
 h+=panel(question(type,i)+msg()+'<div class="btnrow" style="margin-top:12px"><button class="action" data-act="q-prev" '+(at===0?'disabled':'')+'>← Назад</button><button class="primary" data-act="q-next" '+(!s.done[seq(type,i)]?'disabled':'')+'>'+(at===total-1?'К началу ↻':'Далее →')+'</button></div>'+(s.done[seq(type,i)]?'<p class="hint">✓ Выполнено. Повторять можно без ограничений.</p>':''));
 return h;
}
function own(){
 const i=Math.max(0,Math.min(OPTIONS.length-1,Number(s.own)||0)),q=OPTIONS[i];
 return panel(heading('Расскажи о своём хобби','Шаг 6 / 8 · Выбирай только то, что действительно тебе нравится.')+art(0)+'<label class="field">Какое предложение тебе подходит?<select id="own-choice">'+OPTIONS.map((x,j)=>'<option value="'+j+'" '+(i===j?'selected':'')+'>'+esc(x[2])+'</option>').join('')+'</select></label>'+example(q)
 +'<div class="btnrow" style="margin-top:12px"><button class="action" data-act="own-said">'+(s.storyRead?'✓ Произнёс':'🎙 Прочитал вслух')+'</button><button class="primary" data-act="own-save">Сохранить мой вариант</button></div>'+msg()+'<p class="hint">Не отмечаем правильность тонов без достоверного анализа речи.</p>')
 +panel('<h3>Другие возможные ответы</h3><div class="grid">'+OPTIONS.map((x,j)=>'<button class="card" data-act="own-set" data-index="'+j+'"><div class="cn" style="font-size:18px">'+x[0]+'</div><div class="ru">'+x[2]+'</div></button>').join('')+'</div>');
}
function dialog(){
 let n=Math.min(3,s.dialog.length),h=heading('Диалог с Пандой','Шаг 7 / 8 · Расскажи о себе, выбирая подходящие ответы.')+art(0);
 for(let j=0;j<3;j++){const q=QUESTIONS[j];if(j>n)break;h+='<div class="chatbubble"><div class="speaker">🐼 Панда</div><div class="cn">'+q.q+'</div><div class="py">'+q.p+'</div><div class="ru">'+q.ru+'</div><button class="action" data-act="audio-question" data-index="'+j+'">🔊 Слушать</button></div>';if(j<n){const x=q.options[s.dialog[j]]||q.options[0];h+='<div class="chatbubble me"><div class="speaker">Ты</div><div class="cn">'+x[0]+'</div><div class="py">'+x[1]+'</div><div class="ru">'+x[2]+'</div></div>';}}
 if(n<3)h+='<h3>Выбери подходящий тебе ответ</h3><div class="choices">'+QUESTIONS[n].options.map((o,j)=>'<button class="action choice" data-act="dialog-answer" data-index="'+j+'"><div class="cn">'+o[0]+'</div><div class="py">'+o[1]+'</div><div class="ru">'+o[2]+'</div></button>').join('')+'</div>';
 else h+='<div class="status ok">✓ Диалог завершён!</div><button class="action" data-act="dialog-reset">↻ Повторить диалог</button>';
 return panel(h+speakNote)+'<p class="endnote">Это учебный диалог с вариантами ответов. Полноценный AI-разговор пока не подключён.</p>';
}
function result(){
 const done=coreCount()===8&&s.grammar&&s.dialog.length===3,q=OPTIONS[Math.max(0,Math.min(4,s.own))];
 return panel(heading('Итоги урока 4','Шаг 8 / 8 · Моё хобби и свободное время')+'<img class="hero-art result-hero" src="./assets/hsk2-l3-red-panda-video-v535.webp" alt="Панда в китайском саду">'
 +'<div class="section-title"><h3>'+(done?'🎉 Отлично! Урок завершён':'Продолжай — почти готово!')+'</h3>'+badge('8 выражений')+'</div>'
 +'<p>Основные тесты: <b>'+coreCount()+'/8</b></p><p>Дополнительная практика: <b>'+optCount()+'/32</b></p><p>Грамматическая фраза: <b>'+(s.grammar?'✓':'ещё не собрана')+'</b></p><p>Слова для произношения: <b>'+s.spoken.length+'/8</b></p><p>Диалог: <b>'+s.dialog.length+'/3 ответа</b></p><p>Мой рассказ: <b>'+(s.storyRead?'прочитан вслух':'можно потренировать')+'</b></p>'+example(q)
 +(done?'<div class="status ok">✓ Обязательные этапы выполнены. Результат сохранён.</div>':'<div class="status bad">Для завершения нужны 8 основных тестов, грамматическая фраза и 3 ответа в диалоге.</div>')
 +'<div class="btnrow" style="margin-top:11px"><button class="action" data-act="reset">↻ Пройти заново</button><button class="primary" data-act="cover-home">К обложке</button></div>')
 +'<div class="result-ai-only">'+badge('🐼 Panda AI · сценарий на проверке')+'</div>';
}
const screens=[welcome,words,grammar,speaking,tests,own,dialog,result];
function fitCompactStage(){
 const lesson=$('lesson'),box=$('content');lesson.classList.remove('compact-tight','compact-ultra','compact-overflow');
 const over=()=>box.scrollHeight>box.clientHeight+2;
 if(over())lesson.classList.add('compact-tight');
 if(over())lesson.classList.add('compact-ultra');
 if(over())lesson.classList.add('compact-overflow');
}
function render(){
 const opened=s.step>0;$('cover').hidden=opened;$('lesson').hidden=!opened;
 const el=$('lesson');el.classList.remove('compact-intro','compact-tests','compact-result','compact-tight','compact-ultra','compact-overflow');
 if(s.step===1)el.classList.add('compact-intro');
 if(s.step===5)el.classList.add('compact-tests');
 if(s.step===8)el.classList.add('compact-result');
 if(!opened)return;
 $('step-label').textContent='Шаг '+s.step+' из 8';$('step-name').textContent=steps[s.step-1];$('progress-bar').style.width=s.step*12.5+'%';
 $('content').innerHTML=screens[s.step-1]();
 $('next').textContent=s.step===8?'К обложке ↺':s.step===5&&coreCount()<8?'Нужны 8 ответов':'Далее →';
 $('next').disabled=s.step===5&&coreCount()<8;
 fitCompactStage();
}
function handle(act,b){
 const i=Number(b.dataset.index);s.message='';
 switch(act){
 case'cover-start':go(1);return;
 case'cover-home':go(0);return;
 case'word-set':s.word=Math.max(0,Math.min(7,i));break;
 case'word-next':s.word=(s.word+1)%8;break;
 case'audio-word':sound(WORDS[s.word].zh);return;
 case'token':if(!s.build.includes(i))s.build.push(i);break;
 case'token-reset':s.build=[];break;
 case'token-check':if(s.build.join(',')==='0,1,2,3,4'){s.grammar=true;updateMsg('✓ Верно: 我喜欢听音乐。');return;}updateMsg('Порядок: 我 → 喜欢 → 听 → 音乐 → 。','bad');return;
 case'speak-word':sound(WORDS[Math.max(0,Math.min(7,i))].zh);return;
 case'spoken':s.spoken=s.spoken.includes(i)?s.spoken:[...s.spoken,i];break;
 case'record':if(recorder&&recorder.state==='recording'){recorder.stop();return;}startRecord();return;
 case'replay':if(recordUrl){new Audio(recordUrl).play().catch(()=>updateMsg('Запись не воспроизводится.','bad'));}else updateMsg('Сначала запиши свою речь.','bad');return;
 case'q-mode':s.qmode=b.dataset.mode==='optional'?'optional':'core';s.qi=0;s.qbits=[];break;
 case'q-prev':s.qi=Math.max(0,s.qi-1);s.qbits=[];break;
 case'q-next':s.qi=(s.qi+1)%(s.qmode==='core'?8:32);s.qbits=[];break;
 case'quiz-choice':{const t=s.qmode==='core'?0:1+Math.floor(s.qi/8),idx=s.qmode==='core'?s.qi:s.qi%8;if(b.dataset.correct==='true'){s.done[seq(t,idx)]=true;updateMsg('✓ Верно! '+WORDS[idx].zh+' — '+WORDS[idx].ru);return}updateMsg('Попробуй ещё раз.','bad');return;}
 case'quiz-char':if(!Array.isArray(s.qbits))s.qbits=[];if(!s.qbits.includes(i))s.qbits.push(i);break;
 case'quiz-clear':s.qbits=[];break;
 case'quiz-check':{const idx=s.qi%8,w=WORDS[idx],ans=w.ch.map((_,k)=>k).join(',');if((s.qbits||[]).join(',')===ans){s.done[seq(2,idx)]=true;updateMsg('✓ Правильно: '+w.zh);return;}updateMsg('Проверь порядок иероглифов.','bad');return;}
 case'quiz-spoken':{const idx=s.qi%8;s.done[seq(4,idx)]=true;updateMsg('✓ Самостоятельное повторение отмечено. Тоны не оценивались.');return;}
 case'own-set':s.own=i;s.storyRead=false;break;
 case'own-said':s.storyRead=!s.storyRead;break;
 case'own-save':updateMsg('✓ Вариант сохранён.');return;
 case'audio-question':sound(QUESTIONS[i].q);return;
 case'dialog-answer':{const q=QUESTIONS[s.dialog.length];if(q&&i>=0&&i<q.options.length)s.dialog.push(i);break;}
 case'dialog-reset':s.dialog=[];break;
 case'reset':if(confirm('Начать урок 4 заново?')){s=fresh();go(1);return;}break;
 default:return;
 }
 save();render();
}
async function startRecord(){
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){updateMsg('Запись недоступна в этом браузере.','bad');return;}
 try{
  stream=await navigator.mediaDevices.getUserMedia({audio:true});
  let chunks=[];recorder=new MediaRecorder(stream);
  recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  recorder.onstop=()=>{if(recordUrl)URL.revokeObjectURL(recordUrl);recordUrl=URL.createObjectURL(new Blob(chunks,{type:recorder.mimeType||'audio/webm'}));if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}recorder=null;recordings++;updateMsg('Запись готова. Нажми «Моя запись».')};
  recorder.start();updateMsg('● Запись идёт. Нажми ещё раз, чтобы остановить.');
 }catch(e){updateMsg('Не удалось получить доступ к микрофону.','bad');}
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&!b.disabled)handle(b.dataset.act,b)});
document.addEventListener('change',e=>{if(e.target.id==='own-choice'){let n=Number(e.target.value);if(n>=0&&n<OPTIONS.length){s.own=n;s.storyRead=false;save();render()}}});
$('headBack').addEventListener('click',()=>s.step===1?go(0):go(s.step-1));
$('prev').addEventListener('click',()=>s.step===1?go(0):go(s.step-1));
$('next').addEventListener('click',()=>s.step===8?go(0):go(s.step+1));
window.addEventListener('resize',()=>{if(s.step)fitCompactStage()});
window.addEventListener('pagehide',()=>{closeRecord();if(recordUrl)URL.revokeObjectURL(recordUrl);window.speechSynthesis?.cancel()});
render();
})();

</script></body></html>
