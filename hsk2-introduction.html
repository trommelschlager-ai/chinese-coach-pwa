.bubble .chat{flex:1;min-width:0;padding:10px;background:linear-gradient(#fffaff,#fef1f5);border:1px solid #e4bcda;border-radius:17px;box-shadow:0 3px 7px #b57fbd35}

<body>
<div class="app hsk2-premium" id="app">
<header class="header">
 <a class="back" href="./hsk2-start.html#map" aria-label="Назад к карте HSK2">‹</a>
 <h1>Panda Go</h1><span class="sub">HSK 2 · Урок 1 · Я и моя визитка</span>
</header>
<main class="page" id="page" tabindex="-1"><div id="screen" aria-live="off"></div></main>
<footer class="bottom">
 <div class="secondary-row"><button type="button" class="secondary" id="toggle-py">Скрыть пиньинь</button><button type="button" class="secondary" id="repeat">↻ Повторить</button></div>
 <div class="primary-row"><button type="button" class="secondary" id="prev">← Назад</button><button type="button" class="primary" id="next">Дальше →</button></div>
 <div id="notice" role="status" aria-live="polite"></div>
</footer>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const KEY='pg-hsk2-introduction-v3';
const OLD='pg-hsk2-introduction-v1';
const TOTAL=5;
const WORDS=[
 {zh:'叫',py:'jiào',ru:'зваться, называться'},
 {zh:'名字',py:'míngzi',ru:'имя'},
 {zh:'什么',py:'shénme',ru:'что / какой'}
];
const MODEL={question:'你叫什么名字？',qPy:'Nǐ jiào shénme míngzi?',qRu:'Как тебя зовут?',answer:'我叫米沙。',aPy:'Wǒ jiào Mǐshā.',aRu:'Меня зовут Миша.'};
const TOKENS=['米沙','叫','我','。'];
const cleanState=()=>({step:0,showPy:true,selected:null,checked:false,heard:false,build:[],mic:'none',recognized:'',dialogueRevealed:false,completed:false});
let state=cleanState();
try{const prior=JSON.parse(localStorage.getItem(KEY)||'null');if(prior){state={...state,...prior};state.step=Math.max(0,Math.min(4,Number(state.step)||0));if(!Array.isArray(state.build))state.build=[]}}catch{}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const audio=phrase=>window.PandaHsk2AudioV330?.lookup(phrase)||null;
function sound(phrase,small=false){
 if(!audio(phrase))return '<span class="small">🔇 Точной записи пока нет</span>';
 return '<button type="button" class="voice" data-audio="'+esc(phrase)+'" aria-label="Слушать запись '+esc(phrase)+'">🔊 '+(small?'Звук':'Слушать')+'</button>';
}
function goAudio(phrase){
 const p=window.PandaHsk2AudioV330;
 if(!p?.lookup(phrase)){notice('Для этой фразы нет оригинальной MP3-записи');return false}
 const started=p.play(phrase,m=>notice(m||''));
 if(started&&state.step===3&&phrase===MODEL.question){state.heard=true;save()}
 return started;
}
function notice(t){$('notice').textContent=t||''}
function shadePinyin(){ $('app').classList.toggle('py-hidden',!state.showPy);$('toggle-py').textContent=state.showPy?'Скрыть пиньинь':'Показать пиньинь'}
const header=(name)=>'<div class="heading">'+(state.step>0?'<img class="heading-panda" src="./assets/hsk2-approved-panda-v357.svg" alt="">':'')+'<span class="name">'+name+'</span></div><div class="step-tag">Шаг '+(state.step+1)+' из '+TOTAL+'</div>';
function renderPlan(){
 const topics=[['👤','имя'],['❓','вопрос'],['📖','правило'],['🧩','фразы'],['🎧','тоны'],['✅','мини-тест']];
 const skills=[
 ['💬','Говорить о себе','Назвать своё имя по-китайски'],
 ['🧩','Строить предложения','Собрать фразу из слов'],
 ['❔','Понимать вопросы','Узнать вопрос о своём имени'],
 ['🎧','Слушать и различать тоны','Повторять за записью']
 ];
 return '<section class="screen screen--plan">'+
 '<div class="poster-lead wow-plan-hero"><img class="poster-panda" src="./assets/hsk2-approved-panda-v357.svg" alt="Панда приглашает на урок">'+
 '<div class="poster-content"><div class="poster-plaque" role="heading" aria-level="2">План<br> изучения</div>'+
 '<p>В этом уроке ты научишься <b>представляться</b>, говорить <b>своё имя</b>, строить <b>простые предложения</b> и понимать <b>короткие вопросы</b>.</p></div>'+
 '<div class="wow-wave" aria-hidden="true"></div></div>'+
 '<div class="poster-scroll">Что будем изучать</div>'+
 '<section class="glam wow-topics"><div class="features">'+topics.map(x=>'<div class="feature"><span class="em">'+x[0]+'</span><span>'+x[1]+'</span></div>').join('')+'</div></section>'+
 '<div class="ribbon wow-skill-ribbon">Ты научишься</div>'+
 '<section class="glam wow-skills"><div class="outcomes">'+skills.map(x=>'<div class="outcome"><span class="em">'+x[0]+'</span><span class="outcome-copy"><strong>'+x[1]+'</strong><small>'+x[2]+'</small></span></div>').join('')+'</div></section>'+
 '<section class="glam wow-tones"><h2>Познакомимся с тонами китайского языка</h2><div class="tone-grid">'+
 [['mā','1 · ровный','─'],['má','2 · вверх','↗'],['mǎ','3 · изгиб','⌄'],['mà','4 · вниз','↘']].map(x=>'<div class="tone"><strong>'+x[0]+'</strong><span class="tone-arrow">'+x[2]+'</span><small>'+x[1]+'</small></div>').join('')+
 '</div><p class="small" style="text-align:center;margin:6px 0 0">Слушай запись и повторяй. Микрофон пока не проверяет точность тонов.</p></section></section>';
}
function renderWords(){
 const all=[...WORDS,{zh:'我',py:'wǒ',ru:'я · повторение HSK1'}];
 const icons=['📣','🪪','❓','👤'];
 return '<section class="screen screen--words">'+
 '<div class="poster-lead lesson-hero"><img class="poster-panda" src="./assets/hsk2-approved-panda-v357.svg" alt="Панда объясняет новые слова">'+
 '<div class="poster-content"><div class="poster-plaque">Как тебя зовут?</div><p>Сначала слова, затем простая фраза.</p></div></div>'+
 '<div class="poster-scroll word-scroll">Сначала слова, потом фраза</div><div class="step-tag">Шаг 2 из '+TOTAL+'</div>'+
 '<section class="glam"><div class="vocabulary-grid">'+all.map((w,i)=>
 '<article class="vocab-premium"><span class="symbol" aria-hidden="true">'+icons[i]+'</span>'+
 '<div class="hanzi" lang="zh-Hans">'+w.zh+'</div><div class="py">'+w.py+'</div>'+
 '<div class="ru">'+w.ru+'</div>'+sound(w.zh)+'</article>').join('')+'</div></section>'+
 '<div class="mini-scroll"><div class="hanzi" lang="zh-Hans">'+MODEL.question+'</div>'+
 '<div class="py">'+MODEL.qPy+'</div><div class="ru">'+MODEL.qRu+'</div>'+sound(MODEL.question)+'</div>'+
 '<p class="intro">🐾 Прослушай слова, повтори их вслух и переходи к грамматике.</p></section>';
}
function renderGrammar(){
 return '<section class="screen screen--grammar">'+header('Краткая грамматика')+
 '<div class="poster-scroll">📖 Одно правило — два примера</div>'+
 '<section class="glam"><h2>📚 Как спросить и сказать имя?</h2>'+
 '<div class="formula"><p class="formula-title">❓ Как тебя зовут?</p><div class="pills">'+
 [['你','ты'],['叫','зваться'],['什么','какое'],['名字','имя']].map((x,i)=> (i?'<span class="operator">+</span>':'')+'<span class="pill"><b>'+x[0]+'</b><small>'+x[1]+'</small></span>').join('')+
 '</div><div class="translation">你叫什么名字？ — Как тебя зовут?</div></div>'+
 '<div class="formula"><p class="formula-title">💬 Как назвать своё имя?</p><div class="pills">'+
 [['我','я'],['叫','зваться'],['米沙','Миша']].map((x,i)=>(i?'<span class="operator">+</span>':'')+'<span class="pill"><b>'+x[0]+'</b><small>'+x[1]+'</small></span>').join('')+
 '</div><div class="translation">我叫米沙。 — Меня зовут Миша.</div></div>'+
 '<div class="definition">💡 <b>什么 (shénme)</b> — «что / какой». В сочетании <b>什么名字</b> спрашиваем «какое имя?». В ответе имя стоит <b>после 叫</b>.</div></section>'+
 '<section class="glam"><h2>🎧 Послушай примеры</h2><div style="display:grid;gap:6px">'+
 '<div class="example"><span class="avatar">🐼</span><div class="example-content"><div class="hanzi">'+MODEL.question+'</div><div class="py">'+MODEL.qPy+'</div><div class="ru">'+MODEL.qRu+'</div></div>'+sound(MODEL.question,true)+'</div>'+
 '<div class="example"><span class="avatar"><img src="./assets/hsk2-misha-avatar-v353.svg" alt="Миша"></span><div class="example-content"><div class="hanzi">'+MODEL.answer+'</div><div class="py">'+MODEL.aPy+'</div><div class="ru">'+MODEL.aRu+'</div></div></div>'+
 '</div><p class="small" style="margin-top:8px">Запись ответа с именем Миша пока отсутствует. Мы не подменяем её другим голосом.</p></section></section>';
}
function renderTest(){
 const isRight=state.selected===1;
 const built=state.build.map(i=>TOKENS[i]).join('');
 const complete=state.build.length===TOKENS.length;
 const buildCorrect=built==='我叫米沙。';
 const msg=state.mic==='pass'?'✓ Браузер распознал слова (точность тонов не проверена).':state.mic==='fail'?'Слова пока не распознаны. Прослушай и повтори.':state.mic==='skip'?'Голосовая проверка пропущена. Можно продолжать.':'Нажми на микрофон или пропусти, если недоступен.';
 return '<section class="screen screen--test">'+header('Проверим себя')+
 '<section class="glam"><h2>🎧 1. Что спросила Панда?</h2><button type="button" class="play-big" data-audio="'+MODEL.question+'">▶ Слушать вопрос</button>'+
 '<div class="choices" style="margin-top:9px">'+['Где ты живёшь?','Как тебя зовут?','Кем ты работаешь?'].map((x,i)=>'<button type="button" class="choice '+(state.checked?(i===1?'correct':state.selected===i?'wrong':''):state.selected===i?'chosen':'')+'" data-choice="'+i+'" aria-pressed="'+(state.selected===i)+'">'+x+'</button>').join('')+'</div>'+
 '<p class="feedback '+(state.checked?(isRight?'good':'bad'):'')+'" role="status">'+(state.checked?(isRight?'✓ Верно! Ты узнал вопрос.':'Пока неверно — послушай ещё раз.'):state.heard?'Выбери перевод и нажми «Проверить».':'Сначала послушай запись.')+'</p>'+
 '<button type="button" class="voice" data-check '+(state.selected==null||!state.heard?'disabled':'')+'>'+(state.checked?'↻ Проверить снова':'✓ Проверить ответ')+'</button></section>'+
 '<section class="glam"><h2>🧩 2. Собери ответ «Меня зовут Миша»</h2><div class="builder-space">'+(state.build.length?state.build.map((id,pos)=>'<button type="button" class="tile" data-remove="'+pos+'" aria-label="Убрать '+TOKENS[id]+'">'+TOKENS[id]+'</button>').join(''):'<span class="intro">Нажимай на слова по порядку…</span>')+'</div>'+
 '<div class="builder-tokens">'+TOKENS.map((x,i)=>'<button type="button" class="tile" data-tile="'+i+'" '+(state.build.includes(i)?'disabled':'')+'>'+x+'</button>').join('')+'</div>'+
 '<p class="feedback '+(buildCorrect?'good':complete?'bad':'')+'">'+(buildCorrect?'✓ Правильно! 我叫米沙。':complete?'Попробуй поменять порядок: нажимай на лишние слова сверху.':'Подсказка: кто → 叫 → имя.')+'</p></section>'+
 '<section class="glam"><h2>🎤 3. Скажи по-китайски</h2><div style="text-align:center;margin-bottom:8px"><div class="hanzi">'+MODEL.answer+'</div><div class="py">'+MODEL.aPy+'</div><div class="ru">'+MODEL.aRu+'</div></div>'+
 '<div class="mic-row"><button type="button" class="mic-button" data-mic aria-label="Сказать фразу" '+(micActive||!window.PandaHSK2PracticeV326?.speechAvailable()?'disabled':'')+'>🎤</button><div class="mic-status" role="status">'+msg+'</div></div>'+
 '<button type="button" class="voice" data-skip style="margin-top:9px">Пройти без микрофона</button>'+
 '<p class="small" style="margin-top:8px">Распознавание текста не оценивает китайские тоны. Для тонов сравнивай своё произношение с образцом.</p></section></section>';
}
function renderDialogue(){
 const show=state.dialogueRevealed;
 return '<section class="screen screen--dialogue">'+header('Мини-диалог')+
 '<section class="glam"><h2>💬 Послушай, повтори и ответь</h2><div class="dialogue">'+
 '<div class="bubble"><div class="face"><img src="./assets/hsk2-approved-panda-face-v357.svg" alt="Панда"></div><article class="chat"><div class="hanzi">'+MODEL.question+'</div><div class="py">'+MODEL.qPy+'</div><div class="ru">'+MODEL.qRu+'</div>'+sound(MODEL.question)+'</article></div>'+
 (show?'<div class="bubble reply"><div class="face"><img src="./assets/hsk2-misha-avatar-v353.svg" alt="Миша"></div><article class="chat"><div class="hanzi">'+MODEL.answer+'</div><div class="py">'+MODEL.aPy+'</div><div class="ru">'+MODEL.aRu+'</div><span class="small">Прочитай вслух: для имени Миша отдельной записи пока нет</span></article></div>':
 '<button type="button" class="play-big" data-reveal>💬 Ответить Панде: «Меня зовут Миша»</button>')+
 '</div></section>'+
 (show?'<section class="glam"><h2>🌸 Что запомнить</h2><div class="remember"><div>✅ <b>你叫什么名字？</b><span>Как тебя зовут?</span></div><div>✅ <b>我叫…</b><span>Меня зовут…</span></div></div>'+
 '<p class="intro" style="margin-top:10px">Ты можешь назвать своё имя вместо Миши. Для этого нужна только конструкция 我叫…</p></section>'+
 '<div class="reward">⭐ Отличная работа! Ты научился спрашивать имя и представляться.</div>':'<p class="hint">Сначала послушай Панду. Затем покажи ответ и прочитай его вслух.</p>')+'</section>';
}
let micActive=false;
function startMic(){
 const module=window.PandaHSK2PracticeV326;
 if(micActive||!module?.speechAvailable()){notice('Микрофон недоступен в этом браузере. Нажми «Пройти без микрофона».');return}
 micActive=true;notice('🎙️ Слушаю…');render();
 module.recognize(['我叫米沙','我叫米莎'],(ok,msg)=>{
  micActive=false;
  if(ok!==null){state.mic=ok?'pass':'fail';state.recognized=msg||'';save()}
  notice(msg||'');render();
 });
}
function canAdvance(){
 if(state.step===3)return state.heard&&state.checked&&state.selected===1&&state.build.map(i=>TOKENS[i]).join('')==='我叫米沙。';
 if(state.step===4)return state.dialogueRevealed;
 return true;
}
function render(){
 const views=[renderPlan,renderWords,renderGrammar,renderTest,renderDialogue];
 $('screen').innerHTML=views[state.step]();
 shadePinyin();
 $('prev').disabled=state.step===0;
 $('next').disabled=!canAdvance();
 $('next').textContent=state.step===0?'🐼 Начать урок →':state.step===1?'К грамматике →':state.step===4?'Завершить урок ✓':'Дальше →';
 $('repeat').textContent=state.step===0?'↻ План заново':'↻ Повторить';
}
$('screen').addEventListener('click',event=>{
 const b=event.target.closest('button');if(!b)return;
 if(b.dataset.audio){goAudio(b.dataset.audio);render();return}
 if(b.hasAttribute('data-choice')){state.selected=Number(b.dataset.choice);state.checked=false;save();render();return}
 if(b.hasAttribute('data-check')){state.checked=true;save();render();return}
 if(b.hasAttribute('data-tile')){const id=Number(b.dataset.tile);if(!state.build.includes(id))state.build.push(id);save();render();return}
 if(b.hasAttribute('data-remove')){state.build.splice(Number(b.dataset.remove),1);save();render();return}
 if(b.hasAttribute('data-mic')){startMic();return}
 if(b.hasAttribute('data-skip')){state.mic='skip';save();render();return}
 if(b.hasAttribute('data-reveal')){state.dialogueRevealed=true;save();render();return}
});
$('toggle-py').addEventListener('click',()=>{state.showPy=!state.showPy;save();shadePinyin()});
$('prev').addEventListener('click',()=>{if(state.step>0){window.PandaHsk2AudioV330?.stop();state.step--;save();notice('');render();$('page').scrollTop=0}});
$('next').addEventListener('click',()=>{
 if(!canAdvance())return;
 window.PandaHsk2AudioV330?.stop();
 if(state.step===TOTAL-1){
  state.completed=true;save();
  location.href='./hsk2-start.html#map';return;
 }
 state.step++;save();notice('');render();$('page').scrollTop=0;
});
$('repeat').addEventListener('click',()=>{
 window.PandaHsk2AudioV330?.stop();
 if(state.step===3){state.selected=null;state.checked=false;state.heard=false;state.build=[];state.mic='none'}
 if(state.step===4)state.dialogueRevealed=false;
 if(state.step===0)state.step=0;
 save();notice('Задание готово к повторению');render();$('page').scrollTop=0;
});
render();
})();
</script>
</body>
</html>
