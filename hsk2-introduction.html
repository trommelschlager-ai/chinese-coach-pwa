<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const WORDS=[
 ['叫','jiào','зваться, называться'],['名字','míngzi','имя'],['什么','shénme','что, какой'],['我','wǒ','я · повторение HSK 1'],
 ['住','zhù','жить, проживать'],['在','zài','в, на; находиться'],['哪儿','nǎr','где (разговорно)'],['莫斯科','Mòsīkē','Москва · пример города'],
 ['工作','gōngzuò','работать; работа'],['做','zuò','делать'],['医生','yīshēng','врач'],['老师','lǎoshī','учитель · повторение HSK 1']
];
const steps=[
 {kind:'words',title:'Как меня зовут?',items:WORDS.slice(0,4)},
 {kind:'rule',title:'Назови своё имя',formula:'我 + 叫 + ИМЯ',example:['我叫安娜。','Wǒ jiào Ānnà.','Меня зовут Анна.'],why:'叫 (jiào) — «зваться». Имена других стран необязательно переводить на китайский.'},
 {kind:'place-words',title:'Сначала разбираем 住 и 在'},
 {kind:'structure',title:'Как построить фразу о городе',formula:'我 + 住在 + ГОРОД'},
 {kind:'words',title:'Кем я работаю?',items:WORDS.slice(8,12)},
 {kind:'rule',title:'Назови профессию',formula:'我 + 是 + ПРОФЕССИЯ',example:['我是医生。','Wǒ shì yīshēng.','Я врач.'],why:'Для профессии-существительного используем 是. «Я работаю в Москве»: 我在莫斯科工作。'},
 {kind:'examples',title:'Три фразы о себе',items:[['我叫安娜。','Wǒ jiào Ānnà.','Меня зовут Анна.'],['我住在莫斯科。','Wǒ zhù zài Mòsīkē.','Я живу в Москве.'],['我是医生。','Wǒ shì yīshēng.','Я врач.']]},
 {kind:'dialogue',title:'Вопросы при знакомстве',items:[
 ['A','你叫什么名字？','Nǐ jiào shénme míngzi?','Как тебя зовут?'],
 ['B','我叫安娜。','Wǒ jiào Ānnà.','Меня зовут Анна.'],
 ['A','你住在哪儿？','Nǐ zhù zài nǎr?','Где ты живёшь?'],
 ['B','我住在莫斯科。','Wǒ zhù zài Mòsīkē.','Я живу в Москве.'],
 ['A','你做什么工作？','Nǐ zuò shénme gōngzuò?','Кем ты работаешь?'],
 ['B','我是医生。','Wǒ shì yīshēng.','Я врач.']]},
 {kind:'quiz',title:'Проверяем понимание',question:'Как перевести 我住在莫斯科。?',choices:['Меня зовут Москва.','Я работаю в Москве.','Я живу в Москве.'],answer:2,why:'我 (я) + 住在 (живу в) + 莫斯科 (Москва).'},
 {kind:'build',title:'Собери предложение',question:'«Я живу в Москве»',tokens:['莫斯科','住在','我'],answer:['我','住在','莫斯科'],why:'Кто + 住在 + где живёт.'},
 {kind:'profile',title:'Теперь расскажи о себе'},
 {kind:'dialogue-practice',title:'Поговори с Пандой'},
 {kind:'finish',title:'Ты умеешь представляться!',desc:'Ты научился говорить, как тебя зовут, где ты живёшь и кем работаешь. Переходи к построению новых предложений.'}
];
const key='pg-hsk2-introduction-v1';
let state={step:0,answers:{},build:[],showPy:true,completed:false,readDialoguePair:0,structureTab:'phrase',dialogue:{index:0,passed:[false,false,false],assisted:[false,false,false],completed:false},profile:{name:'',city:'',job:'老师',other:''}};
try{const x=JSON.parse(localStorage.getItem(key)||'null');if(x&&typeof x==='object')state={...state,...x,answers:x.answers||{},build:Array.isArray(x.build)?x.build:[],dialogue:{index:0,passed:[false,false,false],assisted:[false,false,false],completed:false,...(x.dialogue||{})},profile:{name:'',city:'',job:'老师',other:'',...(x.profile||{})}}}catch{}
const save=()=>{try{localStorage.setItem(key,JSON.stringify(state))}catch{}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* Exact HSK1 owner-approved recordings. No phoneme splice or synthetic fallback. */
const APPROVED_HSK2_REUSE=Object.freeze({
 '我':'assets/lesson1-xiaoxiao-v260/wo.mp3',
 '老师':'assets/panda-lesson2-xiaoxiao-v261/laoshi.mp3',
 '我是老师':'assets/panda-lesson2-xiaoxiao-v261/woshilaoshi.mp3'
});
const LIVE_AUDIO_BASE='https://trommelschlager-ai.github.io/chinese-coach-pwa/';
const matchingAudio=phrase=>APPROVED_HSK2_REUSE[String(phrase||'').replace(/[。！？?!，,\s]/g,'')]||null;
function approvedAudioUrl(phrase){
 const src=matchingAudio(phrase);
 if(!src)return null;
 return location.hostname==='trommelschlager-ai.github.io'?'./'+src:LIVE_AUDIO_BASE+src;
}
let playingApprovedAudio=null;
function stopApprovedAudio(){
 if(!playingApprovedAudio)return;
 try{playingApprovedAudio.pause();playingApprovedAudio.currentTime=0}catch{}
 playingApprovedAudio=null;
}
function setAudioStatus(message,isError=false){
 const out=$('audio-status');if(out){out.textContent=message;out.classList.toggle('warn',isError)}
}
function playApprovedAudio(phrase){
 const url=approvedAudioUrl(phrase);
 if(!url){setAudioStatus('Для этой фразы пока нет проверенной аудиозаписи.',true);return}
 stopApprovedAudio();
 let audio;
 try{audio=new Audio(url)}catch{setAudioStatus('Не удалось запустить аудиоплеер.',true);return}
 playingApprovedAudio=audio;audio.preload='none';
 audio.addEventListener('ended',()=>{if(playingApprovedAudio===audio){playingApprovedAudio=null;setAudioStatus('Запись воспроизведена.')}},{once:true});
 audio.addEventListener('error',()=>{if(playingApprovedAudio===audio){playingApprovedAudio=null;setAudioStatus('Запись не загрузилась. Проверь интернет.',true)}},{once:true});
 setAudioStatus('Загружается запись HSK 1…');
 try{const pending=audio.play();if(pending&&pending.catch)pending.catch(()=>{if(playingApprovedAudio===audio){playingApprovedAudio=null;setAudioStatus('Chrome не разрешил включить звук. Нажми 🔊 ещё раз.',true)}})}
 catch{if(playingApprovedAudio===audio){playingApprovedAudio=null;setAudioStatus('Ошибка аудио. Нажми ещё раз.',true)}}
}
const clipButton=phrase=>matchingAudio(phrase)?'<button class="audio-clip-button" type="button" data-audio="'+esc(phrase)+'" aria-label="Слушать: '+esc(phrase)+'">🔊 Слушать</button>':'';

const word=([zh,py,ru])=>'<article class="vocab"><div lang="zh-Hans" class="hanzi">'+esc(zh)+'</div><div class="py">'+esc(py)+'</div><div class="ru">'+esc(ru)+'</div>'+clipButton(zh)+'</article>';
const example=([zh,py,ru])=>'<div class="example"><b lang="zh-Hans">'+esc(zh)+'</b><span class="py">'+esc(py)+'</span><span class="ru">'+esc(ru)+'</span>'+clipButton(zh)+'</div>';

function convertedProfile(){
 const p=state.profile,svc=window.PandaHSK2PracticeV324;
 if(!svc)return {name:{zh:''},city:{zh:''},job:{zh:''}};
 const name=svc.mapProfile('name',p.name),city=svc.mapProfile('city',p.city);
 if(typeof p.nameZh==='string'&&/^[\u3400-\u9fff·\s]{1,30}$/u.test(p.nameZh.trim())&&p.name.trim()){name.zh=p.nameZh.trim().replace(/\s+/g,'');name.py='';name.known=false}
 if(typeof p.cityZh==='string'&&/^[\u3400-\u9fff·\s]{1,30}$/u.test(p.cityZh.trim())&&p.city.trim()){city.zh=p.cityZh.trim().replace(/\s+/g,'');city.py='';city.known=false}
 return {name,city,job:svc.mapProfile('job',p.job==='other'?p.other:p.job)};
}
// Any nonempty city or name is accepted; translations are never fabricated.
const profileReady=()=>{const p=state.profile;return !!(p.name?.trim()&&p.city?.trim()&&(p.job==='other'?p.other?.trim():p.job?.trim()))};
function profileOutput(){
 const target=$('profile-output');if(!target)return;
 const p=state.profile,m=convertedProfile(),raw=[p.name||'',p.city||'',p.job==='other'?p.other:(p.job||'')];
 const hints=[];
 if(raw[0].trim()&&!m.name.zh)hints.push('Имя не переведено. Это не мешает продолжить урок.');
 if(raw[1].trim()&&!m.city.zh)hints.push('Город не переведён. Ты можешь перейти дальше с любым городом.');
 if(raw[2].trim()&&!m.job.zh)hints.push('Профессия пока без китайского перевода.');
 const phrase=(prefix,pyPrefix,word,ru)=>example([prefix+(word.zh||'（название по-китайски）')+(word.zh?'。':''),pyPrefix+(word.py?' '+word.py:' …'),ru]);
 target.innerHTML=phrase('我叫','Wǒ jiào',m.name,'Меня зовут '+(p.name||'…')+'.')+
  phrase('我住在','Wǒ zhù zài',m.city,'Я живу в городе '+(p.city||'…')+'.')+
  phrase('我是','Wǒ shì',m.job,'Моя профессия: '+(p.job==='other'?p.other:p.job||'…')+'.');
 const status=$('profile-conversion-status');
 if(status){status.textContent=hints.length?'Можно продолжить! '+hints.join(' '):'✓ Китайские предложения составлены. Проверяй собственные названия у носителя.';status.classList.toggle('warning',hints.length>0)}
 const details=target.closest('details');if(details&&profileReady())details.open=true;
 const next=$('screen').querySelector('[data-next]');if(next)next.disabled=!profileReady();
}
function profileForm(){
 const p=state.profile,job=p.job||'老师',choices=[['老师','Учитель'],['医生','Врач'],['司机','Водитель'],['学生','Ученик / студент'],['工程师','Инженер'],['other','Другая профессия']];
 return '<p class="intro">Введи имя, город и профессию на русском или китайском. Известные названия подставятся автоматически.</p><div class="intro-form">'+
 '<label>Как тебя зовут?<input data-field="name" maxlength="40" autocomplete="off" placeholder="Иван / 伊万" value="'+esc(p.name||'')+'"></label>'+
 '<label>Где ты живёшь?<input data-field="city" maxlength="40" autocomplete="off" placeholder="Калуга / 卡卢加" value="'+esc(p.city||'')+'"></label>'+
 '<label>Кем работаешь?<select data-field="job">'+choices.map(([v,t])=>'<option value="'+v+'" '+(v===job?'selected':'')+'>'+t+'</option>').join('')+'</select></label>'+
 (job==='other'?'<label>Название профессии на русском или китайском<input data-field="other" maxlength="40" autocomplete="off" placeholder="Лётчик / 飞行员" value="'+esc(p.other||'')+'"></label>':'')+
 '</div><details class="profile-optional"><summary>✏️ Знаешь написание имени или города иероглифами?</summary>'+
 '<label>Имя иероглифами (необязательно)<input data-field="nameZh" maxlength="30" value="'+esc(p.nameZh||'')+'" placeholder="Например: 安娜"></label>'+
 '<label>Город иероглифами (необязательно)<input data-field="cityZh" maxlength="30" value="'+esc(p.cityZh||'')+'" placeholder="Например: 莫斯科"></label>'+
 '</details><p id="profile-conversion-status" class="pg-profile-help" role="status"></p>'+
 '<details class="profile-phrases"><summary>Мои 3 предложения ▾</summary><div class="intro-output" id="profile-output" aria-live="polite"></div></details>'+
 '<p id="audio-status" role="status" class="audio-status" aria-live="polite"></p>'+
 '<p class="notice">Любой город и имя допустимы. Неизвестные названия не переводим автоматически, но они не блокируют урок. Данные сохраняются только в браузере.</p>';
}
function speechPhrase(kind){
 const p=convertedProfile(),isName=kind==='name';
 const stem=isName?'我叫':'我住在',resolved=isName?p.name.zh:p.city.zh;
 const phrase=resolved?stem+resolved:stem;
 const label=isName?'Меня зовут… × 3':'Я живу в… × 3';
 window.PandaHSK2PracticeV324?.open({id:'intro-'+kind,title:label,
 items:[{zh:phrase,ru:isName?'Тренируй 我叫. Можно произнести своё имя.':'Тренируй 我住在. Можно назвать свой город.',
 targets:[stem,phrase]}]});
}
const PANDA_INTRO_QUESTIONS=Object.freeze([
 {zh:'你叫什么名字？',py:'Nǐ jiào shénme míngzi?',ru:'Как тебя зовут?',sample:'我叫安娜。',samplePy:'Wǒ jiào Ānnà.',ruSample:'Меня зовут Анна.'},
 {zh:'你住在哪儿？',py:'Nǐ zhù zài nǎr?',ru:'Где ты живёшь?',sample:'我住在莫斯科。',samplePy:'Wǒ zhù zài Mòsīkē.',ruSample:'Я живу в Москве.'},
 {zh:'你做什么工作？',py:'Nǐ zuò shénme gōngzuò?',ru:'Кем ты работаешь?',sample:'我是医生。',samplePy:'Wǒ shì yīshēng.',ruSample:'Я врач.'}
]);
function normalizeIntroAnswer(s){return String(s||'').normalize('NFKC').replace(/[。！？!?，,.\s\u200b]/g,'').trim()}
function gradeIntroAnswer(index,answer){
 const x=normalizeIntroAnswer(answer);
 if(!x)return {ok:false,code:'empty',feedback:'Напиши ответ по-китайски или воспользуйся подсказкой.'};
 if(x.length>90)return {ok:false,code:'long',feedback:'Ответ слишком длинный. Начни с одной короткой фразы.'};
 if(/(?:什么名字|在哪儿|什么工作|叫啥|你叫什么|你住在|你做什么)/.test(x))return {ok:false,code:'question',feedback:'Это вопрос, а нам нужен твой ответ от первого лица: 我…'};
 if(index===0){
  if(/^我叫(.+)$/.test(x)||/^我的名字(?:是|叫)(.+)$/.test(x)||/^我是(.+)$/.test(x)){
   const name=x.replace(/^我叫|^我的名字(?:是|叫)|^我是/,'');
   if(!name||/^(?:什么|谁|名字)$/.test(name))return {ok:false,code:'missing',feedback:'После 我叫 укажи имя. Например: 我叫安娜。'};
   if(/^(?:医生|老师|学生|司机|工程师|厨师|工人|护士|经理|工作|一名|在)/.test(name))return {ok:false,code:'profession',feedback:'Ты назвал профессию или место, а Панда спросила имя. Начни с 我叫 + имя.'};
   return {ok:true,code:'name',feedback:/[А-Яа-яA-Za-z]/.test(name)?'Строение фразы верное. Имя написано не иероглифами — его китайское произношение и тоны не проверены.':'Хорошо! Ты правильно представился. Имя может быть любым.'};
  }
  return {ok:false,code:'order',feedback:'Для знакомства используй 我叫 + имя. Например: 我叫安娜。'};
 }
 if(index===1){
  if(/^我住在(.+)$/.test(x)||/^我住(.+)$/.test(x)){
   const city=x.replace(/^我住在|^我住/,'');
   if(!city||/(什么|哪儿|哪里)$/.test(city))return {ok:false,code:'missing',feedback:'После 住在 укажи город. Например: 我住在莫斯科。'};
   if(/^(?:工作|医生|老师|学生|什么|是|学习)/.test(city))return {ok:false,code:'not-city',feedback:'После 住在 нужно назвать город или место, где живёшь. Например: 莫斯科。'};
   return {ok:true,code:'city',feedback:x.startsWith('我住在')?'Правильно: 我 + 住在 + название города. Само название города автоматически не проверяется.':'В разговоре тебя поймут. Для учебного образца лучше 我住在 + город.'};
  }
  if(/^我在(.+)$/.test(x))return {ok:false,code:'location',feedback:'我在… означает «я нахожусь…». Чтобы сказать, где живёшь, добавь 住: 我住在莫斯科。'};
  if(x==='莫斯科'||x==='北京'||x==='上海')return {ok:true,code:'short',feedback:'Короткий ответ допустим. Полным предложением: 我住在'+x+'。'};
  return {ok:false,code:'order',feedback:'Шаблон для города: 我 + 住在 + город. Например: 我住在莫斯科。'};
 }
 if(index===2){
  if(/^我(?:是|是一名|是一位|当)(.+)$/.test(x)){
   const job=x.replace(/^我(?:是一名|是一位|是|当)/,'');
   if(!job||/(什么|谁|吗)$/.test(job))return {ok:false,code:'missing',feedback:'После 我是 назови профессию: 我是医生。'};
   if(/^(?:在|住|叫|什么|哪儿|莫斯科|北京|上海)/.test(job))return {ok:false,code:'not-job',feedback:'Ты назвал место или другое действие, а нужен ответ о профессии: 我是医生。'};
   return {ok:true,code:'job',feedback:'Основа верная: 我是 + профессия. Само название незнакомой профессии автоматически не проверяется.'};
  }
  if(/^(?:我)?(?:没|没有)工作$/.test(x)||/^我(?:还在上学|是学生)$/.test(x))return {ok:true,code:'status',feedback:'Хороший ответ! Если сейчас не работаешь или учишься, можно сказать и так.'};
  if(/^我在.+工作$/.test(x))return {ok:false,code:'workplace',feedback:'Так ты назвал место работы, а вопрос — о профессии. Скажи 我是医生。 или 我是老师。'};
  return {ok:false,code:'order',feedback:'Профессию называем с 是: 我是医生。 Если не работаешь: 我没有工作。'};
 }
 return {ok:false,code:'unknown',feedback:'Не удалось определить вопрос.'};
}
// Проверка ограничена тремя учебными конструкциями, не является языковой моделью или оценкой тонов.
if(typeof window!=='undefined')window.PandaGoHsk2IntroCheck=Object.freeze({gradeIntroAnswer,normalizeIntroAnswer,PANDA_INTRO_QUESTIONS});
let dialogueDraft='',dialogueFeedback=null;
function introDialogueState(){
 const d=state.dialogue||{};
 return {index:Math.max(0,Math.min(2,Number(d.index)||0)),passed:Array.isArray(d.passed)?d.passed:[false,false,false],assisted:Array.isArray(d.assisted)?d.assisted:[false,false,false]};
}
function introDialogueScreen(){
 const d=introDialogueState(),i=d.index,q=PANDA_INTRO_QUESTIONS[i],ready=!!(d.passed[i]||d.assisted[i]);
 return '<div class="intro-dialogue">'+
 '<p class="question-counter">Вопрос '+(i+1)+' из 3 · '+(d.passed.filter(Boolean).length)+' без подсказки</p>'+
 '<div class="question"><b lang="zh-Hans">'+esc(q.zh)+'</b><span class="py">'+esc(q.py)+'</span><small>'+esc(q.ru)+'</small></div>'+
 '<label for="intro-answer">Твой ответ на китайском</label>'+
 '<input type="text" id="intro-answer" maxlength="90" lang="zh-CN" autocomplete="off" spellcheck="false" placeholder="Например: '+esc(q.sample)+'" value="'+esc(dialogueDraft)+'">'+
 '<div class="dialogue-buttons"><button type="button" class="primary" data-dialogue-check>Проверить</button>'+
 '<button type="button" class="softbtn" data-dialogue-hint>Подсказка</button>'+
 (typeof window!=='undefined'&&(window.SpeechRecognition||window.webkitSpeechRecognition)?'<button type="button" class="softbtn" data-dialogue-mic>🎤 Сказать</button>':'')+
 '</div>'+
 (dialogueFeedback?'<div role="status" class="dialogue-feedback '+(dialogueFeedback.ok?'ok':'err')+'">'+esc(dialogueFeedback.feedback)+'</div>':'')+
 (d.assisted[i]?'<div class="dialogue-feedback">'+esc(q.sample)+' · '+esc(q.samplePy)+' · '+esc(q.ruSample)+'</div>':'')+
 '<div class="dialogue-buttons"><button type="button" class="softbtn" data-dialogue-back '+(i===0?'disabled':'')+'>← Вопрос назад</button><button type="button" class="primary" data-dialogue-forward '+(ready?'':'disabled')+'>'+(i===2?'Закончить разговор ✓':'Следующий вопрос →')+'</button></div>'+
 '<p class="dialogue-note">Проверяем только текст и три учебные конструкции. Это не проверка произношения или тонов. Если использовать микрофон, распознавание браузера может передавать голос своему сервису и требовать интернет; это не оценка тонов.</p></div>';
}

function placeWordsScreen(){
 return '<div class="hsk2-meaning-first">'+
 '<p class="meaning-lead">Прежде чем составлять предложение, поймём два слова и их место в фразе.</p>'+
 '<div class="meaning-two">'+
 '<article class="meaning-tile"><span class="meaning-character" lang="zh-Hans">住</span><span class="meaning-pinyin py">zhù · 4-й тон</span><span class="meaning-russian">жить</span><span class="meaning-role">Это действие: что человек делает?</span></article>'+
 '<article class="meaning-tile"><span class="meaning-character" lang="zh-Hans">在</span><span class="meaning-pinyin py">zài · 4-й тон</span><span class="meaning-russian">в / на</span><span class="meaning-role">Здесь указывает место: где живёт?</span></article>'+
 '</div>'+
 '<div class="meaning-connect"><strong lang="zh-Hans">住 + 在 → 住在</strong><span class="py">zhù + zài → zhù zài</span><span>Вместе: <b>«жить в определённом месте»</b></span></div>'+
 '<p class="meaning-note"><b>Порядок:</b> сначала действие <b lang="zh-Hans">住</b> (жить), за ним <b lang="zh-Hans">在</b> (указание места), а после — город. Оба слова произносятся с <b>4-м, падающим тоном</b>.</p>'+
 
 '<p class="meaning-prompt">🔇 Аудио для 住 и 在 ещё записывается. Далее — собираем фразу →</p>'+
 '</div>';
}

function structureScreen(){
 const parts=[
  ['我','wǒ','я','👤'],
  ['住','zhù','жить','⌂'],
  ['在','zài','в (место)','📍'],
  ['莫斯科','Mòsīkē','Москва','🏙️']
 ];
 return '<div class="hsk2-structure" data-view="'+(state.structureTab==='order'?'order':'phrase')+'">'+
 '<div class="hsk2-structure-tabs"><button type="button" data-structure-tab="phrase" aria-pressed="'+(state.structureTab!=='order')+'">🧩 Фраза и слова</button><button type="button" data-structure-tab="order" aria-pressed="'+(state.structureTab==='order')+'">📖 Порядок слов</button></div>'+
 '<div class="hsk2-phrase-card">'+
 '<div class="hsk2-city-art">'+cityIllustration()+'</div>'+
 '<div class="hsk2-phrase-main">'+
 '<button class="hsk2-sound-badge" type="button" disabled title="Запись носителя ещё не подключена" aria-label="Аудиозапись ещё готовится">🔊 Запись готовится</button>'+
 '<div class="hanzi" lang="zh-Hans">我住在莫斯科。</div>'+
 '<span class="pronounce py">Wǒ zhù zài Mòsīkē.</span>'+
 '<div class="translation">Я живу в Москве.</div></div></div>'+
 '<div class="hsk2-ribbon">Из чего состоит предложение</div>'+
 '<div class="hsk2-word-parts">'+parts.map(p=>'<div class="hsk2-word-part"><span class="mark" aria-hidden="true">'+p[3]+'</span><span class="symbol" lang="zh-Hans">'+p[0]+'</span><span class="phonetic py">'+p[1]+'</span><span class="meaning">'+p[2]+'</span></div>').join('')+'</div>'+
 '<div class="hsk2-ribbon">Порядок слов: что за чем?</div>'+
 '<div class="hsk2-order"><div><strong>① КТО?</strong><b lang="zh-Hans">我</b></div><div><strong>② ЧТО ДЕЛАЕТ?</strong><b lang="zh-Hans">住在</b></div><div><strong>③ ГДЕ?</strong><b lang="zh-Hans">莫斯科</b></div></div>'+
 '<p class="hsk2-order-note"><strong>Правило:</strong> сначала <b>кто</b>, затем <b>живёт в (住在)</b>, затем <b>город</b>. Слово <b>住</b> означает «жить», а <b>在</b> здесь указывает место. Вместе <b>住在</b> — «жить в».</p>'+
 '<p class="lesson-note">Дальше соберём эту фразу самостоятельно из знакомых слов.</p>'+
 '</div>';
}

function render(){
 stopApprovedAudio();
 state.step=Math.max(0,Math.min(steps.length-1,Number(state.step)||0));
 const i=state.step,s=steps[i],answer=state.answers[i];let inside='';
 $('app').classList.toggle('structure-page',s.kind==='structure'||s.kind==='place-words');
 if(s.kind==='words')inside='<p class="intro">Новые слова: иероглифы, пиньинь и перевод.</p><div class="vocgrid">'+s.items.map(word).join('')+'</div><p id="audio-status" class="audio-status" role="status" aria-live="polite"></p><p class="notice">🔊 Только для точных MP3 из HSK 1. На тестовом сайте нужен интернет. Остальные записи ещё готовятся.</p>';
 if(s.kind==='place-words')inside=placeWordsScreen();
 if(s.kind==='structure')inside=structureScreen();
 if(s.kind==='rule')inside='<div class="rule">'+esc(s.formula)+'</div>'+example(s.example)+(s.title==='Назови профессию'?example(['我是老师。','Wǒ shì lǎoshī.','Я учитель.']):'')+'<p class="explain spaced">'+esc(s.why)+'</p><p id="audio-status" class="audio-status" role="status" aria-live="polite"></p>';
 if(s.kind==='rule'&&s.title==='Назови своё имя')inside+='<button type="button" class="pg-speaking-launch" data-pg-drill="name">🎤 Скажи «我叫…» три раза</button>';
 if(s.kind==='structure')inside+='<button type="button" class="pg-speaking-launch" data-pg-drill="city">🎤 Скажи «我住在…» три раза</button>';
 if(s.kind==='examples')inside='<div class="examples">'+s.items.map(example).join('')+'</div>';
 if(s.kind==='dialogue'){
  state.readDialoguePair=Math.max(0,Math.min(2,Number(state.readDialoguePair)||0));
  inside='<p class="intro">Прочитай две реплики и перейди к следующей паре.</p>'+
   s.items.slice(state.readDialoguePair*2,state.readDialoguePair*2+2).map(([who,zh,py,ru])=>'<div class="bubble '+(who==='B'?'right':'')+'"><b lang="zh-Hans">'+esc(zh)+'</b><em class="py">'+esc(py)+'</em><span>'+esc(ru)+'</span></div>').join('')+
   '<div class="lesson-read-nav"><button class="softbtn" type="button" data-read-dialogue="prev" '+(state.readDialoguePair===0?'disabled':'')+'>← Раньше</button><small>Реплики '+(state.readDialoguePair*2+1)+'–'+(state.readDialoguePair*2+2)+' из 6</small><button class="softbtn" type="button" data-read-dialogue="next" '+(state.readDialoguePair===2?'disabled':'')+'>Далее →</button></div>'+
   '<p class="notice">Это учебный диалог. Panda AI подключается отдельно.</p>';
 }
 if(s.kind==='quiz')inside='<p class="intro"><b>'+esc(s.question)+'</b></p><div class="choices">'+s.choices.map((v,n)=>'<button class="choice '+(answer!=null?(n===s.answer?'correct':n===answer?'wrong':''):'')+'" data-answer="'+n+'">'+esc(v)+'</button>').join('')+'</div><div role="status" class="feedback '+(answer===s.answer?'ok':'')+'">'+(answer==null?'Выбери ответ.':(answer===s.answer?'✓ Правильно. ':'Проверь пример. ')+esc(s.why))+'</div>';
 if(s.kind==='build'){let a=state.build,str=a.map(n=>s.tokens[n]).join(''),ok=str===s.answer.join('');inside='<p class="intro">'+esc(s.question)+'</p><div class="builder">'+(a.length?a.map((n,j)=>'<button type="button" data-remove="'+j+'">'+esc(s.tokens[n])+'</button>').join(''):'<span class="small-caption">Выбирай слова в правильном порядке.</span>')+'</div><div class="tokens">'+s.tokens.map((w,n)=>'<button type="button" data-token="'+n+'" '+(a.includes(n)?'disabled':'')+'>'+esc(w)+'</button>').join('')+'</div><p class="feedback '+(ok?'ok':'')+'">'+(ok?'✓ Верно!':esc(s.why))+'</p>'}
 if(s.kind==='profile')inside=profileForm();
 if(s.kind==='dialogue-practice')inside=introDialogueScreen();
 if(s.kind==='finish'){const trained=introDialogueState().passed.every(Boolean);inside='<div style="text-align:center;font-size:35px">🌸 🐼</div><h2 style="text-align:center">'+esc(trained?s.title:'Знакомство с подсказками пройдено')+'</h2><p class="explain">'+esc(trained?s.desc:'Ты прошёл три вопроса, но часть ответов была с подсказками. Повтори разговор и попробуй ответить самостоятельно.')+'</p><p class="notice">Можно повторить любой шаг, а затем продолжить HSK 2.</p>';}
 const disabled=(s.kind==='quiz'&&answer!==s.answer)||(s.kind==='build'&&state.build.map(n=>s.tokens[n]).join('')!==s.answer.join(''))||(s.kind==='profile'&&!profileReady())||(s.kind==='dialogue-practice'&&!introDialogueState().passed.every(Boolean)&&!introDialogueState().passed.every((v,n)=>v||introDialogueState().assisted[n]));
 $('screen').innerHTML='<div class="banner">Меня зовут · где живу · кем работаю</div>'+
 '<div class="lesson-title"><strong>'+esc(s.title)+'</strong><span class="pill">Шаг '+(i+1)+' из '+steps.length+'</span></div>'+
 '<div class="meter"><i style="width:'+(i+1)*100/steps.length+'%"></i></div>'+
 '<section class="paper" aria-label="Урок самопрезентации">'+inside+'</section>'+
 '<div class="toolbar"><button class="softbtn" data-py type="button">'+(state.showPy?'Скрыть пиньинь':'Показать пиньинь')+'</button><button class="softbtn" data-repeat type="button">↻ Повторить</button></div>'+
 '<div class="bottom-actions"><div class="toolbar"><button class="softbtn" data-prev type="button" '+(i===0?'disabled':'')+'>← Назад</button><button class="primary" data-next type="button" '+(disabled?'disabled':'')+'>'+(s.kind==='finish'?'К основам грамматики →':s.kind==='dialogue-practice'?'К итогам →':'Дальше →')+'</button></div></div>'+
 '<p class="small-caption">Озвучку подключим после проверки тонов и записи носителя.</p>';
 $('screen').classList.toggle('hiddenpy',!state.showPy);
 $('screen').querySelectorAll('[data-pg-drill]').forEach(b=>b.addEventListener('click',()=>speechPhrase(b.dataset.pgDrill)));
 $('screen').querySelectorAll('[data-structure-tab]').forEach(b=>b.addEventListener('click',()=>{state.structureTab=b.dataset.structureTab==='order'?'order':'phrase';save();render()}));
 $('screen').querySelectorAll('[data-read-dialogue]').forEach(b=>b.addEventListener('click',()=>{state.readDialoguePair=Math.max(0,Math.min(2,state.readDialoguePair+(b.dataset.readDialogue==='next'?1:-1)));save();render()}));
 $('screen').querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>{state.answers[i]=Number(b.dataset.answer);save();render()}));
 $('screen').querySelectorAll('[data-token]').forEach(b=>b.addEventListener('click',()=>{const n=Number(b.dataset.token);if(!state.build.includes(n))state.build.push(n);save();render()}));
 $('screen').querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click',()=>{state.build.splice(Number(b.dataset.remove),1);save();render()}));
 $('screen').querySelector('[data-py]').addEventListener('click',()=>{state.showPy=!state.showPy;save();render()});
 $('screen').querySelector('[data-repeat]').addEventListener('click',()=>{state.step=0;state.build=[];state.dialogue={index:0,passed:[false,false,false],assisted:[false,false,false],completed:false};dialogueDraft='';dialogueFeedback=null;save();render()});
 $('screen').querySelector('[data-prev]').addEventListener('click',()=>{if(state.step>0){state.step--;save();render()}});
 $('screen').querySelector('[data-next]').addEventListener('click',()=>{if(s.kind==='profile'?!profileReady():disabled)return;if(s.kind==='finish'){state.completed=true;save();location.href='./hsk2-start.html#lesson'}else{state.step++;save();render()}});
 if(s.kind==='dialogue-practice'){
  const d=introDialogueState();
  const input=$('intro-answer');
  input.addEventListener('input',()=>{dialogueDraft=input.value});
  input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('screen').querySelector('[data-dialogue-check]').click()}});
  $('screen').querySelector('[data-dialogue-check]').addEventListener('click',()=>{
   dialogueDraft=input.value.trim();const result=gradeIntroAnswer(d.index,dialogueDraft);
   dialogueFeedback=result;
   if(result.ok){state.dialogue=state.dialogue||{};state.dialogue.passed=[...d.passed];state.dialogue.passed[d.index]=true;state.dialogue.assisted=[...d.assisted];state.dialogue.index=d.index;save()}
   render();
  });
  $('screen').querySelector('[data-dialogue-hint]').addEventListener('click',()=>{
   state.dialogue=state.dialogue||{};state.dialogue.assisted=[...d.assisted];state.dialogue.assisted[d.index]=true;state.dialogue.passed=[...d.passed];state.dialogue.index=d.index;save();
   dialogueFeedback={ok:false,feedback:'Посмотри пример, затем попробуй написать свою фразу. С подсказкой это не считается самостоятельным ответом.'};render();
  });
  $('screen').querySelector('[data-dialogue-back]').addEventListener('click',()=>{if(d.index>0){state.dialogue.index=d.index-1;dialogueDraft='';dialogueFeedback=null;save();render()}});
  $('screen').querySelector('[data-dialogue-forward]').addEventListener('click',()=>{
   if(!d.passed[d.index]&&!d.assisted[d.index])return;
   if(d.index<2){state.dialogue.index=d.index+1;dialogueDraft='';dialogueFeedback=null;save();render()}
   else{state.dialogue.completed=true;save();state.step++;dialogueDraft='';dialogueFeedback=null;save();render()}
  });
  const mic=$('screen').querySelector('[data-dialogue-mic]');
  if(mic)mic.addEventListener('click',()=>{
   const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
   if(!SpeechRecognition)return;
   const recog=new SpeechRecognition();recog.lang='zh-CN';recog.interimResults=false;recog.maxAlternatives=1;
   mic.disabled=true;mic.textContent='Слушаю…';
   recog.onresult=e=>{const transcript=e.results&&e.results[0]&&e.results[0][0]&&e.results[0][0].transcript;
    if(typeof transcript==='string'){input.value=transcript;dialogueDraft=transcript;input.focus()}};
   recog.onerror=()=>{dialogueFeedback={ok:false,feedback:'Распознавание недоступно. Напиши ответ вручную.'};const status=$('screen').querySelector('.dialogue-note');if(status)status.textContent=dialogueFeedback.feedback};
   recog.onend=()=>{mic.disabled=false;mic.textContent='🎤 Сказать'};
   try{recog.start()}catch{mic.disabled=false;mic.textContent='🎤 Сказать'}
  });
 }
 if(s.kind==='profile'){
  $('screen').querySelectorAll('[data-field]').forEach(el=>el.addEventListener(el.tagName==='SELECT'?'change':'input',()=>{state.profile[el.dataset.field]=el.value;save();if(el.dataset.field==='job')render();else profileOutput()}));
  profileOutput();
 }
}
$('scene-sub').textContent='HSK 2 · Учимся представляться';
$('scene-caption').textContent='Имя · город · работа';
document.querySelector('.backlink').href='./hsk2-start.html#map';
document.querySelectorAll('.nav a').forEach(a=>{const h=a.getAttribute('href');a.href='./hsk2-start.html'+h});
$('screen').addEventListener('click',event=>{
 const btn=event.target&&event.target.closest&&event.target.closest('[data-audio]');
 if(btn&&$('screen').contains(btn))playApprovedAudio(btn.dataset.audio);
});
render();
})();
</script></body></html>
