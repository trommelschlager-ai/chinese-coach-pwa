<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const WORDS=[
 ['叫','jiào','зваться, называться'],['名字','míngzi','имя'],['什么','shénme','что, какой'],['我','wǒ','я · повторение HSK 1'],
 ['住','zhù','жить, проживать'],['在','zài','в, на; находиться'],['哪儿','nǎr','где (разговорно)'],['莫斯科','Mòsīkē','Москва · пример города'],
 ['工作','gōngzuò','работать; работа'],['做','zuò','делать'],['医生','yīshēng','врач'],['老师','lǎoshī','учитель · повторение HSK 1']
];
const steps=[
 {kind:'model-dialogue',title:'Сначала послушай короткое знакомство',items:[
 ['A','你好！','Nǐ hǎo!','Привет!'],
 ['B','你好！','Nǐ hǎo!','Привет!'],
 ['A','你叫什么名字？','Nǐ jiào shénme míngzi?','Как тебя зовут?'],
 ['B','我叫熊猫。','Wǒ jiào Xióngmāo.','Меня зовут Панда.']]},
 {kind:'words',title:'Как меня зовут?',items:WORDS.slice(0,4)},
 {kind:'rule',title:'Говорим своё имя',formula:'我 + 叫 + ИМЯ',example:['我叫熊猫。','Wǒ jiào Xióngmāo.','Меня зовут Панда.'],why:'叫 (jiào) — «зваться». После 我叫 назови своё имя. Можно использовать любое имя.'},
 {kind:'words',title:'Где ты живёшь?',items:WORDS.slice(4,8)},
 {kind:'structure',title:'Учимся говорить, где живём'},
 {kind:'words',title:'Кто я по профессии?',items:WORDS.slice(8,12)},
 {kind:'rule',title:'Моя профессия',formula:'我 + 是 + ПРОФЕССИЯ',example:['我是医生。','Wǒ shì yīshēng.','Я врач.'],extra:[['我是老师。','Wǒ shì lǎoshī.','Я учитель.'],['我是熊猫老师。','Wǒ shì Xióngmāo lǎoshī.','Я учитель Панда.']],why:'Для профессии обычно используют 是 (shì). Например, 我是医生 — «Я врач». Если не работаешь: 我没有工作。'},
 {kind:'rule',title:'Сколько мне лет?',formula:'我 + 今年 + ЧИСЛО + 岁',example:['我今年二十五岁。','Wǒ jīnnián èrshíwǔ suì.','Мне 25 лет.'],extra:[['我今年三岁了。','Wǒ jīnnián sān suì le.','Мне три года.']],why:'今年 (jīnnián) — в этом году; 岁 (suì) — счётное слово для возраста. 了 в конце возможно, но необязательно. Например: 我今年二十五岁。'},
 {kind:'examples',title:'Пять фраз для знакомства',items:[
 ['你好！','Nǐ hǎo!','Привет!'],
 ['我叫熊猫。','Wǒ jiào Xióngmāo.','Меня зовут Панда.'],
 ['我是医生。','Wǒ shì yīshēng.','Я врач.'],
 ['我今年三岁了。','Wǒ jīnnián sān suì le.','Мне три года.'],
 ['我住在中国。','Wǒ zhù zài Zhōngguó.','Я живу в Китае.']]},
 {kind:'listening-quiz',title:'🎧 Послушай и узнай вопрос',audio:'你叫什么名字？',question:'Что спросила Панда?',choices:['Где ты живёшь?','Как тебя зовут?','Кем ты работаешь?'],answer:1,why:'你叫什么名字？ — «Как тебя зовут?»'},
 {kind:'build',title:'🧩 Собери предложение',question:'«Я живу в Пекине»',tokens:['北京','我','在','住'],answer:['我','住','在','北京'],why:'Порядок слов: 我 + 住 + 在 + 北京. Вместе 住在 означает «жить в». '},
 {kind:'quiz',title:'📚 Проверь правило грамматики',question:'Как правильно сказать «Я врач»?',choices:['我叫医生。','我是医生。','我住在医生。'],answer:1,why:'Профессию называем по образцу 我 + 是 + профессия.'},
 {kind:'guided-practice',title:'Твоя очередь: 5 коротких фраз'},
 {kind:'dialogue-practice',title:'Поговори с Пандой · 5 вопросов'},
 {kind:'speaking5',title:'🎤 Произнеси четыре слова · по 5 раз'},
 {kind:'finish',title:'Ты умеешь знакомиться!',desc:'Пять фраз: 你好 / 我叫… / 我是… / 我今年…岁 / 我住在…. Повтори их вслух, затем возвращайся к карте.'}];
const key='pg-hsk2-introduction-v1';
let state={step:0,answers:{},build:[],showPy:true,completed:false,readDialoguePair:0,structureTab:'phrase',dialogue:{index:0,started:false,passed:[false,false,false,false,false],skipped:[false,false,false,false,false],hints:[false,false,false,false,false],completed:false,transcripts:[]},profile:{name:'',city:'',job:'',age:'',other:''}};
try{const x=JSON.parse(localStorage.getItem(key)||'null');if(x&&typeof x==='object')state={...state,...x,answers:x.answers||{},build:Array.isArray(x.build)?x.build:[],dialogue:{index:0,started:false,passed:[false,false,false,false,false],skipped:[false,false,false,false,false],hints:[false,false,false,false,false],completed:false,transcripts:[],...(x.dialogue||{})},profile:{name:'',city:'',job:'',age:'',other:'',...(x.profile||{})}}}catch{}
// On first launch of the revised lesson, show the listening example even for earlier in-progress sessions.
try{if(!localStorage.getItem('pg-hsk2-intro-v337-shown')){state.step=0;localStorage.setItem('pg-hsk2-intro-v337-shown','1')}}catch{}
// Clear only stale three-question conversation progress; preserve course step and other work.
try{if(!localStorage.getItem('pg-hsk2-live-five-v340')){state.dialogue={index:0,started:false,passed:[false,false,false,false,false],skipped:[false,false,false,false,false],hints:[false,false,false,false,false],completed:false,transcripts:[],facts:{},selfConfirmed:{}};localStorage.setItem('pg-hsk2-live-five-v340','1')}}catch{}
const save=()=>{try{localStorage.setItem(key,JSON.stringify(state))}catch{}};
// v344: retain saved answers and dialogue; revisit new location/age teaching steps once.
if(state.introLayoutVersion!==344){
 const oldStep=Math.max(0,Math.min(8,Number(state.step)||0));
 state.step=state.completed?11:(oldStep<=2?oldStep:3);
 state.introLayoutVersion=344;
 save();
}
// v345: preserve progress and answers; students not yet finished revisit the added listening and grammar checks.
if(state.introLayoutVersion!==345){if(state.completed){state.step=steps.length-1}else if(state.step>8){state.step=9}state.build=[];state.introLayoutVersion=345;save()}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* Exact HSK1 owner-approved recordings. No phoneme splice or synthetic fallback. */
// Unified native recording source; do not mix Xiaoxiao with the approved speaker.
const matchingAudio=phrase=>window.PandaHsk2AudioV330?.lookup(phrase)||null;
function setAudioStatus(message,isError=false){
 const out=$('audio-status');
 if(out){out.textContent=message;out.classList.toggle('warn',isError)}
}
function stopApprovedAudio(){
 window.PandaHsk2AudioV331?.stop();
}
function playApprovedAudio(phrase){
 const player=window.PandaHsk2AudioV331;
 if(!player){setAudioStatus('Аудиоплеер не загружен.',true);return}
 player.play(phrase,m=>setAudioStatus(m,/не удалось|Ошибка|нет подтверждённого/i.test(m)));
}
const clipButton=phrase=>matchingAudio(phrase)?'<button class="audio-clip-button" type="button" data-audio="'+esc(phrase)+'" aria-label="Слушать точную запись: '+esc(phrase)+'">🔊 Слушать</button>':'';
const word=([zh,py,ru])=>{
 const exact=!!matchingAudio(zh),sample=exact?null:window.PandaHsk2AudioV330?.sentenceFor(zh);
 const sentence=sample?'<div class="hsk2-word-phrase"><span class="hsk2-word-phrase-label">🎧 Предложение целиком — не звук одного слова</span>'+
  '<strong lang="zh-Hans">'+esc(sample.zh)+'</strong><span class="py">'+esc(sample.pinyin)+'</span>'+
  '<span class="ru">'+esc(sample.ru)+'</span>'+clipButton(sample.zh)+'</div>':
  '<span class="hsk2-missing-audio">Для этого слова отдельной записи пока нет</span>';
 return '<article class="vocab"><div lang="zh-Hans" class="hanzi hanzi-squares">'+Array.from(zh).map(c=>'<span class="hz-square">'+esc(c)+'</span>').join('')+'</div>'+
  '<div class="py">'+esc(py)+'</div><div class="ru">'+esc(ru)+'</div>'+
  (exact?clipButton(zh):sentence)+'</article>';
};
const example=([zh,py,ru])=>'<div class="example"><b lang="zh-Hans">'+esc(zh)+'</b><span class="py">'+esc(py)+'</span><span class="ru">'+esc(ru)+'</span>'+clipButton(zh)+'</div>';


function convertedProfile(){
 const p=state.profile,svc=window.PandaHSK2PracticeV324;
 if(!svc)return {name:{zh:''},city:{zh:''},job:{zh:''}};
 const name=svc.mapProfile('name',p.name),city=svc.mapProfile('city',p.city);
 if(typeof p.nameZh==='string'&&/^[\u3400-\u9fff·\s]{1,30}$/u.test(p.nameZh.trim())&&p.name.trim()){name.zh=p.nameZh.trim().replace(/\s+/g,'');name.py='';name.known=false}
 if(typeof p.cityZh==='string'&&/^[\u3400-\u9fff·\s]{1,30}$/u.test(p.cityZh.trim())&&p.city.trim()){city.zh=p.cityZh.trim().replace(/\s+/g,'');city.py='';city.known=false}
 return {name,city,job:svc.mapProfile('job',p.job==='other'?p.other:p.job)};
}
// Any nonempty city or name is accepted; translations are never fabricated.
const profileReady=()=>{const p=state.profile,n=Number(p.age);return !!(p.name?.trim()&&p.city?.trim()&&p.job?.trim()&&Number.isInteger(n)&&n>=1&&n<=99)};

function ageInChinese(value){
 const n=Number(value);if(!Number.isInteger(n)||n<1||n>99)return null;
 const zh=['零','一','二','三','四','五','六','七','八','九'];
 const py=['líng','yī','èr','sān','sì','wǔ','liù','qī','bā','jiǔ'];
 if(n===2)return {zh:'两',py:'liǎng'};
 if(n<10)return {zh:zh[n],py:py[n]};
 const tens=Math.floor(n/10),ones=n%10;
 return {zh:(tens===1?'':zh[tens])+'十'+(ones?zh[ones]:''),
 py:(tens===1?'':py[tens]+' ')+'shí'+(ones?' '+py[ones]:'')};
}
function profileOutput(){
 const el=$('profile-output');if(!el)return;
 const p=state.profile,m=convertedProfile(),age=ageInChinese(p.age);
 const blocks=[
 ['你好！','Nǐ hǎo!','Привет!'],
 ['我叫'+(m.name.zh||'……')+'。','Wǒ jiào'+(m.name.py?' '+m.name.py:' …'),'Меня зовут '+(p.name||'…')+'.'],
 ['我是'+(m.job.zh||'……')+'。','Wǒ shì'+(m.job.py?' '+m.job.py:' …'),'Я по профессии '+(p.job||'…')+'.'],
 ['我今年'+(age?.zh||'……')+'岁。','Wǒ jīnnián '+(age?.py||'…')+' suì.','Мне '+(p.age||'…')+' лет.'],
 ['我住在'+(m.city.zh||'……')+'。','Wǒ zhù zài'+(m.city.py?' '+m.city.py:' …'),'Я живу в '+(p.city||'…')+'.']
 ];
 el.innerHTML=blocks.map(example).join('');
 const hints=[];
 if(p.name?.trim()&&!m.name.zh)hints.push('Имя не переведено на китайский — можешь указать иероглифы ниже.');
 if(p.city?.trim()&&!m.city.zh)hints.push('Незнакомый город не переводим автоматически.');

function parseIntroAge(text){
 const d={'零':0,'〇':0,'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
 if(/^\d{1,3}$/.test(text)){const v=Number(text);return v>=1&&v<=120?v:null}
 if(!/^[零〇一二两三四五六七八九十百]+$/.test(text))return null;
 let n=0,x=text;
 if(x.includes('百')){let p=x.split('百');if(p.length!==2||!(d[p[0]]>=1))return null;n=100*d[p[0]];x=p[1]}
 if(x.includes('十')){let p=x.split('十');if(p.length!==2)return null;let a=p[0]===''?1:d[p[0]],b=p[1]===''?0:d[p[1]];if(!(a>=1)||b===undefined)return null;n+=10*a+b}
 else if(x){x=x.replace(/^零/,'');if(x.length>1||d[x]===undefined)return null;n+=d[x]}
 return n>=1&&n<=120?n:null;
}
function gradeIntroAnswer(index,raw){
 const x=normalizeIntroAnswer(raw);
 if(index===0){

  return {ok:false,code:'greeting',feedback:'Поздоровайся: 你好！ Nǐ hǎo!'};
 }
 if(index===1)return gradeIntroAnswerLegacy(0,raw);
 if(index===2){
  const result=gradeIntroAnswerLegacy(2,raw);
  if(result.ok)return result;
  if(/^我在[\u3400-\u9fff]{1,16}工作$/.test(x))return {ok:true,code:'workplace',feedback:'✓ Верно, ты рассказал, где работаешь. Название профессии можно сказать через 我是…'};
  return result;
 }
 if(index===3){
  const m=x.match(/^我(?:今年|已经)?([零〇一二两三四五六七八九十百\d]+)岁(?:了)?$/);
  const years=m?parseIntroAge(m[1]):null;
  return years!=null?{ok:true,code:'age',feedback:'✓ Правильно! Ты сказал, что тебе '+years+' лет.'}:{ok:false,code:'age',feedback:'Скажи: 我今年二十五岁。 — «Мне 25 лет».'};
 }
 if(index===4)return gradeIntroAnswerLegacy(1,raw);
 return {ok:false,code:'unknown',feedback:'Неизвестный вопрос.'};
}

 '<div class="hsk2-ribbon">Из чего состоит предложение</div>'+
 '<div class="hsk2-word-parts">'+parts.map(p=>'<div class="hsk2-word-part"><span class="mark" aria-hidden="true">'+p[3]+'</span><span class="symbol" lang="zh-Hans">'+p[0]+'</span><span class="phonetic py">'+p[1]+'</span><span class="meaning">'+p[2]+'</span></div>').join('')+'</div>'+
 '<div class="hsk2-ribbon">Порядок слов: что за чем?</div>'+
 '<div class="hsk2-order"><div><strong>① КТО?</strong><b lang="zh-Hans">我</b></div><div><strong>② ЧТО ДЕЛАЕТ?</strong><b lang="zh-Hans">住在</b></div><div><strong>③ ГДЕ?</strong><b lang="zh-Hans">莫斯科</b></div></div>'+
 '<p class="hsk2-order-note"><strong>Правило:</strong> сначала <b>кто</b>, затем <b>живёт в (住在)</b>, затем <b>город</b>. Слово <b>住</b> означает «жить», а <b>在</b> здесь указывает место. Вместе <b>住在</b> — «жить в».</p>'+
 '<div class="hsk2-order-note"><strong>🎧 Послушай также:</strong></div>'+example(['我住在中国。','Wǒ zhù zài Zhōngguó.','Я живу в Китае.'])+
 '<p class="lesson-note">Дальше ты попробуешь сказать, где живёшь сам.</p>'+
 '</div>';
}

function render(){
 stopIntroMic();
 stopApprovedAudio();
 state.step=Math.max(0,Math.min(steps.length-1,Number(state.step)||0));
 const i=state.step,s=steps[i],answer=state.answers[i];let inside='';
 $('app').classList.toggle('structure-page',s.kind==='structure'||s.kind==='place-words');
 if(s.kind==='model-dialogue')inside='<p class="intro">Послушай четыре короткие реплики. Потом разберём слова и попробуем ответить сами.</p>'+
 '<div class="model-lines">'+s.items.map(([who,zh,py,ru])=>'<article class="model-line '+(who==='B'?'reply':'')+'"><small class="model-who">'+(who==='A'?'Ученик':'Панда')+'</small><strong lang="zh-Hans">'+esc(zh)+'</strong><span class="py">'+esc(py)+'</span><span>'+esc(ru)+'</span>'+clipButton(zh)+'</article>').join('')+'</div><p id="audio-status" class="audio-status" role="status"></p>';
 if(s.kind==='words')inside='<p class="intro">Новые слова: иероглифы, пиньинь и перевод.</p><div class="vocgrid">'+s.items.map(word).join('')+'</div><p id="audio-status" class="audio-status" role="status" aria-live="polite"></p><p class="notice">Нажми 🔊 рядом со словом, послушай и повтори. Если записи пока нет, появится 🔇.</p>';
 if(s.kind==='place-words')inside=placeWordsScreen();
 if(s.kind==='structure')inside=structureScreen();
 if(s.kind==='rule')inside='<div class="rule">'+esc(s.formula)+'</div>'+example(s.example)+(s.extra||[]).map(example).join('')+'<p class="explain spaced">'+esc(s.why)+'</p><p id="audio-status" class="audio-status" role="status" aria-live="polite"></p>';
 if(s.kind==='rule'&&s.title==='Говорим своё имя')inside+='<button type="button" class="pg-speaking-launch" data-pg-drill="name">🎤 Скажи «我叫…» три раза</button>';
 if(s.kind==='structure')inside+='<button type="button" class="pg-speaking-launch" data-pg-drill="city">🎤 Скажи «我住在…» три раза</button>';
 if(s.kind==='examples')inside='<div class="examples">'+s.items.map(example).join('')+'</div>';
 if(s.kind==='dialogue'){
  state.readDialoguePair=Math.max(0,Math.min(2,Number(state.readDialoguePair)||0));
  inside='<p class="intro">Прочитай две реплики и перейди к следующей паре.</p>'+
   s.items.slice(state.readDialoguePair*2,state.readDialoguePair*2+2).map(([who,zh,py,ru])=>'<div class="bubble '+(who==='B'?'right':'')+'"><b lang="zh-Hans">'+esc(zh)+'</b><em class="py">'+esc(py)+'</em><span>'+esc(ru)+'</span>'+clipButton(zh)+'</div>').join('')+
   '<div class="lesson-read-nav"><button class="softbtn" type="button" data-read-dialogue="prev" '+(state.readDialoguePair===0?'disabled':'')+'>← Раньше</button><small>Реплики '+(state.readDialoguePair*2+1)+'–'+(state.readDialoguePair*2+2)+' из 6</small><button class="softbtn" type="button" data-read-dialogue="next" '+(state.readDialoguePair===2?'disabled':'')+'>Далее →</button></div>'+
   '<p class="notice">Это учебный диалог. Panda AI подключается отдельно.</p>';
 }
 if(s.kind==='listening-quiz')inside='<div class="journey-audio-question"><p class="intro">Сначала послушай запись. Затем выбери перевод.</p>'+(matchingAudio(s.audio)?'<button type="button" class="primary journey-listen" data-audio="'+esc(s.audio)+'" aria-label="Прослушать вопрос по-китайски">▶ Слушать вопрос</button>':'<p class="notice">Точной записи пока нет. Это задание можно пропустить.</p>')+'<p id="audio-status" role="status" class="audio-status"></p><p class="intro"><b>'+esc(s.question)+'</b></p><div class="choices">'+s.choices.map((v,n)=>'<button type="button" class="choice '+(answer!=null?(n===s.answer?'correct':answer===n?'wrong':''):'')+'" data-answer="'+n+'">'+esc(v)+'</button>').join('')+'</div><p class="feedback '+(answer===s.answer?'ok':'')+'" role="status">'+(answer==null?'Выбери перевод после прослушивания.':(answer===s.answer?'✓ Верно. ':'Пока неверно. ')+esc(s.why))+'</p></div>';
 if(s.kind==='quiz')inside='<p class="intro"><b>'+esc(s.question)+'</b></p><div class="choices">'+s.choices.map((v,n)=>'<button class="choice '+(answer!=null?(n===s.answer?'correct':n===answer?'wrong':''):'')+'" data-answer="'+n+'">'+esc(v)+'</button>').join('')+'</div><div role="status" class="feedback '+(answer===s.answer?'ok':'')+'">'+(answer==null?'Выбери ответ.':(answer===s.answer?'✓ Правильно. ':'Проверь пример. ')+esc(s.why))+'</div>';
 if(s.kind==='build'){let a=state.build,str=a.map(n=>s.tokens[n]).join(''),ok=str===s.answer.join('');inside='<p class="intro">'+esc(s.question)+'</p><div class="builder">'+(a.length?a.map((n,j)=>'<button type="button" data-remove="'+j+'">'+esc(s.tokens[n])+'</button>').join(''):'<span class="small-caption">Выбирай слова в правильном порядке.</span>')+'</div><div class="tokens">'+s.tokens.map((w,n)=>'<button type="button" data-token="'+n+'" '+(a.includes(n)?'disabled':'')+'>'+esc(w)+'</button>').join('')+'</div><p class="feedback '+(ok?'ok':'')+'">'+(ok?'✓ Верно!':esc(s.why))+'</p>'}
 if(s.kind==='guided-practice')inside=guidedIntroPractice();
 if(s.kind==='speaking5')inside='<div class="journey-speaking-intro"><b>Четыре слова, пять попыток для каждого</b><p>Нажми на слово и произнеси его по-китайски. Галочка означает, что браузер распознал текст, но <strong>не подтверждает правильность тонов</strong>.</p></div><div class="journey-speaking" id="journey-speaking"></div>';
 if(s.kind==='dialogue-practice')inside=introDialogueScreen();
 if(s.kind==='finish'){const d=introDialogueState(),correct=d.passed.filter(Boolean).length,skipped=d.skipped.filter(Boolean).length;inside='<div class="pg-talk-result"><div style="text-align:center;font-size:35px">🐼🌸</div><h2 style="text-align:center">Разговор завершён!</h2><p class="explain">Принято ответов: '+correct+' из 5. Пропущено: '+skipped+'.</p><div class="pg-talk-recap">'+PANDA_INTRO_QUESTIONS.map((q,j)=>'<div><b>'+(d.passed[j]?'✓':'○')+'</b><span><strong>'+esc(q.ru)+'</strong><small>'+esc(d.transcripts[j]||'Пропущено')+'</small></span></div>').join('')+'</div><button type="button" class="softbtn" data-dialogue-restart>↻ Повторить разговор</button><p class="pg-talk-notice">Оценка только текста и структуры; тоны не проверялись.</p></div>'}
 const disabled=((s.kind==='quiz'||s.kind==='listening-quiz')&&answer!==s.answer)||(s.kind==='build'&&state.build.map(n=>s.tokens[n]).join('')!==s.answer.join(''))||(s.kind==='dialogue-practice'&&!introDialogueState().completed);
 $('screen').innerHTML='<div class="banner">Я и моя визитка · HSK 2</div>'+
 '<div class="lesson-title"><strong>'+esc(s.title)+'</strong><span class="pill">Шаг '+(i+1)+' из '+steps.length+'</span></div>'+
 '<div class="meter"><i style="width:'+(i+1)*100/steps.length+'%"></i></div>'+
 '<section class="paper" aria-label="Урок самопрезентации">'+inside+'</section>'+
 '<div class="toolbar"><button class="softbtn" data-py type="button">'+(state.showPy?'Скрыть пиньинь':'Показать пиньинь')+'</button><button class="softbtn" data-repeat type="button">↻ Повторить</button></div>'+
 '<div class="bottom-actions"><div class="toolbar"><button class="softbtn" data-prev type="button" '+(i===0?'disabled':'')+'>← Назад</button><button class="primary" data-next type="button" '+(disabled?'disabled':'')+'>'+(s.kind==='finish'?'К карте HSK 2 →':s.kind==='dialogue-practice'?'К итогам →':'Дальше →')+'</button></div></div>'+
 '<p class="small-caption">Слушай образцы и повторяй. Тоны проверяй по пиньиню.</p>';
 $('screen').classList.toggle('hiddenpy',!state.showPy);
 if(s.kind==='speaking5')window.PandaHSK2PracticeV326?.mountFinal($('journey-speaking'),[['叫','jiào','зваться'],['住','zhù','жить'],['工作','gōngzuò','работать'],['医生','yīshēng','врач']],'journey-intro-final-five-v345');
 $('screen').querySelectorAll('[data-pg-drill]').forEach(b=>b.addEventListener('click',()=>speechPhrase(b.dataset.pgDrill)));
 $('screen').querySelectorAll('[data-structure-tab]').forEach(b=>b.addEventListener('click',()=>{state.structureTab=b.dataset.structureTab==='order'?'order':'phrase';save();render()}));
 $('screen').querySelectorAll('[data-read-dialogue]').forEach(b=>b.addEventListener('click',()=>{state.readDialoguePair=Math.max(0,Math.min(2,state.readDialoguePair+(b.dataset.readDialogue==='next'?1:-1)));save();render()}));
 $('screen').querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>{state.answers[i]=Number(b.dataset.answer);save();render()}));
 $('screen').querySelectorAll('[data-token]').forEach(b=>b.addEventListener('click',()=>{const n=Number(b.dataset.token);if(!state.build.includes(n))state.build.push(n);save();render()}));
 $('screen').querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click',()=>{state.build.splice(Number(b.dataset.remove),1);save();render()}));
 $('screen').querySelector('[data-py]').addEventListener('click',()=>{state.showPy=!state.showPy;save();render()});
 $('screen').querySelector('[data-repeat]').addEventListener('click',()=>{state.step=0;state.completed=false;state.answers={};state.build=[];state.dialogue={index:0,started:false,passed:[false,false,false,false,false],skipped:[false,false,false,false,false],hints:[false,false,false,false,false],completed:false,transcripts:[],facts:{},selfConfirmed:{}};dialogueDraft='';dialogueFeedback=null;save();render()});
 $('screen').querySelector('[data-prev]').addEventListener('click',()=>{if(state.step>0){state.step--;save();render()}});
 $('screen').querySelector('[data-next]').addEventListener('click',()=>{if(s.kind==='profile'?!profileReady():disabled)return;if(s.kind==='finish'){state.completed=true;save();location.href='./hsk2-start.html#map'}else{state.step++;save();render()}});
 if(s.kind==='dialogue-practice'){
  const d=introDialogueState();
  const begin=$('screen').querySelector('[data-dialogue-start]');
  if(begin)begin.addEventListener('click',()=>{state.dialogue.started=true;save();render();if(matchingAudio(PANDA_INTRO_QUESTIONS[0].audio))playApprovedAudio(PANDA_INTRO_QUESTIONS[0].audio)});
  else {
   const input=$('intro-answer');
   input.addEventListener('input',()=>{dialogueDraft=input.value});
   const check=raw=>{
    dialogueDraft=String(raw||'').trim();
    const brain=window.PandaBrainV341;
    if(!brain){dialogueFeedback={ok:false,feedback:'Panda Brain не загрузился. Обнови страницу в Chrome.'};render();return}
    const result=brain.assess(d.index,dialogueDraft);
    dialogueFeedback={ok:result.ok,uncertain:!!result.uncertain,feedback:result.feedback,matched:result.matched};
    if(result.ok){
     const passed=[...d.passed],transcripts=[...d.transcripts];
     passed[d.index]=true;transcripts[d.index]=dialogueDraft;
     for(const f of result.facts||[]){
      const i=brain.slots.indexOf(f.kind);
      if(i>=0&&f.status==='valid'){passed[i]=true;transcripts[i]=dialogueDraft}
     }
     state.dialogue.passed=passed;state.dialogue.transcripts=transcripts;
     state.dialogue.facts={...d.facts,...brain.memory(result.facts)};
     save();
     const extra=(result.facts||[]).filter(f=>brain.slots.indexOf(f.kind)!==d.index);
     if(extra.length)dialogueFeedback.feedback+=' Запомнила также: '+extra.map(f=>({name:'имя',job:'профессию',age:'возраст',city:'город'})[f.kind]||f.kind).join(', ')+'.';
    }
    render();
   };
   input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();check(input.value)}});
   $('screen').querySelector('[data-dialogue-check]').addEventListener('click',()=>check(input.value));
   $('screen').querySelector('[data-dialogue-hint]').addEventListener('click',()=>{state.dialogue.hints=[...d.hints];state.dialogue.hints[d.index]=!d.hints[d.index];save();render()});
   const advance=()=>{
    stopIntroMic();
    const brain=window.PandaBrainV341;
    const next=brain?brain.nextPending(d.index,state.dialogue.passed||d.passed,state.dialogue.skipped||d.skipped):(d.index<4?d.index+1:-1);
    if(next>=0){state.dialogue.index=next;dialogueDraft=(state.dialogue.transcripts||[])[next]||'';dialogueFeedback=null;save();render();if(matchingAudio(PANDA_INTRO_QUESTIONS[next].audio))playApprovedAudio(PANDA_INTRO_QUESTIONS[next].audio)}
    else{state.dialogue.completed=true;save();state.step++;dialogueDraft='';dialogueFeedback=null;save();render()}
   };
   $('screen').querySelector('[data-dialogue-skip]').addEventListener('click',()=>{state.dialogue.skipped=[...d.skipped];state.dialogue.skipped[d.index]=true;save();advance()});
   $('screen').querySelector('[data-dialogue-forward]').addEventListener('click',()=>{if(d.passed[d.index]||d.skipped[d.index])advance()});
   const confirm=$('screen').querySelector('[data-dialogue-confirm]');
   if(confirm)confirm.addEventListener('click',()=>{
    if(!dialogueFeedback?.uncertain||!dialogueFeedback.matched||d.index!==2)return;
    const term=dialogueFeedback.matched.value;
    state.dialogue.passed=[...d.passed];state.dialogue.passed[d.index]=true;
    state.dialogue.transcripts=[...d.transcripts];state.dialogue.transcripts[d.index]=dialogueDraft;
    state.dialogue.facts={...d.facts,job:term};
    state.dialogue.selfConfirmed={...d.selfConfirmed,job:true};
    dialogueFeedback={ok:true,feedback:'✓ Принято по твоему подтверждению. Значение профессии не проверено.'};
    save();render();
   });
   $('screen').querySelector('[data-dialogue-back]').addEventListener('click',()=>{if(d.index>0){stopIntroMic();state.dialogue.index=d.index-1;dialogueDraft=d.transcripts[d.index-1]||'';dialogueFeedback=null;save();render()}});
   const mic=$('screen').querySelector('[data-dialogue-mic]');
   mic.addEventListener('click',()=>{
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){dialogueFeedback={ok:false,feedback:'Распознавание недоступно. Открой урок в Chrome или введи текст.'};render();return}
    stopIntroMic();const recog=new SR();activeIntroMic=recog;
    recog.lang='zh-CN';recog.interimResults=false;recog.maxAlternatives=3;recog.continuous=false;
    mic.disabled=true;mic.textContent='🎤 Слушаю…';
    recog.onresult=e=>{if(activeIntroMic!==recog)return;activeIntroMic=null;const heard=e.results?.[0]?.[0]?.transcript;if(typeof heard==='string'&&heard.trim())check(heard);else{dialogueFeedback={ok:false,feedback:'Голос не распознан. Попробуй снова или напиши текст.'};render()}};
    recog.onerror=e=>{if(activeIntroMic!==recog)return;activeIntroMic=null;dialogueFeedback={ok:false,feedback:(e.error==='not-allowed'||e.error==='service-not-allowed')?'Разреши доступ к микрофону в Chrome или напиши ответ.':'Не удалось распознать речь. Попробуй ещё раз или введи текст.'};render()};
    recog.onend=()=>{if(activeIntroMic!==recog)return;activeIntroMic=null;mic.disabled=false;mic.textContent='🎤 Сказать'};
    try{recog.start()}catch{activeIntroMic=null;dialogueFeedback={ok:false,feedback:'Микрофон не запустился. Напиши ответ.'};render()}
   });
  }
 }
 if(s.kind==='finish'){
  const button=$('screen').querySelector('[data-dialogue-restart]');
  if(button)button.addEventListener('click',()=>{stopIntroMic();state.dialogue={index:0,started:false,passed:[false,false,false,false,false],skipped:[false,false,false,false,false],hints:[false,false,false,false,false],completed:false,transcripts:[],facts:{},selfConfirmed:{}};state.step=steps.findIndex(x=>x.kind==='dialogue-practice');dialogueDraft='';dialogueFeedback=null;save();render()});
 }
 if(s.kind==='profile'){
  $('screen').querySelectorAll('[data-field]').forEach(el=>el.addEventListener(el.tagName==='SELECT'?'change':'input',()=>{state.profile[el.dataset.field]=el.value;save();profileOutput()}));
  profileOutput();
 }
}
$('scene-sub').textContent='HSK 2 · Урок 1 · Я и моя визитка';
$('scene-caption').textContent='Слова · грамматика · тест';
document.querySelector('.backlink').href='./hsk2-start.html#map';
document.querySelectorAll('.nav a').forEach(a=>{const h=a.getAttribute('href');a.href='./hsk2-start.html'+h});
$('screen').addEventListener('click',event=>{
 const btn=event.target&&event.target.closest&&event.target.closest('[data-audio]');
 if(btn&&$('screen').contains(btn))playApprovedAudio(btn.dataset.audio);
});
render();
})();
</script></body></html>
