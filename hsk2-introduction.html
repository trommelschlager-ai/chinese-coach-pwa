const steps=[

 {kind:'rule',title:'Назови своё имя',formula:'我 + 叫 + ИМЯ',example:['我叫安娜。','Wǒ jiào Ānnà.','Меня зовут Анна.'],why:'叫 (jiào) — «зваться». Имена других стран необязательно переводить на китайский.'},

 {kind:'rule',title:'Назови свой город',formula:'我 + 住在 + ГОРОД',example:['我住在北京。','Wǒ zhù zài Běijīng.','Я живу в Пекине.'],why:'住在 (zhù zài) — «жить в каком-то месте». За ним называем город или место.'},
 {kind:'words',title:'Кем я работаю?',items:WORDS.slice(8,12)},
 {kind:'rule',title:'Назови профессию',formula:'我 + 是 + ПРОФЕССИЯ',example:['我是医生。','Wǒ shì yīshēng.','Я врач.'],why:'Для профессии-существительного используем 是. «Я работаю в Пекине»: 我在北京工作。'},
 {kind:'examples',title:'Три фразы о себе',items:[['我叫安娜。','Wǒ jiào Ānnà.','Меня зовут Анна.'],['我住在北京。','Wǒ zhù zài Běijīng.','Я живу в Пекине.'],['我是医生。','Wǒ shì yīshēng.','Я врач.']]},

 ['A','你叫什么名字？','Nǐ jiào shénme míngzi?','Как тебя зовут?'],

 ['B','我是医生。','Wǒ shì yīshēng.','Я врач.']]},
 {kind:'quiz',title:'Проверяем понимание',question:'Как перевести 我住在北京。?',choices:['Меня зовут Пекин.','Я работаю в Пекине.','Я живу в Пекине.'],answer:2,why:'我 (я) + 住在 (живу в) + 北京 (Пекин).'},
 {kind:'build',title:'Собери предложение',question:'«Я живу в Пекине»',tokens:['北京','住在','我'],answer:['我','住在','北京'],why:'Кто + 住在 + где живёт.'},
 {kind:'profile',title:'Теперь расскажи о себе'},
 {kind:'finish',title:'Ты умеешь представляться!',desc:'Ты научился говорить, как тебя зовут, где ты живёшь и кем работаешь. Переходи к построению новых предложений.'}
];
const key='pg-hsk2-introduction-v1';
let state={step:0,answers:{},build:[],showPy:true,completed:false,profile:{name:'',city:'',job:'老师',other:''}};

const example=([zh,py,ru])=>'<div class="example"><b lang="zh-Hans">'+esc(zh)+'</b><span class="py">'+esc(py)+'</span><span class="ru">'+esc(ru)+'</span></div>';
const profileReady=()=>{const p=state.profile;return !!(String(p.name||'').trim()&&String(p.city||'').trim()&&String(p.job==='other'?p.other:p.job||'').trim())};
function profileOutput(){
 const n=$('profile-output');if(!n)return;
 const p=state.profile,nm=String(p.name||'').trim(),city=String(p.city||'').trim(),job=String(p.job==='other'?p.other:p.job||'').trim();
 const jobsRu={'老师':'учитель','医生':'врач','司机':'водитель','学生':'студент','工程师':'инженер'};
 const citiesRu={'北京':'Пекине','上海':'Шанхае','莫斯科':'Москве'};
 n.innerHTML=example(['我叫'+(nm||'…')+'。','Wǒ jiào …','Меня зовут '+(nm||'…')+'.'])+
  example(['我住在'+(city||'…')+'。','Wǒ zhù zài …',(citiesRu[city]?'Я живу в '+citiesRu[city]+'.':'Город: '+(city||'…')+'.')])+
  example(['我是'+(job||'…')+'。','Wǒ shì …',(jobsRu[job]?'Я '+jobsRu[job]+'.':'Профессия: '+(job||'…')+'.')]);
 const next=$('screen').querySelector('[data-next]');if(next)next.disabled=!profileReady();
}
function profileForm(){
 const p=state.profile,job=p.job||'老师',choices=[['老师','Учитель'],['医生','Врач'],['司机','Водитель'],['学生','Ученик / студент'],['工程师','Инженер'],['other','Другая профессия']];

 '<label>Где ты живёшь?<input data-field="city" maxlength="40" autocomplete="off" placeholder="北京 / Moscow" value="'+esc(p.city||'')+'"></label>'+
 '<label>Кем работаешь?<select data-field="job">'+choices.map(([v,t])=>'<option value="'+v+'" '+(v===job?'selected':'')+'>'+t+'</option>').join('')+'</select></label>'+
 (job==='other'?'<label>Профессия по-китайски<input data-field="other" maxlength="40" autocomplete="off" placeholder="Например, 厨师" value="'+esc(p.other||'')+'"></label>':'')+
 '</div><div class="intro-output" id="profile-output" aria-live="polite"></div>'+
 '<p class="notice">Имена и города можно писать латиницей, пока не знаешь китайскую запись. Тоны для них автоматически не выдумываются. Эти данные сохраняются только в браузере на устройстве.</p>';
}
function render(){
 state.step=Math.max(0,Math.min(steps.length-1,Number(state.step)||0));
 const i=state.step,s=steps[i],answer=state.answers[i];let inside='';

 if(s.kind==='rule')inside='<div class="rule">'+esc(s.formula)+'</div>'+example(s.example)+'<p class="explain spaced">'+esc(s.why)+'</p>';

 if(s.kind==='dialogue')inside='<p class="intro">Прочитай вопрос, затем попробуй ответить сам.</p>'+s.items.map(([who,zh,py,ru])=>'<div class="bubble '+(who==='B'?'right':'')+'"><b lang="zh-Hans">'+esc(zh)+'</b><em class="py">'+esc(py)+'</em><span>'+esc(ru)+'</span></div>').join('')+'<p class="notice">Диалог учебный. Подключение Panda AI и звуков ещё впереди.</p>';

 if(s.kind==='build'){let a=state.build,str=a.map(n=>s.tokens[n]).join(''),ok=str===s.answer.join('');inside='<p class="intro">'+esc(s.question)+'</p><div class="builder">'+(a.length?a.map((n,j)=>'<button type="button" data-remove="'+j+'">'+esc(s.tokens[n])+'</button>').join(''):'<span class="small-caption">Выбирай слова в правильном порядке.</span>')+'</div><div class="tokens">'+s.tokens.map((w,n)=>'<button type="button" data-token="'+n+'" '+(a.includes(n)?'disabled':'')+'>'+esc(w)+'</button>').join('')+'</div><p class="feedback '+(ok?'ok':'')+'">'+(ok?'✓ Верно!':esc(s.why))+'</p>'}

 '<div class="meter"><i style="width:'+(i+1)*100/steps.length+'%"></i></div>'+
 '<section class="paper" aria-label="Урок самопрезентации">'+inside+'</section>'+
 '<div class="toolbar"><button class="softbtn" data-py type="button">'+(state.showPy?'Скрыть пиньинь':'Показать пиньинь')+'</button><button class="softbtn" data-repeat type="button">↻ Повторить</button></div>'+
 '<div class="bottom-actions"><div class="toolbar"><button class="softbtn" data-prev type="button" '+(i===0?'disabled':'')+'>← Назад</button><button class="primary" data-next type="button" '+(disabled?'disabled':'')+'>'+(s.kind==='finish'?'К основам грамматики →':'Дальше →')+'</button></div></div>'+
 '<p class="small-caption">Озвучку подключим после проверки тонов и записи носителя.</p>';
 $('screen').classList.toggle('hiddenpy',!state.showPy);
 $('screen').querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>{state.answers[i]=Number(b.dataset.answer);save();render()}));
 $('screen').querySelectorAll('[data-token]').forEach(b=>b.addEventListener('click',()=>{const n=Number(b.dataset.token);if(!state.build.includes(n))state.build.push(n);save();render()}));
 $('screen').querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click',()=>{state.build.splice(Number(b.dataset.remove),1);save();render()}));
 $('screen').querySelector('[data-py]').addEventListener('click',()=>{state.showPy=!state.showPy;save();render()});
 $('screen').querySelector('[data-repeat]').addEventListener('click',()=>{state.step=0;state.build=[];save();render()});
 $('screen').querySelector('[data-prev]').addEventListener('click',()=>{if(state.step>0){state.step--;save();render()}});
 $('screen').querySelector('[data-next]').addEventListener('click',()=>{if(s.kind==='profile'?!profileReady():disabled)return;if(s.kind==='finish'){state.completed=true;save();location.href='./hsk2-start.html#lesson'}else{state.step++;save();render()}});
 if(s.kind==='profile'){
  $('screen').querySelectorAll('[data-field]').forEach(el=>el.addEventListener(el.tagName==='SELECT'?'change':'input',()=>{state.profile[el.dataset.field]=el.value;save();if(el.dataset.field==='job')render();else profileOutput()}));
  profileOutput();
 }
}
$('scene-sub').textContent='HSK 2 · Учимся представляться';
$('scene-caption').textContent='Имя · город · работа';
document.querySelector('.backlink').href='./hsk2-start.html#map';
document.querySelectorAll('.nav a').forEach(a=>{const h=a.getAttribute('href');a.href='./hsk2-start.html'+h});
render();
})();
</script></body></html>
