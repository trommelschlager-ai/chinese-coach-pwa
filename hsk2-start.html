const example=([zh,py,ru])=>`<div class="example"><b lang="zh-Hans">${esc(zh)}</b><span class="py">${esc(py)}</span><span class="ru">${esc(ru)}</span>${window.PandaHsk2AudioV330?.button(zh)||''}</div>`;
const renderMap=()=>{const rv=state.completedReview?'✓ Пройдено':'Начать';let introDone=false;try{introDone=!!JSON.parse(localStorage.getItem('pg-hsk2-introduction-v1')||'null')?.completed}catch{}$('screen').innerHTML=`<div class="banner">Как будем действовать</div><p class="intro">Закрепляем HSK 1 → проходим 30 базовых слов → готовимся к HSK 2.</p><a class="review-row" href="#review"><span class="emoji">📖</span><span><strong>Сначала — повторение HSK 1</strong><small>20 слов по темам HSK 1, 3 примера, 2 проверки</small></span><span class="arrow">${rv} ›</span></a><a class="review-row" href="./hsk1-hsk2-bridge.html"><span class="emoji">🐼</span><span><strong>Бесплатный мостик HSK 1 → HSK 2</strong><small>30 базовых слов · 6 тем · самостоятельные проверки</small></span><span class="arrow">Открыть ›</span></a><a class="review-row" href="./hsk2-introduction.html"><span class="emoji">👋</span><span><strong>Знакомство: имя, город и работа</strong><small>Слова → три фразы о себе → вопросы → практика</small></span><span class="arrow">${introDone?'✓ Пройдено':'Начать'} ›</span></a><div class="road">${sections.map((s,i)=>i===0?`<a href="#lesson" class="road-item"><span class="num">${i+1}</span><span><strong>${esc(s[0])}</strong><small>${esc(s[1])}</small></span><span class="status">${state.completedLesson?'✓':'НАЧАТЬ'} ›</span></a>`:`<div class="road-item disabled" aria-label="${esc(s[0])} — готовится"><span class="num">${i+1}</span><span><strong>${esc(s[0])}</strong><small>${esc(s[1])}</small></span><span class="status">СКОРО</span></div>`).join('')}</div><p class="footnote">📖 Слова → ✏️ правило → 💬 примеры → 🎯 практика → 🐼 диалог. Это шаги, не дни.</p>`};
function renderProgress(){const a=(state.review+1)*100/reviewStages.length,b=(state.lesson+1)*100/lessonStages.length;$('screen').innerHTML=`<div class="banner">Мой прогресс HSK 2</div><div class="paper"><h2>📖 Повторение HSK 1</h2><div class="lesson-title"><strong>${state.completedReview?'Завершено':'В процессе'}</strong><span class="pill">${state.review+1} из ${reviewStages.length}</span></div><div class="meter"><i style="width:${a}%"></i></div><a class="plainlink" href="#review">Открыть повторение →</a></div><div class="paper"><h2>🌸 Слова → предложения</h2><div class="lesson-title"><strong>${state.completedLesson?'Завершено':'В процессе'}</strong><span class="pill">${state.lesson+1} из ${lessonStages.length}</span></div><div class="meter"><i style="width:${b}%"></i></div><a class="plainlink" href="#lesson">Продолжить урок →</a></div><p class="intro">Все результаты HSK 2 сохраняются отдельно от HSK 1. Повторение не имеет срока и может быть пройдено вновь.</p>`}
function setTitle(view){$('scene-sub').textContent=view==='map'?'HSK 2 · План курса':view==='review'?'HSK 2 · Повторение HSK 1':view==='progress'?'HSK 2 · Мой прогресс':'HSK 2 · Урок 1';$('scene-caption').textContent=view==='map'?'Слова → правило → практика':view==='review'?'Вспоминаем базу':view==='progress'?'Твои достижения':'Сначала слова, потом фразы';for(let link of document.querySelectorAll('.nav a'))link.classList.toggle('active',link.getAttribute('href')==='#'+view)}
function stagePage(view){const isReview=view==='review',idx=isReview?'review':'lesson',stages=isReview?reviewStages:lessonStages;state[idx]=Math.min(Math.max(0,Number(state[idx])||0),stages.length-1);const i=state[idx],s=stages[i],code=view+':'+i,answered=state.answers[code];let inside='';
 if(s.kind==='words')inside=`<p class="intro">${isReview?'Вспомни чтение, тон и значение.':'Четыре слова — затем проверим, что запомнилось.'}</p><div class="vocgrid">${s.items.map(wordCard).join('')}</div><p class="pg-sound-hint" role="status">Нажми на слово для прослушивания. Неподтверждённые записи отмечены отдельно.</p>`;
 if(s.kind==='examples')inside=`<p class="intro">Все фразы составлены из уже изученных слов.</p><div class="examples">${s.items.map(example).join('')}</div>${isReview?'<p class="notice">В 不是 звук 不 меняется на bú перед четвёртым тоном.</p>':''}`;
 if(s.kind==='rule')inside=`<div class="rule">${esc(s.formula)}</div><div class="pg-rule-examples">${example(s.example)}${(s.extra||[]).map(example).join('')}</div><p class="explain spaced">${esc(s.why)}</p>`;
 if(s.kind==='doublequiz')inside=`<div class="pg-double-quiz">${s.items.map((q,j)=>{
  const choice=state.answers[code+':'+(j?'b':'a')];
  return `<section class="pg-double-question" aria-label="Вопрос ${j+1}"><h3>${j+1}. ${esc(q.question)}</h3><div class="pg-double-choices">${q.choices.map((label,n)=>`<button type="button" class="choice ${choice!=null?(n===q.answer?'correct':choice===n?'wrong':''):''}" data-double-question="${j}" data-double-answer="${n}" aria-pressed="${choice===n}">${esc(label)}</button>`).join('')}</div><p class="feedback ${choice==null?'':choice===q.answer?'ok':'err'}" role="status">${choice==null?'Выбери вариант.':(choice===q.answer?'✓ Верно. ':'✕ Ошибка. ')+esc(q.why)}</p></section>`;
 }).join('')}</div>`;
 if(s.kind==='quiz')inside=`<p class="intro"><b>${esc(s.question)}</b></p><div class="choices">${s.choices.map((choice,n)=>`<button type="button" class="choice ${answered!=null?(n===s.answer?'correct':answered===n?'wrong':''):''}" data-choose="${n}" aria-pressed="${answered===n}">${esc(choice)}</button>`).join('')}</div><div class="feedback ${answered==null?'':answered===s.answer?'ok':'err'}" role="status">${answered==null?'Выбери верный ответ.':(answered===s.answer?'✓ Верно. ':'Не совсем. ')+esc(s.why)+(isReview?' Теперь можешь перейти дальше.':'')}</div>`;
 if(s.kind==='build'){const selected=state.build||[],text=selected.map(n=>s.tokens[n]).join(''),ok=text===s.answer.join('');inside=`<p class="intro">${esc(s.question)}</p><div class="builder">${selected.length?selected.map((n,k)=>`<button data-remove="${k}" type="button">${esc(s.tokens[n])}</button>`).join(''):'<span class="small-caption">Нажимай на слова в нужном порядке…</span>'}</div><div class="tokens">${s.tokens.map((token,n)=>`<button type="button" data-token="${n}" ${selected.includes(n)?'disabled':''}>${esc(token)}</button>`).join('')}</div><div class="feedback ${selected.length===s.tokens.length?(ok?'ok':'err'):''}" role="status">${selected.length===s.tokens.length?(ok?'✓ Правильно!':'Порядок неверный. Нажми на слово выше, чтобы убрать его.'):'Подсказка: кто → действие → что.'}</div><p class="notice">${esc(s.why)}</p>`;}
 if(s.kind==='dialogue')inside=`<p class="intro">Прочитай сначала с пиньинем, потом попробуй без подсказки.</p>${s.items.map(([who,zh,py,ru])=>`<div class="bubble ${who==='B'?'right':''}"><b lang="zh-Hans">${esc(zh)}</b><em class="py">${esc(py)}</em><span>${esc(ru)}</span></div>`).join('')}<p class="notice">Разговор с живой Panda AI будет подключён отдельно. Здесь учебный диалог, не ИИ-чат.</p>`;
 if(s.kind==='finish')inside=isReview?`<div style="text-align:center;font-size:39px">🌸 🐼</div><h2 style="text-align:center;margin:10px 0">${esc(s.title)}</h2><p class="explain" style="text-align:center">${esc(s.desc)}</p><p class="notice">Теперь можно перейти к знакомству.</p>`:`<div id="pg-hsk2-final"></div>`;
 const pyToggle=`<button class="softbtn" data-pinyin type="button" aria-pressed="${state.showPy}">${state.showPy?'Скрыть пиньинь':'Показать пиньинь'}</button>`;
 const nextBlocked=(s.kind==='doublequiz'&&s.items.some((_,j)=>state.answers[code+':'+(j?'b':'a')]==null))||
  (s.kind==='quiz'&&answered==null)||
  (s.kind==='build'&&(state.build||[]).map(n=>s.tokens[n]).join('')!==s.answer.join(''));
 $('screen').innerHTML=`<div class="banner">${isReview?'Краткое повторение HSK 1':'Сначала слова → потом фразы'}</div><div class="lesson-title"><strong>${esc(s.title)}</strong><span class="pill">Шаг ${i+1} из ${stages.length}</span></div><div class="meter"><i style="width:${(i+1)/stages.length*100}%"></i></div><section class="paper" aria-label="Учебный экран">${inside}</section>${!isReview&&i===0?'<button class="pg-speaking-launch" type="button" data-start-speech>🎤 Тест: 4 слова × 3 попытки (с результатом)</button>':''}<div class="toolbar">${pyToggle}<button class="softbtn" data-restart type="button">↻ Повторить</button></div><div class="bottom-actions"><div class="toolbar"><button class="softbtn" data-prev type="button" ${i===0?'disabled':''}>← Назад</button><button class="primary" data-next type="button" ${nextBlocked?'disabled':''}>${s.kind==='finish'?(isReview?'Учимся представляться':'К карте HSK 2 →'):(isReview&&i===stages.length-1?'К знакомству →':'Дальше →')}</button></div></div><p class="small-caption">Здесь нет непроверенной автоматической озвучки.</p>`;
 $('screen').querySelectorAll('[data-sound]').forEach(b=>b.addEventListener('click',()=>{
   const report=msg=>{const node=$('screen').querySelector('.pg-sound-hint');if(node)node.textContent=msg};
   window.PandaHsk2AudioV330?.play(b.dataset.sound,report);
 }));
 if(!isReview&&s.kind==='finish')window.PandaHSK2PracticeV326?.mountFinal($('pg-hsk2-final'),WORDS);
 const test=$('screen').querySelector('[data-start-speech]');
 if(test)test.addEventListener('click',()=>window.PandaHSK2PracticeV324?.open({
   id:'hsk2-lesson-1-four-words',title:'Четыре слова × 3 раза',
   items:WORDS.map(([zh,py,ru])=>({zh,ru,targets:[zh]}))
 }));
 window.PandaHsk2AudioV330?.bind($('screen'));
 $('screen').classList.toggle('hiddenpy',!state.showPy);
 $('screen').querySelectorAll('[data-double-answer]').forEach(b=>b.addEventListener('click',()=>{
  state.answers[code+':'+(Number(b.dataset.doubleQuestion)===0?'a':'b')]=Number(b.dataset.doubleAnswer);
  save();stagePage(view);
 }));
 $('screen').querySelectorAll('[data-choose]').forEach(b=>b.addEventListener('click',()=>{state.answers[code]=Number(b.dataset.choose);save();stagePage(view)}));
 $('screen').querySelectorAll('[data-token]').forEach(b=>b.addEventListener('click',()=>{const n=Number(b.dataset.token);if(!state.build.includes(n))state.build.push(n);save();stagePage(view)}));
 $('screen').querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click',()=>{state.build.splice(Number(b.dataset.remove),1);save();stagePage(view)}));
 $('screen').querySelector('[data-pinyin]').addEventListener('click',()=>{state.showPy=!state.showPy;save();stagePage(view)});
 $('screen').querySelector('[data-restart]').addEventListener('click',()=>{state[idx]=0;if(!isReview)state.build=[];save();stagePage(view)});
 $('screen').querySelector('[data-prev]').addEventListener('click',()=>{if(state[idx]>0){state[idx]--;save();stagePage(view)}});
 $('screen').querySelector('[data-next]').addEventListener('click',()=>{if(nextBlocked)return;if(s.kind==='finish'){if(isReview){state.completedReview=true;save();location.href='./hsk2-introduction.html'}else{state.completedLesson=true;save();location.hash='#map'}}else if(isReview&&i===stages.length-1){state.completedReview=true;save();location.href='./hsk2-introduction.html'}else{state[idx]++;save();stagePage(view)}});
}
function show(){let view=(location.hash||'#map').slice(1);if(!['map','review','lesson','progress'].includes(view))view='map';setTitle(view);document.querySelector('.backlink').href=view==='map'?'./index.html#panda/home':'#map';$('screen').classList.remove('hiddenpy');view==='map'?renderMap():view==='progress'?renderProgress():stagePage(view);$('screen').scrollTop=0;}
window.addEventListener('hashchange',show);show();
})();
</script></body></html>
