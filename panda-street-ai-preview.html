<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#08091b">
<title>Panda Street AI — чёткие увеличенные диалоги v4</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;background:#02030b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
#screen{position:relative;width:100%;height:100dvh;min-height:440px;max-width:820px;margin:0 auto;overflow:hidden;background:#030614}
#art{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;user-select:none;-webkit-user-drag:none}
#screen[data-theme=day] #art{filter:brightness(1.18) saturate(.81) sepia(.07)}
.hot{position:absolute;background:transparent;border:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;color:transparent;font-size:0;border-radius:16px}
.hot:focus-visible{outline:3px solid #fbdaff;outline-offset:-3px}
.hot:active{background:#ca65f827}
.hot[aria-pressed=true]:not([data-permanent]){box-shadow:inset 0 0 0 2px #b947ff,0 0 12px #ad51f8}
#back{left:1%;top:.2%;width:18%;height:4.3%}
#short{left:19%;top:.1%;width:20.5%;height:4.7%}
#nonstop{left:39.8%;top:.1%;width:23%;height:4.7%}
#history{left:63%;top:.1%;width:21%;height:4.7%}
#theme{left:84%;top:.1%;width:15.4%;height:4.7%}
#dialogue1{left:5.5%;top:5%;width:89%;height:4.9%}
#dialogue2{left:5.5%;top:10%;width:89%;height:4.9%}
#dialogue3{left:5.5%;top:15%;width:89%;height:5%}
#trainer{left:83%;top:37%;width:14%;height:7.2%}
#topics{left:83%;top:46.5%;width:14%;height:7.2%}
#book{left:83%;top:55.6%;width:14%;height:7.2%}
#home{left:4%;top:90.6%;width:17%;height:8.2%}
#lessons{left:22.5%;top:90.6%;width:16%;height:8.2%}
#training{left:42%;top:90.6%;width:16%;height:8.2%}
#chat{left:60.5%;top:90.6%;width:17%;height:8.2%}
#profile{left:80%;top:90.6%;width:17%;height:8.2%}
#toast{position:absolute;left:10%;right:10%;bottom:10%;padding:10px 14px;border:1px solid #d47ffc85;border-radius:22px;background:#120c27ef;color:#fff;box-shadow:0 0 26px #9a3cff66;text-align:center;font-size:13px;pointer-events:none;opacity:0;transition:opacity .2s}
#toast.show{opacity:1}
#panel{position:fixed;inset:0;z-index:10;display:none;align-items:flex-end;justify-content:center;background:#000a;backdrop-filter:blur(5px);padding:0}
#panel.open{display:flex}
.panel-inner{width:min(100%,720px);max-height:min(78dvh,700px);overflow:auto;overscroll-behavior:contain;border-radius:28px 28px 0 0;border:1px solid #b68de8;background:linear-gradient(155deg,#11132bfa,#060913fc);padding:18px 20px max(23px,env(safe-area-inset-bottom));box-shadow:0 -12px 55px #0008;color:#fef9ff}
.panel-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.panel-top h2{font-size:19px;margin:0}.close{background:#312149;border:1px solid #8a6fa8;border-radius:50%;width:35px;height:35px;color:white;font-size:25px;cursor:pointer}
#panel-body{padding-top:14px}.hanzi{font-size:clamp(27px,7vw,39px);font-weight:750}.pinyin{color:#e6d2ff;font-style:italic;font-size:17px}.ru{color:#f7b5fc;font-size:17px}.note{color:#c8bfd5;font-size:12px;line-height:1.5}
.talk{display:grid;gap:12px}.tbuttons{display:flex;flex-wrap:wrap;gap:8px}.tbuttons button,.choice,button.action{border:1px solid #bf76eb90;color:#fff;background:linear-gradient(115deg,#302348,#15203b);border-radius:15px;padding:11px 15px;font-size:15px;cursor:pointer}.tbuttons button:active,.choice:active,button.action:active{transform:scale(.97)}
.answer-form{display:flex;gap:8px}.answer-form input{flex:1;min-width:0;background:#161c2f;border:1px solid #b6a0d580;border-radius:14px;color:white;padding:12px;font-size:16px}.answer-form button{border:0;border-radius:14px;color:white;background:#8a22bb;padding:0 15px;font-weight:700}
#feedback{min-height:20px;color:#e4c6fc;font-size:13px}.choice{display:block;width:100%;text-align:left;margin:7px 0}.history-item{border-bottom:1px solid #ffffff28;padding:10px 0}.history-item strong{color:#efc0ff}.history-item small{display:block;color:#d3cae5;margin-top:3px}
body:has(#panel.open){overflow:hidden}
@media (orientation: landscape){#screen{max-width:54dvh}#panel .panel-inner{max-height:100dvh}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* v2: exact photo-2 ratio; never stretch the approved panda or blur artwork. */
html,body{
  width:100%;height:100%;height:100dvh;min-height:0;
  display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(ellipse at 50% 48%,#1c1031 0%,#070613 57%,#02030b 100%);
}
#screen{
  position:relative;
  width:min(100vw, calc(100dvh * 2 / 3));
  height:auto;aspect-ratio:2 / 3;
  min-height:0;max-height:100dvh;max-width:none;
  flex-shrink:0;margin:auto;
  overflow:hidden;background:#030614;
}
#art{
  display:block;position:absolute;inset:0;
  width:100%;height:100%;object-fit:contain;object-position:center;
  image-rendering:auto;filter:none;
  pointer-events:none;user-select:none;-webkit-user-drag:none;
}
/* The theme filter is only for user-activated day mode. */
#screen[data-theme=day] #art{filter:brightness(1.18) saturate(.81) sepia(.07)}
/* All hit areas are percentages of the exact same 2:3 artwork rectangle. */
@media (orientation:landscape){#screen{max-width:none;width:min(100vw, calc(100dvh * 2 / 3));height:auto}}

/* Panda Street AI v3: true edge-to-edge mobile stage. The source image is NEVER
   stretched around the panda. Only empty sky and street-reflection bands expand. */
html, body {margin:0!important; padding:0!important; width:100%!important; height:100%!important;
  overflow:hidden!important; display:block!important; background:#02030b!important;}
#screen {width:100vw!important; height:100vh!important; height:100dvh!important;
  min-height:0!important; max-height:none!important; max-width:none!important;
  margin:0!important; display:block!important; aspect-ratio:auto!important;
  overflow:hidden!important; position:relative!important; background:#040614!important;}
#art {display:block!important;position:absolute!important;inset:0!important;
  width:100%!important;height:100%!important;max-width:none!important;
  object-fit:unset!important;filter:none!important;pointer-events:none!important;}
#source-art {display:none!important}
#screen[data-theme=day] #art {filter:brightness(1.18) saturate(.81) sepia(.07)!important}
.hot {position:absolute!important;z-index:2}
@supports(height:100dvh) {#screen{height:100dvh!important}}

/* v4: the scene is the same approved bitmap. Dialogue cards are real, sharp HTML
   instead of being vertically stretched pixels. Only the painting below the
   cards moves downward; all parts of the panda preserve their original scale. */
#readable-dialogues {position:absolute;z-index:4;left:5.6%;width:89.1%;display:flex;flex-direction:column;gap:5px;}
#readable-dialogues .dialogue-card{
 display:grid;grid-template-columns:clamp(32px,10vw,48px) minmax(0,1.37fr) minmax(0,.98fr) 18px;
 align-items:center;gap:clamp(4px,.9vw,8px);width:100%;min-width:0;
 border:1px solid #b5a9d2dd;border-radius:999px;
 padding:3px clamp(7px,1.7vw,12px);margin:0;color:#fff;
 background:linear-gradient(180deg,#20253aeF 0%,#090f1cfA 46%,#08101efb 100%);
 box-shadow:inset 0 1px 5px #e8ddff45,inset 0 -2px 5px #0008,0 0 9px #e5c5ff66,0 3px 8px #0008;
 cursor:pointer;line-height:1.03;overflow:hidden;text-align:left;-webkit-tap-highlight-color:transparent;
}
#readable-dialogues .dialogue-card:focus-visible{outline:2px solid #ff9dff;outline-offset:2px}
#readable-dialogues .dialogue-card:active{background:#33284c;transform:scale(.99)}
#readable-dialogues .dialogue-avatar {width:100%;aspect-ratio:1;object-fit:cover;border-radius:50%;box-shadow:0 0 5px #ff81ef88;align-self:center}
#readable-dialogues .dialogue-cn {display:block;font-family:'Noto Sans CJK SC','Noto Sans SC',system-ui,sans-serif;font-size:clamp(14px,3.8vw,20px);font-weight:700;letter-spacing:-.045em;white-space:nowrap;line-height:1.16}
#readable-dialogues .dialogue-py {display:block;color:#f3eafa;font-size:clamp(10px,2.9vw,14px);line-height:1.22;font-style:italic;white-space:normal;overflow-wrap:normal;word-break:normal;margin-top:1px}
#readable-dialogues .dialogue-ru {min-width:0;color:#eda0e8;border-left:1px solid #f8d7faad;padding-left:clamp(5px,1.7vw,10px);font-size:clamp(12px,3.15vw,17px);line-height:1.18;font-weight:500}
#readable-dialogues .dialogue-arrow{color:white;font-size:clamp(29px,7vw,37px);line-height:1;text-align:center;font-weight:400}
#readable-dialogues .dialogue-text{min-width:0}
.hot#dialogue1,.hot#dialogue2,.hot#dialogue3{display:none!important}
@media(max-width:375px){#readable-dialogues .dialogue-card{grid-template-columns:33px minmax(0,1.4fr) minmax(0,1fr) 14px;gap:3px;padding:3px 5px}#readable-dialogues .dialogue-cn{font-size:14px}#readable-dialogues .dialogue-py{font-size:10.4px}#readable-dialogues .dialogue-ru{font-size:12px;padding-left:5px}}

</style>

 <button class="hot" id="dialogue2" aria-label="Практиковать: Какие планы на вечер"></button>
 <button class="hot" id="dialogue3" aria-label="Практиковать: Давай поболтаем"></button>
 <button class="hot" id="trainer" aria-label="Открыть тренажёр"></button>
 <button class="hot" id="topics" aria-label="Все темы"></button>
 <button class="hot" id="book" aria-label="Слова и подсказки"></button>
 <button class="hot" id="home" aria-label="Главная"></button>
 <button class="hot" id="lessons" aria-label="Уроки"></button>
 <button class="hot" id="training" aria-label="Тренажёр"></button>
 <button class="hot" id="chat" aria-label="Начать разговор"></button>

</main>
<section id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title">
 <div class="panel-inner"><div class="panel-top"><h2 id="panel-title">Panda Street AI</h2><button class="close" id="close" aria-label="Закрыть">×</button></div><div id="panel-body"></div></div>
</section>

<script>
/* Native-readable dialogue rows + exact, unmodified panda image. */
(function(){'use strict';
const stage=document.getElementById('screen');
const bitmap=document.getElementById('source-art');
const canvas=document.getElementById('art');
const rows=document.getElementById('readable-dialogues');
const buttons=Array.from(stage.querySelectorAll('button.hot'));
const design={
 back:[1,.2,18,4.3],short:[19,.1,20.5,4.7],nonstop:[39.8,.1,23,4.7],history:[63,.1,21,4.7],theme:[84,.1,15.4,4.7],
 trainer:[83,37,14,7.2],topics:[83,46.5,14,7.2],book:[83,55.6,14,7.2],
 home:[4,90.6,17,8.2],lessons:[22.5,90.6,16,8.2],training:[42,90.6,16,8.2],chat:[60.5,90.6,17,8.2],profile:[80,90.6,17,8.2]
};
const SW=1024,SH=1536,TOP_END=76,SCENE_START=312,ROAD_START=1330,ROAD_END=1390;
const rowButtons=[...rows.querySelectorAll('.dialogue-card')];
rowButtons.forEach(button=>button.addEventListener('click',()=>document.getElementById(button.dataset.target)?.click()));
let scheduled=false;
function render(){scheduled=false;
 if(!bitmap.complete||!bitmap.naturalWidth)return;
 const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;
 const r=Math.min(2.5,devicePixelRatio||1);
 canvas.width=Math.ceil(w*r);canvas.height=Math.ceil(h*r);
 const ctx=canvas.getContext('2d',{alpha:false});ctx.setTransform(canvas.width/w,0,0,canvas.height/h,0,0);
 ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
 const s=w/SW;
 const rowH=Math.max(45,Math.min(60,w*.118));
 const gap=Math.max(4,Math.min(7,w*.012));
 const rowStart=TOP_END*s+1;
 const rowArea=3*rowH+2*gap;
 const sceneDest=rowStart+rowArea+9;
 const offset=sceneDest-SCENE_START*s;
 const expand=Math.max(0,h-SH*s-offset);
 ctx.fillStyle='#071025';ctx.fillRect(0,0,w,h);
 // Draw top navigation at original pixel ratio.
 ctx.drawImage(bitmap,0,0,SW,TOP_END,0,0,w,TOP_END*s);
 // The extra background under the taller cards mirrors only a small empty
 // skyline strip. The bottom line is pixel-identical to the beginning of the
 // original scene, avoiding a visible horizontal seam; no panda is included.
 ctx.save();ctx.translate(0,sceneDest);ctx.scale(1,-1);
 ctx.drawImage(bitmap,0,SCENE_START,SW,53,0,0,w,sceneDest-rowStart);
 ctx.restore();
 const shade=ctx.createLinearGradient(0,rowStart,0,sceneDest);
 shade.addColorStop(0,'rgba(6,9,29,.67)');
 shade.addColorStop(.65,'rgba(7,12,29,.16)');
 shade.addColorStop(1,'rgba(7,12,29,0)');
 ctx.fillStyle=shade;ctx.fillRect(0,rowStart,w,sceneDest-rowStart);
 // The panda and the alley below the card stack are drawn with ONE uniform scale.
 ctx.drawImage(bitmap,0,SCENE_START,SW,ROAD_END-SCENE_START,0,sceneDest,w,(ROAD_END-SCENE_START)*s);
 // Extend only the wet street, NEVER any part of the panda.
 if(expand>0){
  const count=Math.max(1,Math.round(expand/(2*(ROAD_END-ROAD_START)*s)));
  const bandH=expand/(2*count);
  for(let i=0;i<2*count;i++){
   const top=sceneDest+(ROAD_END-SCENE_START)*s+i*bandH;
   ctx.save();
   if(i%2===0){ctx.translate(0,top+bandH);ctx.scale(1,-1);ctx.drawImage(bitmap,0,ROAD_START,SW,ROAD_END-ROAD_START,0,0,w,bandH);}
   else{ctx.drawImage(bitmap,0,ROAD_START,SW,ROAD_END-ROAD_START,0,top,w,bandH);}
   ctx.restore();
  }
 }
 // Keep the real footer anchored at bottom.
 const footTop=sceneDest+(ROAD_END-SCENE_START)*s+expand;
 ctx.drawImage(bitmap,0,ROAD_END,SW,SH-ROAD_END,0,footTop,w,(SH-ROAD_END)*s);
 rows.style.top=rowStart+'px';rows.style.gap=gap+'px';
 for(const button of rowButtons)button.style.height=rowH+'px';
 for(const button of buttons){
  const d=design[button.id];if(!d)continue;
  const from=d[1]*SH/100;
  const to=(d[1]+d[3])*SH/100;
  const mapY=py=>py<TOP_END?py*s:py<SCENE_START?py*s:py<ROAD_END?(sceneDest+(py-SCENE_START)*s):footTop+(py-ROAD_END)*s;
  button.style.left=d[0]+'%';button.style.width=d[2]+'%';
  button.style.top=mapY(from)+'px';
  button.style.height=Math.max(20,mapY(to)-mapY(from))+'px';
 }
 stage.dataset.rowsReady='true';
}
function schedule(){if(!scheduled){scheduled=true;requestAnimationFrame(render)}}
bitmap.addEventListener('load',schedule);
if(bitmap.complete&&bitmap.naturalWidth)schedule();
window.addEventListener('resize',schedule);
window.visualViewport?.addEventListener('resize',schedule);
new ResizeObserver(schedule).observe(stage);
})();
</script>
<script>
(()=>{'use strict';
// A working design-stage preview. The original Panda AI remains the canonical tutor.
const base='https://trommelschlager-ai.github.io/chinese-coach-pwa/';
const DATA=[
 {zh:'我有点忙。',py:'Wǒ yǒudiǎn máng.',ru:'Я немного занят.',key:'我有点忙',reply:'没关系。你什么时候有空？',replyPy:'Méi guānxi. Nǐ shénme shíhou yǒu kòng?',replyRu:'Ничего страшного. Когда ты свободен?'},
 {zh:'你晚上有什么计划？',py:'Nǐ wǎnshang yǒu shénme jìhuà?',ru:'Какие у тебя планы на вечер?',key:'你晚上有什么计划',reply:'我晚上想学习中文。',replyPy:'Wǒ wǎnshang xiǎng xuéxí Zhōngwén.',replyRu:'Вечером я хочу учить китайский.'},
 {zh:'我们聊聊吧！',py:'Wǒmen liáoliao ba!',ru:'Давай поболтаем!',key:'我们聊聊吧',reply:'好啊！你今天怎么样？',replyPy:'Hǎo a! Nǐ jīntiān zěnmeyàng?',replyRu:'Давай! Как у тебя дела сегодня?'},
 {zh:'你叫什么名字？',py:'Nǐ jiào shénme míngzi?',ru:'Как тебя зовут?',key:'你叫什么名字',reply:'我叫熊猫。',replyPy:'Wǒ jiào Xióngmāo.',replyRu:'Меня зовут Панда.'},
 {zh:'你今天怎么样？',py:'Nǐ jīntiān zěnmeyàng?',ru:'Как ты сегодня?',key:'你今天怎么样',reply:'我很好，谢谢！',replyPy:'Wǒ hěn hǎo, xièxie!',replyRu:'У меня всё хорошо, спасибо!'},
 {zh:'你喜欢喝茶吗？',py:'Nǐ xǐhuan hē chá ma?',ru:'Ты любишь пить чай?',key:'你喜欢喝茶吗',reply:'我喜欢喝茶。',replyPy:'Wǒ xǐhuan hē chá.',replyRu:'Я люблю пить чай.'}
];
let mode='nonstop', selected=0, transcript=[], recognition=null;
const el=x=>document.getElementById(x), root=el('screen'), panel=el('panel'), body=el('panel-body');
const escape=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){let t=el('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2600)}
function open(title,content){el('panel-title').textContent=title;body.innerHTML=content;panel.classList.add('open');el('close').focus({preventScroll:true})}
function close(){try{recognition?.stop()}catch(_){}panel.classList.remove('open')}
el('close').onclick=close;panel.addEventListener('click',e=>{if(e.target===panel)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
function speak(text){if(!('speechSynthesis' in window)){toast('Озвучка недоступна в этом браузере');return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=.88;const voices=speechSynthesis.getVoices();u.voice=voices.find(x=>/zh-CN|cmn-Hans/i.test(x.lang))||null;speechSynthesis.speak(u)}
function choose(i){selected=i;const d=DATA[i];const t=transcript.slice(-4).map(x=>`<div class="history-item"><strong>${escape(x.who)}:</strong> ${escape(x.text)}</div>`).join('');
open('Разговор с Panda Street AI',`<div class="talk"><div class="hanzi">${escape(d.zh)}</div><div class="pinyin">${escape(d.py)}</div><div class="ru">${escape(d.ru)}</div><div class="tbuttons"><button id="listen">🔊 Прослушать</button><button id="mic">🎙 Сказать вслух</button><button id="next">Следующая фраза →</button></div><form id="answer" class="answer-form"><input id="answer-text" autocomplete="off" lang="zh" placeholder="Ответь по-китайски…" aria-label="Ответ по-китайски"><button type="submit">➤</button></form><div id="feedback" role="status"></div>${t?`<div><strong>Последние реплики</strong>${t}</div>`:''}<div class="note">Это интерактивный прототип дизайна. Озвучка синтезируется браузером. Распознавание речи не проверяет акустические тоны; для полной учебной логики используется действующая Panda AI.</div><button class="action" id="open-real">Открыть действующую Panda AI</button></div>`);
 el('listen').onclick=()=>speak(d.zh);el('next').onclick=()=>choose((selected+1)%DATA.length);el('open-real').onclick=()=>location.assign(base+'panda-voice-pilot.html');
 el('answer').onsubmit=e=>{e.preventDefault();answer(el('answer-text').value)};el('mic').onclick=startVoice;
}
function answer(text){let cleaned=text.trim();if(!cleaned){el('feedback').textContent='Сначала произнеси или введи ответ.';return;}const d=DATA[selected];transcript.push({who:'Ты',text:cleaned});transcript.push({who:'Панда',text:d.reply});transcript=transcript.slice(-100);el('feedback').textContent='Панда: '+d.reply+' — '+d.replyRu;speak(d.reply);if(mode==='nonstop')setTimeout(()=>{if(panel.classList.contains('open'))choose((selected+1)%DATA.length)},6000)}
function startVoice(){const API=window.SpeechRecognition||window.webkitSpeechRecognition;if(!API){el('feedback').textContent='Голосовой ввод не поддерживается здесь. Открой в Chrome по HTTPS либо используй поле ответа.';return}try{recognition=new API();recognition.lang='zh-CN';recognition.interimResults=false;recognition.continuous=false;recognition.onresult=e=>{const text=e.results[0][0].transcript;const input=el('answer-text');if(input)input.value=text;answer(text)};recognition.onerror=e=>{const f=el('feedback');if(f)f.textContent='Микрофон: '+e.error+'. Проверь разрешения в Chrome.'};recognition.start();el('feedback').textContent='Слушаю китайскую речь…';}catch(e){el('feedback').textContent='Не удалось включить микрофон: '+e.message}}
function setMode(v){mode=v;el('short').setAttribute('aria-pressed',String(v==='short'));el('nonstop').setAttribute('aria-pressed',String(v==='nonstop'));if(v==='short'){open('Краткие диалоги',`<p>Выбери фразу для короткой тренировки:</p>${DATA.slice(0,3).map((d,i)=>`<button class="choice" data-i="${i}"><b>${escape(d.zh)}</b> — ${escape(d.ru)}</button>`).join('')}`);body.querySelectorAll('.choice').forEach(n=>n.onclick=()=>choose(+n.dataset.i))}else{choose(0)}}
el('short').onclick=()=>setMode('short');el('nonstop').onclick=()=>setMode('nonstop');
el('history').onclick=()=>open('История разговора',transcript.length?transcript.map(x=>`<div class="history-item"><strong>${escape(x.who)}</strong><small>${escape(x.text)}</small></div>`).join(''):'<p>Пока история пуста. Начни тренировку, нажав на фразу.</p>');
el('theme').onclick=()=>{const day=root.dataset.theme!=='day';root.dataset.theme=day?'day':'night';el('theme').setAttribute('aria-pressed',String(day));toast(day?'Светлый фильтр для предпросмотра':'Ночная тема')};
DATA.slice(0,3).forEach((_,i)=>el('dialogue'+(i+1)).onclick=()=>choose(i));
el('trainer').onclick=()=>location.assign(base+'game.html');el('training').onclick=()=>location.assign(base+'game.html');
el('topics').onclick=()=>open('Все темы',DATA.map((d,i)=>`<button class="choice" data-i="${i}"><b>${escape(d.zh)}</b><br><small>${escape(d.ru)}</small></button>`).join(''));el('topics').addEventListener('click',()=>setTimeout(()=>{body.querySelectorAll('.choice').forEach(n=>n.onclick=()=>choose(+n.dataset.i))},0));
el('book').onclick=()=>open('Китайские фразы',DATA.map(d=>`<div class="history-item"><strong>${escape(d.zh)}</strong><small>${escape(d.py)} · ${escape(d.ru)}</small></div>`).join(''));
el('chat').onclick=()=>choose(0);el('back').onclick=()=>location.assign(base+'panda-voice-pilot.html');el('home').onclick=()=>location.assign(base+'index.html');el('lessons').onclick=()=>location.assign(base+'hsk1-map.html');el('profile').onclick=()=>toast('Профиль доступен в основной Panda Go');
})();
</script>
</body>
