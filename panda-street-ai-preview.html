const approvedMaleRegistryPromise=import('./assets/panda-street-approved-male-mp3-v1.mjs?v=1')
 .catch(error=>{console.warn('Approved Street male audio registry unavailable:',error);return null});
function playApprovedStreetMaleClip(clip,token){
 if(token!==voiceToken)return;
 const audio=new Audio(clip.src);playing=audio;audio.preload='auto';audio.playbackRate=1;
 if('preservesPitch' in audio)audio.preservesPitch=true;
 const valid=()=>token===voiceToken&&playing===audio;
 const clear=()=>{if(valid())playing=null};
 audio.addEventListener('ended',clear);
 audio.addEventListener('error',()=>{if(valid()){clear();tip('Мужская MP3 недоступна. Реплика остаётся текстом.')}});
 const started=audio.play();
 if(started?.catch)started.catch(()=>{if(valid()){clear();tip('Нажми ещё раз, чтобы прослушать мужскую запись.')}});
}
function speak(text){
 const cue=MALE_CUES[normalizeZh(text)];
 if(playing){playing.pause();playing=null}
 const token=++voiceToken;
 if(!cue){
  approvedMaleRegistryPromise.then(mod=>{
   if(token!==voiceToken)return;
   const clip=mod?.lookupApprovedStreetMaleMp3(text);
   if(!clip){tip('Фраза показана текстом · мужская запись для неё пока не загружена');return}
   playApprovedStreetMaleClip(clip,token);
  });
  return true;
 }
 const a=new Audio(MALE_VOICE);playing=a;a.preload='auto';a.playbackRate=.75;
 if('preservesPitch' in a)a.preservesPitch=true;
 const ready=()=>{
  if(token!==voiceToken)return;
  try{
   a.currentTime=cue[0];a.volume=0;
   const play=a.play();
   const tick=()=>{
    if(token!==voiceToken||playing!==a||a.paused)return;
    const elapsed=a.currentTime-cue[0],left=cue[1]-a.currentTime;
    if(left<=.05){a.volume=0;a.pause();return}
    a.volume=Math.min(1,Math.max(0,elapsed/.035),Math.max(0,(left-.05)/.125));
    requestAnimationFrame(tick);
   };
   if(play?.then)play.then(()=>requestAnimationFrame(tick)).catch(()=>tip('Аудио недоступно. Попробуй ещё раз.'));
   else requestAnimationFrame(tick);
  }catch(e){tip('Не удалось воспроизвести запись')}
 };
 if(a.readyState>=1)ready();
 else a.addEventListener('loadedmetadata',ready,{once:true});
 return true;
}

const streetBrainPromise=import('./assets/panda-street-shared-brain-v1.mjs?v=1')
 .then(m=>m.createStreetBrain({storage:(()=>{try{return localStorage}catch{return null}})(),
   curriculum:window.PANDA_HSK1_FOUNDATIONS||[]}))
 .catch(e=>{console.error('Panda Street shared brain:',e);tip('Разговорный модуль не загрузился. Обнови страницу.');return null});
let responseSeq=0;
async function respond(text){
 const zh=String(text||'').trim();
 if(!zh){tip('Введи или произнеси фразу по-китайски');return}
 const token=++responseSeq;
 const brain=await streetBrainPromise;
 if(token!==responseSeq)return;
 if(!brain){tip('Модуль Panda AI недоступен. Проверь подключение.');return}
 const result=brain.answer(zh,{mode});
 if(!result||result.kind==='empty'||result.kind==='error'){tip(result?.message||'Не удалось разобрать фразу');return}
 if(['correction','clarify','locked','explanation'].includes(result.kind)||!result.panda){
  const correction=result.correction;
  const detail=correction?'<p class="hanzi">'+esc(correction.zh)+'</p><p class="py">'+esc(correction.py)+'</p><p class="ru">'+esc(correction.ru)+'</p>':'';
  popup('Панда объясняет',detail+'<p class="hint">'+esc(result.why||result.message||'Пожалуйста, уточни фразу.')+
    '</p><p class="hint">Это проверка текста, не оценка китайских тонов по звуку.</p>');
  return;
 }
 const panda=result.panda,learner=result.learner||recognizedDetail(zh);
 const item={user:zh,userInfo:learner,panda,at:Date.now(),feedback:result.message||''};
 history.push(item);history=history.slice(-100);persist();
 liveRow('live-panda',panda);liveRow('live-learner',learner);
 closePopup();if(result.message)tip(result.message);speak(panda.zh);
 if(mode==='nonstop'&&result.nextQuestion){
   // Keep a conversational turn: acknowledge first, then let Panda ask the next reviewed question.
   setTimeout(()=>{
    if(token!==responseSeq||mode!=='nonstop'||shade.classList.contains('open'))return;
    const next=brain.nextQuestion();
    if(!next?.zh)return;
    item.nextQuestion=next;persist();liveRow('live-panda',next);speak(next.zh);
   },2800);
 }
}
function composition(){popup('Ответь Панде по-китайски',`<p class="hint">Набери ответ или нажми микрофон. На экране будут только две последние реплики; все предыдущие сохраняются в «Истории».</p><textarea id="entry" lang="zh-Hans" autocomplete="off" placeholder="Напиши по-китайски…" aria-label="Твой ответ"></textarea><div class="actions"><button class="action primary" id="submit">➤ Отправить</button><button class="action" id="voice">🎙 Говорить</button></div><p class="hint">Это учебная демонстрация с заранее заданными ответами. Акустическая проверка тонов пока не подключена.</p>`);el('submit').onclick=()=>respond(el('entry').value);el('voice').onclick=listen;setTimeout(()=>el('entry')?.focus({preventScroll:true}),0)}
function listen(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){tip('Для распознавания открой страницу в Chrome по HTTPS');return}let rec;try{rec=new SR();rec.lang='zh-CN';rec.interimResults=false;rec.continuous=false;rec.onresult=e=>{const phrase=e.results[0][0].transcript;const input=el('entry');if(input)input.value=phrase;respond(phrase)};rec.onerror=e=>tip('Микрофон: '+e.error);rec.start();tip('Слушаю китайскую речь…')}catch(e){tip('Микрофон недоступен: '+e.message)}}
function phrase(i){current=i;const d=cues[i];popup('Практика фразы',`<div class="hanzi">${esc(d.zh)}</div><div class="py">${esc(d.py)}</div><div class="ru">${esc(d.ru)}</div><div class="actions"><button class="action" id="hear">🔊 Слушать</button><button class="action primary" id="reply">Ответить</button><button class="action" id="other">Следующая →</button></div><p class="hint">Можно произнести или написать ответ. Предыдущие реплики остаются в истории.</p>`);el('hear').onclick=()=>speak(d.zh);el('reply').onclick=composition;el('other').onclick=()=>phrase((i+1)%cues.length)}
function historyView(){
 const rendered=history.length?history.map(x=>{
  const learner=x.userInfo||recognizedDetail(x.user);
  return '<div class="logline"><strong>Ты:</strong> '+esc(x.user)+
   (learner.py?'<br><em>'+esc(learner.py)+'</em>':'')+
   '<br>'+esc(learner.ru)+'<br><strong>Панда:</strong> '+esc(x.panda.zh)+
   '<br><em>'+esc(x.panda.py)+'</em><br>'+esc(x.panda.ru)+'</div>';
 }).join(''):'<p>Реплик пока нет.</p>';
 popup('История разговора','<p class="hint">Последние '+history.length+' реплик.</p>'+rendered);
}
function shortMode(){mode='short';paint();popup('Краткие диалоги',cues.map((d,i)=>`<button class="example" data-i="${i}">${esc(d.zh)} — ${esc(d.ru)}</button>`).join('')+'<p class="hint">Выбери фразу для тренировки.</p>');body.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>phrase(Number(b.dataset.i)))}
el('row1').onclick=()=>history.length?speak(history.at(-1).panda.zh):phrase(0);
el('row2').onclick=()=>history.length?composition():phrase(1);
el('short').onclick=shortMode;el('nonstop').onclick=async()=>{mode='nonstop';paint();const b=await streetBrainPromise;if(b){const start=b.start('nonstop');liveRow('live-panda',start);speak(start.zh)}composition()};
el('send').onclick=composition;el('mic').onclick=listen;el('history').onclick=historyView;
el('topics').onclick=shortMode;el('book').onclick=()=>{popup('Подсказка',`<p class="hint">Ответь на текущую фразу Панды:</p><div class="hanzi">我有点忙。</div><div class="py">Wǒ yǒudiǎn máng.</div><div class="ru">Я немного занят.</div><div class="actions"><button class="action primary" id="usehint">Попробовать ответить</button></div>`);el('usehint').onclick=composition;};
const themeButton=el('theme');
const themeKey='panda-street-theme';
function applyTheme(theme){
 const day=theme==='day';
 document.documentElement.dataset.theme=theme;
 document.querySelector('meta[name="theme-color"]').content=day?'#e6edf8':'#030513';
 themeButton.setAttribute('aria-pressed',String(day));
}
const dayReady=daySrc.decode().then(()=>{paint();return true},()=>false);
let themeRequest=0;
try{
 if(localStorage.getItem(themeKey)==='day')dayReady.then(ready=>{if(ready&&!themeRequest)applyTheme('day')});
}catch{}
themeButton.onclick=async()=>{
 const request=++themeRequest;
 const theme=document.documentElement.dataset.theme==='day'?'night':'day';
 themeButton.setAttribute('aria-busy','true');
 const ready=theme==='night'||await dayReady;
 if(request!==themeRequest)return;
 themeButton.removeAttribute('aria-busy');
 if(!ready){tip('Дневная сцена недоступна. Подключись к интернету и обнови страницу.');return}
 applyTheme(theme);
 try{localStorage.setItem(themeKey,theme)}catch{}
};
const base='https://trommelschlager-ai.github.io/chinese-coach-pwa/';
el('back').onclick=()=>location.assign(base+'panda-voice-pilot.html');el('home').onclick=()=>location.assign(base+'index.html');el('lessons').onclick=()=>location.assign(base+'panda-street-hsk1-map.html');el('game').onclick=()=>speak(history.length?history.at(-1).panda.zh:cues[current].zh);el('trainer').onclick=()=>location.assign(base+'game.html');el('chat').onclick=composition;el('profile').onclick=()=>tip('Профиль открой в основном Panda Go');
if('serviceWorker' in navigator&&location.protocol==='https:'){
 navigator.serviceWorker.register('./sw.js').catch(error=>console.warn('Panda Street offline cache:',error));
}
if(history.length){let x=history.at(-1);liveRow('live-panda',x.panda);liveRow('live-learner',x.userInfo||recognizedDetail(x.user))}
})();
